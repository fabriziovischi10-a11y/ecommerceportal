<style>
  .ad { display: flex; min-height: 100vh; }
  .sb { width: 256px; flex-shrink: 0; background: var(--sidebar); color: var(--sidebar-fg); position: sticky; top: var(--banda, 0px); height: calc(100vh - var(--banda, 0px)); display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden; z-index: 60; }
  .sb.mini { width: 66px; }
  .sb.mini .txt { display: none; }
  .sb-marca { display: flex; align-items: flex-start; flex-direction: column; gap: .65rem; padding: 1rem .9rem; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sb-marca img { height: 26px; width: auto; max-width: 100%; object-fit: contain; flex-shrink: 1; }
  .sb-marca .t1 { font-weight: 800; line-height: 1.1; white-space: nowrap; } .sb-marca .t2 { font-size: .78rem; opacity: .7; white-space: nowrap; }
  .sb-grupo { padding: .9rem .6rem 0; flex: 1; overflow-y: auto; }
  .sb-grupo .tit { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; opacity: .55; padding: 0 .55rem .4rem; white-space: nowrap; }
  .sb a.item { display: flex; align-items: center; gap: .7rem; padding: .55rem .6rem; border-radius: .6rem; color: inherit; text-decoration: none; font-weight: 600; font-size: .92rem; margin-bottom: 2px; white-space: nowrap; }
  .sb a.item svg { flex-shrink: 0; }
  .sb a.item:hover { background: rgba(255,255,255,.06); }
  .sb a.item.activo { background: var(--sidebar-accent); color: var(--sidebar-primary); }
  .sb-pie { border-top: 1px solid rgba(255,255,255,.08); padding: .75rem .7rem; display: grid; gap: .5rem; }
  .sb-user { display: flex; align-items: center; gap: .6rem; min-width: 0; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--sidebar-primary); color: var(--sidebar); display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
  .sb-user .n { font-weight: 700; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-user .r { font-size: .74rem; opacity: .65; }
  .sb-salir { background: rgba(255,255,255,.08); color: inherit; border: 0; }
  .sb-velo { display: none; }
  .principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: .7rem; padding: .65rem 1rem; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: var(--banda, 0px); z-index: 40; }
  .top .t1 { font-weight: 800; line-height: 1.1; } .top .t2 { font-size: .8rem; color: var(--muted-fg); }
  .top .esp { flex: 1; }
  @media (max-width: 860px) {
    .sb { position: fixed; left: 0; top: 0; bottom: 0; height: 100%; width: 280px; transform: translateX(-102%); transition: transform .2s ease; z-index: 8600; }
    .sb.mini { width: 280px; } .sb.mini .txt { display: initial; }
    .sb.abierto { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.35); }
    .sb-velo.abierto { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 8500; }
  }
  .vista { max-width: 1240px; width: 100%; margin: 0 auto; padding: 1rem 16px 3rem; display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); }
  .vista > *, .grid > * { min-width: 0; }
  .grid#rMes, .grid#cDet { grid-template-columns: minmax(0, 1fr); }
  .eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-fg); font-weight: 700; margin-bottom: .2rem; }
  .sec-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: .8rem; flex-wrap: wrap; margin-bottom: .75rem; }
  .sec-cab p { margin: .1rem 0 0; }
  .kpi { border-radius: .9rem; padding: .85rem 1rem; border: 1px solid var(--border); background: var(--card); min-width: 0; }
  .kpi.clic { cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .kpi.clic:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16,30,54,.08); }
  .kpi-l { font-size: .8rem; font-weight: 700; opacity: .85; }
  .kpi-v { font-size: 1.45rem; font-weight: 800; line-height: 1.2; margin-top: .15rem; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .kpi-d { font-size: .8rem; opacity: .85; margin-top: .15rem; }
  .kpi-p { font-size: .74rem; font-weight: 700; margin-top: .35rem; text-decoration: underline; }
  .k-amber { background: var(--amber-bg); color: var(--amber); border-color: rgba(255,255,255,.12); }
  .k-emerald { background: var(--emerald-bg); color: var(--emerald); border-color: rgba(255,255,255,.12); }
  .k-rose { background: var(--rose-bg); color: var(--rose); border-color: rgba(255,255,255,.12); }
  .k-orange { background: var(--orange-bg); color: var(--orange); border-color: rgba(255,255,255,.12); }
  .k-violet { background: var(--violet-bg); color: var(--violet); border-color: rgba(255,255,255,.12); }
  .k-blue { background: var(--blue-bg); color: var(--blue); border-color: rgba(255,255,255,.12); }
  .k-slate { background: var(--slate-bg); color: var(--slate); }
  .k-cyan { background: var(--cyan-bg); color: var(--cyan); border-color: rgba(255,255,255,.12); }
  .k-cliente { background: var(--cliente-bg); color: var(--brand); }
  .lista { display: grid; gap: .5rem; }
  .itm { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .7rem .85rem; border: 1px solid var(--border); border-radius: .8rem; background: var(--card); }
  .itm .tt { font-weight: 700; overflow-wrap: anywhere; } .itm .st { font-size: .84rem; color: var(--muted-fg); overflow-wrap: anywhere; }
  .itm > div:first-child { min-width: 0; }
  .tabs { display: flex; gap: .35rem; flex-wrap: wrap; background: var(--muted); padding: .3rem; border-radius: .8rem; width: fit-content; max-width: 100%; }
  .tabs button { border: 0; background: transparent; padding: .4rem .8rem; border-radius: .6rem; font: inherit; font-weight: 700; color: var(--muted-fg); cursor: pointer; }
  .tabs button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .chips { display: flex; gap: .4rem; flex-wrap: wrap; }
  .campo-linea { display: flex; gap: .6rem; flex-wrap: wrap; align-items: flex-end; }
  .campo-linea > div { min-width: 180px; flex: 1; }
  .campo-linea label { margin-top: 0; }
  .fila-err { background: var(--rose-bg); } .fila-omit { background: var(--amber-bg); }
  .caja-err { background: var(--rose-bg); color: var(--rose); border: 1px solid rgba(255,255,255,.12); border-radius: .8rem; padding: .75rem 1rem; }
  .caja-err ul { margin: .3rem 0 0; padding-left: 1.2rem; max-height: 220px; overflow: auto; }
  .aviso { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(255,255,255,.12); border-radius: .9rem; padding: .9rem 1rem; }
  details.acc { border: 1px solid var(--border); border-radius: .8rem; background: var(--card); }
  details.acc > summary { list-style: none; cursor: pointer; padding: .75rem .9rem; display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }
  details.acc > summary::-webkit-details-marker { display: none; }
  details.acc > summary::after { content: "▾"; color: var(--muted-fg); }
  details.acc[open] > summary::after { content: "▴"; }
  details.acc .acc-cuerpo { padding: 0 .9rem .9rem; }
  .doc { display: flex; gap: .7rem; align-items: center; padding: .6rem 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .doc .mini { width: 46px; height: 46px; border-radius: .5rem; background: var(--muted); object-fit: cover; flex-shrink: 0; display: grid; place-items: center; color: var(--muted-fg); font-size: .7rem; }
  .doc .inf { flex: 1; min-width: 180px; }
  .stars { color: var(--amarillo); letter-spacing: 1px; }
  .enc { display: grid; gap: .4rem; }
  .totales3 { display: grid; gap: .6rem; grid-template-columns: repeat(3, minmax(0,1fr)); }
  @media (max-width: 600px) { .totales3 { grid-template-columns: 1fr; } .g2 { grid-template-columns: 1fr; } }
  .cargando { display: flex; align-items: center; gap: .6rem; color: var(--muted-fg); padding: 1rem; }
  .spin { width: 18px; height: 18px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: gira .8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .sel-busca { display: grid; gap: .35rem; }
  .ok-txt { color: var(--emerald); font-weight: 700; } .err-txt { color: var(--rose); font-weight: 700; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--primary); font: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; }
  td .st { font-size: .8rem; color: var(--muted-fg); }
  .nowrap { white-space: nowrap; }
</style>

<body>
<div class="ad">
  <div class="sb-velo" id="sbVelo"></div>
  <aside class="sb" id="sb" aria-label="Menú de administración">
    <div class="sb-marca"><img src="logo-blanco.png" alt="Portal Distribuidora"><div class="txt"><div class="t2">Gestión de entregas</div></div></div>
    <nav class="sb-grupo" id="sbNav"></nav>
    <div class="sb-pie">
      <div class="sb-user"><span class="avatar" id="sbIni">U</span><div class="txt" style="min-width:0"><div class="n" id="sbNombre">Usuario autorizado</div><div class="r">Cuenta administradora</div></div></div>
      <button class="btn btn-sm sb-salir" id="sbSalir" title="Cerrar sesión"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span class="txt">Cerrar sesión</span></button>
    </div>
  </aside>
  <div class="principal">
    <header class="top">
      <button class="btn btn-ghost btn-icon" id="sbBoton" aria-label="Mostrar u ocultar menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
      <div><div class="t1">Gestión de Entregas</div><div class="t2">Control operativo de distribución</div></div>
      <div class="esp"></div>
      <button class="btn btn-outline btn-sm" id="btnActualizar" title="Volver a leer los datos"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Actualizar</button>
    </header>
    <main class="vista" id="vista"><div class="cargando"><span class="spin"></span>Cargando operación...</div></main>
  </div>
</div>

<script>
(function () {
  "use strict";
  var esc = GE.esc, money = GE.money, round2 = GE.round2;

  // ================= Estado =================
  var P = new URLSearchParams(location.search);
  function fechaValida(s) { return s && /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : null; }
  var S = {
    fecha: fechaValida(P.get("fecha")) || GE.hoy(),
    clienteSel: P.get("cliente") ? Number(P.get("cliente")) : null,
    filtroChofer: "", filtroZona: "", tok: 0,
    op: { tab: "zones", modo: "zona" },
    seg: { q: "", estado: "all", lim: 40, orden: "recientes", limE: 12 },
    cli: { q: "" }
  };
  S.mes = S.fecha.slice(0, 7);
  S.mesCli = S.mes;

  function mesSig(m) { var y = +m.slice(0, 4), mm = +m.slice(5, 7) + 1; if (mm > 12) { mm = 1; y++; } return y + "-" + String(mm).padStart(2, "0"); }
  function mesLabel(m) { return GE.mes(m + "-01"); }
  function conPrueba(href) { if (!GE.PRUEBA) return href; return href + (href.indexOf("?") >= 0 ? "&" : "?") + "prueba=1"; }
  function slug(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase(); }
  function norm(s) { return String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, " ").trim().toLowerCase(); }
  function n(v) { return Number(v) || 0; }
  function plural(k, s, p) { return k + " " + (k === 1 ? s : p); }
  function sincronizarUrl() {
    var u = new URL(location.href);
    u.searchParams.set("fecha", S.fecha);
    if (S.clienteSel) u.searchParams.set("cliente", S.clienteSel); else u.searchParams.delete("cliente");
    history.replaceState(null, "", u.pathname + u.search + location.hash);
  }

  var MOTIVOS = { no_money: "Sin dinero", not_authorized: "No autorizado", closed: "Cliente cerrado", damaged: "Mercadería dañada o rechazada por estado", wrong_order: "Pedido equivocado o no solicitado", other: "Otro motivo" };
  var CATEGORIAS = { food: "Comida", toll: "Peaje", lodging: "Hospedaje", phone: "Teléfono", assistant: "Ayudante", coca: "Coca", taxi: "Remis", truck_wash: "Lavado camión", floor: "Piso" };

  // ================= Datos =================
  // Catálogos (zonas y choferes) una vez por sesión; clientes solo cuando hacen falta.
  var CAT = { zones: [], drivers: [], clients: null, cli: {} };
  var _pCat = null, _pCli = null;
  function catalogo() {
    if (!_pCat) _pCat = Promise.all([GE.todos("zones"), GE.todos("drivers")]).then(function (r) {
      CAT.zones = r[0].sort(function (a, b) { return String(a.code).localeCompare(String(b.code), "es", { numeric: true }); });
      CAT.drivers = r[1].sort(function (a, b) { return String(a.name).localeCompare(String(b.name), "es"); });
      return CAT;
    }).catch(function (e) { _pCat = null; throw e; });
    return _pCat;
  }
  function clientesTodos() {
    if (!_pCli) _pCli = GE.todos("clients").then(function (r) {
      CAT.clients = r.sort(function (a, b) { return String(a.businessName).localeCompare(String(b.businessName), "es"); });
      r.forEach(function (c) { CAT.cli[c.id] = c; });
      return r;
    }).catch(function (e) { _pCli = null; throw e; });
    return _pCli;
  }
  function clientesPorId(ids) {
    var falta = ids.filter(function (id) { return id != null && !CAT.cli[id]; });
    if (!falta.length || CAT.clients) return Promise.resolve();
    return GE.dondeEn("clients", "id", falta).then(function (r) { r.forEach(function (c) { CAT.cli[c.id] = c; }); });
  }
  function chofer(id) { return CAT.drivers.filter(function (d) { return d.id === id; })[0] || null; }
  function zona(id) { return CAT.zones.filter(function (z) { return z.id === id; })[0] || null; }

  var cache = {};
  var TTL = 60000;
  function memo(clave, fn) {
    var c = cache[clave];
    if (c && Date.now() - c.t < TTL) return c.p;
    var p = fn();
    cache[clave] = { t: Date.now(), p: p };
    p.catch(function () { delete cache[clave]; });
    return p;
  }
  function invalidar() { cache = {}; }

  function rangoQ(nombre, campo, from, to) {
    // Un solo filtro de rango, sin orderBy: no requiere índice compuesto.
    return GE.col(nombre).where(campo, ">=", from).where(campo, "<", to).get().then(GE.datos);
  }
  function porFecha(a, b) { return String(a.serviceDate || "").localeCompare(String(b.serviceDate || "")); }

  function armar(from, to, r) {
    var routes = r[0], rmap = {};
    routes.forEach(function (x) { rmap[x.id] = x; });
    var invoices = r[1].map(function (f) {
      var ru = rmap[f.routeId];
      if (ru) { f.driverId = ru.driverId; f.driverName = ru.driverName; f.routeName = ru.name; if (!f.zoneName) f.zoneName = ru.zoneName; }
      return f;
    });
    var att = {}, adj = [];
    r[6].concat(r[7]).forEach(function (a) { if (!att[a.id]) { att[a.id] = 1; adj.push(a); } });
    return {
      from: from, to: to, routes: routes.sort(porFecha), invoices: invoices, rmap: rmap,
      expenses: r[2], receipts: r[3], cashClosures: r[4], accountPayments: r[5], paymentAttachments: adj, accountStatements: r[8]
    };
  }
  function cargarRango(from, to) {
    return Promise.all([
      rangoQ("routes", "serviceDate", from, to), rangoQ("invoices", "serviceDate", from, to), rangoQ("expenses", "serviceDate", from, to),
      rangoQ("receipts", "serviceDate", from, to), rangoQ("cashClosures", "serviceDate", from, to), rangoQ("accountPayments", "collectionDate", from, to),
      rangoQ("paymentAttachments", "serviceDate", from, to), rangoQ("paymentAttachments", "collectionDate", from, to),
      rangoQ("accountStatements", "issuedAt", from, to), catalogo()
    ]).then(function (r) { return armar(from, to, r); });
  }
  function enRango(v, from, to) { v = String(v || "").slice(0, 10); return v >= from && v < to; }
  function subRango(ov, from, to) {
    function f(c) { return function (x) { return enRango(x[c], from, to); }; }
    var routes = ov.routes.filter(f("serviceDate")), rmap = {};
    routes.forEach(function (x) { rmap[x.id] = x; });
    return {
      from: from, to: to, routes: routes, rmap: rmap, invoices: ov.invoices.filter(f("serviceDate")),
      expenses: ov.expenses.filter(f("serviceDate")), receipts: ov.receipts.filter(f("serviceDate")), cashClosures: ov.cashClosures.filter(f("serviceDate")),
      accountPayments: ov.accountPayments.filter(f("collectionDate")),
      paymentAttachments: ov.paymentAttachments.filter(function (a) { return enRango(a.serviceDate, from, to) || enRango(a.collectionDate, from, to); }),
      accountStatements: ov.accountStatements.filter(f("issuedAt"))
    };
  }
  // M = mes; D = día (si el mes ya está en memoria, se deriva de ahí sin leer de nuevo)
  function datosMes(m) { return memo("M" + m, function () { return cargarRango(m + "-01", mesSig(m) + "-01"); }); }
  function datosDia(f) {
    var cm = cache["M" + f.slice(0, 7)];
    if (cm && Date.now() - cm.t < TTL) return cm.p.then(function (ov) { return subRango(ov, f, GE.sumarDias(f, 1)); });
    return memo("D" + f, function () { return cargarRango(f, GE.sumarDias(f, 1)); });
  }
  function datosAsignacion() { return memo("V", function () { return Promise.all([GE.donde("routes", [["driverId", "==", null]]), catalogo()]).then(function (r) { return { routes: r[0], drivers: CAT.drivers }; }); }); }

  // Escrituras en lotes de hasta 450 operaciones
  function escribir(ops) {
    var lotes = [];
    for (var i = 0; i < ops.length; i += 450) lotes.push(ops.slice(i, i + 450));
    return lotes.reduce(function (p, lote) {
      return p.then(function () {
        var b = GE.db.batch();
        lote.forEach(function (o) { if (o[0] === "set") b.set(o[1], o[2]); else if (o[0] === "update") b.update(o[1], o[2]); else b.delete(o[1]); });
        return b.commit();
      });
    }, Promise.resolve());
  }

  // Cambia chofer/caja de una ruta y copia el chofer a sus facturas (están desnormalizadas).
  function reasignarRuta(routeId, driverId, petty, extra) {
    var d = chofer(driverId);
    if (!d) return Promise.reject(new Error("Chofer inexistente."));
    return GE.donde("invoices", [["routeId", "==", routeId]]).then(function (invs) {
      var cambios = Object.assign({ driverId: d.id, driverName: d.name, pettyCashAmount: round2(petty), updatedAt: GE.ahora() }, extra || {});
      var ops = [["update", GE.ref("routes", routeId), cambios]];
      invs.forEach(function (f) {
        var c = { driverId: d.id, driverName: d.name };
        if (extra && extra.name) c.routeName = extra.name;
        if (extra && extra.serviceDate) c.serviceDate = extra.serviceDate;
        if (extra && extra.zoneName) c.zoneName = extra.zoneName;
        ops.push(["update", GE.ref("invoices", f.id), c]);
      });
      return escribir(ops);
    });
  }

  // ================= Cálculos =================
  function netoDe(f) { return f.netAmount != null && f.netAmount !== "" ? n(f.netAmount) : round2(n(f.amount) - n(f.discountAmount)); }
  function resumenPagos(invs) {
    var r = { n: 0, gross: 0, discount: 0, net: 0, mixed: 0, accN: 0, acc: 0, cashN: 0, cash: 0, chkN: 0, chk: 0, trN: 0, tr: 0, nrN: 0, nr: 0 };
    invs.forEach(function (f) {
      if (f.status !== "delivered") return;
      r.n++;
      var net = netoDe(f);
      r.gross += n(f.amount); r.discount += n(f.discountAmount); r.net += net;
      var acc = (f.paymentMethod === "account" && !n(f.accountAmount)) ? net : n(f.accountAmount);
      if (f.paymentMethod === "mixed") r.mixed++;
      if (acc !== 0) { r.accN++; r.acc += acc; }
      if (n(f.cashAmount) > 0) { r.cashN++; r.cash += n(f.cashAmount); }
      var ch = GE.sumaCheques(f.checkAmounts);
      if (ch > 0) { r.chkN++; r.chk += ch; }
      if (n(f.transferAmount) > 0) { r.trN++; r.tr += n(f.transferAmount); }
      if (!f.paymentMethod) { r.nrN++; r.nr += net; }
    });

  function txtPdf(s) { return String(s == null ? "" : s).replace(/[  ]/g, " "); }

  function logoPdf() {
    if (!_logoPdf) _logoPdf = GE.logoDataUrl().then(function (src) {
      if (!src) return null;
      return new Promise(function (ok) {
        var im = new Image();
        im.onload = function () {
          var c = document.createElement("canvas"); c.width = 160; c.height = 160;
          var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 160, 160);
          var s = Math.min(160 / im.width, 160 / im.height), w = im.width * s, h = im.height * s;
          x.drawImage(im, (160 - w) / 2, (160 - h) / 2, w, h);
          ok(c.toDataURL("image/jpeg", 0.85));
        };
        im.onerror = function () { ok(null); };
        im.src = src;
      });
    });
    return _logoPdf;
  }

        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">' + [["zonesToCreate", "zonas nuevas", "blue"], ["clientsToCreate", "clientes nuevos", "blue"], ["invoices", "facturas nuevas", "emerald"], ["skipped", "ya cargadas", "amber"], ["addressesMatched", "domicilios", "violet"], ["errors", "errores", "rose"]].map(function (x) { return kpi({ label: x[1], valor: V.summary[x[0]], tono: x[2] }); }).join("") + '</div>' +
        '<div class="tabla-scroll" style="margin-top:.75rem;max-height:420px;overflow:auto"><table><thead><tr><th>Archivo / fila</th><th>Zona / cliente</th><th>Factura</th><th>Domicilio</th><th>Validación</th></tr></thead><tbody>' +
        V.rows.map(function (o) { return '<tr class="' + (o.status === "error" ? "fila-err" : o.status === "skipped" ? "fila-omit" : "") + '"><td>' + esc(o.sourceFile) + '<div class="st">Fila ' + o.rowNumber + '</div></td><td>' + esc(o.zoneNameResolved || "") + '<div class="st">' + esc(o.clientNameResolved || "") + '</div></td><td>' + esc(o.invoiceNumber) + '</td><td>' + (o.addressMatched ? '<span class="ok-txt">Vinculado</span>' : '<span class="st">Sin coincidencia segura</span>') + '</td><td>' + (o.status === "ready" ? '<span class="ok-txt">Se cargará</span>' : o.status === "skipped" ? "Ya cargada · se omite" : '<span class="err-txt">' + esc(o.errors.join(" ")) + '</span>') + '</td></tr>'; }).join("") + '</tbody></table></div>' +
        '<div class="ge-acciones"><button class="btn btn-primary" id="cmImportar"' + (V.canImport ? "" : " disabled") + '>Cargar ' + V.summary.invoices + ' facturas nuevas</button></div></section>' : "") +
      '<section class="aviso"><div class="eyebrow" style="color:inherit">Siguiente paso</div><h3>Las zonas quedan pendientes de asignación</h3><p style="margin:0">La carga masiva no asigna cobrador ni caja chica. Cuando termines de cargar los Excel, abrí <a href="#/asignar-zonas"><b>Asignar zonas</b></a> en el menú de Administración.</p></section>' +
      '<section class="card" id="cmAud">' + cargando("Cargando auditoría...") + '</section>';

    el.querySelector("#cmModelo").onclick = function () {
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Fecha", "Número de Factura", "Cliente", "Importe", "Zona"]]), "Rutas y facturas");
      XLSX.writeFile(wb, "modelo_carga_masiva_rutas.xlsx");
    };
    el.querySelector("#cmNuevoCh").onclick = function () { alta("driver"); };
    el.querySelector("#cmCh").onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      leerChoferes(f).then(function (r) { CM.ch = r; if (r.filas.length) GE.toast(r.filas.length + " choferes listos para incorporar."); vCarga(el, vigente); })
        .catch(function (err) { CM.ch = { archivo: f.name, filas: [], errores: [err.message] }; vCarga(el, vigente); });
    };
    var bOk = el.querySelector("#cmChOk");
    if (bOk) bOk.onclick = function () {
      bOk.disabled = true; bOk.textContent = "Incorporando...";
      catalogo().then(function () {
        var ahora = GE.ahora(), ops = [], porCod = {};
        CAT.drivers.forEach(function (d) { porCod[String(d.code).trim().toUpperCase()] = d; });
        CM.ch.filas.forEach(function (x) {
          var d = porCod[x.code.toUpperCase()];
          if (d) ops.push(["update", GE.ref("drivers", d.id), { name: x.name, active: true, updatedAt: ahora }]);
          else { var id = GE.nuevoId(); ops.push(["set", GE.ref("drivers", id), { id: id, code: x.code, name: x.name, phone: null, active: true, userId: null, createdAt: ahora, updatedAt: ahora }]); }
        });
        return escribir(ops).then(function () { return CM.ch.filas.length; });
      }).then(function (t) {
        GE.toast(t + " choferes listos para asignar rutas.");
        CM.ch = null; _pCat = null; refrescar();
      }).catch(function (e) { bOk.disabled = false; bOk.textContent = "Incorporar los " + CM.ch.filas.length + " nombres"; GE.toast(e.message, "error"); });
    };
    el.querySelector("#cmRu").onchange = function (e) {
      var fs = Array.from(e.target.files); if (!fs.length) return;
      Promise.all(fs.map(function (f) { return leerRutas(f).catch(function (err) { return { filas: [], errores: [f.name + ": " + err.message] }; }); })).then(function (rs) {
        var filas = [].concat.apply([], rs.map(function (r) { return r.filas; })), errs = [].concat.apply([], rs.map(function (r) { return r.errores; }));
        CM.rutas = { filas: filas, errores: errs }; CM.val = null;
        var lotes = new Set(filas.map(function (r) { return r.routeKey; })).size;
        if (filas.length) GE.toast(filas.length + " facturas leídas en " + lotes + " lotes operativos. Revisá la vista previa antes de cargar.");
        vCarga(el, vigente);
      });
    };
    el.querySelector("#cmDo").onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      leerDomicilios(f).then(function (r) { CM.dom = r; CM.val = null; GE.toast(r.filas.length + " domicilios listos para relacionar de forma segura."); vCarga(el, vigente); })
        .catch(function (err) { CM.dom = { archivo: f.name, filas: [], errores: [err.message] }; vCarga(el, vigente); });
    };
    var bV = el.querySelector("#cmValidar");
    if (bV) bV.onclick = function () {
      bV.disabled = true; bV.textContent = "Validando...";
      planificar(rows, CM.dom ? CM.dom.filas : []).then(function (p) { CM.val = p; vCarga(el, vigente); })
        .catch(function (e) { console.error(e); bV.disabled = false; bV.textContent = "Validar y preparar carga"; GE.toast(e.message, "error"); });
    };
    var bI = el.querySelector("#cmImportar");
    if (bI) bI.onclick = function () {
      bI.disabled = true; bI.textContent = "Cargando...";
      // Se vuelve a validar contra la base justo antes de escribir (evita duplicar si otro admin cargó lo mismo).
      planificar(rows, CM.dom ? CM.dom.filas : []).then(function (p) {
        if (!p.canImport) { CM.val = p; throw new Error("La validación cambió: revisá la vista previa."); }
        return importar(p);
      }).then(function (res) {
        GE.toast(res.invoicesCreated + " facturas y " + res.createdRoutes.length + " zonas cargadas. Ahora podés asignar cobrador y caja chica desde “Asignar zonas”.");
        CM.rutas = null; CM.val = null; CM.dom = null; refrescar();
      }).catch(function (e) { console.error(e); GE.toast(e.message, "error"); vCarga(el, vigente); });
    };

    // Auditoría de carga (mes M)
    datosMes(S.mes).then(function (M) {
      if (!vigente()) return;
      var porR = {};
      M.invoices.forEach(function (f) { (porR[f.routeId] = porR[f.routeId] || []).push(f); });
      var rs = M.routes.slice().sort(function (a, b) { return String(b.serviceDate).localeCompare(String(a.serviceDate)) || b.id - a.id; });
      var box = el.querySelector("#cmAud");
      box.innerHTML = '<div class="sec-cab"><div><div class="eyebrow">Auditoría de carga</div><h2>Rutas y facturas ya cargadas</h2><p class="muted">Abrí cada jornada para comprobar todas las facturas y clientes, incluso después de recargar la página.</p></div><div class="fila" style="align-items:flex-end">' + selectorMes("cmMes", S.mes) + '<span class="badge t-blue">' + rs.length + ' rutas · ' + M.invoices.length + ' facturas</span></div></div>' +
        '<div class="lista">' + (rs.length ? rs.map(function (r) {
          var fs = (porR[r.id] || []).sort(function (a, b) { return String(a.invoiceNumber).localeCompare(String(b.invoiceNumber), "es", { numeric: true }); });
          var tot = fs.reduce(function (a, f) { return a + n(f.amount); }, 0), ncli = new Set(fs.map(function (f) { return f.clientId; })).size;
          return '<details class="acc"><summary><div><b>' + esc(r.name) + '</b><div class="small muted">' + esc(GE.fechaCorta(r.serviceDate)) + ' · ' + esc(r.driverName || "Pendiente de asignar") + ' · ' + ncli + ' clientes</div></div><div class="fila"><span class="badge t-blue">' + fs.length + ' facturas</span><b class="num">' + money(tot) + '</b></div></summary><div class="acc-cuerpo">' +
            (fs.length ? '<div class="tabla-scroll"><table><thead><tr><th>Factura</th><th>Cliente</th><th>Estado</th><th class="num">Importe</th></tr></thead><tbody>' + fs.map(function (f) { return '<tr><td>' + esc(f.invoiceNumber) + '</td><td>' + esc(f.clientName) + (f.clientCode ? '<div class="st">' + esc(f.clientCode) + '</div>' : "") + '</td><td>' + (f.status === "delivered" ? '<span class="badge t-emerald">Entregada</span>' : f.status === "issue" ? '<span class="badge t-rose">Rechazada</span>' : '<span class="badge t-amber">Pendiente</span>') + '</td><td class="num nowrap">' + money(f.amount) + '</td></tr>'; }).join("") + '</tbody></table></div>' : vacio("Sin facturas.")) + '</div></details>';
        }).join("") : vacio("Todavía no hay rutas cargadas en el período seleccionado.")) + '</div>';
      box.querySelector("#cmMes").onchange = function (e) { if (e.target.value) { S.mes = e.target.value; vCarga(el, vigente); } };
    }).catch(function (e) { if (vigente()) el.querySelector("#cmAud").innerHTML = errorBox(e); });
  }

  // ================= Arranque =================
  GE.requerirAdmin({ titulo: "Administración de Portal", texto: "Ingresá con tu cuenta de Google autorizada. Cada persona autorizada puede abrir este enlace desde su propio teléfono o computadora.", volver: { href: conPrueba("chofer.html"), label: "Volver a Soy Chofer" } }).then(function (u) {
    var nombre = (u && !u.isAnonymous && (u.displayName || u.email)) || "Usuario autorizado";
    document.getElementById("sbNombre").textContent = nombre;
    document.getElementById("sbNombre").title = (u && u.email) || "";
    document.getElementById("sbIni").textContent = nombre.trim().charAt(0).toUpperCase() || "U";
    var banda = document.querySelector(".ge-banda-prueba");
    if (banda) document.documentElement.style.setProperty("--banda", banda.offsetHeight + "px");
    sincronizarUrl();
    render();
  });
})();
</script>
</body>
</html>
