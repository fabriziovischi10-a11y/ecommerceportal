<!doctype html>
<html lang="es-AR">

<style>
  .chofer { max-width: 760px; padding: 1rem 16px 5rem; display: grid; gap: 1rem; }
  .ge-cab .esp { flex: 1; }
  [hidden] { display: none !important; }
  .menu > summary { white-space: nowrap; }
  .pwa .ico-pwa { flex: none; width: 38px; height: 38px; border-radius: 99px; display: grid; place-items: center; }
  .menu { position: relative; }
  .menu > summary { list-style: none; }
  .menu > summary::-webkit-details-marker { display: none; }
  .menu-lista { position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--border); border-radius: .8rem; box-shadow: 0 10px 30px rgba(16,30,54,.15); min-width: 210px; padding: .35rem; z-index: 60; display: grid; }
  .menu-lista a { padding: .6rem .75rem; border-radius: .55rem; text-decoration: none; color: var(--fg); font-weight: 600; }
  .menu-lista a:hover { background: var(--muted); }
  .menu-tit { font-size: .75rem; color: var(--muted-fg); padding: .3rem .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .wizard { display: grid; gap: .5rem; }
  .wizard .paso { font-size: .8rem; font-weight: 700; color: var(--muted-fg); text-transform: uppercase; letter-spacing: .04em; }
  .barra { height: 6px; background: var(--muted); border-radius: 99px; overflow: hidden; }
  .barra > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .25s; }
  .wizard .cab { display: flex; align-items: center; gap: .6rem; }
  .wizard h1 { margin: 0; font-size: 1.35rem; }
  .ceja { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-fg); margin-bottom: .15rem; }
  .sec { display: grid; gap: .75rem; }
  .sec > h2, .sec-cab h2 { margin: 0; }
  .sec-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; flex-wrap: wrap; }
  .res-grid { display: grid; gap: .6rem; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 560px) { .res-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .res { border-radius: .9rem; padding: .7rem .8rem; border: 1px solid rgba(0,0,0,.04); display: grid; gap: .1rem; text-align: left; font: inherit; color: inherit; }
  button.res { cursor: pointer; }
  button.res:hover { filter: brightness(.97); }
  .res .et { font-size: .78rem; font-weight: 700; opacity: .85; }
  .res .va { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; word-break: break-word; }
  .res .va.chico { font-size: 1.05rem; }
  .res .mas { font-size: .75rem; font-weight: 600; text-decoration: underline; opacity: .85; }
  .t-cyan { background: #ecfeff; color: #0e7490; } .t-cliente { background: var(--cliente-bg); color: var(--brand); }
  .lista { display: grid; gap: .5rem; }
  .item { display: flex; align-items: center; gap: .75rem; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: .9rem; padding: .75rem .85rem; font: inherit; color: inherit; cursor: pointer; min-height: 56px; touch-action: manipulation; }
  .item:hover { border-color: #b8c7d6; background: #fbfcfd; }
  .item .cuerpo { flex: 1; min-width: 0; display: grid; gap: .1rem; }
  .item .tit { font-weight: 700; word-break: break-word; }
  .item .sub { font-size: .85rem; color: var(--muted-fg); word-break: break-word; }
  .item .der { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .ic { flex: none; width: 34px; height: 34px; border-radius: 99px; display: grid; place-items: center; }
  .estado { font-size: .82rem; font-weight: 600; }
  .ok-txt { color: var(--emerald); } .warn-txt { color: var(--amber); } .rose-txt { color: var(--rose); } .orange-txt { color: var(--orange); }
  .mini { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: .4rem; }
  .mini > div { border-radius: .7rem; padding: .4rem .55rem; }
  .mini .et { font-size: .72rem; font-weight: 700; }
  .mini .va { font-weight: 800; font-variant-numeric: tabular-nums; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 440px) { .mini { grid-template-columns: 1fr; } .mini > div { display: flex; justify-content: space-between; align-items: center; gap: .5rem; } .mini .va { font-size: .9rem; } }
  .grupo { display: grid; gap: .5rem; padding: .75rem; border: 1px solid var(--border); border-radius: 1rem; background: #fafcfd; }
  .aviso { border-radius: .9rem; padding: .75rem .85rem; font-size: .9rem; }
  .pwa { display: flex; gap: .75rem; align-items: flex-start; }
  .pwa .cuerpo { flex: 1; }
  .opciones { display: grid; gap: .5rem; }
  .opciones.c3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .opciones.c2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .opcion { border: 2px solid var(--border); background: var(--card); border-radius: .9rem; padding: .6rem .5rem; font: inherit; cursor: pointer; text-align: center; display: grid; gap: .1rem; color: var(--fg); min-height: 60px; touch-action: manipulation; }
  .opcion b { font-size: .92rem; } .opcion span { font-size: .75rem; color: var(--muted-fg); }
  .opcion.on.t-emerald, .opcion.on.e-emerald { border-color: var(--emerald); background: var(--emerald-bg); color: var(--emerald); }
  .opcion.on.e-amber { border-color: var(--amber); background: var(--amber-bg); color: var(--amber); }
  .opcion.on.e-rose { border-color: var(--rose); background: var(--rose-bg); color: var(--rose); }
  .opcion.on.e-blue { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }
  .opcion.on.e-violet { border-color: var(--violet); background: var(--violet-bg); color: var(--violet); }
  .opcion.on span { color: inherit; }
  .bloque { border: 1px solid var(--border); border-radius: .9rem; padding: .75rem; display: grid; gap: .5rem; }
  .bloque h3 { margin: 0; }
  .panel { background: var(--slate-bg); border-radius: .9rem; padding: .75rem; display: grid; gap: .3rem; font-size: .92rem; }
  .panel .l { display: flex; justify-content: space-between; gap: .5rem; }
  .panel .l b { font-variant-numeric: tabular-nums; }
  .panel .msg { font-weight: 700; margin-top: .25rem; }
  .estrellas { display: flex; gap: .25rem; }
  .estrella { background: none; border: 0; padding: .15rem; cursor: pointer; color: #cbd5e1; touch-action: manipulation; }
  .estrella.on { color: #f59e0b; }
  .fotos { display: flex; gap: .4rem; flex-wrap: wrap; }
  .foto { position: relative; width: 64px; height: 64px; border-radius: .6rem; overflow: hidden; border: 1px solid var(--border); }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .foto button { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 99px; border: 0; background: rgba(15,23,42,.75); color: #fff; font-size: 12px; cursor: pointer; padding: 0; }
  .subir { display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; margin: 0; }
  .subir input { display: none; }
  .ck { display: flex; align-items: center; gap: .6rem; }
  .ck input[type=checkbox] { width: 22px; height: 22px; min-height: 0; flex: none; }
  .ck .item { flex: 1; }
  .err-dlg { color: var(--rose); background: var(--rose-bg); border-radius: .6rem; padding: .5rem .7rem; font-weight: 600; }
  .ancho { width: 100%; }
  .cheque-fila { display: flex; gap: .4rem; align-items: center; }
  .cheque-fila input { flex: 1; }
  .nota { font-size: .82rem; color: var(--muted-fg); }
  .sticky-acc { position: sticky; bottom: 0; background: var(--card); padding: .75rem 0 .25rem; border-top: 1px solid var(--border); margin-top: .5rem; }
  .flex1 { flex: 1; }
</style>

<body>
<header class="ge-cab">
  <img src="logo.png" alt="Portal Distribuidora">
  <div><div class="t1">Portal Distribuidora</div><div class="t2">Entregas</div></div>
  <div class="esp"></div>
  <details class="menu" id="menuControl">
    <summary class="btn btn-outline btn-sm">Control ▾</summary>
    <div class="menu-lista">
      <div class="menu-tit">Control</div>
      <a data-link="index.html">Inicio</a>
      <a data-link="admin.html">Panel administrador</a>
      <a data-link="admin.html#/seguimiento">Seguimiento</a>
    </div>
  </details>
  <button class="btn btn-ghost btn-sm" id="btnCambiar" hidden>Cambiar</button>
</header>
<main id="app" class="contenedor chofer"><div class="vacio">Cargando…</div></main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<script src="comun.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  "use strict";
  var esc = GE.esc, money = GE.money, r2 = GE.round2;
  var Q = new URLSearchParams(location.search);
  var TTL = 120000; // 2 min de caché para no gastar lecturas
  var ABIERTAS = ["scheduled", "open", "in_progress", "pending", "active"];

  // ---------------- Íconos ----------------
  var P = {
    atras: '<path d="m15 18-6-6 6-6"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    alerta: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
    editar: '<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
    basura: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    estrella: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/>',
    ubic: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    camara: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
    mas: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    flecha: '<path d="m9 18 6-6-6-6"/>',
    descargar: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
    compartir: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/>',
    celu: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>'
  };
  function ico(n, s) { s = s || 18; return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[n] + '</svg>'; }

  // ---------------- Catálogos ----------------
  var CATS = [["food", "Comida"], ["toll", "Peaje"], ["lodging", "Hospedaje"], ["phone", "Teléfono"], ["assistant", "Ayudante"], ["coca", "Coca"], ["taxi", "Remis"], ["truck_wash", "Lavado camión"], ["floor", "Piso"]];
  var CAT = {}; CATS.forEach(function (c) { CAT[c[0]] = c[1]; });
  var MOTIVOS = [["no_money", "Sin dinero"], ["not_authorized", "No autorizado"], ["closed", "Cliente cerrado"], ["damaged", "Mercadería dañada o rechazada por estado"], ["wrong_order", "Pedido equivocado o no solicitado"], ["other", "Otro motivo"]];
  var MOTIVO = {}; MOTIVOS.forEach(function (m) { MOTIVO[m[0]] = m[1]; });
  function catLabel(c) { return CAT[c] || c || "Gasto"; }

  // ---------------- Estado ----------------
  var S = {
    driver: null, fecha: /^\d{4}-\d{2}-\d{2}$/.test(Q.get("fecha") || "") ? Q.get("fecha") : GE.hoy(),
    route: null, client: null,
    buscarChofer: "", verTodos: false, buscarZona: "", buscarCC: "", ccSel: {},
    gasto: { cat: "food", monto: "", notas: "", editId: null }, manual: { abierta: false, numero: "", importe: "", detalle: "Flete" },
    ocupado: {}, pwaCerrado: false
  };
  var C = { drivers: null, zonas: {}, d: {}, dia: {}, cc: {} };
  var cargando = { drivers: false, dia: false, chofer: false, cc: false };
  var app = document.getElementById("app");

  // ---------------- Utilidades ----------------
  function num(v) { var n = Number(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) ? n : 0; }
  function pos(v) { var n = r2(num(v)); return n > 0 ? n : 0; }
  function suma(a) { return r2(a.reduce(function (x, y) { return x + (Number(y) || 0); }, 0)); }
  function plural(n, s, p) { return n + " " + (n === 1 ? s : p); }
  function ts(v) { var t = v ? new Date(v).getTime() : 0; return isFinite(t) ? t : 0; }
  function conPrueba(href) { if (!GE.PRUEBA) return href; var i = href.indexOf("#"); var base = i >= 0 ? href.slice(0, i) : href, hash = i >= 0 ? href.slice(i) : ""; return base + (base.indexOf("?") >= 0 ? "&" : "?") + "prueba=1" + hash; }
  /* Reparte `total` según `pesos` (proporcional); el último absorbe el redondeo. */
  function repartir(total, pesos) {
    var s = pesos.reduce(function (a, b) { return a + b; }, 0), acum = 0, out = [];
    pesos.forEach(function (w, i) {
      if (i === pesos.length - 1) out.push(r2(total - acum));
      else { var v = s ? r2(total * w / s) : 0; out.push(v); acum = r2(acum + v); }
    });
    return out;
  }
  function detallePago(f) {
    var acc = GE.ctaOriginal(f), partes = [];
    if (Math.abs(acc) > 0.0001) partes.push("Cta. cte. " + money(acc));
    if (Number(f.cashAmount) > 0) partes.push("Efectivo " + money(f.cashAmount));
    var ch = GE.sumaCheques(f.checkAmounts); if (ch > 0) partes.push("Cheque " + money(ch));
    if (Number(f.transferAmount) > 0) partes.push("Transferencia " + money(f.transferAmount));
    return partes.length ? partes.join(" + ") : "Sin informar";
  }
  function esCC(f) { return f.status === "delivered" && GE.saldo(f) > 0.009; }

  // Menú Control
  document.querySelectorAll("[data-link]").forEach(function (a) { a.href = conPrueba(a.getAttribute("data-link")); });
  document.addEventListener("click", function (e) { var m = document.getElementById("menuControl"); if (m.open && !m.contains(e.target)) m.open = false; });
  document.getElementById("btnCambiar").onclick = function () { S.driver = null; S.route = null; S.client = null; S.ccSel = {}; render(); };

  // ---------------- "Procedimientos" (driverFlow) sobre Firestore ----------------
  function listDrivers() {
    if (C.drivers) return Promise.resolve(C.drivers);
    return GE.todos("drivers").then(function (ds) {
      C.drivers = ds.filter(function (d) { return d.active !== false; })
        .map(function (d) { return { id: d.id, code: d.code || "", name: d.name || "" }; })
        .sort(function (a, b) { return a.name.localeCompare(b.name, "es"); });
      return C.drivers;
    });
  }
  function fechasRecientes(n) { var out = [], h = GE.hoy(); for (var i = 0; i < n; i++) out.push(GE.sumarDias(h, -i)); return out; }
  /* Carga todo lo del chofer: rutas (abiertas + últimas 60 jornadas), facturas de las rutas abiertas,
     gastos y cierres de caja de esas jornadas. Queda en caché TTL y se parchea tras cada acción. */
  function cargarChofer(driverId, forzar) {
    var d = C.d[driverId];
    if (d && !forzar && Date.now() - d.t < TTL) return Promise.resolve(d);
    cargando.chofer = true;
    return GE.donde("routes", [["driverId", "==", driverId], ["status", "in", ABIERTAS]]).then(function (abiertas) {
      var fechas = fechasRecientes(60);
      abiertas.forEach(function (r) { if (r.serviceDate && fechas.indexOf(r.serviceDate) < 0) fechas.push(r.serviceDate); });
      var extra = [["driverId", "==", driverId]];
      return Promise.all([
        GE.dondeEn("routes", "serviceDate", fechas, extra),
        GE.dondeEn("expenses", "serviceDate", fechas, extra),
        GE.dondeEn("cashClosures", "serviceDate", fechas, extra),
        GE.dondeEn("invoices", "routeId", abiertas.map(function (r) { return r.id; }))
      ]).then(function (res) {
        var porId = {};
        res[0].concat(abiertas).forEach(function (r) { porId[r.id] = r; });
        var inv = {};
        abiertas.forEach(function (r) { inv[r.id] = []; });
        res[3].forEach(function (f) { (inv[f.routeId] = inv[f.routeId] || []).push(f); });
        var nd = { t: Date.now(), driverId: driverId, rutas: Object.keys(porId).map(function (k) { return porId[k]; }), gastos: res[1], cierres: res[2], inv: inv };
        var zids = nd.rutas.map(function (r) { return r.zoneId; }).filter(function (z) { return z != null && !C.zonas[z]; });
        return (zids.length ? GE.dondeEn("zones", "id", zids).then(function (zs) { zs.forEach(function (z) { C.zonas[z.id] = z; }); }) : Promise.resolve()).then(function () {
          C.d[driverId] = nd; cargando.chofer = false; return nd;
        });
      });
    }).catch(function (e) { cargando.chofer = false; throw e; });
  }
  function dc() { return S.driver ? C.d[S.driver.id] : null; }
  function rutaActual() { var d = dc(); if (!d || !S.route) return null; return d.rutas.filter(function (r) { return r.id === S.route; })[0] || null; }
  function facturasRuta(routeId) { var d = dc(); return (d && d.inv[routeId]) || []; }

  function listZones() {
    var d = dc(); if (!d) return [];
    return d.rutas.filter(function (r) { return r.status !== "completed"; }).map(function (r) {
      var fs = d.inv[r.id] || [], last = null;
      fs.forEach(function (f) { if (f.status === "delivered" && f.deliveredAt && (!last || ts(f.deliveredAt) > ts(last))) last = f.deliveredAt; });
      return {
        routeId: r.id, routeName: r.name || "", zoneName: r.zoneName || "", zoneCode: (C.zonas[r.zoneId] || {}).code || "", serviceDate: r.serviceDate,
        pendingInvoices: fs.filter(function (f) { return f.status === "pending"; }).length,
        partialInvoices: fs.filter(function (f) { return f.status === "delivered" && f.deliveryType === "partial"; }).length,
        lastDeliveredAt: last
      };
    });
  }
  function listDailyCashSummaries() {
    var d = dc(); if (!d) return [];
    var g = {};
    d.rutas.forEach(function (r) {
      var x = g[r.serviceDate] = g[r.serviceDate] || { serviceDate: r.serviceDate, routeCount: 0, openRouteCount: 0, pettyCashAmount: 0, totalExpenses: 0, balance: 0, cashClosedAt: null };
      x.routeCount++; if (r.status !== "completed") x.openRouteCount++;
      x.pettyCashAmount = Math.max(x.pettyCashAmount, Number(r.pettyCashAmount) || 0);
    });
    d.gastos.forEach(function (e) { if (g[e.serviceDate]) g[e.serviceDate].totalExpenses = r2(g[e.serviceDate].totalExpenses + (Number(e.amount) || 0)); });
    d.cierres.forEach(function (c) { var x = g[c.serviceDate]; if (x && c.closedAt && !c.reopenedAt && (!x.cashClosedAt || ts(c.closedAt) > ts(x.cashClosedAt))) x.cashClosedAt = c.closedAt; });
    return Object.keys(g).map(function (k) { var x = g[k]; x.balance = r2(x.pettyCashAmount - x.totalExpenses); return x; })
      .sort(function (a, b) { return b.serviceDate < a.serviceDate ? -1 : 1; });
  }
  function listClients(routeId) {
    var g = {};
    facturasRuta(routeId).forEach(function (f) {
      var x = g[f.clientId] = g[f.clientId] || { id: f.clientId, businessName: f.clientName || "", address: f.clientAddress || "", invoiceCount: 0, pendingCount: 0, partialCount: 0, completedAt: null, _max: null };
      x.invoiceCount++;
      if (f.status === "pending") x.pendingCount++;
      if (f.status === "delivered" && f.deliveryType === "partial") x.partialCount++;
      var t = f.deliveredAt || f.rejectedAt; if (t && (!x._max || ts(t) > ts(x._max))) x._max = t;
    });
    return Object.keys(g).map(function (k) { var x = g[k]; if (x.pendingCount === 0 && x.partialCount === 0) x.completedAt = x._max; return x; })
      .sort(function (a, b) { return a.businessName.localeCompare(b.businessName, "es"); });
  }
  function getZoneSummary(routeId) { var fs = facturasRuta(routeId); return { totalInvoices: fs.length, pendingInvoices: fs.filter(function (f) { return f.status === "pending"; }).length }; }
  function getRouteExpenses(routeId) {
    var d = dc(); var ex = (d ? d.gastos : []).filter(function (e) { return e.routeId === routeId; }).sort(function (a, b) { return ts(b.spentAt) - ts(a.spentAt); });
    return { totalExpenses: suma(ex.map(function (e) { return e.amount; })), expenses: ex };
  }
  function listInvoices(routeId, clientId) {
    return facturasRuta(routeId).filter(function (f) { return f.clientId === clientId; })
      .sort(function (a, b) { return String(a.invoiceNumber).localeCompare(String(b.invoiceNumber), "es", { numeric: true }); });

    var file = new File([blob], nombre, { type: "application/pdf" });
    return { blob: blob, file: file, entregar: function () {
      function bajar() { var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); return "descargado"; }
      if (compartir && navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: titulo }).then(function () { return "compartido"; })
          .catch(function (e) { if (e && e.name === "AbortError") return "compartido"; return bajar(); });
      }
      return Promise.resolve(bajar());
    } };
  }

  function pintarSaldoCC() {

  function prepararFoto(file) {

    if (file.size > 20 * 1024 * 1024) throw new Error("La foto original supera 20 MB. Sacala nuevamente con menor resolución.");
    return { file: file, url: URL.createObjectURL(file) };
  }
  function htmlFotos(lista, tipo, etiqueta) {

      (lista.length < 6 ? '<label class="btn btn-outline btn-sm subir">' + ico("camara", 16) + ' ' + etiqueta + '<input type="file" accept="image/*" capture="environment" multiple data-foto="' + tipo + '"></label>' : '<div class="nota">Máximo 6 fotos.</div>');

  // ---------------- Ubicación ----------------
  function obtenerUbicacion() {
    return new Promise(function (ok, no) {
      if (!navigator.geolocation) return no(new Error("Este dispositivo o navegador no permite obtener la ubicación."));
      if (!window.isSecureContext) return no(new Error("La ubicación solo se puede solicitar desde el enlace seguro de la aplicación."));
      function exito(p) { ok({ latitude: p.coords.latitude, longitude: p.coords.longitude, accuracyMeters: p.coords.accuracy != null ? r2(p.coords.accuracy) : null, capturedAt: GE.ahora() }); }
      function msg(e) {
        var m = e && e.code === 1 ? "El permiso de ubicación fue rechazado. Habilitalo para Portal Distribuidora en los ajustes del navegador."
          : e && e.code === 2 ? "El teléfono no pudo determinar una ubicación. Activá GPS o ubicación precisa y reintentá."
          : e && e.code === 3 ? "La ubicación tardó demasiado. Revisá GPS o señal y volvé a intentarlo."
          : "No fue posible obtener la ubicación. Revisá los permisos y reintentá.";
        return new Error(m);
      }
      navigator.geolocation.getCurrentPosition(exito, function (e) {
        if (e && (e.code === 2 || e.code === 3)) navigator.geolocation.getCurrentPosition(exito, function (e2) { no(msg(e2)); }, { enableHighAccuracy: false, timeout: 30000, maximumAge: 60000 });
        else no(msg(e));
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
  }

  // ---------------- Diálogo de factura ----------------
  function abrirFactura(f) {
    if (f.status !== "pending") return dlgRevertir(f);

  }
  function dlgRevertir(f) {
    var rech = f.status === "issue", oc = false;
    var html = '<p class="muted" style="margin-top:0">' + esc(f.clientName) + ' · Factura ' + esc(f.invoiceNumber) + '</p>' +
      (rech ? '<div class="aviso t-rose"><b>Motivo: ' + esc(MOTIVO[f.rejectionReason] || f.rejectionReason || "Motivo no informado") + '</b>' + (f.rejectionNotes ? '<div>' + esc(f.rejectionNotes) + '</div>' : '') +
        '<div class="small" style="margin-top:.3rem">La factura queda registrada como rechazo y no como entrega.</div></div>'
        : '<div class="aviso t-amber">La factura volverá a pendiente y se quitarán pago, descuento, ubicación, encuesta y adjuntos.</div>' +
          '<div class="panel" style="margin-top:.6rem"><div class="l"><span>Importe</span><b>' + money(f.amount) + '</b></div><div class="l"><span>Tipo</span><b>' + (f.deliveryType === "partial" ? "Parcial" : "Total") + '</b></div><div class="l"><span>Pago</span><b style="text-align:right">' + esc(detallePago(f)) + '</b></div></div>') +
      '<div id="errRev"></div><div class="ge-acciones"><button class="btn btn-outline" data-r="cancelar">Cancelar</button><button class="btn btn-danger" data-r="ok">' + (rech ? "Volver a pendiente" : "Quitar tilde") + '</button></div>';
    var m = GE.modal({ titulo: rech ? "Mercadería rechazada" : "Quitar tilde de entrega", html: html });
    m.el.addEventListener("click", function (e) {
      var b = e.target.closest("[data-r]"); if (!b) return;
      if (b.dataset.r === "cancelar") return m.cerrar();
      if (oc) return; oc = true; b.disabled = true; b.textContent = "Revirtiendo...";
      revertirFactura(f).then(function () { GE.toast("Factura devuelta a pendiente."); m.cerrar(); alCambiar(); })
        .catch(function (e) { oc = false; b.disabled = false; b.textContent = rech ? "Volver a pendiente" : "Quitar tilde"; m.el.querySelector("#errRev").innerHTML = '<div class="err-dlg">' + esc(e.message || "No se pudo revertir.") + '</div>'; GE.toast(e.message || "No se pudo revertir.", "error"); });
    });

  function dlgEntrega(f) {
    var amount = Number(f.amount) || 0, NC = amount < 0;
    var pendCli = facturasRuta(f.routeId).filter(function (x) { return x.clientId === f.clientId && x.status === "pending"; });
    var totalCli = suma(pendCli.map(function (x) { return x.amount; }));
    var st = {
      tipo: "total", loc: null, locErr: null, buscando: false, pagoTotal: false,
      metodos: { account: true, cash: false, check: false, transfer: false }, montos: { account: String(amount), cash: "", transfer: "" },
      cheques: [""], fotos: { check: [], transfer: [] }, descuento: "", notas: "", motivo: "", motivoNotas: "",
      est: { p: 0, s: 0, o: 0 }, guardando: false, rechazando: false, error: null
    };
    var m = GE.modal({ titulo: "Confirmar entrega", html: "", ancho: "600px", onCerrar: function () {
      ["check", "transfer"].forEach(function (t) { st.fotos[t].forEach(function (p) { URL.revokeObjectURL(p.url); }); });
    } });
    var caja = m.el.closest(".ge-modal");

    function calc() {
      var base = st.pagoTotal ? totalCli : amount;
      var desc = NC ? 0 : (base > 0 ? Math.min(base - 0.01, Math.max(0, num(st.descuento))) : 0);
      var neto = r2(base - desc);
      var act = ["account", "cash", "check", "transfer"].filter(function (k) { return st.metodos[k]; });
      var soloCta = act.length === 1 && act[0] === "account";
      var acc = !st.metodos.account ? 0 : NC ? amount : (soloCta && String(st.montos.account).trim() === "") ? r2(base - desc) : r2(num(st.montos.account));
      var cash = st.metodos.cash ? pos(st.montos.cash) : 0, transfer = st.metodos.transfer ? pos(st.montos.transfer) : 0;
      var checks = st.metodos.check ? st.cheques.map(pos) : [], chk = suma(checks);
      var ingresado = r2(acc + cash + chk + transfer), dif = r2(neto - ingresado);
      return { base: base, desc: desc, neto: neto, act: act, soloCta: soloCta, acc: acc, cash: cash, transfer: transfer, checks: checks, chk: chk, ingresado: ingresado, dif: dif, bal: Math.abs(dif) < 0.01 };
    }
    function habilitado(c) {
      if (st.tipo === "rechazo") return false;
      if (!(st.est.p > 0 && st.est.s > 0 && st.est.o > 0)) return false;
      if (st.tipo === "parcial") return c.ingresado > 0 && c.ingresado <= c.neto + 0.009;
      if (c.neto === 0) return true;
      if (!c.act.length) return false;
      if (st.metodos.account && !(NC ? c.acc < 0 : c.acc > 0)) return false;
      if (st.metodos.cash && !(c.cash > 0)) return false;
      if (st.metodos.transfer && !(c.transfer > 0)) return false;
      if (st.metodos.check && !(c.checks.length && c.checks.every(function (v) { return v > 0; }))) return false;
      return c.bal;
    }
    function textoUbic() {
      if (st.buscando) return "Buscando ubicación...";
      if (st.loc) return "Ubicación obtenida." + (st.loc.accuracyMeters != null ? " Precisión ±" + Math.round(st.loc.accuracyMeters) + " m." : "");
      if (st.locErr) return st.locErr + " Podés continuar sin ubicación volviendo a confirmar.";
      return "Se solicitará la ubicación al confirmar.";
    }
    function htmlPanel() {
      var c = calc(), msg, cls;
      if (c.bal) { msg = st.tipo === "parcial" ? "Entrega parcial lista para guardar." : "El total está controlado y coincide."; cls = "ok-txt"; }
      else if (c.dif > 0) { msg = "Falta asignar: " + money(c.dif); cls = "warn-txt"; }
      else { msg = "Se excede por: " + money(-c.dif); cls = "rose-txt"; }
      return '<div class="l"><span>' + (st.pagoTotal ? "Boletas seleccionadas" : "Factura") + '</span><b>' + money(c.base) + '</b></div>' +
        (c.desc > 0 ? '<div class="l"><span>Descuento por importe</span><b>− ' + money(c.desc) + '</b></div>' : '') +
        '<div class="l"><span>Total neto</span><b>' + money(c.neto) + '</b></div>' +
        '<div class="l"><span>Pagos cargados</span><b>' + money(c.ingresado) + '</b></div>' +
        (!st.pagoTotal && totalCli > amount + 0.009 && pendCli.length > 1 ? '<div class="l small muted"><span>Total bruto del cliente</span><b>' + money(totalCli) + '</b></div>' : '') +
        '<div class="msg ' + cls + '">' + msg + '</div>' +
        (st.tipo !== "parcial" && !c.bal && c.dif > 0 ? '<button type="button" class="btn btn-outline btn-sm" data-d="completarCta">Completar saldo en Cuenta Corriente</button>' : '');
    }
    function pintarPanel() {
      var c = calc(), p = m.el.querySelector("#panelCobro"); if (p) p.innerHTML = htmlPanel();
      var b = m.el.querySelector("#btnConfirmar"); if (b) b.disabled = st.guardando || !habilitado(c);

    function toggle(k, v, sub, tono) {

      } else {

        if (NC) {
          h += '<div class="aviso t-blue"><b>Nota de crédito:</b> se registra automáticamente como un ajuste negativo en Cuenta Corriente.</div>' +
            '<label>Monto a cuenta corriente</label><input type="number" readonly value="' + amount + '">';
        } else {
          h += '<div class="opciones c2">' + toggle("account", "Cuenta corriente", "Saldo a la cuenta", "e-blue") + toggle("cash", "Efectivo", "Monto cobrado", "e-emerald") +
            toggle("check", "Cheque", "Montos y fotos", "e-amber") + toggle("transfer", "Transferencia", "Monto transferido", "e-violet") + '</div>';
          if (st.metodos.account) h += '<label>Monto a cuenta corriente</label><input type="number" inputmode="decimal" min="0.01" step="0.01" data-d="monto" data-k="account" placeholder="Monto a cuenta corriente" value="' + esc(st.montos.account) + '">';
          if (st.metodos.cash) h += '<label>Monto en efectivo</label><input type="number" inputmode="decimal" min="0.01" step="0.01" data-d="monto" data-k="cash" placeholder="Monto en efectivo" value="' + esc(st.montos.cash) + '">';
          if (st.metodos.check) h += '<label>Cheques</label>' + htmlCheques(st) + htmlFotos(st.fotos.check, "check", "Sacar o adjuntar fotos");
          if (st.metodos.transfer) h += '<label>Monto por transferencia</label><input type="number" inputmode="decimal" min="0.01" step="0.01" data-d="monto" data-k="transfer" placeholder="Monto por transferencia" value="' + esc(st.montos.transfer) + '">' +

          h += '<label>Descuento por importe</label><input type="number" inputmode="decimal" min="0" max="' + r2(c.base - 0.01) + '" step="0.01" data-d="descuento" placeholder="0,00" value="' + esc(st.descuento) + '">' +
            '<div class="nota">Ingresá el monto exacto que se resta de la factura, no un porcentaje.</div>';
        }
        h += '<label>Información adicional del cobro</label><textarea rows="2" maxlength="500" data-d="notas">' + esc(st.notas) + '</textarea></div>';
        h += '<div class="panel" id="panelCobro"></div>';
        h += '<div class="bloque t-violet"><b>Encuesta</b>' +

    function pintar() {

    }
    function ubicar() {
      st.buscando = true; pintar();
      return obtenerUbicacion().then(function (l) { st.loc = l; st.locErr = null; }, function (e) { st.locErr = e.message; st.loc = null; })
        .then(function () { st.buscando = false; if (document.body.contains(m.el)) pintar(); });
    }
    function enviar() {
      var c = calc();
      if (!habilitado(c)) return;
      var activos = c.act, payment = {
        method: activos.length > 1 ? "mixed" : (activos[0] || "mixed"), hasAccount: !!st.metodos.account,
        account: st.metodos.account ? c.acc : 0, cash: c.cash, transfer: c.transfer, checks: st.metodos.check ? c.checks.filter(function (v) { return v > 0; }) : [],
        discount: c.desc, notes: st.notas.trim()
      };
      var ids = st.pagoTotal ? pendCli.map(function (x) { return x.id; }) : [f.id];
      st.guardando = true; st.error = null; pintar();

        survey: { punctualityRating: st.est.p, serviceRating: st.est.s, overallRating: st.est.o },
        fotosCheque: st.metodos.check ? st.fotos.check : [], fotosTransfer: st.metodos.transfer ? st.fotos.transfer : []
      }).then(function (r) {
        GE.toast(ids.length > 1 ? r.appliedInvoices + " entregas, cobro y trazabilidad guardados." : st.loc ? "Entrega, cobranza y ubicación guardadas." : "Entrega y cobranza guardadas sin ubicación.");
        m.cerrar(); alCambiar();
      }).catch(function (e) {
        console.error(e); st.guardando = false; st.error = (e && e.message) || "No se pudo guardar la entrega.";

    m.el.addEventListener("click", function (e) {
      var b = e.target.closest("[data-d]"); if (!b || b.disabled) return;

      if (d === "cancelar") return m.cerrar();
      if (d === "ubicar") return ubicar();
      if (d === "tipo") { st.tipo = b.dataset.v; st.motivo = ""; st.motivoNotas = ""; if (st.tipo === "rechazo") st.pagoTotal = false; st.error = null; return pintar(); }
      if (d === "pagoTotal") {
        st.pagoTotal = !st.pagoTotal;
        st.metodos = { account: true, cash: false, check: false, transfer: false };
        st.montos = { account: String(st.pagoTotal ? totalCli : amount), cash: "", transfer: "" }; st.cheques = [""]; st.descuento = "";
        return pintar();
      }
      if (d === "metodo") {
        var k = b.dataset.k, c = calc();
        if (!st.metodos[k] && k !== "account" && c.soloCta && Math.abs(c.acc - c.neto) < 0.01) { st.metodos.account = false; st.montos.account = ""; }
        st.metodos[k] = !st.metodos[k];
        return pintar();
      }
      if (d === "agregarCheque") { st.cheques.push(""); return pintar(); }
      if (d === "quitarCheque") { st.cheques.splice(Number(b.dataset.i), 1); return pintar(); }
      if (d === "quitarFoto") { var l = st.fotos[b.dataset.t], p = l.splice(Number(b.dataset.i), 1)[0]; if (p) URL.revokeObjectURL(p.url); return pintar(); }
      if (d === "estrella") { st.est[b.dataset.k] = Number(b.dataset.v); return pintar(); }

        var prev = st.metodos.account ? c2.acc : 0;

      }
      if (d === "rechazar") {
        if (!st.motivo) return;

        st.rechazando = true; st.error = null; pintar();
        rechazarFactura(f, st.motivo, st.motivoNotas.trim()).then(function () { GE.toast("Rechazo del cliente guardado."); m.cerrar(); alCambiar(); })
          .catch(function (e) { st.rechazando = false; st.error = e.message || "No se pudo guardar el rechazo."; GE.toast(st.error, "error"); pintar(); });
        return;
      }
      if (d === "confirmar") {
        if (st.guardando) return;
        if (st.loc || st.locErr) return enviar();
        st.buscando = true; pintar();
        obtenerUbicacion().then(function (l) { st.loc = l; st.buscando = false; enviar(); }, function (err) { st.locErr = err.message; st.buscando = false; pintar(); });
      }
    });
    m.el.addEventListener("input", function (e) {
      var t = e.target, d = t.dataset && t.dataset.d; if (!d) return;
      if (d === "monto") st.montos[t.dataset.k] = t.value;
      else if (d === "cheque") st.cheques[Number(t.dataset.i)] = t.value;
      else if (d === "descuento") {
        st.descuento = t.value;
        var c = calc();
        if (c.soloCta) { st.montos.account = String(r2(c.base - c.desc)); var a = m.el.querySelector('[data-d="monto"][data-k="account"]'); if (a) a.value = st.montos.account; }

  // ---------------- Diálogo de pago de cuenta corriente ----------------
  function abrirPagoCC(items) {
    var ruta = rutaActual(), lote = items.length > 1;
    var orig = suma(items.map(function (x) { return x.originalAccountAmount; })), pagado = suma(items.map(function (x) { return x.paidAmount; })), saldo = suma(items.map(function (x) { return x.outstandingAmount; }));
    var st = { metodos: { cash: false, check: false, transfer: false }, montos: { cash: "", transfer: "" }, cheques: [""], fotos: { check: [], transfer: [] }, notas: "", guardando: false, error: null };
    var m = GE.modal({ titulo: "Aplicar pago a Cuenta Corriente", html: "", ancho: "600px", onCerrar: function () { ["check", "transfer"].forEach(function (t) { st.fotos[t].forEach(function (p) { URL.revokeObjectURL(p.url); }); }); } });
    var caja = m.el.closest(".ge-modal");
    function calc() {
      var cash = st.metodos.cash ? pos(st.montos.cash) : 0, transfer = st.metodos.transfer ? pos(st.montos.transfer) : 0, checks = st.metodos.check ? st.cheques.map(pos) : [];
      var total = r2(cash + transfer + suma(checks));
      return { cash: cash, transfer: transfer, checks: checks, total: total, restante: r2(saldo - total) };
    }
    function valido(c) {
      if (!(c.total > 0) || c.restante < -0.009) return false;
      if (st.metodos.cash && !(c.cash > 0)) return false;
      if (st.metodos.transfer && !(c.transfer > 0)) return false;
      if (st.metodos.check && !(c.checks.length && c.checks.every(function (v) { return v > 0; }))) return false;
      return true;
    }
    function htmlPanel() {
      var c = calc();
      return '<div class="l"><span>Saldo pendiente</span><b>' + money(saldo) + '</b></div><div class="l"><span>Pago ingresado</span><b>' + money(c.total) + '</b></div>' +
        '<div class="l"><span>Saldo restante</span><b>' + money(c.restante) + '</b></div>' +
        (c.restante > 0.009 ? '<button type="button" class="btn btn-outline btn-sm" data-d="completar">Completar el saldo</button>' : '') +
        (c.restante < -0.009 ? '<div class="msg rose-txt">El pago supera el saldo de la factura.</div>' : '');
    }
    function pintarPanel() { var p = m.el.querySelector("#panelCC"); if (p) p.innerHTML = htmlPanel(); var b = m.el.querySelector("#btnAplicar"); if (b) b.disabled = st.guardando || !valido(calc()); }
    function tg(k, v, sub, tono) { return '<button type="button" class="opcion ' + tono + (st.metodos[k] ? " on" : "") + '" data-d="metodo" data-k="' + k + '" aria-pressed="' + st.metodos[k] + '"><b>' + v + '</b><span>' + sub + '</span></button>'; }
    function cuerpo() {
      var h = '<p class="muted" style="margin-top:0">' + esc(items[0].clientName) + ' · ' + (lote ? items.length + " facturas seleccionadas" : "Factura " + esc(items[0].invoiceNumber)) + '</p><div class="grid">' +
        '<div class="mini"><div class="t-slate"><div class="et">Original</div><div class="va">' + money(orig) + '</div></div><div class="t-emerald"><div class="et">Ya cobrado</div><div class="va">' + money(pagado) + '</div></div><div class="t-amber"><div class="et">Saldo</div><div class="va">' + money(saldo) + '</div></div></div>' +
        '<div class="bloque"><div><b>¿Cómo paga ahora?</b><div class="small muted">Podés combinar efectivo, cheque y transferencia.</div></div>' +
        '<div class="opciones c3">' + tg("cash", "Efectivo", "Monto cobrado", "e-emerald") + tg("check", "Cheque", "Montos y fotos", "e-amber") + tg("transfer", "Transferencia", "Monto transferido", "e-violet") + '</div>';
      if (st.metodos.cash) h += '<label>Monto en efectivo</label><input type="number" inputmode="decimal" min="0.01" step="0.01" data-d="monto" data-k="cash" placeholder="Monto en efectivo" value="' + esc(st.montos.cash) + '">';
      if (st.metodos.check) h += '<label>Cheques</label>' + htmlCheques(st) + htmlFotos(st.fotos.check, "check", "Sacar o adjuntar fotos");
      if (st.metodos.transfer) h += '<label>Monto por transferencia</label><input type="number" inputmode="decimal" min="0.01" step="0.01" data-d="monto" data-k="transfer" placeholder="Monto por transferencia" value="' + esc(st.montos.transfer) + '">' + htmlFotos(st.fotos.transfer, "transfer", "Sacar o adjuntar comprobante de transferencia");
      h += '<label>Detalle del pago (opcional)</label><textarea rows="2" maxlength="500" data-d="notas">' + esc(st.notas) + '</textarea></div>' +
        '<div class="panel" id="panelCC"></div>' + (st.error ? '<div class="err-dlg">' + esc(st.error) + '</div>' : '') + '</div>' +
        '<div class="ge-acciones sticky-acc"><button type="button" class="btn btn-outline" data-d="cancelar">Cancelar</button><button type="button" class="btn btn-primary" id="btnAplicar" data-d="aplicar">' + (st.guardando ? "Guardando..." : lote ? "Aplicar pago proporcional" : "Aplicar pago") + '</button></div>';
      return h;
    }
    function pintar() { var y = caja.scrollTop; m.el.innerHTML = cuerpo(); pintarPanel(); caja.scrollTop = y; }
    m.el.addEventListener("click", function (e) {
      var b = e.target.closest("[data-d]"); if (!b || b.disabled) return;
      var d = b.dataset.d;
      if (d === "cancelar") return m.cerrar();
      if (d === "metodo") { st.metodos[b.dataset.k] = !st.metodos[b.dataset.k]; return pintar(); }
      if (d === "agregarCheque") { st.cheques.push(""); return pintar(); }
      if (d === "quitarCheque") { st.cheques.splice(Number(b.dataset.i), 1); return pintar(); }
      if (d === "quitarFoto") { var l = st.fotos[b.dataset.t], p = l.splice(Number(b.dataset.i), 1)[0]; if (p) URL.revokeObjectURL(p.url); return pintar(); }
      if (d === "completar") {
        var c = calc(); if (c.restante <= 0.009) return;
        if (st.metodos.cash) st.montos.cash = String(r2(c.cash + c.restante));
        else if (st.metodos.check) st.cheques[0] = String(r2(pos(st.cheques[0]) + c.restante));
        else if (st.metodos.transfer) st.montos.transfer = String(r2(c.transfer + c.restante));
        else { st.metodos.cash = true; st.montos.cash = String(c.restante); }
        return pintar();
      }
      if (d === "aplicar") {
        var c3 = calc(); if (st.guardando || !valido(c3)) return;
        st.guardando = true; st.error = null; pintar();
        aplicarPagoCC({ ids: items.map(function (x) { return x.id; }), cash: c3.cash, transfer: c3.transfer, checks: c3.checks.filter(function (v) { return v > 0; }), notes: st.notas.trim(),
          fotosCheque: st.metodos.check ? st.fotos.check : [], fotosTransfer: st.metodos.transfer ? st.fotos.transfer : [] })
          .then(function (r) {
            GE.toast(lote ? "Pago agrupado aplicado a " + r.appliedInvoices + " facturas." : r.remainingAmount > 0.009 ? "Pago guardado. Saldo restante: " + money(r.remainingAmount) + "." : "Pago guardado. La factura quedó cancelada.");
            S.ccSel = {}; m.cerrar(); alCambiar();
          }).catch(function (e) { console.error(e); st.guardando = false; st.error = (e && e.message) || "No se pudo aplicar el pago."; GE.toast(st.error, "error"); pintar(); });
      }
    });
    m.el.addEventListener("input", function (e) {
      var t = e.target, d = t.dataset && t.dataset.d; if (!d) return;
      if (d === "monto") st.montos[t.dataset.k] = t.value; else if (d === "cheque") st.cheques[Number(t.dataset.i)] = t.value; else if (d === "notas") st.notas = t.value;
      pintarPanel();
    });
    m.el.addEventListener("change", function (e) { var t = e.target; if (t.dataset.foto) { agregarFotos(st, t.dataset.foto, t.files); pintar(); } });
    pintar();
  }

  // ---------------- Recibo y cierre de caja ----------------
  function slug(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "cliente"; }
  function emitirRecibo(compartir) {
    var ruta = rutaActual(), cli = clienteActual(); if (!ruta || !cli) return;
    var fs = listInvoices(ruta.id, cli.id);
    if (!fs.length || !fs.every(function (f) { return f.status === "delivered"; })) { GE.toast("Todas las facturas del cliente tienen que estar entregadas.", "error"); return; }
    S.ocupado.recibo = true; render();
    var ms = Date.now(), numero = "RC-" + ms, emitido = new Date(ms).toISOString();
    var nombre = numero + "-recibo-" + slug(cli.businessName) + "-" + ruta.serviceDate + ".pdf";
    pdfRecibo(ruta, cli, fs, numero, emitido).then(function (r) {
      var out = salidaPdf(r.doc, nombre, compartir, "Recibo " + numero);
      return GE.guardarArchivo(out.blob, "recibos", nombre).then(function (fileUrl) {
        var id = GE.nuevoId();
        return GE.guardar("receipts", {
          id: id, receiptNumber: numero, routeId: ruta.id, clientId: cli.id, clientName: cli.businessName, driverId: S.driver.id, driverName: S.driver.name,
          serviceDate: ruta.serviceDate, zoneName: ruta.zoneName, totalAmount: r.totalNeto, fileUrl: fileUrl, issuedAt: emitido,
          paymentSummary: JSON.stringify(fs.map(function (f) {
            return { invoiceNumber: f.invoiceNumber, amount: f.amount, status: f.status, deliveryType: f.deliveryType, paymentMethod: f.paymentMethod, accountAmount: f.accountAmount,
              cashAmount: f.cashAmount, checkAmounts: f.checkAmounts, transferAmount: f.transferAmount, discountPercent: f.discountPercent, discountAmount: f.discountAmount, netAmount: GE.neto(f), paymentNotes: f.paymentNotes };
          }))
        });
      }).then(function () { return out.entregar(); });
    }).then(function (modo) {
      GE.toast(modo === "compartido" ? "Recibo guardado y listo para compartir por WhatsApp." : "Recibo guardado y descargado.");
    }).catch(function (e) { console.error(e); GE.toast("No se pudo emitir el recibo.", "error"); })
      .then(function () { S.ocupado.recibo = false; render(); });
  }
  function cerrarCaja(fecha, compartir) {
    S.ocupado["caja" + fecha] = true; render();
    var emitido = GE.ahora();
    getDailyCashDetails(fecha).then(function (det) {
      errorSi(!det.routes.length, "No hay rutas en esta jornada.");
      errorSi(det.routes.some(function (r) { return r.status !== "completed"; }), "Primero cerrá todas las rutas de esta jornada.");
      errorSi(det.cierres.some(function (c) { return c.closedAt && !c.reopenedAt; }), "La caja de esta jornada ya estaba cerrada.");
      return pdfCaja(fecha, det, emitido).then(function (doc) {
        var nombre = "cierre-caja-" + slug(S.driver.name) + "-" + fecha + ".pdf";
        var out = salidaPdf(doc, nombre, compartir, "Cierre de caja " + GE.fechaChofer(fecha));
        return GE.guardarArchivo(out.blob, "cajas", nombre).then(function (fileUrl) {
          var c = { id: GE.nuevoId(), driverId: S.driver.id, driverName: S.driver.name, serviceDate: fecha, pettyCashAmount: det.pettyCashAmount, totalExpenses: det.totalExpenses,
            balance: det.balance, fileUrl: fileUrl, closedAt: emitido, reopenedAt: null, reopenReason: null };
          return GE.guardar("cashClosures", c).then(function () { var d = dc(); if (d) d.cierres.push(c); });
        }).then(function () { return out.entregar(); });
      });
    }).then(function (modo) {
      GE.toast(modo === "compartido" ? "Caja cerrada. El PDF quedó guardado y listo para compartir." : "Caja cerrada. El PDF quedó guardado y descargado.");
    }).catch(function (e) { console.error(e); GE.toast(e && e.message && /cerr|rutas|caja/i.test(e.message) ? e.message : "No se pudo cerrar la caja.", "error"); })
      .then(function () { delete S.ocupado["caja" + fecha]; render(); });
  }

  // ---------------- Inicio ----------------
  render();
  GE.anonimo().then(function () {
    var pDia = cargarDia(S.fecha).then(function () { if (paso() === 1) render(); }).catch(errorToast("No se pudo cargar el resumen del día."));
    return listDrivers().then(function () {
      var chofer = Number(Q.get("chofer"));
      if (chofer) S.driver = C.drivers.filter(function (d) { return d.id === chofer; })[0] || null;
      if (!S.driver) { listo = true; render(); return; }
      render();
      return cargarChofer(S.driver.id).catch(function (e) { listo = true; throw e; }).then(function () {
        listo = true;
        var ruta = Number(Q.get("ruta")), cliente = Number(Q.get("cliente")), factura = Number(Q.get("factura"));
        var z = ruta && listZones().filter(function (x) { return x.routeId === ruta; })[0];
        if (z) {
          S.route = ruta; S.fecha = z.serviceDate;
          if (cliente && facturasRuta(ruta).some(function (f) { return f.clientId === cliente; })) S.client = cliente;
        }
        render();
        if (S.client) cargarCC(S.client).then(refrescarCC).catch(errorToast("No se pudieron cargar los saldos."));
        if (S.client && factura) { var f = facturasRuta(S.route).filter(function (x) { return x.id === factura && x.clientId === S.client; })[0]; if (f) abrirFactura(f); }
      });
    }).then(function () { return pDia; });
  }).catch(function (e) {
    console.error(e);
    app.innerHTML = '<section class="card"><div class="vacio"><b>No pudimos conectar con la base de datos.</b><div class="small">' + esc(e.message || "") + '</div></div></section>';
  });
})();
</script>
