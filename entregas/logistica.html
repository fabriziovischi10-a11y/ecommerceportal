  .cargando { display: grid; place-items: center; min-height: 16rem; color: var(--muted-fg); font-size: .9rem; background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 1.25rem; }

  // ---------- Utilidades ----------

    var ownTankLiters = sumL(fuel.filter(function (f) { return f.source === "own_tank"; }));
    var routeLiters = sumL(fuel.filter(function (f) { return f.source === "service_station"; }));
    var fuelCost = r2(fuel.reduce(function (a, f) { return a + Math.max(0, n0(f.totalCost)); }, 0));
    var tollCost = Math.max(0, n0(e.tollCost)), otherCost = Math.max(0, n0(e.otherCost));
    var pettyCashCost = r2(gastos.reduce(function (a, g) { return a + Math.max(0, n0(g.amount)); }, 0));
    var amortizationCost = Math.max(0, n0(e.amortizationCost)), gpsCost = Math.max(0, n0(e.gpsCost));
    var driverSalaryCost = Math.max(0, n0(e.driverSalaryCost)), collectorSalaryCost = Math.max(0, n0(e.collectorSalaryCost));
    var markupPercent = Math.max(0, n0(e.markupPercent));
    var totalCost = r2(fuelCost + tollCost + otherCost + pettyCashCost + amortizationCost + gpsCost + driverSalaryCost + collectorSalaryCost);
    var units = items.reduce(function (a, i) { return a + Math.max(0, Math.trunc(n0(i.units))); }, 0);
    var invoiceAmount = r2(items.reduce(function (a, i) { return a + n0(i.amount); }, 0));
    var markupAmount = r2(invoiceAmount * (markupPercent / 100));
    var utility = r2(invoiceAmount - totalCost - markupAmount);
    var dest = new Set(items.map(function (i) { return i.destinationName ? String(i.destinationName).trim() : ""; }).filter(Boolean)).size;
    var delivered = items.filter(function (i) { return i.deliveryStatus === "delivered"; }).length;
    var partial = items.filter(function (i) { return i.deliveryStatus === "delivered" && i.deliveryType === "partial"; }).length;
    var issue = items.filter(function (i) { return i.deliveryStatus === "issue"; }).length;

      '<div class="full"><label for="tNotas">Notas</label><textarea id="tNotas" rows="2"></textarea></div>' +
      '</div><div class="ge-acciones"><button class="btn btn-primary" id="tOk" disabled>Guardar acoplado</button></div>';
    var m = GE.modal({ titulo: "Alta de acoplado", html: html }), el = m.el, b = el.querySelector("#tOk");
    el.querySelector("#tPat").addEventListener("input", function (e) { e.target.value = e.target.value.toUpperCase(); });
    el.addEventListener("input", function () { b.disabled = !val(el, "tCod") || !val(el, "tPat"); });
    b.onclick = function () {
      b.disabled = true;
      var ahora = GE.ahora();
      // createLogisticsTrailer
      GE.guardar("trailers", { id: GE.nuevoId(), internalCode: val(el, "tCod"), licensePlate: val(el, "tPat").toUpperCase(), trailerType: val(el, "tTipo") || null,
        capacityUnits: numOpc(val(el, "tUni")), capacityKg: numOpc(val(el, "tKg")), notes: val(el, "tNotas") || null, active: true, createdAt: ahora, updatedAt: ahora })
        .then(function () { m.cerrar(); GE.toast("Acoplado agregado a la flota."); return cargarFlota(true); })
        .then(refrescarTodo)
        .catch(function (e) { b.disabled = false; err(e, "No se pudo guardar el acoplado."); });
    };
  }

  /* Facturas disponibles para el despacho (sourceInvoices): las de sus rutas fuente; si no tiene, las de su fecha. */
  function facturasDisponibles(d) {
    var rids = d.sourceRoutes.length ? d.sourceRoutes.map(function (r) { return Number(r.routeId); }) : (d.sourceRouteId ? [d.sourceRouteId] : []);
    var p = rids.length ? GE.dondeEn("invoices", "routeId", rids) : GE.donde("invoices", [["serviceDate", "==", d.serviceDate]]);
    return p.then(function (fs) {
      var ya = new Set(d.invoices.map(function (i) { return i.sourceInvoiceId; }));
      return fs.filter(function (f) { return !ya.has(f.id); })
        .sort(function (a, b) { return String(a.clientName || "").localeCompare(String(b.clientName || ""), "es") || String(a.invoiceNumber).localeCompare(String(b.invoiceNumber)); });
    });
  }
  function dlgFactura(d) {
    var html = '<p class="muted small" style="margin-top:0">Podés traer una factura de la ruta vinculada o cargarla manualmente.</p><div class="form2">' +
      '<div class="full"><label for="fSel">Factura existente</label><select id="fSel"><option value="manual">Carga manual</option></select><p class="ayuda" id="fCarg">Buscando facturas de la ruta...</p></div>' +
      campo("fNum", "Número de factura", "") + campo("fDest", "Destino / cliente", "") +
      campo("fProv", "Provincia", "") + campo("fLoc", "Localidad", "") +
      campo("fDom", "Domicilio destino", "", true) +
      campo("fUni", "Unidades", 'type="number" min="0"') + campo("fMonto", "Monto factura", 'type="number"') +
      campo("fSeq", "Orden de entrega", 'type="number" min="1" value="' + (d.invoices.length + 1) + '"') + campo("fNotas", "Notas", "") +
      '</div><div class="ge-acciones"><button class="btn btn-primary" id="fOk" disabled>Agregar a la ruta</button></div>';
    var m = GE.modal({ titulo: "Agregar factura al despacho", html: html, ancho: "640px" }), el = m.el, b = el.querySelector("#fOk"), disp = [];
    function act() { b.disabled = !val(el, "fNum") || !val(el, "fDest") || !val(el, "fMonto"); }
    el.addEventListener("input", act);
    facturasDisponibles(d).then(function (fs) {
      disp = fs;
      var sel = el.querySelector("#fSel");
      fs.forEach(function (f) { var o = document.createElement("option"); o.value = f.id; o.textContent = f.invoiceNumber + " · " + (f.clientName || "") + " · " + money(n0(f.amount)); sel.appendChild(o); });
      el.querySelector("#fCarg").textContent = fs.length ? fs.length + " factura" + plural(fs.length, "", "s") + " disponible" + plural(fs.length, "", "s") + "." : "No hay facturas disponibles de la ruta vinculada.";
    }).catch(function (e) { console.warn(e); el.querySelector("#fCarg").textContent = "No se pudieron traer las facturas de la ruta."; });
    el.querySelector("#fSel").onchange = function (e) {
      var f = disp.filter(function (x) { return String(x.id) === e.target.value; })[0];
      if (f) {
        el.querySelector("#fNum").value = f.invoiceNumber || ""; el.querySelector("#fDest").value = f.clientName || "";
        el.querySelector("#fDom").value = f.clientAddress || ""; el.querySelector("#fProv").value = ""; el.querySelector("#fLoc").value = "";
        el.querySelector("#fMonto").value = String(f.amount);
      }
      act();
    };
    b.onclick = function () {
      b.disabled = true;
      var selV = val(el, "fSel"), f = selV === "manual" ? null : disp.filter(function (x) { return String(x.id) === selV; })[0];
      var monto = Number(val(el, "fMonto")), seq = Math.max(1, Math.trunc(Number(val(el, "fSeq") || 1)));
      if (!isFinite(monto)) { b.disabled = false; GE.toast("Revisá el monto.", "error"); return; }
      // addLogisticsDispatchInvoice
      mutar(d.id, function (doc) {
        if (doc.status !== "draft" && doc.status !== "in_progress") throw new Error("El despacho ya no admite facturas.");
        if (f && doc.invoices.some(function (i) { return i.sourceInvoiceId === f.id; })) throw new Error("Esa factura ya está en el despacho.");
        var it = f ? itemDesdeFactura(doc, f, seq) : itemDesdeFactura(doc, { id: null, status: "pending" }, seq);
        it.invoiceNumber = val(el, "fNum"); it.destinationName = val(el, "fDest"); it.destinationAddress = val(el, "fDom") || null;
        it.destinationProvince = val(el, "fProv") || null; it.destinationLocality = val(el, "fLoc") || null;
        it.units = Math.max(0, Math.trunc(Number(val(el, "fUni") || 0))); it.amount = monto; it.notes = val(el, "fNotas") || null;
        // Se inserta en el orden pedido y se corre el resto.
        var arr = ordenItems(doc.invoices);
        arr.forEach(function (x, k) { x.sequence = k + 1; });
        var pos = Math.min(seq, arr.length + 1);
        arr.splice(pos - 1, 0, it);
        arr.forEach(function (x, k) { x.sequence = k + 1; });
        doc.invoices = arr;
      }).then(function () { m.cerrar(); GE.toast("Factura agregada a la hoja de ruta."); refrescarTodo(); })
        .catch(function (e) { b.disabled = false; err(e, "No se pudo agregar la factura."); });
    };
  }
  function dlgCombustible(d) {
    var html = '<p class="muted small" style="margin-top:0">Indicá si salió de la cisterna propia o de una estación en ruta.</p><div class="form2">' +
      selector("cSrc", "Origen del combustible", [["own_tank", "Cisterna propia"], ["service_station", "Estación de servicio"]], "own_tank", true) +
      campo("cLit", "Litros", 'type="number" min="0.01" step="0.01"') + campo("cCosto", "Costo total", 'type="number" min="0" step="0.01"') +
      campo("cOdo", "Odómetro al cargar", 'type="number" min="0"') +
      '<div id="cEstW" style="display:none">' + '<label for="cEst">Estación de servicio</label><input id="cEst"></div>' +
      campo("cComp", "Comprobante", "") + campo("cNotas", "Notas", "") +
      '</div><div class="ge-acciones"><button class="btn btn-primary" id="cOk" disabled>Guardar combustible</button></div>';
    var m = GE.modal({ titulo: "Carga de combustible", html: html }), el = m.el, b = el.querySelector("#cOk");
    function act() { b.disabled = !val(el, "cLit"); el.querySelector("#cEstW").style.display = val(el, "cSrc") === "service_station" ? "" : "none"; }
    el.addEventListener("input", act); el.addEventListener("change", act);
    b.onclick = function () {
      var lit = Number(val(el, "cLit"));
      if (!(lit > 0)) { GE.toast("Ingresá los litros cargados.", "error"); return; }
      b.disabled = true;
      var src = val(el, "cSrc"), ahora = GE.ahora();
      // addLogisticsFuelLoad
      mutar(d.id, function (doc) {
        doc.fuelLoads.push({ id: GE.nuevoId(), dispatchId: doc.id, source: src, liters: lit, totalCost: Number(val(el, "cCosto") || 0),
          odometerKm: numOpc(val(el, "cOdo")), stationName: src === "service_station" ? (val(el, "cEst") || null) : null,
          documentNumber: val(el, "cComp") || null, loadedAt: ahora, notes: val(el, "cNotas") || null, createdAt: ahora });
      }).then(function () { m.cerrar(); GE.toast("Carga de combustible guardada."); refrescarTodo(); })
        .catch(function (e) { b.disabled = false; err(e, "No se pudo guardar la carga."); });
    };
  }

  // ---------- Arranque ----------
  GE.logistica = { metricas: metricas, hojaRuta: function (id) { return hojaRuta(despacho(id)); }, estado: S }; // para verificar desde la consola
  document.getElementById("bSalir").onclick = function () { GE.toast("Sesión de Logística cerrada."); GE.salir(); };
  document.getElementById("bActualizar").onclick = function () {
    var b = this; b.disabled = true;
    cargar(true).then(function () { if (S.sel) sincronizar(S.sel); GE.toast("Datos actualizados.", "info"); })
      .catch(function (e) { err(e, "No se pudo cargar el módulo logístico."); })
      .then(function () { b.disabled = false; });
  };
  if (GE.PRUEBA) document.getElementById("bInicio").href = "index.html?prueba=1";
  GE.requerirAdmin({ titulo: "Logística de Portal", texto: "Ingresá con tu cuenta de Google autorizada para administrar despachos, camiones, acoplados, combustible y costos.", volver: { href: "index.html", label: "Volver al inicio" } })
    .then(function () { return cargar(); })
    .catch(function (e) {
      console.error(e);
      app().innerHTML = '<div class="cargando" style="color:var(--rose)">No se pudo cargar el módulo logístico.</div>';
    });
})();
</script>
</body>
</html>
