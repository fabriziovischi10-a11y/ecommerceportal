<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premio mensual del depósito</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FED403; --blue:#1F4185; --red:#D3202A;
  --bg:#F4F5F8; --panel:#FFFFFF; --ink:#16264D; --muted:#5D6785; --line:#DDE1EA; --soft:#EEF1F6;
  --ok:#1E8A4C; --warn:#C77A00; --bad:#D3202A; --accent:var(--blue); --accent-ink:#FFFFFF;
  box-sizing:border-box; padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1730; --panel:#18234A; --ink:#EEF1F8; --muted:#A3AECB; --line:#2B3A6B; --soft:#1F2C58;
    --ok:#4CCB86; --warn:#F2B13C; --bad:#FF6B6B; --accent:#FED403; --accent-ink:#16264D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1730; --panel:#18234A; --ink:#EEF1F8; --muted:#A3AECB; --line:#2B3A6B; --soft:#1F2C58;
  --ok:#4CCB86; --warn:#F2B13C; --bad:#FF6B6B; --accent:#FED403; --accent-ink:#16264D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
/* brand header */
.brand{background:var(--yellow);color:#16264D;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;position:relative}
.brand-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:16px}
.brand img{height:62px;width:auto;display:block;border-radius:4px}
.brand-txt{flex:1 1 180px;min-width:0}
.brand h1{margin:0;font-size:clamp(26px,6.5vw,38px);line-height:1;font-weight:800;color:var(--blue)}
.prize{margin:4px 0 0;font-size:15px;font-weight:600;color:var(--red)}
.month{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:4px 4px 4px 12px}
.month label{font-size:14px;font-weight:600;color:var(--blue)}
.month input{border:0;background:transparent;font-weight:600;color:var(--blue);padding:8px}
.brand::after{content:"";display:block;height:6px;margin:0 -16px;background:linear-gradient(90deg,var(--blue) 0 72%,var(--red) 72% 100%)}
.wrap{max-width:1040px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;font-size:16px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
/* tabs: top on desktop, bottom bar on phone */
nav.tabs{display:flex;gap:6px;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:700px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:16px 16px 0 0;border-width:1px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 -4px 18px rgba(22,38,77,.12)}
  nav.tabs button{font-size:12px;padding:8px 2px}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.status{padding:10px 14px;border-radius:10px;background:var(--soft);color:var(--muted);margin-bottom:14px;font-size:14px}
.status.err{color:var(--bad)}
.intro{margin:0 0 12px;color:var(--muted);font-size:14px}
/* leaderboard */
.board{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.row.lead{border:2px solid var(--yellow);box-shadow:0 6px 22px rgba(31,65,133,.14)}
.row.lead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--yellow)}
.pos{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;line-height:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.row.lead .pos{background:var(--yellow);color:#16264D}
.tname{font-weight:700;font-size:19px;margin:2px 0 8px;font-family:"Barlow Condensed",sans-serif;letter-spacing:.01em}
.score{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:42px;line-height:1;text-align:right;color:var(--accent)}
.score small{font-size:17px;font-weight:600;color:var(--muted)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;margin-top:8px}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.no{background:var(--soft);color:var(--muted)}
.tag.win{background:var(--red);color:#fff}
.metrics{display:flex;flex-direction:column;gap:8px}
.m{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.m .lbl{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:9px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.m .val{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:120px;color:var(--muted)}
.m .val b{color:var(--ink);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field span{font-size:14px;color:var(--muted);font-weight:600}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line);padding:8px 12px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.flash{font-size:14px;color:var(--ok);font-weight:600}
/* records */
.reclist{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rec .t{font-weight:600}
.rec .s{font-size:14px;color:var(--muted)}
.rec .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;text-align:right;color:var(--accent)}
.rec .d{grid-column:2;justify-self:end}
/* config */
.task{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--panel);border-top:5px solid var(--blue)}
.task-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.task-head input{flex:1 1 220px;font-weight:700}
.mrow{display:grid;grid-template-columns:minmax(150px,2fr) minmax(150px,1.4fr) 100px 84px 76px auto;gap:8px;align-items:end;margin-bottom:10px}
.mrow .field span{font-size:12px}
.settings{margin-bottom:16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
@media (max-width:640px){
  .row{grid-template-columns:44px 1fr;}
  .row .score{grid-column:2;grid-row:1;text-align:right;font-size:34px;position:absolute;right:14px;top:12px}
  .row .tname{padding-right:96px;min-height:40px;margin-bottom:10px}
  .m{grid-template-columns:1fr auto;gap:4px 8px}
  .m .lbl{grid-column:1 / -1;white-space:normal;font-weight:600}
  .m .bar{grid-column:1 / -1;grid-row:3}
  .m .val{grid-column:1 / -1;grid-row:2;text-align:left;min-width:0;white-space:normal}
  .mrow{grid-template-columns:1fr 1fr;padding-bottom:12px;border-bottom:1px dashed var(--line)}
  .mrow .field:first-child{grid-column:1/-1}
  .brand img{height:50px}
  .month{width:100%}
  .month input{flex:1}
}
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .5s ease} }

/* ---- carga guiada ---- */
.steps{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.crumb{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.crumb.back{background:var(--soft)}
.q{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;margin:0 0 12px;line-height:1.1}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;min-height:76px}
.choice:active{transform:scale(.98)}
.choice .ic{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;background:var(--yellow);color:#16264D}
.choice b{display:block;font-size:18px}
.choice small{display:block;color:var(--muted);font-size:14px}
.big{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:64px;line-height:1;text-align:center;color:var(--accent);margin:6px 0}
.big small{font-size:24px;color:var(--muted);font-weight:600}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
.stepper button{width:64px;height:64px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:32px;font-weight:700;cursor:pointer;line-height:1}
.stepper button.minus{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.stepper .big{min-width:120px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:16px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}
.scale button{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:800;cursor:pointer;color:var(--ink)}
.scale button[aria-pressed="true"]{border-color:transparent;color:#fff}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.vcard + .vcard{margin-top:12px}
.lab{font-size:14px;font-weight:700;color:var(--muted);margin:0 0 6px;text-align:center}
.result{text-align:center;font-weight:700;margin-top:8px}
.timer{display:flex;flex-direction:column;align-items:center;gap:10px}
.timer .btn{width:100%;max-width:320px;font-size:18px;padding:14px}
.save{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex;flex-direction:column;gap:6px}
@media (min-width:701px){.save{bottom:12px}}
.save .btn{background:var(--red);font-size:19px;padding:16px;border-radius:14px;box-shadow:0 6px 18px rgba(211,32,42,.3)}
.done{text-align:center;padding:28px 16px}
.done .check{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:46px}
.done .actions{justify-content:center}
.err{color:var(--bad);font-weight:600;text-align:center;font-size:14px;min-height:1em}

/* ---- diseño común ---- */
.tic{flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;color:#fff}
.sect{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;margin:20px 2px 10px;color:var(--ink)}
.sect:first-child{margin-top:4px}
/* ranking */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.sum b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:28px;line-height:1;color:var(--accent)}
.sum span{font-size:13px;color:var(--muted);font-weight:600}
.hero{background:var(--blue);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden;margin-bottom:14px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:var(--yellow);opacity:.16}
.hero .who{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.hero .badge{display:inline-block;background:var(--yellow);color:#16264D;font-weight:800;font-size:13px;padding:4px 12px;border-radius:999px;margin-bottom:6px}
.hero h2{margin:0;font-size:32px;line-height:1.05}
.hero p{margin:4px 0 0;opacity:.85;font-size:15px}
.hero .hm{margin-top:16px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.hero .hm .mi{background:rgba(255,255,255,.1);color:#fff}
.hero .hm .mi small{color:rgba(255,255,255,.75)}
.ring{flex:0 0 auto;position:relative;display:grid;place-items:center}
.ring svg{display:block;transform:rotate(-90deg)}
.ring b{position:absolute;font-family:"Barlow Condensed",sans-serif;font-weight:800;line-height:1;text-align:center}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.tcard .top{display:flex;align-items:center;gap:12px}
.tcard .pl{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:18px;color:var(--muted);width:26px;text-align:center}
.tcard h3{margin:0;font-size:21px;line-height:1.1;flex:1}
.tcard .st{font-size:13px;font-weight:700;margin-top:3px}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mi{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px}
.mi .dot{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.mi .tx{flex:1;min-width:0}
.mi .tx b{display:block;font-size:15px;font-weight:600}
.mi .tx small{display:block;font-size:13px;color:var(--muted)}
.mi .vv{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;white-space:nowrap}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;background:var(--red);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:17px;cursor:pointer}
.emptyc{background:var(--panel);border:2px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center}
.emptyc .q{margin-bottom:6px}
/* registros */
.fchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips .chip{white-space:nowrap;flex:0 0 auto}
.day{font-size:14px;font-weight:700;color:var(--muted);margin:16px 4px 8px}
.ritem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.ritem .tx{flex:1;min-width:0}
.ritem .tx b{display:block;font-size:16px}
.ritem .tx small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;padding:4px 12px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.pill.neu{background:var(--soft);color:var(--ink)}
.xbtn{flex:0 0 36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.xbtn:hover{color:var(--bad);border-color:var(--bad)}
/* objetivos */
.ocard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer}
.ocard .tx{flex:1;min-width:0}
.ocard .tx b{display:block;font-size:18px}
.ocard .tx small{display:block;color:var(--muted);font-size:14px}
.ocard .chev{font-size:26px;color:var(--muted)}
.ocard.prizec{background:var(--yellow);border-color:var(--yellow);color:#16264D}
.ocard.prizec small{color:#3d4a6d}
.addc{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px dashed var(--line);background:transparent;border-radius:18px;padding:16px;font-weight:700;color:var(--accent);cursor:pointer;font-size:16px}
.bigin{width:100%;font-size:22px;font-weight:700;font-family:"Barlow Condensed",sans-serif;padding:12px 14px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.mcard .row1{display:flex;gap:10px;align-items:center}
.mcard .row1 input{flex:1;font-weight:600}
.lab2{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.kinds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kind{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;cursor:pointer;font-weight:600;font-size:14px;text-align:left}
.kind span{font-size:18px;width:24px;text-align:center}
.kind[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--panel))}
.nstep{display:flex;align-items:center;gap:8px}
.nstep button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:22px;font-weight:700;cursor:pointer;color:var(--ink)}
.nstep input{width:90px;text-align:center;font-weight:700;font-size:18px}
.nstep em{font-style:normal;color:var(--muted);font-size:14px}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:16px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(22,38,77,.25)}
@media (min-width:701px){.savebar{bottom:12px}}
.savebar span{flex:1;font-weight:600;font-size:14px}
.savebar .btn{background:var(--red);color:#fff}
.savebar[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.dangerlink{display:block;margin:18px auto 0;background:none;border:0;color:var(--bad);font-weight:600;cursor:pointer;padding:10px}

.tsub{display:block;font-size:13px;color:var(--muted)}
.tcard.win{border:2px solid var(--yellow)}
.hlabel{margin:0 0 10px!important;font-weight:700;opacity:1!important;color:var(--yellow)}
.tsect{margin-bottom:22px}
.tsh{display:flex;align-items:center;gap:10px;margin:6px 2px 10px}
.tsh b{font-family:"Barlow Condensed",sans-serif;font-size:22px}
.tsh small{color:var(--muted);font-weight:600;margin-left:auto}
.team{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;background:var(--soft);border-radius:14px;padding:12px;margin-bottom:8px}
.team .tic{grid-row:span 2}
.team input{width:100%;background:var(--panel)}
.team input.tn{font-weight:700}
.team .xbtn{grid-row:span 2}
.modes{display:grid;gap:8px}
.modes .kind{padding:14px}
.modes .kind small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tchip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.tchip i{width:10px;height:10px;border-radius:50%}
.qadd{display:flex;gap:8px}
.qadd input{flex:1}
.qadd .btn{white-space:nowrap;background:var(--red)}
.linkb{background:none;border:0;color:var(--accent);font-weight:600;padding:10px 0 0;cursor:pointer;font-size:14px}

.av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-family:"Barlow Condensed",sans-serif;font-size:15px}
.av.add{background:transparent;border:2px dashed var(--line);color:var(--muted);width:52px;height:52px;font-size:26px;font-weight:600}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nbig{min-width:44px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:30px;color:var(--accent)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.tbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tbh{display:flex;align-items:center;gap:8px;background:var(--tc);padding:8px 12px}
.tbh{width:100%;border:0;cursor:pointer;text-align:left;color:#fff}
.temb{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:22px;font-weight:800;font-family:"Barlow Condensed",sans-serif;flex:0 0 auto}
.tnm{flex:1;min-width:0;font-family:"Barlow Condensed",sans-serif;font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbh .edit{opacity:.8;font-size:16px}
.tbh .cnt{color:#fff;font-weight:700;background:rgba(0,0,0,.18);border-radius:999px;padding:2px 10px;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:4px 2px;border-radius:12px;color:var(--ink);min-width:0}
.slot:hover{background:var(--soft)}
.slot span:last-child{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.slot:not(.full) span:last-child{color:var(--muted)}
.pb{border:0;cursor:pointer;padding:4px 12px 4px 4px;color:var(--ink)}
.prow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .tx{flex:1;min-width:0}
.prow input{width:100%;font-weight:600;border-color:transparent;background:transparent;padding:6px 8px}
.prow input:focus{border-color:var(--line);background:var(--panel)}
.prow small{display:block;font-size:13px;color:var(--muted);padding-left:8px}
.sheetbg{position:fixed;inset:0;background:rgba(10,18,40,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;max-width:640px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.picks{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:center;gap:12px;background:var(--soft);border:0;border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink)}
.pick .tx b{display:block;font-size:16px}
.pick .tx small{display:block;color:var(--muted);font-size:13px}
.sheetbtns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.crew{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
.crew .tchip{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.xchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;color:var(--ink);font-size:14px}
.xchip[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#16264D}
@media (max-width:420px){ .slots{grid-template-columns:repeat(4,1fr)} .av.add{width:46px;height:46px} .slot .av{width:46px!important;height:46px!important} }
@media (max-width:700px){ nav.tabs button{font-size:11px} }

.temb.big{width:84px;height:84px;font-size:42px;color:#fff;margin:0 auto}
.spv{text-align:center;padding:4px 0 6px}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.egrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.egrid button{aspect-ratio:1;border:2px solid var(--line);background:var(--panel);border-radius:12px;font-size:22px;cursor:pointer;color:var(--ink)}
.egrid button[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--panel))}
.cgrid{display:flex;flex-wrap:wrap;gap:10px}
.cgrid button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.cgrid button[aria-pressed="true"]{border-color:var(--panel);box-shadow:0 0 0 3px var(--ink)}
/* premios */
.pthumb{flex:0 0 auto;border-radius:16px;background:var(--yellow);display:grid;place-items:center;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.pcard .ph{display:flex;gap:14px;align-items:center}
.pcard .ph .tx{flex:1;min-width:0}
.pcard .ph .tx input{width:100%;font-weight:700;font-size:17px}
.pcard .ph .tx small{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:6px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pbtns .btn{padding:9px 14px;font-size:14px}
.hprize{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:14px;padding:8px;margin-top:12px;position:relative;z-index:1}
.hprize b{font-size:16px}
.hprize small{display:block;opacity:.8;font-size:12px}
.prchip{display:inline-flex;align-items:center;gap:6px;margin-left:auto;background:var(--soft);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:700;max-width:55%}
.prchip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pending{opacity:.75}
.pending .tx small{font-style:italic}
.ver{text-align:center;font-size:12px;color:var(--muted);margin:24px 0 0}

/* menú vertical cuando hay espacio */
@media (min-width:701px){
  .wrap{max-width:1240px;display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:28px;align-items:start}
  .wrap > *{grid-column:2}
  nav.tabs{grid-column:1;grid-row:1 / span 20;flex-direction:column;position:sticky;top:16px;padding:8px;gap:4px;margin:0}
  nav.tabs button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:14px 16px;font-size:16px;border-radius:10px}
  nav.tabs button svg{width:24px;height:24px}
  .brand-in{max-width:1240px}
}
/* selector de tareas: botones uno debajo del otro */
.fchips{flex-direction:column;flex-wrap:nowrap;overflow:visible;gap:6px;margin:0 0 14px;padding:0}
.fchips .chip{width:100%;text-align:left;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.fchips .chip[aria-pressed="true"]::after{content:"✓";font-weight:800}
</style>

    <button role="tab" data-tab="ranking" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 6h3a3 3 0 0 1-3 4M7 6H4a3 3 0 0 0 3 4"/></svg>Ranking</button>
    <button role="tab" data-tab="cargar" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Cargar</button>
    <button role="tab" data-tab="registros" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Registros</button>
    <button role="tab" data-tab="equipos" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.9.3 5 2.7 5 5.8"/></svg>Equipos</button>
    <button role="tab" data-tab="tareas" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Objetivos</button>
  </nav>
  <div id="status" class="status">Conectando…</div>
  <main id="view"></main>
  <p class="ver" id="ver">Versión 9 · 14/10/2026</p>
</div>

<script>
(function(){
  const KINDS = {
    auditoria: {label:"Auditoría (correctas de N)", higher:true,  unit:"%",   agg:"Promedio del mes (% correctas)"},
    puntaje:   {label:"Puntaje de control",          higher:true,  unit:"pts", agg:"Promedio de los controles"},
    tiempo:    {label:"Tiempo (minutos)",            higher:false, unit:"min", agg:"Promedio del mes"},
    cantidad:  {label:"Cantidad (ej. roturas)",      higher:false, unit:"",    agg:"Total del mes"}
  };
  const state = {
    db:null, canWrite:true, tab:"ranking",
    month: new Date().toISOString().slice(0,7),
    config:null, configLoaded:false, records:[], recLoaded:false,
    draft:null, unsubRec:null, form:{}, eq:{taskId:null, sheet:null}
  };
  const DEFAULT_CONFIG = {prize:"",threshold:90,tasks:[
    {id:"recepcion",name:"Recepción",team:"",metrics:[
      {id:"rec_pos",name:"Posiciones bien grabadas",kind:"auditoria",target:98,sample:50,weight:2},
      {id:"rec_orden",name:"Orden y limpieza",kind:"puntaje",target:8,scaleMax:10,weight:1}]},
    {id:"carga",name:"Carga de camiones",team:"",metrics:[
      {id:"car_tiempo",name:"Tiempo de carga por camión",kind:"tiempo",target:45,weight:2},
      {id:"car_orden",name:"Orden en la zona de trabajo",kind:"puntaje",target:8,scaleMax:10,weight:1}]},
    {id:"picking",name:"Picking",team:"",metrics:[
      {id:"pic_orden",name:"Orden en los pasillos",kind:"puntaje",target:8,scaleMax:10,weight:1},
      {id:"pic_roturas",name:"Roturas en el mes",kind:"cantidad",target:5,weight:2}]},
    {id:"chofer",name:"Chofer",team:"",metrics:[]},
    {id:"cobrador",name:"Cobrador",team:"",metrics:[]},
    {id:"orden",name:"Orden y limpieza",team:"",metrics:[]},
    {id:"controladores",name:"Controladores",team:"",metrics:[]},
    {id:"sucursales",name:"Sucursales",team:"",metrics:[]}]};

  // Base compartida: Firebase (proyecto ecommerce-e7ab2, base "default"), datos bajo premio/datos/
  const firebaseConfig={apiKey:"AIzaSyCLP890Q5hyuqSs82vyF0rk9VhEg0pBlCA",authDomain:"ecommerce-e7ab2.firebaseapp.com",projectId:"ecommerce-e7ab2",storageBucket:"ecommerce-e7ab2.firebasestorage.app",messagingSenderId:"237845351422",appId:"1:237845351422:web:6350a5c3e103b088cf4eaf"};
  const FIRESTORE_DATABASE_ID="default", RAIZ="premio/datos/";
  async function conectarFirebase(){
    if(typeof firebase==="undefined") return null;
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInAnonymously();
    const app=firebase.app();
    const modular=app._delegate.container.getProvider("firestore").getImmediate({identifier:FIRESTORE_DATABASE_ID});
    const fs=new firebase.firestore.Firestore(app,modular);
    try{ fs.settings({experimentalAutoDetectLongPolling:true,ignoreUndefinedProperties:true,merge:true}); }catch(e){}
    return { collection:c=>fs.collection(RAIZ+c), doc:p=>fs.doc(RAIZ+p) };
  }

  // Guarda en este dispositivo si no hay conexión con Firebase
  function makeLocalDb(){
    const K_CFG="portal-premio-config", K_REC="portal-premio-records";
    const read=(k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
    const write=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ throw {code:"unavailable"}; } };
    const cfgL=new Set(), recL=new Set();
    // Al abrir una versión nueva del archivo, suma las tareas nuevas sin tocar lo que ya cargaste
    const DEFAULTS_VERSION=2;
    (()=>{ const c=read(K_CFG,null); if(!c || (c.defaultsVersion||1)>=DEFAULTS_VERSION) return;
      DEFAULT_CONFIG.tasks.forEach(t=>{ if(!c.tasks.some(x=>x.id===t.id)) c.tasks.push(JSON.parse(JSON.stringify(t))); });
      c.defaultsVersion=DEFAULTS_VERSION; try{ localStorage.setItem(K_CFG,JSON.stringify(c)); }catch(e){} })();
    const cfgSnap=()=>{ const c=read(K_CFG,null) || DEFAULT_CONFIG; return {exists:true,data:()=>JSON.parse(JSON.stringify(c))}; };
    const recAll=()=>read(K_REC,{});
    const fireRec=()=>recL.forEach(l=>l());
    return {
      local:true,
      doc(path){ return {
        set:async d=>{ write(K_CFG,d); cfgL.forEach(f=>f(cfgSnap())); },
        onSnapshot(next){ cfgL.add(next); setTimeout(()=>next(cfgSnap())); return ()=>cfgL.delete(next); } }; },
      collection(){ return {
        add:async r=>{ const all=recAll(); all[Math.random().toString(36).slice(2,12)]=r; write(K_REC,all); fireRec(); },
        doc:id=>({ delete:async()=>{ const all=recAll(); delete all[id]; write(K_REC,all); fireRec(); } }),
        where(f,op,val){ return { onSnapshot(next){
          const l=()=>{ const all=recAll(); next({docs:Object.keys(all).filter(id=>all[id][f]===val).map(id=>({id,data:()=>all[id]}))}); };
          recL.add(l); setTimeout(l); return ()=>recL.delete(l); } }; } }; },
      exportAll(){ return {config:read(K_CFG,null)||DEFAULT_CONFIG, records:recAll()}; },
      importAll(o){ if(!o||!o.config||!Array.isArray(o.config.tasks)) throw new Error("bad"); write(K_CFG,o.config); write(K_REC,o.records||{}); cfgL.forEach(f=>f(cfgSnap())); fireRec(); }
    };
  }

  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid = () => Math.random().toString(36).slice(2,9);
  const fmt = (n,d=1) => (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString("es-AR",{maximumFractionDigits:d});
  const monthName = m => { const [y,mm]=m.split("-"); return new Date(+y,+mm-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"}); };

  $("#month").value = state.month;
  $("#month").addEventListener("change", e => { if(e.target.value){ state.month=e.target.value; subscribeRecords(); render(); }});
  document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{
    state.tab=b.dataset.tab;
    document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected", x===b?"true":"false"));
    if(state.tab==="cargar" && state.form.done){ state.form.done=false; state.form.taskId=state.form.metricId=null; }
    if(state.tab==="tareas") state.cfgEdit=null;
    if(state.tab==="equipos") state.eq.sheet=null;
    if(state.tab==="tareas") state.draft = JSON.parse(JSON.stringify(state.config || {prize:"",threshold:90,tasks:[]}));
    render();
  }));

  function setStatus(msg, err){ const s=$("#status"); if(!msg){s.hidden=true;return;} s.hidden=false; s.textContent=msg; s.className="status"+(err?" err":""); }

  // ---------- scoring ----------
  function aggregate(metric, recs){
    const r = recs.filter(x=>x.metricId===metric.id);
    if(!r.length) return {value:null,n:0};
    if(metric.kind==="auditoria"){
      const c=r.reduce((a,x)=>a+(+x.correct||0),0), t=r.reduce((a,x)=>a+(+x.total||0),0);
      return {value: t? c/t*100 : null, n:r.length, extra:`${c}/${t}`};
    }
    if(metric.kind==="cantidad") return {value:r.reduce((a,x)=>a+(+x.value||0),0), n:r.length};
    return {value:r.reduce((a,x)=>a+(+x.value||0),0)/r.length, n:r.length};
  }
  function compliance(metric, value){
    if(value==null) return null;
    const t=+metric.target;
    if(KINDS[metric.kind].higher){ return t>0 ? Math.min(value/t,1) : 1; }
    if(value<=t) return 1;
    return value>0 ? Math.max(t/value,0) : 1;
  }
  const teamsOf=t=>(t.teams||[]).filter(x=>x && x.id);
  const memberIds=tm=>Array.isArray(tm?.members)?tm.members:[];
  const personName=id=>(state.config?.people||[]).find(p=>p.id===id)?.name||"";
  const shortName=n=>{ const w=String(n||"").trim().split(/\s+/); return w.length>1?`${w[0]} ${w[1][0]}.`:w[0]; };
  const memberNames=tm=>memberIds(tm).map(personName).filter(Boolean);
  // Convierte integrantes escritos como texto ("Juan, Pedro") en personas del plantel
  function normalizeConfig(c){
    c.people=Array.isArray(c.people)?c.people:[];
    (c.tasks||[]).forEach(t=>(t.teams||[]).forEach(tm=>{
      if(typeof tm.members==="string"){
        tm.members=tm.members.split(",").map(x=>x.trim()).filter(Boolean).map(n=>{
          let pp=c.people.find(p=>p.name.toLowerCase()===n.toLowerCase());
          if(!pp){ pp={id:Math.random().toString(36).slice(2,9),name:n}; c.people.push(pp); }
          return pp.id; });
      } else if(!Array.isArray(tm.members)) tm.members=[];
    }));
    return c;
  }
  function scoreOne(task, recs){
    let sw=0, sc=0, missing=0;
    const ms = task.metrics.map(m=>{
      const a=aggregate(m,recs), c=compliance(m,a.value), w=+m.weight||1;
      if(c==null) missing++; else { sw+=w; sc+=w*c; }
      return {m,a,c};
    });
    return {ms, score: sw ? sc/sw*100 : null, complete: task.metrics.length>0 && missing===0};
  }
  // Cada equipo compite por separado; una tarea sin equipos compite como un solo equipo
  function scoreCompetitors(){
    const cfg=state.config; if(!cfg) return [];
    const th=+cfg.threshold||0, out=[];
    cfg.tasks.forEach(task=>{
      const tr=state.records.filter(r=>r.taskId===task.id), teams=teamsOf(task);
      const group = teams.length
        ? teams.map(team=>({task, team, ...scoreOne(task, tr.filter(r=>r.teamId===team.id))}))
        : [{task, team:null, ...scoreOne(task, tr)}];
      group.forEach(g=>g.eligible = g.complete && g.score!=null && g.score>=th);
      out.push(...group);
    });
    const byScore=(a,b)=>(b.score??-1)-(a.score??-1);
    out.sort(byScore);
    if((cfg.prizeMode||"general")==="general"){ const w=out.find(x=>x.eligible); if(w) w.winner=true; }
    else cfg.tasks.forEach(t=>{ const w=out.find(x=>x.task.id===t.id && x.eligible); if(w) w.winner=true; });
    return out;
  }
  function targetText(m){
    const k=KINDS[m.kind];
    if(m.kind==="auditoria") return `meta ≥ ${fmt(m.target)}%`;
    if(m.kind==="puntaje") return `meta ≥ ${fmt(m.target)} de ${fmt(m.scaleMax||10,0)}`;
    if(m.kind==="tiempo") return `meta ≤ ${fmt(m.target)} min`;
    return `meta ≤ ${fmt(m.target,0)} en el mes`;
  }
  function valueText(m,a){
    if(a.value==null) return "sin datos";
    if(m.kind==="auditoria") return `${fmt(a.value)}% (${a.extra})`;
    if(m.kind==="puntaje") return `${fmt(a.value)} pts`;
    if(m.kind==="tiempo") return `${fmt(a.value)} min`;
    return `${fmt(a.value,0)}`;
  }

  // ---------- views ----------
  function render(){
    const cfg=state.config;
    { const gp=cfg?getPrize(cfg,"general"):null;
      $("#prizeLine").textContent = !cfg ? "" : (cfg.prizeMode==="tarea" ? "Un premio por tarea" : gp&&gp.name ? `Premio: ${gp.name}` : `Mínimo para ganar: ${fmt(cfg.threshold,0)} puntos`); }
    const v=$("#view");
    if(!state.db){ v.innerHTML=""; return; }
    if(!state.configLoaded){ v.innerHTML=`<div class="empty">Cargando…</div>`; return; }
    if(state.tab==="ranking") { v.innerHTML = viewRanking(); wireRanking(); }
    else if(state.tab==="cargar") { v.innerHTML = viewForm(); wireForm(); }
    else if(state.tab==="registros") { v.innerHTML = viewRecords(); wireRecords(); }
    else if(state.tab==="equipos") { v.innerHTML = viewEquipos(); wireEquipos(); }
    else { v.innerHTML = viewConfig(); wireConfig(); }
  }

  const TCOL=["#1F4185","#D3202A","#E0A800","#1E8A4C","#7A3FB0","#E07B00","#0F8A9A","#5D6785","#B0306A","#2E6FD8","#6B8E23","#8A5A2B"];
  const taskColor=id=>{ const i=(state.config?.tasks||[]).findIndex(t=>t.id===id); return TCOL[(i<0?0:i)%TCOL.length]; };
  const TEAMCOL=["#1F4185","#D3202A","#1E8A4C","#7A3FB0","#E07B00","#0F8A9A","#B0306A","#5D6785"];
  const teamColor=(task,team)=>{ if(team.color) return team.color; const i=(task.teams||[]).findIndex(x=>x.id===team.id); return TEAMCOL[(i<0?0:i)%TEAMCOL.length]; };
  const getPrize=(cfg,key)=>{ const p=(cfg.prizes||{})[key]; if(p && (p.name||p.img||p.emoji)) return p; if(key==="general" && cfg.prize) return {name:cfg.prize}; return null; };
  const imgSrc=img=>img ? (img.asset ? "/_blob/"+img.asset : img.data||"") : "";
  const prizeThumb=(p,size)=>`<span class="pthumb" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.55)}px">${p&&p.img&&imgSrc(p.img)?`<img src="${esc(imgSrc(p.img))}" alt="">`:esc(p&&p.emoji||"🏆")}</span>`;
  const teamEmb=tm=>tm.emoji ? tm.emoji : initials(tm.name);
  // Equipos de una sola persona (ej.: choferes) muestran el nombre de la persona
  const teamLabel=(task,tm)=>{ const ids=memberIds(tm); if((+task.teamSize||4)===1 && ids.length===1 && /^Equipo \d+$/.test(tm.name||"")) return personName(ids[0])||tm.name; return tm.name; };
  const TEAM_IDEAS=[["Los Halcones","🦅"],["Los Tiburones","🦈"],["Los Leones","🦁"],["Los Lobos","🐺"],["Los Toros","🐂"],["Los Pumas","🐆"],["Relámpago","⚡"],["Los Titanes","💪"],["Dinamita","🧨"],["Cohete","🚀"],["Las Abejas","🐝"],["Los Dragones","🐉"],["Fuego","🔥"],["Los Gladiadores","🛡️"]];
  const TEAM_EMOJIS=["🦅","🦈","🦁","🐺","🐂","🐆","🐝","🐉","⚡","🔥","💪","🚀","🧨","🛡️","⭐","🏎️","🚚","📦","⚽","🎯"];
  const PRIZE_EMOJIS=["🏆","🥇","🎁","🍖","🍕","🍔","🍻","☕","🍫","💵","🎟️","🛒","⛽","🎬","🏖️","👕","🎧","📱","🎉","🍽️"];
  const tIcon=(t,size)=>`<span class="tic" style="background:${taskColor(t.id)}${size?`;width:${size}px;height:${size}px;flex-basis:${size}px`:""}">${esc(initials(t.name))}</span>`;
  function ring(score,size,stroke,light){
    const r=(size-stroke)/2, c=2*Math.PI*r, p=score==null?0:Math.max(0,Math.min(score,100))/100;
    const col = light ? "#FED403" : score==null?"var(--line)": score>=+(state.config?.threshold||90)?"var(--ok)": score>=70?"var(--warn)":"var(--bad)";
    return `<div class="ring" role="img" aria-label="${score==null?"Sin puntaje":fmt(score,0)+" puntos"}"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${light?"rgba(255,255,255,.18)":"var(--soft)"}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><b style="font-size:${size*.32}px;${light?"color:#fff":""}">${score==null?"–":fmt(score,0)}</b></div>`;
  }
  function metricItem({m,a,c}){
    const icon = c==null?"–": c>=1?"✓":"!";
    const col = c==null?"var(--muted)": c>=1?"var(--ok)": c>=.9?"var(--warn)":"var(--bad)";
    return `<div class="mi"><span class="dot" style="background:${col}">${icon}</span><div class="tx"><b>${esc(m.name)}</b><small>${esc(targetText(m))}${a.n?` · ${a.n} control${a.n===1?"":"es"}`:""}</small></div><span class="vv">${esc(a.value==null?"sin datos":valueText(m,a))}</span></div>`;
  }
  const compName=r=>r.team ? teamLabel(r.task,r.team) : r.task.name;
  const compSub=r=>r.team ? [r.task.name, memberNames(r.team).join(", ")].filter(Boolean).join(" · ") : (r.task.team||"");
  function compIcon(r,size){ return r.team ? `<span class="tic" style="background:${teamColor(r.task,r.team)}${size?`;width:${size}px;height:${size}px;flex-basis:${size}px`:""}">${esc(teamEmb(r.team))}</span>` : tIcon(r.task,size); }
  function statusTag(r){
    return r.winner ? `<span class="st" style="color:var(--red)">🏆 ${state.month<new Date().toISOString().slice(0,7)?"Ganó":"Va ganando"}</span>`
      : r.eligible ? `<span class="st" style="color:var(--ok)">Supera el mínimo</span>`
      : !r.complete ? `<span class="st" style="color:var(--muted)">Faltan mediciones</span>`
      : `<span class="st" style="color:var(--bad)">Debajo del mínimo</span>`;
  }
  function compCard(r,pos,showTask){
    const sub = showTask ? compSub(r) : (r.team?memberNames(r.team).join(", "):"");
    return `<div class="tcard${r.winner?" win":""}"><div class="top"><span class="pl">${r.score==null?"–":pos+"º"}</span>${compIcon(r)}<div style="flex:1;min-width:0"><h3>${esc(compName(r))}</h3>${sub?`<small class="tsub">${esc(sub)}</small>`:""}${statusTag(r)}</div>${ring(r.score,62,6)}</div>
      <div class="mlist">${r.ms.map(metricItem).join("")}</div></div>`;
  }
  function viewRanking(){
    if(!state.config || !state.config.tasks.length) return `<div class="emptyc"><p class="q">Todavía no hay tareas</p><p class="hint">Andá a Objetivos para cargar la primera.</p></div>`;
    if(!state.recLoaded) return `<div class="empty">Cargando mediciones…</div>`;
    const rows=scoreCompetitors(), cfg=state.config, mode=cfg.prizeMode||"general";
    const now=new Date(), cur=now.toISOString().slice(0,7);
    const [yy,mm]=state.month.split("-").map(Number), last=new Date(yy,mm,0).getDate();
    const daysLeft = state.month===cur ? last-now.getDate() : state.month<cur ? 0 : last;
    const closed = state.month<cur;
    let html=`<div class="sum"><div><b>${state.records.length}</b><span>mediciones</span></div><div><b>${closed?"✓":daysLeft}</b><span>${closed?"mes cerrado":daysLeft===1?"día queda":"días quedan"}</span></div><div><b>${fmt(cfg.threshold,0)}</b><span>pts para ganar</span></div></div>`;
    if(!state.records.length){
      return html+`<div class="emptyc"><p class="q">Arrancá el mes</p><p class="hint">Todavía no hay mediciones en ${esc(monthName(state.month))}.</p><button class="cta" data-goload>＋ Cargar la primera medición</button></div>`;
    }
    const hero=(r,label)=>{
      const badge = r.winner ? (closed?"🏆 Ganador del mes":"🏆 Va ganando") : "Va primero";
      const pz=getPrize(cfg, mode==="general"?"general":r.task.id);
      const sub = r.winner ? "Supera el mínimo para el premio" : !r.complete ? "Le faltan mediciones para competir por el premio" : `Necesita ${fmt(cfg.threshold,0)} puntos para el premio`;
      return `<div class="hero">${label?`<p class="hlabel">${esc(label)}</p>`:""}<div class="who">${ring(r.score,92,9,true)}<div><span class="badge">${badge}</span><h2>${esc(compName(r))}</h2>${r.team&&(mode==="general"?compSub(r):memberNames(r.team).length)?`<p>${esc(mode==="general"?compSub(r):memberNames(r.team).join(", "))}</p>`:""}<p>${esc(sub)}</p></div></div>
        ${pz?`<div class="hprize">${prizeThumb(pz,52)}<div><small>${r.winner?(closed?"Se ganó":"Va por"):"En juego"}</small><b>${esc(pz.name||"Premio del mes")}</b></div></div>`:""}
        <div class="hm">${r.ms.map(metricItem).join("")}</div></div>`;
    };
    const pendingCard=t=>`<div class="tcard pending"><div class="top">${tIcon(t)}<div class="tx" style="flex:1"><h3>${esc(t.name)}</h3><small class="tsub">Objetivos a definir</small></div></div></div>`;
    if(mode==="general"){
      const lead=rows[0], has=lead && lead.score!=null;
      if(has) html+=hero(lead);
      const rest = (has ? rows.slice(1) : rows).filter(r=>r.task.metrics.length);
      if(rest.length) html+=`<p class="sect">${has?"El resto de los equipos":"Equipos"}</p>`;
      rest.forEach(r=>html+=compCard(r,rows.indexOf(r)+1,true));
      const pend=cfg.tasks.filter(t=>!t.metrics.length);
      if(pend.length) html+=`<p class="sect">Próximamente</p>${pend.map(pendingCard).join("")}`;
    } else {
      cfg.tasks.forEach(t=>{
        const g=rows.filter(r=>r.task.id===t.id);
        const tp=getPrize(cfg,t.id);
        html+=`<div class="tsect"><div class="tsh">${tIcon(t,36)}<b>${esc(t.name)}</b>${tp?`<span class="prchip">${prizeThumb(tp,26)}<span>${esc(tp.name||"Premio")}</span></span>`:teamsOf(t).length?`<small>${teamsOf(t).length} equipos</small>`:""}</div>`;
        if(!t.metrics.length) html+=pendingCard(t);
        else if(g.length>1 && g[0].score!=null){ html+=hero(g[0]); g.slice(1).forEach((r,i)=>html+=compCard(r,i+2,false)); }
        else g.forEach((r,i)=>html+=compCard(r,i+1,false));
        html+=`</div>`;
      });
    }
    if(!closed) html+=`<button class="cta" data-goload>＋ Cargar medición</button>`;
    return html;
  }
  function wireRanking(){ document.querySelectorAll("[data-goload]").forEach(b=>b.onclick=()=>document.querySelector('[data-tab="cargar"]').click()); }

  // ---------- carga guiada ----------
  const TIMER_KEY="portal-timer";
  const allTimers=()=>{ try{ const v=JSON.parse(localStorage.getItem(TIMER_KEY)||"{}"); return (v && !v.start) ? v : {}; }catch(e){ return {}; } };
  const timerKey=()=>[state.form.taskId,state.form.teamId||"-",state.form.metricId].join("|");
  const getTimer=()=>allTimers()[timerKey()]||null;
  const setTimer=v=>{ const all=allTimers(); if(v) all[timerKey()]=v; else delete all[timerKey()]; try{ localStorage.setItem(TIMER_KEY,JSON.stringify(all)); }catch(e){} };
  let tick=null;
  const today=()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const yesterday=()=>{ const d=new Date(); d.setDate(d.getDate()-1); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const initials=n=>{ const w=String(n||"?").trim().split(/\s+/).filter(x=>!/^(de|del|la|las|el|los|y|en|a)$/i.test(x)); return (w.length?w:[String(n||"?")]).slice(0,2).map(x=>x[0]).join("").toUpperCase(); };
  const scoreColor=(v,max)=>{ const r=v/max; return r>=.8?"var(--ok)":r>=.6?"var(--warn)":"var(--bad)"; };

  function resetValue(m){
    const f=state.form; f.err=""; f.note=""; f.done=false;
    if(!m) return;
    if(m.kind==="auditoria"){ f.total=+m.sample||50; f.errors=0; }
    else if(m.kind==="puntaje"){ f.value=null; }
    else if(m.kind==="tiempo"){ f.value=+m.target||30; }
    else { f.value=1; }
  }

  function viewForm(){
    if(tick){ clearInterval(tick); tick=null; }
    const cfg=state.config, f=state.form;

      const timers=allTimers();
      return `<div class="steps"><button class="crumb back" data-go="start">‹ ${esc(task.name)}</button></div><p class="q">¿Qué equipo?</p><div class="choices">${teams.map(x=>{ const on=Object.keys(timers).some(k=>k.startsWith(task.id+"|"+x.id+"|")); return `
        <button class="choice" data-team="${esc(x.id)}"><span class="ic" style="background:${teamColor(task,x)};color:#fff">${esc(teamEmb(x))}</span><span><b>${esc(teamLabel(task,x))}</b><small>${on?"⏱ Cronómetro corriendo":esc(memberNames(x).join(", ")||"Sin integrantes")}</small></span></button>`; }).join("")}</div>`;
    }
