    // Paso 2: objetivo
    if(!m){
      const icon={auditoria:"✓",puntaje:"★",tiempo:"⏱",cantidad:"#"};
      return crumbs+`<p class="q">¿Qué querés medir?</p><div class="choices">${task.metrics.map(x=>`
        <button class="choice" data-metric="${esc(x.id)}"><span class="ic">${icon[x.kind]}</span><span><b>${esc(x.name)}</b><small>${esc(targetText(x))}</small></span></button>`).join("")}</div>`;
    }
    // Paso 3: valor
    let body="";
    if(m.kind==="auditoria"){
      const ok=Math.max(f.total-f.errors,0), pct=f.total?ok/f.total*100:0;
      body=`<div class="vcard"><p class="lab">¿Cuántas posiciones encontraste mal?</p>
        <div class="stepper"><button class="minus" data-step="errors:-1" aria-label="Una menos">−</button><div class="big" aria-live="polite">${f.errors}</div><button data-step="errors:1" aria-label="Una más">+</button></div>
        <p class="result" style="color:${pct>=m.target?"var(--ok)":"var(--bad)"}">${ok} de ${f.total} bien · ${fmt(pct)}%</p></div>
        <div class="vcard"><p class="lab">Posiciones revisadas</p><div class="chips">${[20,30,50,100].map(n=>`<button class="chip" data-set="total:${n}" aria-pressed="${f.total===n}">${n}</button>`).join("")}
        <button class="chip" data-step="total:-1" aria-label="Una menos">−1</button><button class="chip" data-step="total:1" aria-label="Una más">+1</button></div>
        <p class="hint" style="text-align:center">${f.total} posiciones</p></div>`;
    } else if(m.kind==="puntaje"){
      const max=+m.scaleMax||10, nums=Array.from({length:max},(_,i)=>i+1);
      body=`<div class="vcard"><p class="lab">¿Cómo estaba? Tocá un número</p>
        <div class="scale" style="grid-template-columns:repeat(${max>5?5:max},1fr)">${nums.map(n=>`<button data-set="value:${n}" aria-pressed="${f.value===n}" style="${f.value===n?`background:${scoreColor(n,max)}`:""}">${n}</button>`).join("")}</div>
        <div class="legend"><span>1 = muy mal</span><span>${max} = impecable</span></div>
        ${f.value!=null?`<p class="result" style="color:${f.value>=m.target?"var(--ok)":"var(--bad)"}">${f.value>=m.target?"Cumple la meta":"No llega a la meta"} (${fmt(m.target)})</p>`:""}</div>`;
    } else if(m.kind==="tiempo"){
      const t=getTimer(), running=!!t;
      body=`<div class="vcard timer"><p class="lab">Cronómetro de carga</p>
        ${running?`<div class="big" id="clock">00:00</div><button class="btn" data-timer="stop" style="background:var(--red)">Terminó la carga</button><button class="btn sec" data-timer="cancel">Cancelar</button>`
          :`<button class="btn" data-timer="start">▶ Empezar a cronometrar</button><p class="hint">Lo podés dejar corriendo y volver cuando termine el camión.</p>`}
      </div>
      <div class="vcard"><p class="lab">O cargá los minutos a mano</p>
        <div class="stepper"><button class="minus" data-step="value:-5" aria-label="Cinco menos">−</button><div class="big">${f.value}<small> min</small></div><button data-step="value:5" aria-label="Cinco más">+</button></div>
        <div class="chips">${[30,40,45,60,90].map(n=>`<button class="chip" data-set="value:${n}" aria-pressed="${f.value===n}">${n}</button>`).join("")}<button class="chip" data-step="value:-1">−1</button><button class="chip" data-step="value:1">+1</button></div>
        <p class="result" style="color:${f.value<=m.target?"var(--ok)":"var(--bad)"}">${f.value<=m.target?"Dentro de la meta":"Pasado de la meta"} (${fmt(m.target)} min)</p></div>`;
    } else {
      body=`<div class="vcard"><p class="lab">¿Cuántas?</p>
        <div class="stepper"><button class="minus" data-step="value:-1" aria-label="Una menos">−</button><div class="big">${f.value}</div><button data-step="value:1" aria-label="Una más">+</button></div></div>`;
    }
    let crewCard="";
    if(team){
      const mine=memberIds(team), others=(cfg.people||[]).filter(pp=>!mine.includes(pp.id)).sort((a,b)=>a.name.localeCompare(b.name));
      f.extras=(f.extras||[]).filter(id=>!mine.includes(id));
      crewCard=`<div class="vcard"><p class="lab">Equipo de hoy · ${esc(team.name)}</p>
        ${mine.length?`<div class="crew">${mine.map(id=>`<span class="tchip">${esc(personName(id))}</span>`).join("")}</div>`:`<p class="hint" style="text-align:center;margin:0 0 6px">El equipo no tiene integrantes cargados.</p>`}
        <p class="lab" style="margin-top:12px">¿Se sumó alguien más hoy?</p>
        ${others.length?`<div class="chips">${others.map(pp=>`<button class="xchip" data-extra="${esc(pp.id)}" aria-pressed="${f.extras.includes(pp.id)}">${f.extras.includes(pp.id)?"✓ ":"+ "}${esc(pp.name)}</button>`).join("")}</div>`:""}
        <div class="qadd" style="margin-top:8px"><input id="f_xnew" placeholder="Otra persona: nombre" aria-label="Nombre de otra persona" enterkeyhint="done"><button class="btn sec" id="f_xadd">Sumar</button></div>
        ${f.extras.length?`<p class="result" style="color:var(--accent)">${mine.length+f.extras.length} personas hoy (${mine.length} del equipo + ${f.extras.length} de refuerzo)</p>`:""}
      </div>`;
    }
    const noteLabel = m.kind==="cantidad" ? "¿En qué pasillo o dónde?" : m.kind==="tiempo" ? "Camión o patente (opcional)" : "Comentario (opcional)";
    return crumbs+`<p class="q">${esc(m.name)}</p>${body}${crewCard}
      <div class="vcard"><p class="lab">¿Cuándo?</p>
        <div class="chips"><button class="chip" data-date="${today()}" aria-pressed="${f.date===today()}">Hoy</button><button class="chip" data-date="${yesterday()}" aria-pressed="${f.date===yesterday()}">Ayer</button>
        <input type="date" id="f_date" value="${esc(f.date)}" aria-label="Otra fecha" style="max-width:170px"></div>
        <label class="field" style="margin-top:8px"><span>${noteLabel}</span><input type="text" id="f_note" maxlength="200" value="${esc(f.note||"")}"></label>
      </div>
      <div class="save"><p class="err" id="f_err">${esc(f.err||"")}</p><button class="btn" id="f_save">Guardar</button></div>`;
  }

  function wireForm(){
    const f=state.form, v=$("#view");
    const task=state.config?.tasks.find(t=>t.id===f.taskId), m=task?.metrics.find(x=>x.id===f.metricId);
    const keepNote=()=>{ const n=$("#f_note"); if(n) f.note=n.value; };
    const rerender=()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };
    v.querySelectorAll("[data-pending]").forEach(b=>b.onclick=()=>toast("Esta tarea todavía no tiene objetivos. Cargalos en Objetivos."));
    v.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{ f.taskId=b.dataset.task; f.teamId=null; f.extras=[]; const t=state.config.tasks.find(x=>x.id===f.taskId); f.metricId = t.metrics.length===1?t.metrics[0].id:null; resetValue(t.metrics.find(x=>x.id===f.metricId)); render(); window.scrollTo(0,0); });
    v.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{ f.teamId=b.dataset.team; f.extras=[]; if(f.metricId) resetValue(task.metrics.find(x=>x.id===f.metricId)); render(); window.scrollTo(0,0); });
    v.querySelectorAll("[data-metric]").forEach(b=>b.onclick=()=>{ f.metricId=b.dataset.metric; resetValue(task.metrics.find(x=>x.id===f.metricId)); render(); window.scrollTo(0,0); });
    v.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
      const g=b.dataset.go;
      if(g==="start"){ f.taskId=f.metricId=f.teamId=null; f.done=false; }
      else if(g==="team"){ f.teamId=null; f.done=false; if(f.metricId) resetValue(m); }
      else if(g==="metric"){ f.metricId=null; }
      else if(g==="again"){ resetValue(m); }
      else if(g==="rank"){ f.done=false; f.taskId=f.metricId=f.teamId=null; document.querySelector('[data-tab="ranking"]').click(); return; }
      render(); window.scrollTo(0,0);
    });
    v.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{ keepNote(); const [k,d]=b.dataset.step.split(":"); f[k]=Math.max(k==="total"?1:0,(+f[k]||0)+(+d)); if(k==="total"&&f.errors>f.total) f.errors=f.total; if(k==="errors"&&f.errors>f.total) f.errors=f.total; f.err=""; rerender(); });
    v.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{ keepNote(); const [k,val]=b.dataset.set.split(":"); f[k]=+val; if(k==="total"&&f.errors>f.total) f.errors=f.total; f.err=""; rerender(); });
    v.querySelectorAll("[data-extra]").forEach(b=>b.onclick=()=>{ keepNote(); const id=b.dataset.extra; f.extras=f.extras||[]; f.extras=f.extras.includes(id)?f.extras.filter(x=>x!==id):[...f.extras,id]; rerender(); });
    const addX=async()=>{ keepNote(); const inp=$("#f_xnew"), n=(inp?.value||"").trim(); if(!n){ inp?.focus(); return; }
      const cc=clone(state.config); let pp=cc.people.find(x=>x.name.toLowerCase()===n.toLowerCase()); if(!pp){ pp={id:uid(),name:n}; cc.people.push(pp); }
      f.extras=[...new Set([...(f.extras||[]),pp.id])];
      const prev=state.config; state.config=cc; rerender();
      try{ await state.db.doc("config/main").set(clone(cc)); toast(`${n} sumado de refuerzo`); }catch(e){ state.config=prev; f.extras=f.extras.filter(x=>x!==pp.id); rerender(); alert("No se pudo guardar a la persona nueva."); } };
    $("#f_xadd")?.addEventListener("click",addX);
    $("#f_xnew")?.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addX(); } });
    v.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{ keepNote(); f.date=b.dataset.date; rerender(); });
    $("#f_date")?.addEventListener("change",e=>{ keepNote(); if(e.target.value){ f.date=e.target.value; rerender(); } });
    v.querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>{
      keepNote(); const a=b.dataset.timer;
      if(a==="start") setTimer({start:Date.now()});
      else if(a==="stop"){ const t=getTimer(); if(t) f.value=Math.max(1,Math.round((Date.now()-t.start)/60000)); setTimer(null); }
      else setTimer(null);
      rerender();
    });
    const clock=$("#clock");
    if(clock){ const t=getTimer(); const upd=()=>{ const s=Math.floor((Date.now()-t.start)/1000); clock.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }; upd(); tick=setInterval(()=>{ if(!document.body.contains(clock)){ clearInterval(tick); tick=null; return; } upd(); },1000); }

    $("#f_save")?.addEventListener("click", async ()=>{
      keepNote();
      const err=$("#f_err"), fail=msg=>{ f.err=msg; err.textContent=msg; };
      const team=teamsOf(task).find(x=>x.id===f.teamId);
      if(teamsOf(task).length && !team) return fail("Elegí el equipo.");
      const rec={taskId:task.id, metricId:m.id, ...(team?{teamId:team.id, crew:memberIds(team).length, ...((f.extras||[]).length?{extras:[...f.extras]}:{})}:{}), date:f.date, month:(f.date||"").slice(0,7), note:(f.note||"").slice(0,200), createdAt:new Date().toISOString()};
      if(m.kind==="auditoria"){ rec.total=f.total; rec.correct=Math.max(f.total-f.errors,0); }
      else if(m.kind==="puntaje"){ if(f.value==null) return fail("Tocá un número del 1 al "+(m.scaleMax||10)+"."); rec.value=f.value; }
      else if(m.kind==="tiempo"){ if(getTimer()) return fail("Primero tocá “Terminó la carga”."); if(!(f.value>0)) return fail("Cargá los minutos."); rec.value=f.value; }
      else rec.value=f.value;
      if(!rec.month) return fail("Elegí la fecha.");
      const btn=$("#f_save"); btn.disabled=true; btn.textContent="Guardando…";
      try{
        await state.db.collection("records").add(rec);
        f.done=true; f.err=""; render(); window.scrollTo(0,0);
      }catch(e){
        btn.disabled=false; btn.textContent="Guardar";
        if(e?.code==="invalid_argument"){ state.canWrite=false; fail("No tenés permiso para cargar datos."); }
        else fail("No se pudo guardar. Revisá la conexión y probá de nuevo.");
      }
    });
  }

  function recValue(r,m){
    if(r.total!=null){ const pct=r.correct/r.total*100; return {txt:`${fmt(pct,0)}%`, cls: m? (pct>=m.target?"ok":"bad"):"neu", sub:`${r.correct} de ${r.total} bien`}; }
    if(!m) return {txt:fmt(r.value),cls:"neu"};
    if(m.kind==="puntaje") return {txt:`${fmt(r.value)}/${fmt(m.scaleMax||10,0)}`, cls:r.value>=m.target?"ok":"bad"};
    if(m.kind==="tiempo") return {txt:`${fmt(r.value)} min`, cls:r.value<=m.target?"ok":"bad"};
    return {txt:`${fmt(r.value,0)}`, cls:"neu"};
  }
  function viewRecords(){
    if(!state.recLoaded) return `<div class="empty">Cargando…</div>`;
    const cfg=state.config||{tasks:[]};
    if(state.recFilter && !cfg.tasks.find(t=>t.id===state.recFilter)) state.recFilter=null;
    let recs=[...state.records].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||"").localeCompare(a.createdAt||""));
    if(!recs.length) return `<div class="emptyc"><p class="q">Sin mediciones</p><p class="hint">No hay nada cargado en ${esc(monthName(state.month))}.</p><button class="cta" data-goload>＋ Cargar medición</button></div>`;
    const counts={}; recs.forEach(r=>counts[r.taskId]=(counts[r.taskId]||0)+1);
    let html=`<div class="fchips"><button class="chip" data-f="" aria-pressed="${!state.recFilter}">Todas · ${recs.length}</button>${cfg.tasks.map(t=>`<button class="chip" data-f="${esc(t.id)}" aria-pressed="${state.recFilter===t.id}">${esc(t.name)} · ${counts[t.id]||0}</button>`).join("")}</div>`;
    if(state.recFilter) recs=recs.filter(r=>r.taskId===state.recFilter);
    if(!recs.length) return html+`<div class="emptyc"><p class="hint">Esta tarea no tiene mediciones este mes.</p></div>`;
    const t0=today(), y0=yesterday();
    const dayLabel=d=>{ if(d===t0) return "Hoy"; if(d===y0) return "Ayer"; const [y,mo,da]=(d||"").split("-"); if(!d) return "Sin fecha"; const t=new Date(+y,+mo-1,+da).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"}); return t.charAt(0).toUpperCase()+t.slice(1); };
    let lastDay=null;
    recs.forEach(r=>{
      if(r.date!==lastDay){ lastDay=r.date; html+=`<p class="day">${esc(dayLabel(r.date))}</p>`; }
      const t=cfg.tasks.find(x=>x.id===r.taskId), m=t?.metrics.find(x=>x.id===r.metricId), v=recValue(r,m);
      const tm=r.teamId && t ? (t.teams||[]).find(x=>x.id===r.teamId) : null;
      const ex=(r.extras||[]).length;
      const sub=[t?.name||"Tarea borrada", tm?.name || (r.teamId?"Equipo borrado":null), ex?`+${ex} refuerzo${ex===1?"":"s"}`:null, v.sub, r.note].filter(Boolean).join(" · ");
      html+=`<div class="ritem">${t?tIcon(t,40):`<span class="tic" style="background:var(--muted)">?</span>`}<div class="tx"><b>${esc(m?.name||"Objetivo borrado")}</b><small>${esc(sub)}</small></div><span class="pill ${v.cls}">${esc(v.txt)}</span>${state.canWrite?`<button class="xbtn" data-del="${esc(r._id)}" aria-label="Borrar medición">×</button>`:""}</div>`;
    });
    return html;
  }
  function wireRecords(){
    document.querySelectorAll("[data-goload]").forEach(b=>b.onclick=()=>document.querySelector('[data-tab="cargar"]').click());
    document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ state.recFilter=b.dataset.f||null; render(); });
    document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{
      if(!confirm("¿Borrar esta medición?")) return;
      b.disabled=true;
      try{ await state.db.collection("records").doc(b.dataset.del).delete(); toast("Medición borrada"); }catch(e){ b.disabled=false; alert("No se pudo borrar."); }
    }));
  }
  function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; t.setAttribute("role","status"); document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }

  // ---------- equipos ----------
  const clone=o=>JSON.parse(JSON.stringify(o));
  const avatar=(name,col,size)=>`<span class="av" style="background:${col}${size?`;width:${size}px;height:${size}px;font-size:${size*.38}px`:""}">${esc(initials(name))}</span>`;
  async function commitConfig(c,msg){
    const prev=state.config; state.config=c; render();
    try{ await state.db.doc("config/main").set(clone(c)); if(msg) toast(msg); return true; }
    catch(e){ state.config=prev; render(); alert(e?.code==="invalid_argument"?"No tenés permiso para cambiar los equipos.":"No se pudo guardar. Revisá la conexión y probá de nuevo."); return false; }
  }
  function viewEquipos(){
    const cfg=state.config, eq=state.eq;
    if(!cfg.tasks.length) return `<div class="emptyc"><p class="q">Primero cargá las tareas</p><p class="hint">Andá a Objetivos.</p></div>`;
    if(eq.taskId!=="personal" && !cfg.tasks.find(t=>t.id===eq.taskId)) eq.taskId=(cfg.tasks.find(t=>teamsOf(t).length)||cfg.tasks[0]).id;
    const people=cfg.people||[];
    let html=`<div class="fchips">${cfg.tasks.map(t=>`<button class="chip" data-eqt="${esc(t.id)}" aria-pressed="${eq.taskId===t.id}">${esc(t.name)}${teamsOf(t).length?` · ${teamsOf(t).length}`:""}</button>`).join("")}<button class="chip" data-eqt="personal" aria-pressed="${eq.taskId==="personal"}">👤 Personal · ${people.length}</button></div>`;
    const ro=!state.canWrite;
    if(eq.taskId==="personal"){
      html+=`<p class="q">Personal del depósito</p><p class="hint" style="margin:-6px 0 12px">Cargá a cada persona una sola vez. Después la ubicás en los equipos tocando los lugares vacíos.</p>
        <div class="mcard"><div class="qadd"><input id="pp_new" placeholder="Nombre y apellido" aria-label="Nueva persona" enterkeyhint="done" ${ro?"disabled":""}><button class="btn" id="pp_add" ${ro?"disabled":""}>＋ Agregar</button></div></div>`;
      if(!people.length) html+=`<div class="emptyc"><p class="hint">Todavía no cargaste a nadie.</p></div>`;
      else html+=`<div class="mcard plist">${[...people].sort((a,b)=>a.name.localeCompare(b.name)).map(pp=>{
        const where=[]; cfg.tasks.forEach(t=>teamsOf(t).forEach(tm=>{ if(memberIds(tm).includes(pp.id)) where.push(`${tm.name} (${t.name})`); }));
        return `<div class="prow">${avatar(pp.name,"var(--blue)",40)}<div class="tx"><input data-pname="${esc(pp.id)}" value="${esc(pp.name)}" aria-label="Nombre" ${ro?"disabled":""}><small>${where.length?esc(where.join(" · ")):"Sin equipo · disponible para refuerzos"}</small></div>${ro?"":`<button class="xbtn" data-pdel="${esc(pp.id)}" aria-label="Quitar a ${esc(pp.name)}">×</button>`}</div>`; }).join("")}</div>`;
      return html;
    }
    const t=cfg.tasks.find(x=>x.id===eq.taskId), teams=teamsOf(t), size=+t.teamSize||4;
    html+=`<div class="mcard"><div class="setup">
        <div><p class="lab2" style="margin-top:0">Cantidad de equipos</p><div class="nstep"><button data-eqn="-1" aria-label="Un equipo menos" ${ro?"disabled":""}>−</button><b class="nbig">${teams.length}</b><button data-eqn="1" aria-label="Un equipo más" ${ro?"disabled":""}>+</button></div></div>
        <div><p class="lab2" style="margin-top:0">Personas por equipo</p><div class="nstep"><button data-eqs="-1" aria-label="Una persona menos" ${ro?"disabled":""}>−</button><b class="nbig">${size}</b><button data-eqs="1" aria-label="Una persona más" ${ro?"disabled":""}>+</button></div></div>
      </div>${size===1?`<p class="hint">Con 1 persona por equipo, cada uno compite solo (ideal para choferes o cobradores).</p>`:""}
      ${teams.length&&!ro?`<button class="linkb" data-eqclear style="color:var(--bad)">Borrar todos los equipos de ${esc(t.name)}</button>`:""}</div>`;
    if(!teams.length){
      html+=`<div class="emptyc"><p class="q">${esc(t.name)} no tiene equipos</p><p class="hint">Compite como un solo grupo. Si la hacen varios equipos, tocá el + de “Cantidad de equipos” para armarlos.</p></div>`;
    } else {
      html+=`<div class="tgrid">${teams.map((tm,ti)=>{
        const col=teamColor(t,tm), ids=memberIds(tm), slots=Math.max(size,ids.length);
        return `<div class="tbox" style="--tc:${col}"><button class="tbh" data-style="${ti}" ${ro?"disabled":""} aria-label="Personalizar ${esc(tm.name)}"><span class="temb">${esc(teamEmb(tm))}</span><span class="tnm">${esc(teamLabel(t,tm))}</span><span class="edit">✎</span><span class="cnt">${ids.length}/${size}</span></button>
          <div class="slots">${Array.from({length:slots},(_,k)=>{ const pid=ids[k]; return pid
            ? `<button class="slot full" data-mem="${ti}:${esc(pid)}" ${ro?"disabled":""}>${avatar(personName(pid)||"?",col,52)}<span>${esc(shortName(personName(pid))||"(borrado)")}</span></button>`
            : `<button class="slot" data-slot="${ti}" ${ro?"disabled":""}><span class="av add">+</span><span>Agregar</span></button>`; }).join("")}</div></div>`; }).join("")}</div>`;
      const used=new Set(); teams.forEach(tm=>memberIds(tm).forEach(i=>used.add(i)));
      const free=people.filter(pp=>!used.has(pp.id));
      html+=`<p class="sect">Sin equipo en ${esc(t.name)}</p>${free.length?`<p class="hint" style="margin:-4px 2px 10px">Tocá una persona para ubicarla en un equipo.</p><div class="tchips">${free.map(pp=>`<button class="tchip pb" data-pool="${esc(pp.id)}" ${ro?"disabled":""}>${avatar(pp.name,"var(--muted)",26)}${esc(pp.name)}</button>`).join("")}</div>`:`<p class="hint" style="margin:-4px 2px 10px">${people.length?"Todo el personal ya está en algún equipo de esta tarea.":"Tocá un lugar vacío para cargar a la primera persona."}</p>`}`;
    }
    // hoja inferior
    const sh=eq.sheet;
    if(sh){
      let inner="";
      if(sh.type==="slot"){
        const tm=teams[sh.ti];
        const list=[...people].sort((a,b)=>a.name.localeCompare(b.name)).filter(pp=>!memberIds(tm).includes(pp.id)).map(pp=>{
          const other=teams.find(x=>x!==tm && memberIds(x).includes(pp.id));
          return `<button class="pick" data-pick="${esc(pp.id)}">${avatar(pp.name,other?teamColor(t,other):"var(--muted)",40)}<span class="tx"><b>${esc(pp.name)}</b><small>${other?`Está en ${esc(other.name)} · se cambia a ${esc(tm.name)}`:"Libre"}</small></span></button>`; }).join("");
        inner=`<p class="q">¿Quién va en ${esc(tm.name)}?</p>
          <div class="qadd"><input id="sh_new" placeholder="Persona nueva: nombre" aria-label="Nombre de persona nueva" enterkeyhint="done"><button class="btn" id="sh_add">＋ Agregar</button></div>
          ${list?`<p class="lab2">O elegí del personal</p><div class="picks">${list}</div>`:""}`;
      } else if(sh.type==="style"){
        const sd=eq.styleDraft;
        inner=`<div class="spv"><span class="temb big" style="background:${sd.color}">${esc(sd.emoji||initials(sd.name))}</span><p class="q" style="margin:8px 0 0">${esc(sd.name||"Sin nombre")}</p></div>
          <p class="lab2">Nombre del equipo</p><input class="bigin" id="st_name" value="${esc(sd.name)}" maxlength="30" placeholder="Ej.: Los Halcones">
          <p class="lab2">Ideas</p><div class="ideas">${TEAM_IDEAS.map(([n,e])=>`<button class="xchip" data-idea="${esc(n)}|${e}" aria-pressed="${sd.name===n}">${e} ${esc(n)}</button>`).join("")}</div>
          <p class="lab2">Escudo</p><div class="egrid">${TEAM_EMOJIS.map(e=>`<button data-emo="${e}" aria-pressed="${sd.emoji===e}">${e}</button>`).join("")}<button data-emo="" aria-pressed="${!sd.emoji}" style="font-size:14px;font-weight:700">ABC</button></div>
          <p class="lab2">Color</p><div class="cgrid">${TEAMCOL.concat(["#E0A800","#2E6FD8"]).map(c=>`<button data-col="${c}" style="background:${c}" aria-pressed="${sd.color===c}" aria-label="Color"></button>`).join("")}</div>
          <button class="btn" id="st_ok" style="width:100%;margin-top:16px;background:var(--red);padding:14px;font-size:17px">Listo</button>`;
      } else if(sh.type==="mem"){
        const tm=teams[sh.ti];
        inner=`<div style="text-align:center">${avatar(personName(sh.pid)||"?",teamColor(t,tm),72)}<p class="q" style="margin-top:10px">${esc(personName(sh.pid))}</p><p class="hint" style="margin-top:-6px">${esc(tm.name)} · ${esc(t.name)}</p></div>
          <div class="sheetbtns"><button class="btn" data-shact="swap">Cambiar por otra persona</button>${teams.length>1?`<button class="btn sec" data-shact="move">Pasar a otro equipo</button>`:""}<button class="btn sec" data-shact="out" style="color:var(--bad)">Sacar del equipo</button></div>`;
      } else if(sh.type==="move" || sh.type==="pool"){
        const from = sh.type==="move" ? teams[sh.ti] : null;
        inner=`<p class="q">¿A qué equipo va ${esc(personName(sh.pid))}?</p><div class="picks">${teams.filter(x=>x!==from).map(x=>{ const n=memberIds(x).length; return `<button class="pick" data-toteam="${esc(x.id)}"><span class="tic" style="background:${teamColor(t,x)}">${esc(teamEmb(x))}</span><span class="tx"><b>${esc(teamLabel(t,x))}</b><small>${n}/${size} personas${n>=size?" · completo, se suma igual":""}</small></span></button>`; }).join("")}</div>`;
      }
      html+=`<div class="sheetbg" data-shclose></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}<button class="btn sec" data-shclose style="width:100%;margin-top:12px">Cancelar</button></div>`;
    }
    return html;
  }
  function wireEquipos(){
    const v=$("#view"), eq=state.eq;
    const rer=()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };
    v.querySelectorAll("[data-eqt]").forEach(b=>b.onclick=()=>{ eq.taskId=b.dataset.eqt; eq.sheet=null; render(); });
    v.querySelectorAll("[data-shclose]").forEach(b=>b.onclick=()=>{ eq.sheet=null; rer(); });
    const c=()=>clone(state.config);
    const findT=cc=>cc.tasks.find(x=>x.id===eq.taskId);
    const newPerson=(cc,name)=>{ name=name.trim(); let pp=cc.people.find(x=>x.name.toLowerCase()===name.toLowerCase()); if(!pp){ pp={id:uid(),name}; cc.people.push(pp); } return pp; };
    const placeIn=(cc,pid,teamIdx)=>{ const t=findT(cc), ts=teamsOf(t); ts.forEach(x=>x.members=memberIds(x).filter(i=>i!==pid)); ts[teamIdx].members=[...memberIds(ts[teamIdx]),pid]; };
    // personal
    const addP=async()=>{ const inp=$("#pp_new"), n=(inp?.value||"").trim(); if(!n){ inp?.focus(); return; } const cc=c(); if(cc.people.some(x=>x.name.toLowerCase()===n.toLowerCase())) return toast("Esa persona ya está cargada"); cc.people.push({id:uid(),name:n}); if(await commitConfig(cc,`${n} agregado`)) setTimeout(()=>$("#pp_new")?.focus(),30); };
    $("#pp_add")?.addEventListener("click",addP);
    $("#pp_new")?.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addP(); } });
    v.querySelectorAll("[data-pname]").forEach(el=>el.onchange=()=>{ const n=el.value.trim(); if(!n){ el.value=personName(el.dataset.pname); return; } const cc=c(); cc.people.find(x=>x.id===el.dataset.pname).name=n; commitConfig(cc,"Nombre actualizado"); });
    v.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{ if(!confirm(`¿Quitar a ${personName(b.dataset.pdel)} del personal? También sale de sus equipos.`)) return; const cc=c(); cc.people=cc.people.filter(x=>x.id!==b.dataset.pdel); cc.tasks.forEach(t=>teamsOf(t).forEach(tm=>tm.members=memberIds(tm).filter(i=>i!==b.dataset.pdel))); commitConfig(cc,"Persona quitada"); });
    // cantidad de equipos y tamaño
    v.querySelectorAll("[data-eqn]").forEach(b=>b.onclick=()=>{
      const cc=c(), t=findT(cc); t.teams=teamsOf(t);
      if(+b.dataset.eqn>0){ if(t.teams.length>=12) return; let n=t.teams.length+1; while(t.teams.some(x=>x.name===`Equipo ${n}`)) n++; const nt={id:uid(),name:`Equipo ${n}`,members:[]}; t.teams.push(nt); nt.color=TEAMCOL[(t.teams.length-1)%TEAMCOL.length]; if((+t.teamSize||4)>1){ eq.styleDraft={name:nt.name,emoji:"",color:nt.color}; eq.sheet={type:"style",ti:t.teams.length-1}; } commitConfig(cc,"Equipo agregado"); }
      else { if(!t.teams.length) return; const last=t.teams[t.teams.length-1]; if(!confirm(memberIds(last).length?`¿Quitar ${last.name}? Sus ${memberIds(last).length} personas quedan sin equipo y sus mediciones dejan de contar.`:`¿Quitar ${last.name}?`)) return; t.teams.pop(); commitConfig(cc,"Equipo quitado"); }
    });
    v.querySelectorAll("[data-eqs]").forEach(b=>b.onclick=()=>{ const cc=c(), t=findT(cc); t.teamSize=Math.min(12,Math.max(1,(+t.teamSize||4)+(+b.dataset.eqs))); commitConfig(cc); });
    v.querySelectorAll("[data-style]").forEach(b=>b.onclick=()=>{ const ti=+b.dataset.style, t=findT(state.config), tm=teamsOf(t)[ti]; eq.styleDraft={name:tm.name,emoji:tm.emoji||"",color:teamColor(t,tm)}; eq.sheet={type:"style",ti}; rer(); });
    $("#st_name")?.addEventListener("input",e=>{ eq.styleDraft.name=e.target.value; const q=v.querySelector(".spv .q"); if(q) q.textContent=e.target.value||"Sin nombre"; const em=v.querySelector(".spv .temb"); if(em && !eq.styleDraft.emoji) em.textContent=initials(e.target.value); });
    v.querySelectorAll("[data-idea]").forEach(b=>b.onclick=()=>{ const [n,e]=b.dataset.idea.split("|"); eq.styleDraft.name=n; eq.styleDraft.emoji=e; rer(); });
    v.querySelectorAll("[data-emo]").forEach(b=>b.onclick=()=>{ eq.styleDraft.name=$("#st_name")?.value??eq.styleDraft.name; eq.styleDraft.emoji=b.dataset.emo; rer(); });
    v.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{ eq.styleDraft.name=$("#st_name")?.value??eq.styleDraft.name; eq.styleDraft.color=b.dataset.col; rer(); });
    $("#st_ok")?.addEventListener("click",()=>{ const sd=eq.styleDraft, n=($("#st_name")?.value||"").trim(); if(!n) return toast("Ponele un nombre al equipo"); const cc=c(), tm=teamsOf(findT(cc))[eq.sheet.ti]; tm.name=n; tm.emoji=sd.emoji||""; tm.color=sd.color; eq.sheet=null; commitConfig(cc,"Equipo actualizado"); });
    v.querySelector("[data-eqclear]")?.addEventListener("click",()=>{ const t=findT(state.config); if(!confirm(`¿Borrar todos los equipos de ${t.name}? Las personas quedan cargadas en el Personal.`)) return; const cc=c(); findT(cc).teams=[]; commitConfig(cc,"Equipos borrados"); });
    v.querySelectorAll("[data-tname]").forEach(el=>el.onchange=()=>{ const n=el.value.trim(); const cc=c(), tm=teamsOf(findT(cc))[+el.dataset.tname]; if(!n){ el.value=tm.name; return; } tm.name=n; commitConfig(cc,"Nombre del equipo actualizado"); });
    // lugares
    v.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{ eq.sheet={type:"slot",ti:+b.dataset.slot}; rer(); setTimeout(()=>{ if(!(state.config.people||[]).length) $("#sh_new")?.focus(); },50); });
    v.querySelectorAll("[data-mem]").forEach(b=>b.onclick=()=>{ const [ti,pid]=b.dataset.mem.split(":"); eq.sheet={type:"mem",ti:+ti,pid}; rer(); });
    v.querySelectorAll("[data-pool]").forEach(b=>b.onclick=()=>{ eq.sheet={type:"pool",pid:b.dataset.pool}; rer(); });
    const shAdd=async()=>{ const inp=$("#sh_new"), n=(inp?.value||"").trim(); if(!n){ inp?.focus(); return; } const cc=c(), pp=newPerson(cc,n), ti=eq.sheet.ti, sw=eq.sheet.swap; if(sw){ const tm=teamsOf(findT(cc))[ti]; tm.members=memberIds(tm).filter(i=>i!==sw); } placeIn(cc,pp.id,ti); eq.sheet=null; commitConfig(cc,`${pp.name} agregado`); };
    $("#sh_add")?.addEventListener("click",shAdd);
    $("#sh_new")?.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); shAdd(); } });
    v.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ const cc=c(), ti=eq.sheet.ti, sw=eq.sheet.swap; if(sw){ const tm=teamsOf(findT(cc))[ti]; tm.members=memberIds(tm).filter(i=>i!==sw); } placeIn(cc,b.dataset.pick,ti); eq.sheet=null; commitConfig(cc,"Listo"); });
    v.querySelectorAll("[data-shact]").forEach(b=>b.onclick=()=>{
      const a=b.dataset.shact, sh=eq.sheet;
      if(a==="swap"){ eq.sheet={type:"slot",ti:sh.ti,swap:sh.pid}; rer(); }
      else if(a==="move"){ eq.sheet={type:"move",ti:sh.ti,pid:sh.pid}; rer(); }
      else { const cc=c(), tm=teamsOf(findT(cc))[sh.ti]; tm.members=memberIds(tm).filter(i=>i!==sh.pid); eq.sheet=null; commitConfig(cc,"Sacado del equipo"); }
    });
    v.querySelectorAll("[data-toteam]").forEach(b=>b.onclick=()=>{ const cc=c(), ts=teamsOf(findT(cc)), idx=ts.findIndex(x=>x.id===b.dataset.toteam); placeIn(cc,eq.sheet.pid,idx); eq.sheet=null; commitConfig(cc,"Listo"); });
  }

  // ---------- objetivos ----------
  const KIND_IC={auditoria:"✓",puntaje:"★",tiempo:"⏱",cantidad:"#"};
  const KIND_SHORT={auditoria:"Auditoría",puntaje:"Puntaje 1 a 10",tiempo:"Tiempo",cantidad:"Cantidad"};
  const isDirty=()=>JSON.stringify(state.draft)!==JSON.stringify(state.config);
  function numStep(attr,val,step,unit){
    return `<div class="nstep"><button type="button" data-ns="${attr}:-${step}" aria-label="Menos">−</button><input type="number" step="any" inputmode="decimal" data-nv="${attr}" value="${esc(val)}"><button type="button" data-ns="${attr}:${step}" aria-label="Más">+</button>${unit?`<em>${esc(unit)}</em>`:""}</div>`;
  }
  function viewConfig(){
    const d=state.draft, e=state.cfgEdit;
    const bar=`<div class="savebar" id="savebar" ${isDirty()?"":"hidden"}><span>Cambios sin guardar</span><button class="btn sec" id="c_undo" style="background:transparent;color:inherit;border-color:rgba(255,255,255,.3);padding:10px 12px">Deshacer</button><button class="btn" id="c_save" ${state.canWrite?"":"disabled"}>Guardar</button></div>`;
    if(e==="premio"){
      const keys=(d.prizeMode||"general")==="general" ? [["general","Premio del mes"]] : d.tasks.map(t=>[t.id,t.name]);
      const canPhoto=!!state.db;
      d.prizes=d.prizes||{};
      return `<div class="steps"><button class="crumb back" data-ce="">‹ Objetivos</button></div><p class="q">Premios y reglas</p>
        <div class="mcard"><p class="lab2" style="margin-top:0">¿Cómo se reparte el premio?</p>
        <div class="modes"><button class="kind" data-mode="general" aria-pressed="${(d.prizeMode||"general")==="general"}"><span>🏆</span><span>Un ganador general<small>Compiten todos los equipos de todas las tareas</small></span></button>
        <button class="kind" data-mode="tarea" aria-pressed="${d.prizeMode==="tarea"}"><span>🥇</span><span>Un ganador por tarea<small>Cada tarea tiene su premio</small></span></button></div>
        <p class="lab2">Puntaje mínimo para ganar</p><div class="chips" style="justify-content:flex-start">${[80,85,90,95].map(n=>`<button class="chip" data-th="${n}" aria-pressed="${+d.threshold===n}">${n} pts</button>`).join("")}</div>
        ${numStep("th",d.threshold,1,"puntos")}
        <p class="hint">Si ningún equipo llega a este puntaje con todos sus objetivos medidos, queda sin ganador.</p></div>
        <p class="sect">${keys.length>1?"Premios por tarea":"El premio"}</p>
        ${keys.map(([k,label])=>{ const pz=getPrize(d,k)||{}; return `<div class="pcard"><div class="ph">${prizeThumb(pz,76)}<div class="tx"><small>${esc(label)}</small><input data-pz="${esc(k)}" value="${esc(pz.name||"")}" placeholder="Ej.: Asado para el equipo" aria-label="Premio de ${esc(label)}"></div></div>
          <div class="pbtns"><button class="btn sec" data-ppick="${esc(k)}">🎨 Elegir dibujito</button>${canPhoto?`<label class="btn sec" style="display:inline-flex;align-items:center;gap:4px">📷 ${pz.img?"Cambiar foto":"Subir foto"}<input type="file" accept="image/*" data-pfile="${esc(k)}" hidden></label>`:""}${pz.img?`<button class="btn sec" data-pnoimg="${esc(k)}" style="color:var(--bad)">Quitar foto</button>`:""}</div>
          ${state.prizePick===k?`<div class="egrid" style="margin-top:12px">${PRIZE_EMOJIS.map(em=>`<button data-pemo="${esc(k)}|${em}" aria-pressed="${pz.emoji===em&&!pz.img}">${em}</button>`).join("")}</div>`:""}
        </div>`; }).join("")}
        ${canPhoto?"":`<p class="hint">Para subir fotos de los premios necesitás permiso de edición en esta página.</p>`}${bar}`;
    }
    if(typeof e==="number" && d.tasks[e]){
      const t=d.tasks[e];
      return `<div class="steps"><button class="crumb back" data-ce="">‹ Objetivos</button></div>
        <div class="mcard"><div class="row1">${tIcon(t)}<input class="bigin" data-tk="name" value="${esc(t.name)}" placeholder="Nombre de la tarea" aria-label="Nombre de la tarea"></div>
        ${teamsOf(t).length?"":`<p class="lab2">Responsables (opcional)</p><input data-tk="team" value="${esc(t.team||"")}" placeholder="Ej.: Turno mañana" style="width:100%">`}</div>
        <button class="ocard" data-gotab="equipos" style="margin-top:12px"><span class="tic" style="background:var(--blue)">👥</span><span class="tx"><b>${teamsOf(t).length?`${teamsOf(t).length} equipos`:"Sin equipos"}</b><small>Los equipos se arman en la pestaña Equipos</small></span><span class="chev">›</span></button>
        <p class="sect">Objetivos de la tarea</p>
        ${t.metrics.map((m,mi)=>`<div class="mcard">
          <div class="row1"><input data-mk="${mi}:name" value="${esc(m.name)}" aria-label="Nombre del objetivo" placeholder="Nombre del objetivo"><button class="xbtn" data-delm="${mi}" aria-label="Quitar objetivo">×</button></div>
          <p class="lab2">¿Cómo se mide?</p>
          <div class="kinds">${Object.keys(KINDS).map(k=>`<button class="kind" data-kind="${mi}:${k}" aria-pressed="${m.kind===k}"><span>${KIND_IC[k]}</span>${KIND_SHORT[k]}</button>`).join("")}</div>
          <p class="lab2">${KINDS[m.kind].higher?"Meta (como mínimo)":"Meta (como máximo)"}</p>
          ${numStep(`${mi}:target`, m.target, m.kind==="tiempo"?5:1, m.kind==="auditoria"?"% bien":m.kind==="puntaje"?`de ${m.scaleMax||10}`:m.kind==="tiempo"?"minutos":"en el mes")}
          ${m.kind==="auditoria"?`<p class="lab2">Posiciones que se revisan por control</p><div class="chips" style="justify-content:flex-start">${[20,30,50,100].map(n=>`<button class="chip" data-mset="${mi}:sample:${n}" aria-pressed="${+(m.sample||50)===n}">${n}</button>`).join("")}</div>`:""}
          <p class="lab2">Importancia</p><div class="chips" style="justify-content:flex-start">${[[1,"Normal"],[2,"Doble"],[3,"Triple"]].map(([n,l])=>`<button class="chip" data-mset="${mi}:weight:${n}" aria-pressed="${+(m.weight||1)===n}">${l}</button>`).join("")}</div>
        </div>`).join("")}
        <button class="addc" id="c_addm">＋ Agregar objetivo</button>
        <button class="dangerlink" id="c_deltask">Quitar esta tarea</button>${bar}`;
    }
    state.cfgEdit=null;
    return `<button class="ocard prizec" data-ce="premio">${(d.prizeMode||"general")==="general"?prizeThumb(getPrize(d,"general"),48):prizeThumb({emoji:"🥇"},48)}<span class="tx"><b>${esc((d.prizeMode||"general")==="general"?(getPrize(d,"general")?.name||"Definí el premio"):`${d.tasks.filter(t=>getPrize(d,t.id)).length} de ${d.tasks.length} premios cargados`)}</b><small>${d.prizeMode==="tarea"?"Un ganador por tarea":"Un ganador general"} · mínimo ${fmt(d.threshold,0)} puntos</small></span><span class="chev">›</span></button>
      <p class="sect">Tareas y metas</p>
      ${d.tasks.map((t,i)=>`<button class="ocard" data-ce="${i}">${tIcon(t)}<span class="tx"><b>${esc(t.name||"Sin nombre")}</b><small>${teamsOf(t).length?`${teamsOf(t).length} equipo${teamsOf(t).length===1?"":"s"} · `:""}${t.metrics.length?t.metrics.map(m=>esc(m.name)).join(" · "):"Sin objetivos"}</small></span><span class="chev">›</span></button>`).join("")}
      <button class="addc" id="c_addtask">＋ Agregar tarea</button>
      ${state.db?.local?`<p class="sect">Copia de seguridad</p><div class="mcard"><p class="hint" style="margin-top:0">Los datos quedan guardados sólo en este teléfono. Descargá una copia cada tanto.</p><div class="actions"><button class="btn sec" id="c_export">Descargar copia</button><label class="btn sec" style="display:inline-flex;align-items:center">Restaurar copia<input type="file" id="c_import" accept=".json,application/json" hidden></label></div></div>`:""}
      ${bar}`;
  }
  function wireConfig(){
    const d=state.draft, v=$("#view");
    const syncBar=()=>{ const b=$("#savebar"); if(b) b.hidden=!isDirty(); };
    const rer=()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };
    const t = typeof state.cfgEdit==="number" ? d.tasks[state.cfgEdit] : null;
    v.querySelectorAll("[data-ce]").forEach(b=>b.onclick=()=>{ const x=b.dataset.ce; state.cfgEdit = x===""?null : x==="premio"?"premio":+x; render(); window.scrollTo(0,0); if(b.dataset.scroll){ setTimeout(()=>document.getElementById("teams-sec")?.scrollIntoView({block:"start"}),30); } });
    const pzOf=k=>{ d.prizes=d.prizes||{}; if(!d.prizes[k]){ d.prizes[k]= k==="general"&&d.prize ? {name:d.prize} : {}; } return d.prizes[k]; };
    v.querySelectorAll("[data-pz]").forEach(el=>el.oninput=()=>{ pzOf(el.dataset.pz).name=el.value; if(el.dataset.pz==="general") d.prize=el.value; syncBar(); });
    v.querySelectorAll("[data-ppick]").forEach(b=>b.onclick=()=>{ state.prizePick = state.prizePick===b.dataset.ppick ? null : b.dataset.ppick; rer(); });
    v.querySelectorAll("[data-pemo]").forEach(b=>b.onclick=()=>{ const [k,em]=b.dataset.pemo.split("|"); const pz=pzOf(k); pz.emoji=em; delete pz.img; state.prizePick=null; rer(); });
    v.querySelectorAll("[data-pnoimg]").forEach(b=>b.onclick=()=>{ delete pzOf(b.dataset.pnoimg).img; rer(); });
    v.querySelectorAll("[data-pfile]").forEach(inp=>inp.onchange=async()=>{
      const file=inp.files[0]; if(!file) return; const k=inp.dataset.pfile;
      try{
        toast("Subiendo foto…");
        // La foto se guarda dentro de la configuración (Firestore admite hasta 1 MB por documento)
        const local=true, max=600;
        const bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); });
        const sc=Math.min(1,max/Math.max(bmp.width,bmp.height)), cv=document.createElement("canvas");
        cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc); cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
        if(local){ pzOf(k).img={data:cv.toDataURL("image/jpeg",.75)}; }
        else { const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.82)); const up=await state.assets.upload(blob); pzOf(k).img={asset:up.id}; }
        rer(); toast("Foto lista. Tocá Guardar.");
      }catch(err){ alert("No se pudo subir la foto. Probá con otra imagen."); }
    });
    v.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ d.threshold=+b.dataset.th; rer(); });
    v.querySelectorAll("[data-tk]").forEach(el=>el.oninput=()=>{ t[el.dataset.tk]=el.value; syncBar(); });
    v.querySelectorAll("[data-gotab]").forEach(b=>b.onclick=()=>{ if(isDirty() && !confirm("Tenés cambios sin guardar en Objetivos. ¿Salir igual?")) return; state.eq.taskId=d.tasks[state.cfgEdit]?.id||state.eq.taskId; document.querySelector(`[data-tab="${b.dataset.gotab}"]`).click(); });
    v.querySelectorAll("[data-tm]").forEach(el=>el.oninput=()=>{ const [i,k]=el.dataset.tm.split(":"); t.teams[+i][k]=el.value; if(k==="name"){ const ic=el.parentNode.querySelector(".tic"); if(ic) ic.textContent=initials(el.value); } syncBar(); });
    v.querySelectorAll("[data-deltm]").forEach(b=>b.onclick=()=>{ if(confirm("¿Quitar este equipo? Sus mediciones dejan de contar en el ranking.")){ t.teams.splice(+b.dataset.deltm,1); rer(); } });
    $("#c_addtm")?.addEventListener("click",()=>{ t.teams=t.teams||[]; t.teams.push({id:uid(),name:`Equipo ${t.teams.length+1}`,members:""}); rer(); setTimeout(()=>{ const ins=v.querySelectorAll('.team input.tn'); const last=ins[ins.length-1]; last?.focus(); last?.select(); },50); });
    v.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ d.prizeMode=b.dataset.mode; rer(); });
    v.querySelectorAll("[data-mk]").forEach(el=>el.oninput=()=>{ const [i,k]=el.dataset.mk.split(":"); t.metrics[+i][k]=el.value; syncBar(); });
    v.querySelectorAll("[data-nv]").forEach(el=>el.oninput=()=>{
      const key=el.dataset.nv, val=el.value===""?"":+el.value;
      if(key==="th") d.threshold=val; else { const [i,k]=key.split(":"); t.metrics[+i][k]=val; }
      syncBar();
    });
    v.querySelectorAll("[data-ns]").forEach(b=>b.onclick=()=>{
      const parts=b.dataset.ns.split(":"), delta=+parts.pop(), key=parts.join(":");
      if(key==="th") d.threshold=Math.min(100,Math.max(0,(+d.threshold||0)+delta));
      else { const [i,k]=key.split(":"); const m=t.metrics[+i]; let nv=Math.max(0,(+m[k]||0)+delta); if(m.kind==="auditoria") nv=Math.min(nv,100); if(m.kind==="puntaje") nv=Math.min(nv,+m.scaleMax||10); m[k]=nv; }
      rer();
    });
    v.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{
      const [i,k]=b.dataset.kind.split(":"), m=t.metrics[+i]; if(m.kind===k) return;
      m.kind=k; m.target={auditoria:98,puntaje:8,tiempo:45,cantidad:5}[k];
      if(k==="puntaje") m.scaleMax=10; if(k==="auditoria") m.sample=m.sample||50;
      rer();
    });
    v.querySelectorAll("[data-mset]").forEach(b=>b.onclick=()=>{ const [i,k,n]=b.dataset.mset.split(":"); t.metrics[+i][k]=+n; rer(); });
    v.querySelectorAll("[data-delm]").forEach(b=>b.onclick=()=>{ if(confirm("¿Quitar este objetivo?")){ t.metrics.splice(+b.dataset.delm,1); rer(); } });
    $("#c_addm")?.addEventListener("click",()=>{ t.metrics.push({id:uid(),name:"Orden y limpieza",kind:"puntaje",target:8,scaleMax:10,weight:1}); rer(); setTimeout(()=>{ const ins=v.querySelectorAll("[data-mk]"); const last=ins[ins.length-1]; last?.focus(); last?.select(); },50); });
    $("#c_deltask")?.addEventListener("click",()=>{ if(confirm("¿Quitar esta tarea? Sus mediciones dejan de contar en el ranking.")){ d.tasks.splice(state.cfgEdit,1); state.cfgEdit=null; render(); window.scrollTo(0,0); } });
    const quickAdd=async i=>{
      const inp=v.querySelector(`[data-qname="${i}"]`), name=(inp?.value||"").trim();
      if(!name){ inp?.focus(); return toast("Escribí el nombre del equipo"); }
      const task=d.tasks[i]; task.teams=task.teams||[];
      if(task.teams.some(x=>x.name.trim().toLowerCase()===name.toLowerCase())) return toast("Ese equipo ya existe");
      task.teams.push({id:uid(),name,members:""});
      try{ await state.db.doc("config/main").set(JSON.parse(JSON.stringify(d))); state.config=JSON.parse(JSON.stringify(d)); rer(); toast("Equipo agregado"); setTimeout(()=>v.querySelector(`[data-qname="${i}"]`)?.focus(),50); }
      catch(e){ task.teams.pop(); alert(e?.code==="invalid_argument"?"No tenés permiso para cambiar los equipos.":"No se pudo guardar. Probá de nuevo."); }
    };
    v.querySelectorAll("[data-qadd]").forEach(b=>b.onclick=()=>quickAdd(+b.dataset.qadd));
    v.querySelectorAll("[data-qname]").forEach(el=>el.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); quickAdd(+el.dataset.qname); } });
    $("#c_addtask")?.addEventListener("click",()=>{ d.tasks.push({id:uid(),name:"Nueva tarea",team:"",metrics:[{id:uid(),name:"Orden y limpieza",kind:"puntaje",target:8,scaleMax:10,weight:1}]}); state.cfgEdit=d.tasks.length-1; render(); window.scrollTo(0,0); setTimeout(()=>{ const n=v.querySelector('[data-tk="name"]'); n?.focus(); n?.select(); },50); });
    $("#c_undo")?.addEventListener("click",()=>{ state.draft=JSON.parse(JSON.stringify(state.config)); if(typeof state.cfgEdit==="number" && !state.draft.tasks[state.cfgEdit]) state.cfgEdit=null; render(); });
    $("#c_export")?.addEventListener("click",()=>{
      const blob=new Blob([JSON.stringify(state.db.exportAll(),null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`premio-portal-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
    });
    $("#c_import")?.addEventListener("change",async e=>{
      const file=e.target.files[0]; if(!file) return;
      try{ state.db.importAll(JSON.parse(await file.text())); state.draft=JSON.parse(JSON.stringify(state.config)); render(); toast("Copia restaurada"); }
      catch(err){ alert("Ese archivo no es una copia válida de esta aplicación."); }
    });
    $("#c_save")?.addEventListener("click",async()=>{
      if(d.tasks.some(x=>!String(x.name).trim())) return alert("Cada tarea necesita un nombre.");
      if(d.tasks.some(x=>(x.teams||[]).some(tm=>!String(tm.name).trim()))) return alert("Cada equipo necesita un nombre.");
      if(d.tasks.some(x=>x.metrics.some(m=>!String(m.name).trim()||m.target===""))) return alert("Cada objetivo necesita nombre y meta.");
      if(d.threshold===""||isNaN(+d.threshold)) return alert("Poné el puntaje mínimo para ganar.");
      const b=$("#c_save"); b.disabled=true; b.textContent="Guardando…";
      try{ await state.db.doc("config/main").set(JSON.parse(JSON.stringify(d))); state.config=JSON.parse(JSON.stringify(d)); render(); toast("Cambios guardados"); }
      catch(e){ b.disabled=false; b.textContent="Guardar"; alert(e?.code==="invalid_argument"?"No tenés permiso para cambiar los objetivos.":"No se pudo guardar. Probá de nuevo."); }
    });
  }

  // ---------- data ----------
  function subscribeRecords(){
    if(state.unsubRec) state.unsubRec();
    state.recLoaded=false; state.records=[];
    if(!state.db) return;
    state.unsubRec = state.db.collection("records").where("month","==",state.month).onSnapshot(snap=>{
      state.records = snap.docs.map(d=>({...d.data(), _id:d.id}));
      state.recLoaded=true; if(state.tab==="ranking"||state.tab==="registros") render();
    }, err=>{ setStatus("No se pudieron leer las mediciones. Recargá la página.", true); });
  }

  async function init(){
    let db=null;
    try{ db = await conectarFirebase(); }catch(e){ db=null; }
    if(!db){ db=makeLocalDb(); setStatus("Sin conexión con la base compartida: los datos se guardan sólo en este teléfono.", true); }
    else setStatus("");
    state.db=db;
    $("#ver").textContent = `Versión 9 · 14/10/2026 · ${db.local?"guardado en este teléfono":"datos compartidos con el equipo"}`;
    db.doc("config/main").onSnapshot(snap=>{
      state.config = normalizeConfig(snap.exists ? Object.assign({prize:"",threshold:90,tasks:[]}, snap.data()) : {prize:"",threshold:90,tasks:[]});
      const first=!state.configLoaded; state.configLoaded=true;
      if(first || state.tab==="ranking"||state.tab==="registros") render();
    }, ()=>setStatus("No se pudo leer la configuración. Recargá la página.", true));
    subscribeRecords();
    render();
  }
  render();
  init();
})();
</script>

<style>
#btn-escritorio{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2147483000;display:flex;align-items:center;gap:0;height:46px;padding:0 13px;border-radius:999px;
  background:linear-gradient(145deg,#2f6bd1,#1f4a9b);color:#fff;text-decoration:none;font:700 14px/1 "Figtree","Montserrat","Segoe UI",system-ui,sans-serif;
  box-shadow:0 10px 24px -8px rgba(14,39,86,.65),0 0 0 2px #ffd100;opacity:.92;transition:opacity .2s,transform .2s,gap .25s}
#btn-escritorio svg{width:20px;height:20px;flex:none;stroke:#ffd100;fill:none;stroke-width:2.2}
#btn-escritorio span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .25s}

#btn-escritorio:hover span,#btn-escritorio:focus-visible span{max-width:100px}
@media print{#btn-escritorio{display:none!important}}
</style>
<script>
/* Si debajo del botón hay una barra fija (por ej. la barra de pestañas del celular), lo sube por encima. */
(function(){var b=document.getElementById("btn-escritorio");if(!b)return;
function ubicar(){b.style.bottom="";var r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;b.style.visibility="hidden";var e=document.elementFromPoint(x,y);b.style.visibility="";
for(var p=e;p&&p!==document.body&&p!==document.documentElement;p=p.parentElement){var cs=getComputedStyle(p);if(cs.position==="fixed"||cs.position==="sticky"){var top=p.getBoundingClientRect().top;if(top>innerHeight/2)b.style.bottom=(innerHeight-top+12)+"px";break;}}}
addEventListener("load",function(){setTimeout(ubicar,600)});addEventListener("resize",function(){clearTimeout(ubicar.t);ubicar.t=setTimeout(ubicar,250)});})();
</script>
