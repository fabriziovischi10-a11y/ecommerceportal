<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TMS - Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Montserrat:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
/* logo original de Portal: letras azules sobre fondo claro, letras blancas en modo oscuro */
.brand .logo{height:42px;width:auto;display:block}
.brand .logo.osc{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo.cla{display:none}:root:not([data-theme="light"]) .brand .logo.osc{display:block}}
:root[data-theme="dark"] .brand .logo.cla{display:none}
:root[data-theme="dark"] .brand .logo.osc{display:block}
@media (max-width:520px){.brand .logo{height:34px}}
.sp-img{width:min(440px,82vw);height:auto;opacity:0;animation:rise .5s ease-out .15s forwards}
.sp-sub{font-family:Montserrat,Figtree,sans-serif;font-size:clamp(20px,5vw,30px);letter-spacing:.22em;margin-top:6px}
</style>
<style>
/* Layout: white top bar with color-coded module tabs; home = sunny animated road banner + gradient module tiles; each module carries its own color (logística azul, programación violeta, rutas verde agua, novedades naranja, base de datos frambuesa) over a soft grey workspace. */
:root{
  --bg:#f3f5fa; --panel:#ffffff; --panel-2:#f6f8fc; --line:#e2e7f0; --line-2:#cfd7e4; --ink:#16203a; --muted:#5a6880;
  --pri:#1f4a9b; --pri-h:#183c80; --pri-fg:#ffffff; --pri-soft:#e8eefb;
  --brand-y:#ffd100; --brand-b:#1f4a9b; --brand-r:#e0261c;
  --c-log:#2457c5; --c-log2:#4f8df5; --c-prog:#6f42d6; --c-prog2:#a17cf5; --c-rut:#0b8f7c; --c-rut2:#2cc4a6;
  --c-nov:#d9480f; --c-nov2:#f59f00; --c-base:#c2255c; --c-base2:#f06595; --c-hoja:#0b7fa3; --c-hoja2:#22b8cf;
  --c-viaje:#4338ca; --c-viaje2:#7c83f7; --c-caja:#2b8a3e; --c-caja2:#51cf66; --c-hist:#475569; --c-hist2:#8494ab;
  --ok:#12805c; --ok-soft:#e1f5eb; --warn:#a35f00; --warn-soft:#fff1d1; --bad:#c8322b; --bad-soft:#fde6e4;
  --info:#2457c5; --info-soft:#e6eefc; --vio:#6f42d6; --vio-soft:#efe8fd; --mute:#64738a; --mute-soft:#edf0f5;
  --plate-bg:#ffffff; --plate-fg:#111111; --plate-band:#1f4fbf;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --shadow-lg:0 18px 40px rgba(16,24,40,.16),0 3px 8px rgba(16,24,40,.08);
  --accent:var(--pri); --accent-fg:var(--pri-fg); --side:var(--ink);
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-disp:"Montserrat","Figtree","Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d121d; --panel:#151c2b; --panel-2:#1a2335; --line:#263149; --line-2:#334061; --ink:#e7ecf5; --muted:#98a4bb;
  --pri:#6f97ec; --pri-h:#89aaf0; --pri-fg:#0b1222; --pri-soft:#1d2a49;
  --ok:#4fc78f; --ok-soft:#12301f; --warn:#f2b44c; --warn-soft:#352911; --bad:#f2786f; --bad-soft:#3b1c1a;
  --info:#7ea4f2; --info-soft:#1d2a49; --vio:#b394f7; --vio-soft:#2a2145; --mute:#9aa6b8; --mute-soft:#222b3d;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 18px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d121d; --panel:#151c2b; --panel-2:#1a2335; --line:#263149; --line-2:#334061; --ink:#e7ecf5; --muted:#98a4bb;
  --pri:#6f97ec; --pri-h:#89aaf0; --pri-fg:#0b1222; --pri-soft:#1d2a49;
  --ok:#4fc78f; --ok-soft:#12301f; --warn:#f2b44c; --warn-soft:#352911; --bad:#f2786f; --bad-soft:#3b1c1a;
  --info:#7ea4f2; --info-soft:#1d2a49; --vio:#b394f7; --vio-soft:#2a2145; --mute:#9aa6b8; --mute-soft:#222b3d;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 18px 40px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ro .w{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--brand-y) 0 55%,#ffb000 55% 75%,var(--brand-r) 75% 88%,var(--brand-b) 88%)}
.top-in{max-width:1340px;margin:0 auto;padding-inline:20px;display:flex;align-items:stretch;gap:18px;min-height:62px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none}
.brand svg{width:34px;height:34px}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-family:var(--f-disp);font-weight:800;font-size:19px;color:var(--brand-b);letter-spacing:.01em}
.wm i{font-style:normal;font-family:var(--f-disp);font-weight:700;font-size:8px;color:var(--brand-r);letter-spacing:.14em;margin-top:2px}
.tabs{display:flex;align-items:stretch;gap:2px}
.tabs a{--tc:var(--pri);display:flex;align-items:center;gap:7px;padding:0 12px;color:var(--muted);font-weight:600;text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s}
.tabs a .dot{width:9px;height:9px;border-radius:50%;background:var(--tc);opacity:.55;transition:transform .2s,opacity .2s}
.tabs a:hover{color:var(--ink)} .tabs a:hover .dot{opacity:1;transform:scale(1.3)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--tc)} .tabs a.on .dot{opacity:1}
.tabs .bd{font-size:11.5px;font-weight:700;background:var(--brand-r);color:#ffffff;border-radius:999px;padding:0 7px;line-height:18px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
@media (max-width:980px){
  .top-in{flex-wrap:wrap;gap:0 10px;padding-inline:16px}
  .brand{height:54px}
  .tabs{order:3;overflow-x:auto;border-top:1px solid var(--line);margin-inline:-16px;padding-inline:8px;width:calc(100% + 32px)}
  .tabs a{padding:11px 10px}
}
@media (max-width:520px){.hide-sm{display:none}.wm b{font-size:17px}}

/* dropdowns */
.dd{position:relative;display:inline-flex}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:260px;max-width:min(340px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;display:flex;flex-direction:column}
.menu.l{left:0;right:auto}
.menu>button,.menu>a{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;border-radius:9px;padding:9px 11px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;width:100%}
.menu>button:hover,.menu>a:hover,.menu>button:focus-visible,.menu>a:focus-visible{background:var(--pri-soft);outline:none}
.menu>button svg,.menu>a svg{color:var(--pri);margin-top:1px}
.menu small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:1px}
.menu .sep{height:1px;background:var(--line);margin:5px 6px}
.menu .dng,.menu .dng svg{color:var(--bad)}
.caret{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.8;margin-right:-3px}

/* main + heads */
main{max-width:1340px;margin:0 auto;padding-inline:20px;padding-block:24px 70px;display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:600px){main{padding-inline:16px;padding-block:18px 60px}}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.ph-l{display:flex;align-items:center;gap:14px;min-width:0}
.badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 18px -8px var(--g1)}
.badge svg{width:36px;height:36px}
.eb{font-size:13.5px;font-weight:500;color:var(--muted)}
.eb a{color:var(--muted);text-decoration:none} .eb a:hover{color:var(--pri);text-decoration:underline}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(22px,2.8vw,30px);line-height:1.15;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.pa{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lead{margin:2px 0 0;color:var(--muted);font-size:15px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;box-shadow:0 1px 1px rgba(16,24,40,.04);transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;text-decoration:none}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,var(--c-log),var(--c-log2));border-color:transparent;color:#ffffff;box-shadow:0 6px 14px -6px var(--c-log)}
.btn.pri:hover{box-shadow:0 10px 20px -8px var(--c-log);filter:brightness(1.05)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.big{padding:12px 20px;font-size:15.5px;border-radius:12px}
.btn.big svg.i{width:22px;height:22px}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.icon{padding:6px 7px}
.btn.dng{color:var(--bad);border-color:var(--bad);background:none}
.btn.dngs{background:var(--bad);border-color:var(--bad);color:#ffffff}
.btn.green{background:linear-gradient(135deg,var(--c-caja),var(--c-caja2));border-color:transparent;color:#ffffff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.step{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);overflow:hidden}
.step button{border:0;background:none;padding:7px 12px;font-weight:700;color:var(--muted);font-size:16px;line-height:1}
.step button:hover{background:var(--panel-2);color:var(--ink)}
.step input{border:0;border-inline:1px solid var(--line);background:none;padding:6px 8px}
.step .lbl{padding:7px 12px;font-weight:600;border-inline:1px solid var(--line);white-space:nowrap}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px 0;background:linear-gradient(120deg,#ffd100 0%,#ffbf1f 45%,#ff9f43 100%);color:#16203a;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:6px;min-height:230px}
.hero .eb{color:#5a4300}
.hero h1{font-size:clamp(28px,4vw,42px);color:#1f4a9b}
.hero .lead{color:#3d3000;font-weight:500}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;position:relative;z-index:2}
.hero .btn.big{background:#1f4a9b;color:#ffffff;border-color:#1f4a9b;box-shadow:0 10px 22px -10px #1f4a9b}
.sun{position:absolute;right:8%;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#fff6c4 0%,#ffe066 45%,rgba(255,224,102,0) 70%);z-index:0}
.cloud{position:absolute;height:22px;border-radius:20px;background:rgba(255,255,255,.75);z-index:1}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:30px;height:30px;left:12px;top:-14px}
.cloud::after{width:22px;height:22px;left:34px;top:-9px}
.c1{width:80px;top:40px;left:-100px}.c2{width:60px;top:80px;left:-100px;opacity:.7}
.scene{position:relative;height:96px;margin:10px -28px 0;z-index:1}
.hill{position:absolute;bottom:26px;border-radius:50% 50% 0 0;background:rgba(31,74,155,.12)}
.h1{width:340px;height:70px;left:-40px}.h2{width:420px;height:90px;left:30%}.h3{width:300px;height:60px;right:-30px}
.road{position:absolute;left:0;right:0;bottom:0;height:30px;background:#2d3748}
.road::after{content:"";position:absolute;left:0;right:0;top:13px;height:4px;background:repeating-linear-gradient(90deg,#ffd100 0 34px,transparent 34px 64px)}
.htruck{position:absolute;bottom:14px;left:16%;width:118px;z-index:2}
.htruck .tk{transform-box:fill-box}
.wh{transform-box:fill-box;transform-origin:center}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.tiles.four{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.tiles,.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles,.tiles.four{grid-template-columns:minmax(0,1fr)}}
.tile{--g1:var(--c-log);--g2:var(--c-log2);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:22px;border-radius:20px;background:linear-gradient(140deg,var(--g1) 0%,var(--g2) 100%);border:0;box-shadow:0 12px 26px -14px var(--g1),var(--shadow);text-decoration:none;color:#ffffff;text-align:left;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;min-height:205px;font:inherit;width:100%}
.tile::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;bottom:-90px;background:rgba(255,255,255,.12);transition:transform .4s ease}
.tile::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:40px;top:-60px;background:rgba(255,255,255,.08)}
.tile:hover{transform:translateY(-5px);box-shadow:0 22px 36px -16px var(--g1),var(--shadow)}
.tile:hover::before{transform:scale(1.15)}
.tile:active{transform:translateY(-2px)}
.tile.wide{grid-column:span 2}
@media (max-width:560px){.tile.wide{grid-column:auto}}
.tile>*{position:relative;z-index:1}
.tile .ill{width:80px;height:80px;border-radius:22px;background:rgba(255,255,255,.94);display:grid;place-items:center;flex:none;box-shadow:0 8px 18px -10px rgba(0,0,0,.35);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tile:hover .ill{transform:scale(1.08) rotate(-4deg)}
.tile .ill svg{width:58px;height:58px}
.tile b{display:block;font-family:var(--f-disp);font-size:20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
.tile p{margin:5px 0 0;color:rgba(255,255,255,.88);font-size:14px;max-width:46ch}
.tile .meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.tile .mt{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 11px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#ffffff;backdrop-filter:blur(2px)}
.tile .go{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);color:#ffffff;transition:background .2s,color .2s,transform .2s}
.tile:hover .go{background:#ffffff;color:var(--g1);transform:translateX(4px)}
.tile.sm{min-height:178px;padding:18px}
.tile.sm .ill{width:64px;height:64px;border-radius:18px}
.tile.sm .ill svg{width:46px;height:46px}
.tile.sm b{font-size:16.5px}
.m-log{--g1:var(--c-log);--g2:var(--c-log2)} .m-prog{--g1:var(--c-prog);--g2:var(--c-prog2)} .m-rut{--g1:var(--c-rut);--g2:var(--c-rut2)}
.m-nov{--g1:var(--c-nov);--g2:var(--c-nov2)} .m-base{--g1:var(--c-base);--g2:var(--c-base2)} .m-hoja{--g1:var(--c-hoja);--g2:var(--c-hoja2)}
.m-viaje{--g1:var(--c-viaje);--g2:var(--c-viaje2)} .m-caja{--g1:var(--c-caja);--g2:var(--c-caja2)} .m-hist{--g1:var(--c-hist);--g2:var(--c-hist2)}

/* flow */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.fs{--fc:var(--mute);padding:16px 22px;display:flex;gap:12px;align-items:center;position:relative;border-left:1px solid var(--line);min-width:0}
.fs:first-child{border-left:0}
.fs .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--mute-soft);color:var(--fc);flex:none;position:relative}
.fs.on .n{background:var(--fc);color:#ffffff}
.fs.on .n::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--fc);opacity:0}
.fs b{display:block;font-family:var(--f-disp);font-size:26px;line-height:1;font-variant-numeric:tabular-nums;color:var(--fc)}
.fs span{font-size:13px;color:var(--muted)}
.fs::after{content:"";position:absolute;right:-9px;top:50%;width:16px;height:16px;background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.fs:last-child::after{display:none}
.f1{--fc:var(--vio)} .f2{--fc:var(--warn)} .f3{--fc:var(--info)} .f4{--fc:var(--ok)}
@media (max-width:760px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.fs::after{display:none}.fs:nth-child(3){border-left:0}.fs:nth-child(n+3){border-top:1px solid var(--line)}}

/* pills */
.sumrow{display:flex;flex-wrap:wrap;gap:8px}
.sumrow span{display:inline-flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13.5px;color:var(--muted)}
.sumrow b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.sumrow .hl{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)} .sumrow .hl b{color:var(--warn)}

/* panels & lists */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:1000px){.g2{grid-template-columns:minmax(0,1fr)}}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0;box-shadow:var(--shadow)}
.pn>.tw{border-radius:0 0 16px 16px}
.pnh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pnh h2{font-size:15.5px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.pnh h2 .sw{width:10px;height:10px;border-radius:3px;background:var(--sw,var(--pri))}
.pnh .s{font-size:13px;color:var(--muted)}
.pnb{padding:14px 16px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.li .d{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.li .r{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.daylbl{font-size:12px;font-weight:700;color:var(--muted);padding:8px 16px 6px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.none{padding:26px 16px;color:var(--muted);font-size:14px;text-align:center}
.none.ok{color:var(--ok);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 14px;font-weight:500;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner a{color:inherit;font-weight:700}

/* chips & plates */
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}

.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)}
.st.info{background:var(--info-soft);color:var(--info)} .st.vio{background:var(--vio-soft);color:var(--vio)} .st.mute{background:var(--mute-soft);color:var(--mute)}
.st.live::before{animation:blink 1.2s ease-in-out infinite}
.pat{display:inline-block;font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.06em;background:var(--plate-bg);color:var(--plate-fg);border:1px solid #2a2a2a;border-top:4px solid var(--plate-band);border-radius:3px;padding:0 6px;line-height:17px;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--mute-soft);color:var(--muted);white-space:nowrap}
.tag.pv{background:var(--info-soft);color:var(--info)} .tag.sc{background:var(--warn-soft);color:var(--warn)} .tag.ac{background:var(--vio-soft);color:var(--vio)}
.nro{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--vio);background:var(--vio-soft);border-radius:6px;padding:1px 7px}
.days{display:inline-flex;gap:3px}
.days span{font-size:11px;font-weight:600;width:30px;text-align:center;border-radius:5px;padding:2px 0;background:var(--mute-soft);color:var(--muted);opacity:.5}
.days span.on{background:var(--vio-soft);color:var(--vio);opacity:1}
.vd{font-variant-numeric:tabular-nums;white-space:nowrap}
.vd.warn{color:var(--warn);font-weight:700} .vd.bad{color:var(--bad);font-weight:700}
.mu{color:var(--muted)} .mono{font-family:var(--f-mono);font-size:12.5px} .num{font-variant-numeric:tabular-nums;text-align:right}
.gps{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:5px;padding:1px 6px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
table.wide{min-width:880px}
th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.ck{cursor:pointer} tr.ck:hover td{background:var(--panel-2)}
td .sub{font-size:12.5px;color:var(--muted)}
td.wrap{max-width:320px;overflow-wrap:anywhere}

/* filters */
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flt input,.flt select{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;min-width:0;font-size:14px}
.flt .q{flex:1 1 240px}
.flt label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg2{display:inline-flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--panel);padding:3px;gap:3px}
.seg2 button{border:0;background:none;padding:6px 14px;font-weight:600;color:var(--muted);border-radius:9px}
.seg2 button.on{background:linear-gradient(135deg,var(--c-prog),var(--c-prog2));color:#ffffff}

/* order cards */
.hoy{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.hoy .rail{display:flex;flex-direction:column;gap:16px}
@media (max-width:1050px){.hoy{grid-template-columns:minmax(0,1fr)}.hoy .rail{order:-1}}
.secl{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-size:15px;font-weight:700}
.secl .c{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.lcs{display:flex;flex-direction:column;gap:10px}
.lc{--lc:var(--vio);position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 14px 20px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;transition:box-shadow .15s,transform .15s}
.lc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--lc)}
.lc:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.lc .ic{grid-row:span 2;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--lc) 14%,transparent);color:var(--lc)}
.lc .ic svg{width:26px;height:26px}
.lc .t{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:15.5px;color:var(--ink);min-width:0;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lc .t:hover{color:var(--pri)}
.lc .m{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;color:var(--muted);font-size:13.5px;min-width:0}
.lc .m b{color:var(--ink);font-weight:600}
.lc .a{grid-row:span 2;display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.lc.e-Programada{--lc:var(--vio)} .lc.e-Cargada{--lc:var(--warn)} .lc.e-EnRuta{--lc:var(--info)} .lc.e-Finalizada{--lc:var(--ok)} .lc.e-Anulada{--lc:var(--mute)}
.lc.anul{opacity:.55} .lc.anul .t{text-decoration:line-through}
@media (max-width:640px){.lc{grid-template-columns:auto minmax(0,1fr)}.lc .a{grid-column:1/-1;grid-row:auto;justify-content:flex-start;padding-top:8px;border-top:1px solid var(--line);margin-top:6px}}
.emptycard{background:var(--panel);border:2px dashed var(--line-2);border-radius:18px;padding:34px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.emptycard b{color:var(--ink);font-size:16px}
.emptycard .big-ill{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1,var(--c-log)),var(--g2,var(--c-log2)))}
.emptycard .big-ill svg{width:64px;height:64px}

/* week board */
.wk{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:12px}

@media (max-width:640px){.wk{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);overflow:visible}
.col.today{border-color:var(--c-prog);box-shadow:0 0 0 2px color-mix(in srgb,var(--c-prog) 35%,transparent)}
.colh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px;border-radius:16px 16px 0 0;background:var(--panel-2)}

.colh b{font-size:15px;font-weight:700}
.colh span{font-size:12.5px;color:var(--muted)}
.it{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}

.it .t{font-weight:600;line-height:1.25}

.it.done .t{color:var(--muted)}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog .bar{flex:1 1 200px;height:10px;background:var(--mute-soft);border-radius:5px;overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--c-caja),var(--c-caja2))}
.prog b{font-family:var(--f-disp);font-size:20px}

/* hoja de ruta */
.doc{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.doc-h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 24px;background:linear-gradient(90deg,color-mix(in srgb,var(--brand-y) 22%,var(--panel)),var(--panel));border-bottom:4px solid var(--brand-y)}
.doc-brand{display:flex;align-items:center;gap:10px}
.doc-brand svg{width:40px;height:40px}
.doc-t{text-align:right}
.doc-t small{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.doc-t b{font-size:24px;font-family:var(--f-mono);color:var(--vio)}
.doc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.doc-grid>div{padding:12px 24px;border-left:1px solid var(--line);min-width:0}
.doc-grid>div:first-child{border-left:0}

@media (max-width:760px){.doc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.doc-grid>div:nth-child(3){border-left:0}.doc-grid>div:nth-child(n+3){border-top:1px solid var(--line)}}
.doc-dest{padding:12px 24px;border-bottom:1px solid var(--line);font-size:14px}
.doc table td.firma{min-width:140px;border-left:1px dashed var(--line-2)}
.doc-tot{display:flex;justify-content:flex-end;gap:24px;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--line);font-size:14px}
.doc-tot b{font-size:16px}
.firmas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;padding:46px 24px 24px}
.firmas div{border-top:1px solid var(--ink);padding-top:6px;text-align:center;font-size:13px;color:var(--muted)}
.stops td{vertical-align:middle}
.stops .ord{font-family:var(--f-disp);font-weight:800;font-size:16px;width:40px;text-align:center}
.stops .ord span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--info-soft);color:var(--info)}
.stops .mv{display:flex;flex-direction:column;gap:2px}
.stops .mv button{border:1px solid var(--line-2);background:var(--panel);border-radius:5px;width:26px;height:19px;line-height:1;font-size:10px;padding:0;color:var(--muted)}
.stops .mv button:hover{color:var(--ink);background:var(--panel-2)}
.stops input.dir,.stops select{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;width:100%;min-width:170px;font-size:13.5px}
.stops select{min-width:140px}
.stops tr.ent-ok td{background:var(--ok-soft)} .stops tr.ent-bad td{background:var(--bad-soft)}
.stops tr.locrow td{background:var(--panel-2);font-weight:700;font-size:13px;color:var(--rt);padding-block:7px}

/* recorrido timeline */
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;padding:14px 16px}
.rec .stp{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.rec .stp.dep{background:linear-gradient(135deg,var(--c-log),var(--c-log2));color:#ffffff;border-color:transparent}

.rec .leg{display:inline-flex;flex-direction:column;align-items:center;min-width:64px;padding-inline:4px;font-size:11.5px;font-weight:700;color:var(--c-rut)}

.rec .leg.est{color:var(--warn)}
.rec .leg.est::before{background:repeating-linear-gradient(90deg,var(--warn) 0 8px,transparent 8px 13px);background-size:13px 3px}

.svgmap{width:100%;height:auto;display:block;background:linear-gradient(180deg,color-mix(in srgb,var(--c-rut) 6%,var(--panel)),var(--panel-2));border-radius:0 0 16px 16px}

@media (max-width:700px){.caja{grid-template-columns:repeat(2,minmax(0,1fr))}.caja>div:nth-child(3){border-left:0}.caja>div:nth-child(n+3){border-top:1px solid var(--line)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.kpi{padding:14px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px}

.kpi .s{font-size:12.5px;color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

/* modal + forms */
.ov{position:fixed;inset:0;background:rgba(14,20,34,.5);backdrop-filter:blur(2px);display:flex;justify-content:center;align-items:flex-start;z-index:40;overflow-y:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 12px 28px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(760px,100%);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--mc,var(--c-log)) 12%,var(--panel)),var(--panel))}
.mh h2{font-family:var(--f-disp);font-weight:800;font-size:19px;margin:0}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:2px 8px;border-radius:8px}
.x:hover{background:var(--panel-2)}
.mf,.adv-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mf{padding:18px 20px 20px}
@media (max-width:640px){.mf,.adv-in{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1} .fld.two{grid-column:span 2}
@media (max-width:640px){.fld.two{grid-column:auto}}
.fld>label,.fld>.lab{font-size:13px;font-weight:600}

.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri);outline:3px solid var(--pri-soft);outline-offset:0}
.fld textarea{min-height:72px;resize:vertical}
.fsec{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.adv{grid-column:1/-1;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.adv summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--pri);list-style:none;display:flex;align-items:center;gap:6px}

.adv[open] summary::before{content:"–"}
.adv-in{padding:4px 14px 14px}
.sg{display:flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;padding:3px;gap:3px;background:var(--panel)}
.sg label{flex:1;text-align:center;padding:7px 6px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);position:relative;border-radius:9px;transition:background .15s,color .15s}
.sg input,.dk input{position:absolute;opacity:0;pointer-events:none}
.sg label:has(input:checked){background:linear-gradient(135deg,var(--c-log),var(--c-log2));color:#ffffff}
.sg label:has(input:focus-visible),.dk label:has(input:focus-visible){outline:2px solid var(--pri);outline-offset:1px}
.dk{display:flex;gap:5px;flex-wrap:wrap}
.dk label{position:relative;font-size:13px;font-weight:600;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted);background:var(--panel)}
.dk label:has(input:checked){background:var(--vio-soft);border-color:var(--vio);color:var(--vio)}
.cks{border:1px solid var(--line-2);border-radius:12px;max-height:280px;overflow-y:auto;background:var(--panel)}
.cks .cg{font-size:12px;font-weight:700;color:var(--muted);padding:8px 12px 5px;background:var(--panel-2);position:sticky;top:0;z-index:1}
.cks label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}

.cks label span{flex:1;min-width:0;font-weight:500}
.cks label em{font-style:normal;font-size:12px;color:var(--muted)}
.cks label em.ok{color:var(--ok);font-weight:600} .cks label em.al{color:var(--bad);font-weight:600}
.cks .empty{padding:14px;color:var(--muted);font-size:13.5px}
.recbox{grid-column:1/-1;border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--c-rut) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--c-rut) 30%,transparent);font-size:13.5px;display:flex;flex-direction:column;gap:4px}

.fmeta{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.cmsg{grid-column:1/-1;margin:0;font-size:14.5px}
.imp{grid-column:1/-1;border:2px dashed var(--line-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:7px;font-size:14px;background:var(--panel-2)}
.imp b{font-size:16px}
.choices{grid-column:1/-1;display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.choice:hover{border-color:var(--pri);background:var(--pri-soft);transform:translateX(3px)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;z-index:70;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px}

/* splash */
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#ffd100,#ffb000);display:grid;place-items:center;cursor:pointer;animation:spOut .5s ease-in 2.2s forwards}

.sp-wm{text-align:center;opacity:0;animation:rise .5s ease-out .55s forwards}
.sp-wm b{display:block;font-family:var(--f-disp);font-weight:800;font-size:clamp(34px,8vw,50px);color:#1f4a9b;letter-spacing:.02em;line-height:1}
.sp-wm i{font-style:normal;font-family:var(--f-disp);font-weight:700;font-size:13px;color:#e0261c;letter-spacing:.32em}
.sp-road{position:relative;width:100%;height:54px;border-bottom:4px dashed rgba(31,74,155,.45);overflow:hidden;margin-top:4px}
.sp-truck{position:absolute;bottom:4px;left:0;width:80px;animation:drive 1.9s cubic-bezier(.45,.05,.3,1) .25s both}
.sp-sub{font-weight:800;color:#1f4a9b;letter-spacing:.08em;opacity:0;animation:rise .5s ease-out .95s forwards}

@keyframes drive{from{transform:translateX(-90px)}to{transform:translateX(min(540px,92vw))}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@keyframes roadmove{to{background-position:-64px 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 200px))}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes blink{50%{opacity:.25}}
@keyframes ring{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.3}}
@keyframes slideIn{from{transform:translate(-50%,20px);opacity:0}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
@media (prefers-reduced-motion:no-preference){
  .road::after{animation:roadmove .7s linear infinite}
  .htruck .tk{animation:bob .45s ease-in-out infinite}
  .wh{animation:spin .5s linear infinite}
  .c1{animation:drift 28s linear infinite}.c2{animation:drift 40s linear 6s infinite}
  .tile:hover .ill svg{animation:floaty 1.4s ease-in-out infinite}
  .tile:hover .wh{animation:spin .4s linear infinite}
  .flowline{animation:dash 1s linear infinite}
  .fs.on .n::after{animation:ring 1.8s ease-out infinite}
  .lc.e-EnRuta .ic svg{animation:bob .5s ease-in-out infinite}
  .modal{animation:pop .2s cubic-bezier(.2,.8,.2,1)}
  .menu{animation:pop .14s ease-out}
  .toast{animation:slideIn .25s ease-out}
  .btn.pri{position:relative;overflow:hidden}
  .btn.pri::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-120%) skewX(-20deg)}
  .btn.pri:hover::after{animation:shine .7s ease-out}
  main.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  main.enter>*:nth-child(2){animation-delay:.06s} main.enter>*:nth-child(3){animation-delay:.12s} main.enter>*:nth-child(4){animation-delay:.18s} main.enter>*:nth-child(5){animation-delay:.24s}
  main.enter .tiles>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
  main.enter .tiles>*:nth-child(1){animation-delay:.1s} main.enter .tiles>*:nth-child(2){animation-delay:.17s} main.enter .tiles>*:nth-child(3){animation-delay:.24s}
  main.enter .tiles>*:nth-child(4){animation-delay:.31s} main.enter .tiles>*:nth-child(5){animation-delay:.38s} main.enter .tiles>*:nth-child(6){animation-delay:.45s}
  main.enter .tiles>*:nth-child(n+7){animation-delay:.52s}
  main.enter .lcs>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  main.enter .lcs>*:nth-child(2){animation-delay:.06s} main.enter .lcs>*:nth-child(3){animation-delay:.12s} main.enter .lcs>*:nth-child(n+4){animation-delay:.18s}
}

const hav=(a,b)=>{const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
/** km por ruta entre dos localidades: tabla precalculada (exacto) o estimación en línea recta × 1,3 */
function km(a,b){
  if(!a||!b)return{km:null,exact:false};if(a===b)return{km:0,exact:true};
  const D=DIST();if(D&&D.ix[a]!=null&&D.ix[b]!=null){const v=D.m[D.ix[a]][D.ix[b]];if(v>=0)return{km:v/10,exact:true}}
  const L=LOC(),A=L[a],B=L[b];if(A&&B&&A.lat!=null&&B.lat!=null)return{km:Math.round(hav(A,B)*1.3),exact:false};
  return{km:null,exact:false};
}

/** ordena localidades: vecino más cercano + 2-opt, con origen y destino fijos */
function ordenLocalidades(locs,o,d){
  let left=locs.slice(),route=[],cur=o;
  const K=(a,b)=>{const r=km(a,b);return r.km==null?9999:r.km};
  while(left.length){let bi=0,bd=Infinity;left.forEach((l,i)=>{const v=cur?K(cur,l):0;if(v<bd){bd=v;bi=i}});cur=left.splice(bi,1)[0];route.push(cur)}
  const full=[o].concat(route,[d]);let imp=true,g=0;
  while(imp&&g++<80){imp=false;for(let i=1;i<full.length-2;i++)for(let j=i+1;j<full.length-1;j++){
    if(K(full[i-1],full[j])+K(full[i],full[j+1])<K(full[i-1],full[i])+K(full[j],full[j+1])-1e-6){const seg=full.slice(i,j+1).reverse();full.splice(i,j-i+1,...seg);imp=true}}}
  return full.slice(1,-1);
}
/** orden de localidades: el que cargó el usuario (posiciones) y, para las que falten, el camino más corto */
function locOrder(s,locs,o,d){
  if(s.ordenLoc&&s.ordenLoc.length){const fixed=s.ordenLoc.filter(l=>locs.includes(l)),rest=locs.filter(l=>!fixed.includes(l));return fixed.concat(ordenLocalidades(rest,fixed.length?fixed[fixed.length-1]:o,d))}
  return ordenLocalidades(locs,o,d);
}
/** paradas ordenadas + tramos de km */
function plan(s){
  const {stops,sinExcel}=rawStops(s);const o=origenOf(s),d=destinoOf(s),wp=destPrinc(s);
  const by={},noLoc=[];stops.forEach(st=>{if(st.loc)(by[st.loc]=by[st.loc]||[]).push(st);else noLoc.push(st)});
  if(wp&&wp!==o&&wp!==d&&!by[wp])by[wp]=[];
  const pc=s.posCli||{},keys=Object.keys(by);
  const lo=wp&&by[wp]&&!(s.ordenLoc||[]).includes(wp)?locOrder(s,keys.filter(k=>k!==wp),o,wp).concat([wp]):locOrder(s,keys,o,d);
  const inLoc=a=>a.sort((x,y)=>((pc[x.k]??x.orden??9999)-(pc[y.k]??y.orden??9999))||String(x.cliente).localeCompare(String(y.cliente)));
  const ord=lo.flatMap(l=>inLoc(by[l])).concat(noLoc);
  ord.forEach((x,i)=>x.n=i+1);
  const locs=lo.map((l,i)=>({loc:l,pos:i+1,stops:by[l],total:by[l].reduce((t,x)=>t+(Number(x.total)||0),0)}));
  const seq=[o];lo.forEach(l=>{if(seq[seq.length-1]!==l)seq.push(l)});seq.push(d);
  const tramos=[];let total=0,exact=true,unknown=0;
  for(let i=1;i<seq.length;i++){if(!seq[i-1]||!seq[i])continue;const r=km(seq[i-1],seq[i]);if(seq[i-1]===seq[i]&&i===seq.length-1)continue;tramos.push({from:seq[i-1],to:seq[i],km:r.km,exact:r.exact});if(r.km==null)unknown++;else total+=r.km;if(!r.exact)exact=false}
  const locsSin=noLoc.length;
  locs.forEach((L,i)=>{const r=km(i===0?o:locs[i-1].loc,L.loc);L.km=r.km;L.exact=r.exact});
  const vuelta=locs.length?km(locs[locs.length-1].loc,d):{km:null,exact:false};
  return{stops:ord,locs,noLoc,vuelta,tramos,total:Math.round(total*10)/10,exact,unknown,sinExcel,locsSin,origen:o,destino:d,dest:wp,seq};
}

  let h=ph(crumb(["Inicio","inicio"],["Logística","logistica"],["Órdenes de carga"])+" · "+(isToday?"hoy, ":"")+fLarga(f),"Órdenes de carga",dayStep(f)+newOrden(),"orden");
  h+='<div class="sumrow"><span class="'+(pc.n?"hl":"")+'"><b>'+pc.n+'</b> por cargar</span><span><b>'+act.filter(s=>s.estado==="Programada").length+'</b> emitidas</span><span><b>'+act.filter(s=>s.estado==="Cargada").length+'</b> cargadas</span><span><b>'+act.filter(s=>s.estado==="En ruta").length+'</b> en viaje</span></div>';
  if(!depId())h+='<div class="banner">Elegí el <a href="#" data-act="cfg">punto de partida</a> (localidad del depósito) para que el sistema calcule los km de cada viaje.</div>';
  let L='<div><div class="secl">Órdenes <span class="c">'+sal.length+'</span></div>';
  L+=sal.length?'<div class="lcs">'+sal.map(ordenCard).join("")+'</div>':emptyCard("orden","m-log","Todavía no hay órdenes de carga para "+(isToday?"hoy":"este día"),"Emití la orden con camión, chofer, cobrador, origen y destino. Las zonas se cargan después, con el Excel, en la hoja de ruta.",'<button class="btn pri" data-act="new-sal" data-v="Preventa">'+IC.truck+'Preventa</button><button class="btn" data-act="new-sal" data-v="Sucursales">'+IC.store+'Sucursales</button>');
  L+='</div>';
  let R='<div class="rail"><section class="pn"><div class="pnh"><h2><span class="sw" style="--sw:var(--c-prog)"></span>Por cargar</h2><span class="s">'+pc.n+' pendientes</span></div><div class="list">';
  if(!pc.n)R+='<div class="none ok">'+IC.check+' Todo lo programado ya tiene orden</div>';
  pc.zPend.forEach(x=>{
    if(x.pz){const p=x.pz;R+='<div class="li"><div><div class="t">'+esc(pzLabel(p))+'</div><div class="d"><span class="tag pv">Preventa</span>'+(x.st.k==="no"?chip("No cumplido","bad"):"")+'<span>'+esc((p.zonaIds||[]).map(zonaT).join(", "))+'</span></div></div><div class="r"><button class="btn sm pri w" data-act="pz-desp" data-id="'+p.id+'">'+IC.truck+'Orden</button>'+dots([{a:"pz-susp",id:p.id,i:"pause",t:"Hoy no sale",w:1}])+'</div></div>';return}
    const z=x.z,st=x.st;
    R+='<div class="li"><div><div class="t">'+esc(zonaT(z.id))+'</div><div class="d"><span class="tag pv">Preventa</span>'+(st.t==="No salió"?chip("No salió","bad"):"")+'</div></div><div class="r"><button class="btn sm pri w" data-act="zona-desp" data-id="'+z.id+'" data-f="'+f+'">'+IC.truck+'Orden</button>'
      +dots([{a:"zona-sin",id:z.id,f:f,i:"pause",t:"Hoy no sale",w:1}])+'</div></div>'});
  pc.sPend.forEach(p=>{const late=p.fecha<f;
    R+='<div class="li"><div><div class="t">'+esc(sucT(p.sucursalId))+'</div><div class="d"><span class="tag sc">Sucursal</span>'+(late?chip("No cumplido · "+fDL(p.fecha),"bad"):'<span>programada '+fDL(p.fecha)+'</span>')+(p.rubro?'<span>'+esc(p.rubro)+'</span>':"")+'</div></div><div class="r"><button class="btn sm pri w" data-act="prog-desp" data-id="'+p.id+'">'+IC.truck+'Orden</button>'
      +dots([{a:"prog-susp",id:p.id,i:"pause",t:"Suspender envío",w:1},{a:"prog-del",id:p.id,i:"x",t:"Quitar del programa",dng:1,w:1}])+'</div></div>'});
  R+='</div></section>';
  const vv=[];
  S.camiones.filter(c=>c.estado!=="Baja").forEach(c=>{[["vtvVence","VTV"],["seguroVence","Seguro"]].forEach(([k,l])=>{if(c[k]&&daysTo(c[k])<=30)vv.push({d:c[k],t:plate(c.patente)+" "+l,act:"edit-cam",id:c.id})})});
  S.choferes.filter(isActive).forEach(c=>{if(c.licenciaVence&&daysTo(c.licenciaVence)<=30)vv.push({d:c.licenciaVence,t:esc(c.nombre)+" · licencia",act:"edit-cho",id:c.id})});
  vv.sort((a,b)=>a.d.localeCompare(b.d));
  if(vv.length)R+='<section class="pn"><div class="pnh"><h2><span class="sw" style="--sw:var(--bad)"></span>Vencimientos</h2></div><div class="list">'+vv.slice(0,6).map(v=>{const d=daysTo(v.d);return'<div class="li" data-act="'+v.act+'" data-id="'+v.id+'" style="cursor:pointer"><div class="t">'+v.t+'</div><div class="r">'+chip(d<0?"Vencido":d===0?"Vence hoy":"En "+d+" días",d<0?"bad":"warn")+'</div></div>'}).join("")+'</div></section>';
  R+='</div>';
  return h+'<div class="hoy">'+L+R+'</div>';
};

  :emptyCard("sheet","m-hoja","No hay hojas de ruta para este día","Cada orden de carga genera su hoja de ruta con el orden de entrega y los km.",'<a class="btn pri" href="#ordenes">Ir a órdenes de carga</a>'));
};
function recTimeline(p){
  const parts=['<span class="stp dep">'+IC.pin+esc(locName(p.origen)||"Origen")+'</span>'];
  const cnt={};p.stops.forEach(x=>{if(x.loc)cnt[x.loc]=(cnt[x.loc]||0)+1});
  p.tramos.forEach((t,i)=>{parts.push('<span class="leg'+(t.exact?"":" est")+'">'+(t.km==null?"? km":(t.exact?"":"≈")+fKm(t.km))+'</span>');
    const last=i===p.tramos.length-1;parts.push('<span class="stp'+(last&&t.to===p.destino?" dep":"")+'">'+esc(locName(t.to))+(cnt[t.to]?' <i>'+cnt[t.to]+'</i>':"")+'</span>')});
  return'<div class="rec">'+parts.join("")+'</div>';
}
function croquis(p){
  const L=LOC();const pts=p.seq.map(id=>L[id]).filter(l=>l&&l.lat!=null);
  if(pts.length<2)return"";
  const W=760,H=300,pad=36,k=Math.cos(pts.reduce((t,q)=>t+q.lat,0)/pts.length*Math.PI/180);
  const xs=pts.map(q=>q.lng*k),ys=pts.map(q=>q.lat),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sc=Math.min((W-2*pad)/((x1-x0)||1e-6),(H-2*pad)/((y1-y0)||1e-6)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
  const X=q=>+(ox+(q.lng*k-x0)*sc).toFixed(1),Y=q=>+(H-oy-(q.lat-y0)*sc).toFixed(1);
  const uniq=[];p.seq.forEach((id,i)=>{const l=L[id];if(l&&l.lat!=null&&!uniq.some(u=>u.id===id))uniq.push({id,l,i})});
  return'<svg class="svgmap" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Croquis del recorrido"><polyline class="flowline" points="'+pts.map(q=>X(q)+","+Y(q)).join(" ")+'" style="fill:none;stroke:var(--c-rut);stroke-width:3;stroke-dasharray:8 5;stroke-linecap:round"/>'
    +uniq.map((u,j)=>{const dep=u.id===p.origen||u.id===p.destino;return'<g><circle cx="'+X(u.l)+'" cy="'+Y(u.l)+'" r="'+(dep?11:8)+'" style="fill:'+(dep?"var(--c-log)":"var(--brand-r)")+';stroke:var(--panel);stroke-width:2.5"/><text x="'+X(u.l)+'" y="'+(Y(u.l)-15)+'" text-anchor="middle" style="fill:var(--ink);font:700 11.5px Figtree,Arial,sans-serif;paint-order:stroke;stroke:var(--panel);stroke-width:3px">'+esc(locName(u.id))+'</text></g>'}).join("")+'</svg>';
}

const pHead=(tipo,s,sub)=>'<header class="p-head">'+P_LOGO+'<div class="p-doc"><small>'+tipo+'</small><b>N° '+nro(s)+'</b><span>'+sub+'</span></div></header><div class="p-stripe"><i></i><i></i><i></i></div>';
const pBox=(l,v,sub,c)=>'<div class="p-box" style="--c:'+(c||"#1f4a9b")+'"><small>'+l+'</small><b>'+v+'</b>'+(sub?'<span>'+sub+'</span>':"")+'</div>';
const pK=(l,v,c)=>'<div class="p-k" style="--c:'+c+'"><small>'+l+'</small><b>'+v+'</b></div>';
const pPat=p=>p?'<span class="p-pat">'+esc(p)+'</span>':"—";
const pFoot=(t,s)=>'<footer class="p-foot"><span>Portal Distribuidora · '+t+' N° '+nro(s)+'</span><span>Impreso el '+new Date().toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"})+'</span></footer>';
function pRoute(p){const cnt={};p.stops.forEach(x=>{if(x.loc)cnt[x.loc]=(cnt[x.loc]||0)+1});
  let h='<div class="p-route"><span class="p-stop dep">'+esc(locName(p.origen))+'</span>';
  p.tramos.forEach((t,i)=>{h+='<span class="p-leg">→ '+(t.km==null?"?":(t.exact?"":"≈")+fKmN(t.km))+' km →</span><span class="p-stop'+(i===p.tramos.length-1&&t.to===p.destino?" dep":"")+'">'+esc(locName(t.to))+(cnt[t.to]?'<em>'+cnt[t.to]+'</em>':"")+'</span>'});
  return h+'</div>'}
function hojaInner(s){
  const p=plan(s),pv=s.canal==="Preventa",cam=get("camiones",s.camionId)||{},acop=get("camiones",s.acopladoId),ch=get("choferes",s.choferId)||{},co=get("choferes",s.cobradorId);
  const tot=p.stops.reduce((t,r)=>t+(Number(r.total)||0),0),nf=p.stops.reduce((t,r)=>t+r.fact.length,0);
  let rows="",last=null;const kmOf={};p.locs.forEach(L=>kmOf[L.loc]=L);
  p.stops.forEach(r=>{if(r.loc!==last){last=r.loc;const L=kmOf[r.loc];rows+='<tr class="g"><td colspan="6">'+esc(r.loc?locFull(r.loc):"Sin localidad")+(L&&L.km!=null?'<span>'+(L.exact?"":"≈")+fKmN(L.km)+' km desde la anterior</span>':"")+'</td></tr>'}
    rows+='<tr class="r"><td><span class="p-n">'+r.n+'</span></td><td><b>'+esc(r.cliente)+'</b><div class="sub mono">'+esc(r.cod)+'</div></td><td>'+esc(r.dir||"—")+(r.horario?'<div class="sub">'+esc(r.horario)+'</div>':"")+'</td><td class="mono">'+(r.fact.length?esc(r.fact.join(" ")):"—")+'</td><td class="num">'+(r.total!=null?fM(r.total):"")+'</td><td class="firma"></td></tr>'});
  return pHead("HOJA DE RUTA",s,fLarga(s.fecha)+" · "+(pv?"Preventa":"Sucursales"))
   +'<div class="p-grid">'+pBox("Camión",pPat(cam.patente),esc(cam.modelo||"")+(acop?" · acoplado "+esc(acop.patente):""),"#1f4a9b")
   +pBox("Chofer",esc(ch.nombre||"—"),ch.legajo?"Legajo "+esc(ch.legajo):"","#e0261c")
   +(pv?pBox("Cobrador",esc(co?co.nombre:"Sin cobrador"),co&&co.legajo?"Legajo "+esc(co.legajo):"","#6f42d6"):pBox("Equipo de carga",esc(equipoT(s)||"—"),"","#6f42d6"))
   +pBox("Portón de carga",esc(portT(s.portonId)),s.controladorId?"Controló: "+esc(persT(s.controladorId)):"","#2b8a3e")+'</div>'
   +'<div class="p-grid">'+pBox("Origen",esc(locName(p.origen)),"","#0b8f7c")+pBox("Destino",esc(p.dest?locName(p.dest):"—"),"","#0b8f7c")+pBox("Regreso",esc(locName(p.destino)),"3er destino","#0b8f7c")
   +pBox("Salida / llegada","Hora ____:____ / ____:____","Km odómetro ________ / ________","#f08c00")+'</div>'
   +'<h3>Recorrido · '+(p.total?(p.exact?"":"≈ ")+fKm(p.total):"sin km")+'</h3>'+pRoute(p)

/** estadística: observaciones por controlador en el período (y por cada orden que controló) */
function ctrlStats(F){
  const list=novFiltered(true),by={};list.forEach(n=>{const k=n.controladorId||"-";(by[k]=by[k]||[]).push(n)});
  const ords=S.salidas.filter(s=>actSal(s)&&s.controladorId&&(!F.canal||s.canal===F.canal)&&(!F.desde||s.fecha>=F.desde)&&(!F.hasta||s.fecha<=F.hasta));
  const ctrls=new Set(Object.keys(by).concat(ords.map(s=>s.controladorId)));if(!ctrls.size)return"";
  const top=["Faltante","Rotura","Sobrante"];const tot=list.length||1;
  const rows=[...ctrls].map(k=>{const a=by[k]||[],o=ords.filter(s=>s.controladorId===k).length;return{k,n:a.length,o,t:top.map(t=>a.filter(x=>x.tipo===t).length),otros:a.filter(x=>!top.includes(x.tipo)).length,ab:a.filter(x=>x.estado!=="Resuelta").length}}).sort((a,b)=>b.n-a.n||(a.k==="-")-(b.k==="-"));
  const mx=Math.max(1,...rows.map(r=>r.n));
  return'<section class="pn"><div class="pnh"><h2><span class="sw" style="--sw:var(--c-prog)"></span>Observaciones por controlador</h2><span class="s">Período y canal del filtro · tocá una fila para ver sus observaciones</span></div><div class="tw"><table class="wide"><thead><tr><th>Controlador</th><th class="num">Órdenes controladas</th><th class="num">Observaciones</th><th style="width:22%"></th><th class="num">Por orden</th>'+top.map(t=>'<th class="num">'+t+'s</th>').join("")+'<th class="num">Otras</th><th class="num">Sin resolver</th></tr></thead><tbody>'
   +rows.map(r=>'<tr class="ck'+(F.ctrl===r.k?" sel":"")+'" data-act="nov-ctrl" data-v="'+esc(F.ctrl===r.k?"":r.k)+'"><td><b>'+(r.k==="-"?'<span class="mu">Sin controlador</span>':esc(persT(r.k)||"(eliminado)"))+'</b></td><td class="num mono">'+(r.k==="-"?"—":r.o)+'</td><td class="num mono"><b>'+r.n+'</b> <span class="sub">'+Math.round(r.n*100/tot)+'%</span></td><td><div style="height:10px;border-radius:6px;background:var(--line,#e6e8ef);overflow:hidden"><div style="height:100%;width:'+Math.round(r.n*100/mx)+'%;background:var(--c-nov)"></div></div></td><td class="num mono">'+(r.k!=="-"&&r.o?(r.n/r.o).toLocaleString("es-AR",{maximumFractionDigits:1}):"—")+'</td>'+r.t.map(v=>'<td class="num mono">'+(v||"·")+'</td>').join("")+'<td class="num mono">'+(r.otros||"·")+'</td><td class="num mono">'+(r.ab?'<span class="st bad">'+r.ab+'</span>':"·")+'</td></tr>').join("")
   +'</tbody></table></div></section>';
}

function guiaSt(g){

/* ---- lectura del Excel ---- */
function gDate(v){
  if(v instanceof Date&&!isNaN(v)){const t=new Date(v.getTime()+6*36e5);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
  if(typeof v==="number"&&v>20000)return new Date(Math.round((v-25569)*864e5)+12*36e5).toISOString().slice(0,10);
  const m=String(v||"").match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+String(m[1]).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0")}
  return today();
}
async function parseGuias(file){
  const wb=await readBook(file),out={};let lines=0;
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});
    const hi=rows.slice(0,15).findIndex(r=>{const h=r.map(normH);return h.includes("id")&&h.includes("depa")});if(hi<0)continue;
    const H=rows[hi].map(normH),ix=(...ks)=>{for(const k of ks){const i=H.indexOf(k);if(i>=0)return i}return-1};
    const I={id:ix("id"),depa:ix("depa"),depde:ix("depde"),fe:ix("fechadoc","fecha"),cod:ix("codigo"),des:ix("descripcio","descripcion"),q:ix("cant","cantidad"),r:ix("nombre_rubro"),sr:ix("nombre_srubro"),con:ix("concepto"),us:ix("usuario")};
    const val=(r,i)=>i>=0?String(r[i]??"").trim():"";
    rows.slice(hi+1).forEach(r=>{const n=val(r,I.id);if(!n)return;lines++;
      const g=out[n]||(out[n]={nro:n,depa:val(r,I.depa),depde:val(r,I.depde),fecha:gDate(r[I.fe]),concepto:val(r,I.con),usuario:val(r,I.us),items:[]});
      g.items.push({c:val(r,I.cod),d:val(r,I.des),q:Number(r[I.q])||0,r:val(r,I.r),sr:val(r,I.sr)})});
  }
  if(!lines)throw new Error("columnas");
  Object.values(out).forEach(g=>{const s=sucByCode(g.depa);g.sucursalId=s?s.id:""});
  return{archivo:file.name,guias:Object.values(out),lines};
}

/** al grabar / anular / borrar una orden: asigna o libera sus guías */
async function syncGuias(salId,ids,anul){
  for(const g of S.guias){const want=!anul&&ids.includes(g.id);
    if(want&&g.salidaId!==salId)await C("guias").doc(g.id).update({salidaId:salId,estado:"Asignada"});
    else if(!want&&g.salidaId===salId)await C("guias").doc(g.id).update({salidaId:null,estado:"Pendiente"})}
}

let rT=null,pendingRender=false;
function schedule(){clearTimeout(rT);rT=setTimeout(render,25)}
function render(){
  const main=$("main"),a=document.activeElement;let fid=null,sel=null;
  if(a&&a.dataset&&(a.dataset.cli||a.dataset.hfld)&&main.contains(a)){pendingRender=true;return}
  if(main.querySelector(".menu:not([hidden])")){pendingRender=true;return}
  if(a&&a.id&&main.contains(a)){fid=a.id;try{sel=[a.selectionStart,a.selectionEnd]}catch(e){}}
  document.querySelectorAll("#nav a").forEach(x=>x.classList.toggle("on",x.dataset.r===(GRP[UI.route]||"inicio")));
  const nA=S.novedades.filter(n=>n.estado!=="Resuelta").length;$("bdNov").hidden=!nA;$("bdNov").textContent=nA;
  const late=S.progsuc.filter(p=>p.estado==="Pendiente"&&p.fecha<today()).length;$("bdProg").hidden=!late;$("bdProg").textContent=late;
  if(!ready)return;
  if(!db){main.innerHTML='<div class="pn"><div class="none">No se pudo conectar con la base de datos. Revisá la conexión a internet y recargá la página.</div></div>';return}
  if(main.classList.contains("enter")&&!render.et)render.et=setTimeout(()=>{main.classList.remove("enter");render.et=null},1200);
  const v=VIEWS[UI.route]||VIEWS.inicio;
  main.innerHTML=(canWrite?"":'<div class="banner">Tenés acceso de solo lectura: podés consultar todo, pero no cargar ni modificar.</div>')+v();
  if(fid){const el=$(fid);if(el){el.focus();if(sel&&sel[0]!=null)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  if(main.classList.contains("enter"))countUp(main);
  if(canWrite)addTrash(main);
  etiquetarTablas(main);
}
/* en el celular cada fila de tabla se ve como tarjeta: cada celda lleva el nombre de su columna */
function etiquetarTablas(root){(root||document).querySelectorAll("table.wide").forEach(t=>{
  const heads=[...t.querySelectorAll("thead th")].map(th=>th.textContent.trim());
  t.querySelectorAll("tbody tr").forEach(tr=>{let i=0;[...tr.children].forEach(td=>{const span=Number(td.getAttribute("colspan")||1);
    if(span>1)td.classList.add("full");else if(!td.hasAttribute("data-l"))td.setAttribute("data-l",heads[i]||"");i+=span})})})}
new MutationObserver(()=>{clearTimeout(etiquetarTablas.t);etiquetarTablas.t=setTimeout(()=>etiquetarTablas($("ov")),60)}).observe($("ov"),{childList:true,subtree:true});
/* tacho de eliminar en cada fila de las tablas editables */
const DELK={"edit-por":"porton","edit-pers":"personal","edit-cam":"camion","edit-cho":"chofer","edit-zon":"zona","edit-suc":"sucursal","edit-cli":"cliente","edit-nov":"novedad","open-hoja":"salida","caja-f":"salida"};
function addTrash(root){root.querySelectorAll("table").forEach(t=>{const rows=[...t.querySelectorAll("tbody tr")].filter(r=>r.dataset.delk||(r.classList.contains("ck")&&DELK[r.dataset.act]));if(!rows.length)return;
  const hr=t.querySelector("thead tr");if(hr&&!hr.querySelector(".thx")){const th=document.createElement("th");th.className="thx";hr.appendChild(th)}
  rows.forEach(r=>{if(r.querySelector(".tdx"))return;const k=r.dataset.delk||DELK[r.dataset.act],id=r.dataset.delid||r.dataset.id;const td=document.createElement("td");td.className="tdx";td.innerHTML='<button class="btn sm ghost icon trashb" data-act="del-x" data-v="'+k+'" data-id="'+esc(id)+'" title="Eliminar" aria-label="Eliminar">'+IC.trash+'</button>';r.appendChild(td)})})}
function countUp(root){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  root.querySelectorAll("[data-count]").forEach(el=>{const to=Number(el.dataset.count)||0;if(!to)return;const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/700);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

function fh(f,v){
  if(f.type==="sec")return'<div class="fsec">'+f.label+'</div>';
  if(f.type==="html")return'<div class="'+(f.cls||"imp")+'" id="f_'+f.k+'">'+(f.html||"")+'</div>';
  const id="f_"+f.k,cls="fld"+(f.full?" full":f.two?" two":""),star=f.req?" *":"";let inner;
  switch(f.type){
    case"select":inner='<select id="'+id+'" name="'+f.k+'">'+(f.blank===false?"":'<option value="">'+(f.blank||"—")+'</option>')+opts(typeof f.options==="function"?f.options():f.options,v)+'</select>';break;
    case"rawselect":inner='<select id="'+id+'" name="'+f.k+'">'+f.html(v)+'</select>';break;
    case"seg":inner='<div class="sg" role="radiogroup">'+f.options.map(o=>'<label><input type="radio" name="'+f.k+'" value="'+esc(o)+'"'+(o===(v||f.options[0])?" checked":"")+'>'+esc(o)+'</label>').join("")+'</div>';break;
    case"days":inner='<div class="dk">'+DIAS.map(([n,s])=>'<label><input type="checkbox" name="'+f.k+'" value="'+n+'"'+((v||[]).includes(n)?" checked":"")+'>'+s+'</label>').join("")+'</div>';break;
    case"checks":inner='<div class="cks" id="'+id+'"></div>';break;
    case"textarea":inner='<textarea id="'+id+'" name="'+f.k+'" placeholder="'+esc(f.ph||"")+'">'+esc(v??"")+'</textarea>';break;
    case"file":inner='<input id="'+id+'" name="'+f.k+'" type="file" accept="'+(f.accept||"")+'"'+(f.multiple?" multiple":"")+'>';break;

async function parsePlan(file){

    const m=a.match(/(\d{1,2})\/(\d{1,2})\s*al\s*(\d{1,2})\/(\d{1,2})/);if(m){const k=pad(m[2])+"-"+pad(m[1]);weeks[k]=(weeks[k]||0)+1}
    if(/^encargad/.test(na)){lastEnc=a.replace(/^encargad[oa][.:]?\s*/i,"").trim();return}
    const sm=b.match(/sucursal[:\s]+(.+)/i)||a.match(/sucursal[:\s]+(.+)/i);if(sm&&lastEnc&&!/^rubro/.test(na)){const name=sm[1].replace(/…/g,"").trim();if(name)enc[name]=title(lastEnc)}
    if(DIA_N[na]!=null){day=DIA_N[na];return}
    if(day!=null&&a&&!/^(rubro|encargad|sucursal)/.test(na)&&!/^\d{1,2}\/\d/.test(a))items.push({dia:day,suc:a,rubro:b});
  });
  const wk=Object.entries(weeks).sort((x,y)=>y[1]-x[1])[0];let semana=monday(today());
  if(wk){const y=new Date().getFullYear(),[mm,dd]=wk[0].split("-");semana=monday(y+"-"+mm+"-"+dd)}

  openForm({title:"Importar planilla semanal de sucursales",color:"c-prog",ok:"Programación de sucursales cargada",saveLabel:"Cargar programación",
    fields:[{k:"archivo",label:"Planilla «Pendientes y Planificación Entregas Semanal»",type:"file",accept:".xls,.xlsx",full:true},{k:"semana",label:"Semana que empieza el lunes",type:"date",req:true},{k:"reemp",label:"Si ya hay programa esa semana",type:"select",blank:false,options:[["agregar","Agregar lo nuevo"],["reemplazar","Reemplazar lo pendiente"]],two:true},{k:"sum",type:"html",html:'<span class="mu">Toma la planificación por día (sucursal y rubro) y los encargados de cada sucursal.</span>'}],
    after:F=>{F.elements.archivo.addEventListener("change",async()=>{const box=$("f_sum");box.innerHTML='<span class="mu">Leyendo…</span>';try{R=await parsePlan(F.elements.archivo.files[0])}catch(e){R=null;box.innerHTML='<span style="color:var(--bad)">No pude leer la planilla.</span>';return}
      F.elements.semana.value=R.semana;const names=Array.from(new Set(R.items.map(i=>i.suc))),nuevas=names.filter(n=>!findSuc(n));
      box.innerHTML='<b>'+pl(R.items.length,"envío","envíos")+' en '+pl(new Set(R.items.map(i=>i.dia)).size,"día","días")+'</b><span>'+DIAS.filter(([n])=>R.items.some(i=>i.dia===n)).map(([n,d])=>d+": "+R.items.filter(i=>i.dia===n).map(i=>i.suc).join(", ")).join(" · ")+'</span>'+(nuevas.length?'<span style="color:var(--warn)">Se crean '+pl(nuevas.length,"sucursal nueva","sucursales nuevas")+': '+esc(nuevas.join(", "))+'. Revisá su localidad en Base de datos.</span>':"")})},
    save:async d=>{if(!R||!R.items.length){ferr("Elegí la planilla.");return false}const wk=monday(d.semana),now=new Date().toISOString();
      const encs=Object.entries(R.enc).map(([n,e])=>({nombre:n,e})),encOf=name=>{const x=findSuc(name,encs);return x?x.e:""};
      const ids={};for(const name of Array.from(new Set(R.items.map(i=>i.suc)))){let s=findSuc(name);const e=encOf(name);
        if(!s){const id=await write("sucursales",null,{nombre:title(name),alias:[name],contacto:e,locId:guessLoc(name),localidad:locName(guessLoc(name)),dias:[],estado:"Activa"});s={id,nombre:title(name)}}
        else if(e&&s.contacto!==e)await C("sucursales").doc(s.id).update({contacto:e,updatedAt:now});ids[name]=s.id}
      if(d.reemp==="reemplazar")for(const p of S.progsuc.filter(p=>p.semana===wk&&p.estado==="Pendiente"))await del("progsuc",p.id);
      let n=0;for(const it of R.items){const fecha=addD(wk,it.dia===0?6:it.dia-1),sid=ids[it.suc];
        if(d.reemp!=="reemplazar"&&S.progsuc.some(p=>p.sucursalId===sid&&p.fecha===fecha&&normH(p.rubro)===normH(it.rubro)))continue;
        await write("progsuc",null,{semana:wk,fecha,sucursalId:sid,rubro:it.rubro,estado:"Pendiente",origen:"planilla"});n++}
      UI.semana=wk;UI.progTab="suc";MF.ok=pl(n,"envío programado","envíos programados")}});
}

/* ================= eliminar ================= */
function delX(kind,id){
  const nn=(n,s,p)=>pl(n,s,p);let t,msg,fn,ok="Eliminado";
  if(kind==="salida"){const s=get("salidas",id);if(!s)return;const cs=cargasDe(s),nv=S.novedades.filter(n=>n.salidaId===id).length;
    t="Eliminar orden N° "+nro(s);msg="Se elimina la orden de carga y su hoja de ruta"+(cs.length?" con "+nn(cs.length,"zona cargada","zonas cargadas")+" y sus estados de entrega":"")+". "+(s.canal==="Sucursales"?"Los envíos programados vuelven a pendientes. ":"")+(nv?"Las "+nv+" novedades quedan sin orden vinculada. ":"")+"<b>No se puede deshacer.</b> Si solo querés dejarla sin efecto, usá «Anular».";
    fn=async()=>{for(const c of cs)await del("cargas",c.id);await deleteSal(s);if(UI.route==="hoja"&&UI.hojaId===id)location.hash="#hojas"};ok="Orden eliminada"}
  else if(kind==="novedad"){const n=get("novedades",id);t="Eliminar novedad";msg="Se elimina la novedad «"+esc(n.tipo)+"»"+(n.cliente?" de "+esc(n.cliente):"")+".";fn=()=>del("novedades",id)}
  else if(kind==="camion"){const c=get("camiones",id),u=S.salidas.filter(s=>s.camionId===id||s.acopladoId===id).length;t="Eliminar "+c.patente;msg="Se elimina el vehículo "+esc(c.patente)+" de la base."+(u?" Aparece en "+nn(u,"orden","órdenes")+": van a quedar sin vehículo. Para conservar el historial conviene ponerlo en estado «Baja».":"");fn=()=>del("camiones",id)}
  else if(kind==="chofer"){const c=get("choferes",id),u=S.salidas.filter(s=>s.choferId===id||s.cobradorId===id).length;t="Eliminar a "+c.nombre;msg="Se elimina a "+esc(c.nombre)+" de la base."+(u?" Aparece en "+nn(u,"orden","órdenes")+". Para conservar el historial conviene ponerlo «Inactivo».":"");fn=()=>del("choferes",id)}
  else if(kind==="zona"){const z=get("zonas",id),ncl=S.clientes.filter(c=>c._z===id).length;t="Eliminar "+zonaT(id);msg="Se elimina la zona"+(ncl?" y sus "+ncl+" clientes":"")+". Las hojas de ruta ya armadas no cambian.";fn=async()=>{if(S.cz.some(d=>d.id===id))await del("cz",id);await del("zonas",id)}}
  else if(kind==="sucursal"){const s=get("sucursales",id),np=S.progsuc.filter(p=>p.sucursalId===id&&p.estado==="Pendiente");t="Eliminar "+s.nombre;msg="Se elimina la sucursal"+(np.length?" y sus "+np.length+" envíos pendientes de programación":"")+".";fn=async()=>{for(const p of np)await del("progsuc",p.id);await del("sucursales",id)}}

// La base de Firestore de este proyecto se llama "default" (sin paréntesis), no "(default)".
const FIRESTORE_DATABASE_ID="default";
// Toda la hoja de ruta vive debajo de este documento, separada de entregas y monitoreo.
const RAIZ="hojaruta/datos/";
const esObj=v=>v!==null&&typeof v==="object"&&!Array.isArray(v)&&Object.getPrototypeOf(v)===Object.prototype;
// update() fusiona los objetos anidados campo por campo (como hacía la base de Claude), en vez de reemplazarlos enteros.
function caminos(obj,pre,out){Object.keys(obj).forEach(k=>{const v=obj[k],p=pre.concat(k);
  if(esObj(v)&&Object.keys(v).length)caminos(v,p,out);else if(!(esObj(v)&&pre.length))out.push(new firebase.firestore.FieldPath(...p),v)});return out}
function envolverDoc(ref){return{id:ref.id,ref,
  set:d=>ref.set(d),get:()=>ref.get(),delete:()=>ref.delete(),onSnapshot:(...a)=>ref.onSnapshot(...a),
  update:d=>{const a=caminos(d,[],[]);return a.length?ref.update(...a):Promise.resolve()}}}
function envolverCol(col){return{
  doc:id=>envolverDoc(id?col.doc(id):col.doc()),
  orderBy:(...a)=>col.orderBy(...a),limit:n=>col.limit(n),where:(...a)=>col.where(...a),onSnapshot:(...a)=>col.onSnapshot(...a),get:()=>col.get(),
  add:d=>col.add(d)}}
async function conectarFirebase(){
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  await firebase.auth().signInAnonymously();
  const app=firebase.app();
  const modular=app._delegate.container.getProvider("firestore").getImmediate({identifier:FIRESTORE_DATABASE_ID});
  const fs=new firebase.firestore.Firestore(app,modular);
  try{fs.settings({experimentalAutoDetectLongPolling:true,ignoreUndefinedProperties:true,merge:true})}catch(e){}
  return{collection:c=>envolverCol(fs.collection(RAIZ+c)),doc:p=>envolverDoc(fs.doc(RAIZ+p))};
}
function crearDownloads(){return{save:async({filename,data})=>{
  const blob=data instanceof Blob?data:new Blob([data],{type:/\.html?$/i.test(filename)?"text/html;charset=utf-8":/\.csv$/i.test(filename)?"text/csv;charset=utf-8":"application/octet-stream"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}}}
