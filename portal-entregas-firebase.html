const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* Oct. 2026: vista propia para computadora (≥ 1024 px). En celular y
   tablet chica todo sigue igual que antes. */
const MQ_ESCRITORIO = "(min-width: 1024px)";
function useEsEscritorio() {
  const [ok, setOk] = useState(() => window.matchMedia(MQ_ESCRITORIO).matches);
  useEffect(() => {
    const m = window.matchMedia(MQ_ESCRITORIO);
    const f = (e) => setOk(e.matches);
    m.addEventListener("change", f);
    return () => m.removeEventListener("change", f);
  }, []);
  return ok;
}

/* ------------------------------------------------------------------ */

function IconBase({ children, size = 24, color, strokeWidth = 2, className = "", style = {}, fill = "none" }) {
  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24"
      fill={fill} stroke={color || "currentColor"} strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round"
      className={className} style={style}
    >
      {children}
    </svg>
  );
}

function parseChoferesLineas(lineas) {
  return lineas.map((l) => {
    const [nombre, acompanante, patente] = l.split(";").map((s) => (s || "").trim());
    return { id: genId(), nombre: nombre || "Sin nombre", acompanante: acompanante || "", patente: patente || "" };
  });
}

function parseClientesLineas(lineas, zonasExistentes) {
  let zonasNuevas = [...zonasExistentes];
  const clientesNuevos = [];
  lineas.forEach((l) => {
    const [nombreZona, codigo, nombre, localidad, domicilio, telefono] = l.split(";").map((s) => (s || "").trim());
    if (!nombreZona || !nombre) return;
    let zona = zonasNuevas.find((z) => z.nombre.toLowerCase() === nombreZona.toLowerCase());
    if (!zona) {
      zona = { id: genId(), nombre: nombreZona, choferId: null, choferTexto: "" };
      zonasNuevas = [...zonasNuevas, zona];
    }
    clientesNuevos.push({
      id: genId(),
      codigo: codigo || "",
      nombre,
      localidad: localidad || "",
      domicilio: domicilio || "",
      telefono: telefono || "",
      zonaId: zona.id,
    });
  });
  return { zonasNuevas, clientesNuevos };
}

function parseImporte(raw) {
  if (raw == null) return 0;
  const s = String(raw).trim();
  if (!s) return 0;
  const cleaned = s.replace(/\./g, "").replace(",", ".").replace(/[^\d.-]/g, "");
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function formatMoney(n) {

}

function normalizarHeader(h) {
  return String(h || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
}

  localidad: ["localidad", "ciudad", "barrio"],
};

function detectarMapeoFacturas(headers) {
  const normalizados = headers.map((h) => ({ original: h, norm: normalizarHeader(h) }));
  const resultado = {};
  for (const [campo, candidatos] of Object.entries(MAPEO_CANDIDATOS_FACTURAS)) {
    const match = normalizados.find((h) => candidatos.includes(h.norm));
    if (match) resultado[campo] = match.original;
  }
  return resultado;
}

function leerArchivoExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

/** Convierte el valor crudo de una celda de Excel (número JS o texto) al formato
 *  argentino que espera parseImporte (coma decimal, sin puntos de miles). */
function formatearImporteDesdeExcel(valor) {
  if (valor == null || valor === "") return "0";
  if (typeof valor === "number") {
    if (Number.isInteger(valor)) return String(valor);
    return valor.toFixed(2).replace(".", ",");
  }
  return String(valor).trim();
}

function obtenerUbicacion() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve({ error: "no_disponible", mensaje: "Este navegador no tiene geolocalización disponible" }); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, precision: Math.round(pos.coords.accuracy || 0) }),
      (err) => {
        const motivos = { 1: "Permiso denegado", 2: "Posición no disponible", 3: "Tiempo agotado" };
        resolve({ error: motivos[err.code] || "Error desconocido", mensaje: err.message || "" });
      },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
    );
  });
}

/** Distancia en km entre dos puntos {lat, lng} (fórmula de haversine, en línea recta). */
function distanciaKm(a, b) {
  const R = 6371;
  const rad = (g) => (g * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat);
  const dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function formatKm(km) {
  return (km || 0).toLocaleString("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " km";
}

/** Busca las coordenadas de una dirección (OpenStreetMap / Nominatim, limitado a Argentina). */
async function geocodificarDireccion(domicilio, localidad) {
  const query = [domicilio, localidad].filter(Boolean).join(", ");
  if (!query) return null;
  const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q=${encodeURIComponent(query)}`);
  const datos = await resp.json();
  if (datos && datos[0]) return { lat: parseFloat(datos[0].lat), lng: parseFloat(datos[0].lon) };
  return null;
}

/** Geolocaliza una lista de clientes de a uno por segundo (límite de Nominatim).
 *  Devuelve { coords: { [clienteId]: {lat,lng} }, fallidos: [clienteId] }. */
async function geocodificarClientes(lista, onProgreso) {
  const coords = {};
  const fallidos = [];
  for (let i = 0; i < lista.length; i++) {
    const c = lista[i];
    try {
      const r = await geocodificarDireccion(c.domicilio, c.localidad);
      if (r) coords[c.id] = r; else fallidos.push(c.id);
    } catch (e) {
      fallidos.push(c.id);
    }
    if (onProgreso) onProgreso(i + 1, coords);
    if (i < lista.length - 1) await new Promise((r) => setTimeout(r, 1100));
  }
  return { coords, fallidos };
}

/** Largo total (km, línea recta) de recorrer los puntos en orden, saliendo y volviendo al origen. */
function largoRecorrido(origen, puntos, volver = true) {
  let total = 0;
  let prev = origen;
  puntos.forEach((p) => { if (prev) total += distanciaKm(prev, p); prev = p; });
  if (volver && origen && puntos.length) total += distanciaKm(puntos[puntos.length - 1], origen);
  return total;
}

/** Propuesta de orden local: vecino más cercano + mejora 2-opt. Funciona sin internet. */
function ordenarParadasLocal(origen, paradas, volver = true) {
  if (paradas.length <= 1) return [...paradas];
  const restantes = [...paradas];
  const orden = [];
  let actual = origen || restantes[0];
  while (restantes.length) {
    let mejor = 0;
    for (let i = 1; i < restantes.length; i++) {
      if (distanciaKm(actual, restantes[i]) < distanciaKm(actual, restantes[mejor])) mejor = i;
    }
    actual = restantes.splice(mejor, 1)[0];
    orden.push(actual);
  }
  // 2-opt: dar vuelta tramos mientras eso acorte el recorrido
  let mejoro = true;
  let vueltas = 0;
  let mejorLargo = largoRecorrido(origen, orden, volver);
  while (mejoro && vueltas < 50) {
    mejoro = false;
    vueltas++;
    for (let i = 0; i < orden.length - 1; i++) {
      for (let k = i + 1; k < orden.length; k++) {
        const candidato = [...orden.slice(0, i), ...orden.slice(i, k + 1).reverse(), ...orden.slice(k + 1)];
        const largo = largoRecorrido(origen, candidato, volver);
        if (largo + 1e-9 < mejorLargo) {
          orden.splice(0, orden.length, ...candidato);
          mejorLargo = largo;
          mejoro = true;
        }
      }
    }
  }
  return orden;
}

/** Propuesta de orden por calles reales (servicio OSRM), saliendo del depósito y volviendo a él.
 *  Si falla, usa el cálculo local en línea recta.
 *  paradas: [{ id, lat, lng }]. Devuelve { orden: [ids], km, metodo: "calles" | "linea_recta" }. */
async function proponerRuta(origen, paradas) {
  const volver = !!origen;
  if (!paradas.length) return { orden: [], km: 0, metodo: "linea_recta" };
  if (origen && paradas.length <= 90) {
    try {
      const puntos = [origen, ...paradas].map((p) => `${p.lng},${p.lat}`).join(";");
      const url = `https://router.project-osrm.org/trip/v1/driving/${puntos}?source=first&roundtrip=true&overview=false`;
      const resp = await fetch(url);
      const datos = await resp.json();
      if (datos.code === "Ok" && datos.waypoints && datos.trips && datos.trips[0]) {
        // waypoint_index = posición de cada punto dentro del recorrido (el 0 es el depósito)
        const conPosicion = datos.waypoints.slice(1).map((w, i) => ({ id: paradas[i].id, pos: w.waypoint_index }));
        conPosicion.sort((a, b) => a.pos - b.pos);
        return { orden: conPosicion.map((x) => x.id), km: datos.trips[0].distance / 1000, metodo: "calles" };
      }
    } catch (e) {}
  }
  const orden = ordenarParadasLocal(origen, paradas, volver);
  return { orden: orden.map((p) => p.id), km: largoRecorrido(origen, orden, volver), metodo: "linea_recta" };
}

/** Fecha de hoy en hora local (AAAA-MM-DD), para que el día no cambie a las 21 h por el horario UTC. */
function fechaLocalHoy() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

/** Suma los km de un historial de puntos GPS con el mismo criterio que usa el celular del chofer
 *  (ignora movimientos de menos de 40 m y saltos de más de 150 km/h). */
function kmDeHistorial(historial) {
  let total = 0;
  let ancla = null;
  (historial || []).forEach((p) => {
    if (!p || !p.lat) return;
    if (!ancla) { ancla = p; return; }
    const d = distanciaKm(ancla, p);
    const horas = Math.max((new Date(p.ts) - new Date(ancla.ts)) / 3600000, 1 / 3600);
    if (d / horas > 150) ancla = p;
    else if (d >= 0.04) { total += d; ancla = p; }
  });
  return total;
}

/* ------------------------------------------------------------------ */

function useDb() {
  const [db, setDb] = useState(undefined); // undefined = cargando, null = no disponible, obj = listo

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        await firebase.auth().signInAnonymously();
        // La base de Firestore de este proyecto se llama "default" (sin paréntesis),
        // no "(default)". El SDK compat no permite elegir la base por nombre, así que
        // armamos la instancia compat encima de la instancia modular de esa base.
        const app = firebase.app();
        const firestoreModular = app._delegate.container.getProvider("firestore").getImmediate({ identifier: FIRESTORE_DATABASE_ID });
        const firestoreInstance = new firebase.firestore.Firestore(app, firestoreModular);
        try {
          firestoreInstance.settings({ experimentalAutoDetectLongPolling: true, merge: true });
        } catch (settingsErr) {
          // Si ya se configuró antes (por un remount), ignoramos el error.
        }
        dbGlobal = firestoreInstance;
        if (alive) setDb(firestoreInstance);
      } catch (e) {
        console.error("Error inicializando Firebase:", e);
        if (alive) setDb(null);
      }
    })();
    return () => { alive = false; };
  }, []);

  return db;
}

/* Fotos de facturas: Firebase Storage no responde en este proyecto (plan gratis), así que
   la foto se comprime a JPEG y se guarda como texto en Firestore, en la colección FOTOS_COLECCION.
   La factura guarda fotoId = "fs:<id del documento>". Las fotos viejas (URL de Storage) siguen andando. */
const FOTOS_COLECCION = "entregas_fotos";
let dbGlobal = null;
const fotoCache = {};

async function comprimirFoto(file) {
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(Object.assign(new Error("No se pudo leer la imagen"), { code: "imagen-invalida" }));
    i.src = URL.createObjectURL(file);
  });
  let lado = 1280, calidad = 0.75, dataUrl = "";
  for (let k = 0; k < 8; k++) {
    const r = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * r);
    c.height = Math.round(img.naturalHeight * r);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    dataUrl = c.toDataURL("image/jpeg", calidad);
    if (dataUrl.length < 300000) break; // margen amplio bajo el límite de 1 MB por documento
    calidad = Math.max(0.4, calidad - 0.1);
    lado = Math.round(lado * 0.85);
  }
  URL.revokeObjectURL(img.src);
  return dataUrl;
}

function useAssets() {
  return useMemo(() => ({
    upload: async (file) => {
      if (!dbGlobal) throw Object.assign(new Error("Sin base de datos"), { code: "sin-conexion" });
      const dataUrl = await comprimirFoto(file);
      const ref = dbGlobal.collection(FOTOS_COLECCION).doc();
      await ref.set({ img: dataUrl, ts: Date.now() });
      fotoCache[ref.id] = dataUrl;
      return { id: "fs:" + ref.id };
    },
  }), []);
}

/** Devuelve la imagen lista para <img src>: lee de Firestore si es "fs:<id>", o usa la URL tal cual. */
function useFotoSrc(fotoId) {
  const esFs = typeof fotoId === "string" && fotoId.startsWith("fs:");
  const id = esFs ? fotoId.slice(3) : null;
  const [src, setSrc] = useState(esFs ? (fotoCache[id] || null) : fotoId);
  useEffect(() => {
    if (!esFs) { setSrc(fotoId); return; }
    if (fotoCache[id]) { setSrc(fotoCache[id]); return; }
    let alive = true;
    (async () => {
      try {
        const snap = await dbGlobal.collection(FOTOS_COLECCION).doc(id).get();
        const img = snap.exists ? snap.data().img : null;
        if (img) fotoCache[id] = img;
        if (alive) setSrc(img);
      } catch (e) {
        if (alive) setSrc(null);
      }
    })();
    return () => { alive = false; };
  }, [fotoId]);
  return src;
}

/** Abre la foto en una pestaña nueva (las fotos en Firestore son data URLs y no se pueden abrir como link). */
function abrirFoto(src) {
  const w = window.open("", "_blank");
  if (w) w.document.write(`<title>Foto factura</title><body style="margin:0;background:#000"><img src="${src}" style="max-width:100%;display:block;margin:auto"></body>`);
}

function FotoFactura({ fotoId, className, linkClassName, alt }) {
  const src = useFotoSrc(fotoId);
  if (!src) return <span className={linkClassName} style={{ fontSize: 12, color: "var(--slate)" }}>Cargando foto...</span>;
  return (
    <button type="button" onClick={() => abrirFoto(src)} className={linkClassName} style={{ padding: 0, border: 0, background: "none", cursor: "zoom-in" }}>
      <img src={src} alt={alt} className={className} style={{ border: "1px solid var(--line)" }} />
    </button>
  );
}

/** Un documento único que guarda un array bajo la clave "list" (choferes, zonas). */
function useDbListDoc(db, path) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (db === undefined) return;
    if (!db) { setLoading(false); return; }
    const ref = db.doc(path);
    const unsub = ref.onSnapshot(
      (snap) => {
        const body = snap.exists ? snap.data() : null;
        setData((body && body.list) || []);
        setLoading(false);
      },
      () => setLoading(false)
    );
    return () => unsub();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [db, path]);

  const setter = useCallback(async (nextArray) => {
    if (!db) return false;
    for (let i = 0; i < 3; i++) {
      try {
        await db.doc(path).set({ list: nextArray });
        return true;
      } catch (e) {
        console.error("Error guardando en Firestore:", e);
        ultimoErrorDb = { codigo: (e && (e.code || e.name)) || "desconocido", mensaje: (e && e.message) || String(e) };
        if (i === 2) return false;
        await new Promise((r) => setTimeout(r, 400 * (i + 1)));
      }
    }
    return false;
  }, [db, path]);

  return [data, setter, loading];
}

/** Una colección con un documento por zona, cada uno con { zonaId, list: [...] } —
 *  se aplana a un solo array plano (clientes o facturas), igual que antes. */
function useDbShardedByZona(db, collectionPath) {
  const [porZona, setPorZona] = useState({});
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (db === undefined) return;
    if (!db) { setLoading(false); return; }
    const unsub = db.collection(collectionPath).onSnapshot(
      (snap) => {
        const nuevo = {};
        snap.docs.forEach((d) => {
          const body = d.data() || {};
          nuevo[d.id] = body.list || [];
        });
        setPorZona(nuevo);
        setLoading(false);
      },
      () => setLoading(false)
    );
    return () => unsub();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [db, collectionPath]);

  const data = useMemo(() => Object.values(porZona).flat(), [porZona]);

  const setter = useCallback(async (nextArrayCompleto) => {
    if (!db) return false;
    const nuevosPorZona = {};
    nextArrayCompleto.forEach((item) => {
      const zid = item.zonaId || "sin_zona";
      if (!nuevosPorZona[zid]) nuevosPorZona[zid] = [];
      nuevosPorZona[zid].push(item);
    });
    const zonasAfectadas = new Set([...Object.keys(porZona), ...Object.keys(nuevosPorZona)]);
    const col = db.collection(collectionPath);

    const escribirConReintento = async (zid, intentos = 3) => {
      const cuerpo = { zonaId: zid, list: nuevosPorZona[zid] || [] };
      const cuerpoTexto = JSON.stringify(cuerpo);
      for (let i = 0; i < intentos; i++) {
        try {
          await col.doc(zid).set(cuerpo);
          return true;
        } catch (e) {
          console.error("Error guardando en Firestore (sharded):", e);
          ultimoErrorDb = {
            codigo: (e && (e.code || e.name)) || "desconocido",
            mensaje: (e && e.message) || String(e),
            tam: `${cuerpoTexto.length}b / ${(cuerpo.list || []).length} items / zonas afectadas: ${zonasAfectadas.size}`,
          };
          if (i === intentos - 1) return false;
          await new Promise((r) => setTimeout(r, 400 * (i + 1)));
        }
      }
      return false;
    };

    const resultados = await Promise.all(Array.from(zonasAfectadas).map((zid) => escribirConReintento(zid)));
    return resultados.every(Boolean);
  }, [db, collectionPath, porZona]);

  return [data, setter, loading];
}

/** Colección con un documento por registro (no shardeada), ordenada por fecha. Para combustible. */
function useDbCollectionLive(db, path, limitN = 300) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (db === undefined) return;
    if (!db) { setLoading(false); return; }
    const unsub = db.collection(path).orderBy("fecha", "desc").limit(limitN).onSnapshot(
      (snap) => {
        setData(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        setLoading(false);
      },
      () => setLoading(false)
    );
    return () => unsub();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [db, path, limitN]);

  return [data, loading];
}

function CombustibleModal({ db, choferId, vehiculoId, onCerrar }) {
  const [litros, setLitros] = useState("");
  const [importe, setImporte] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState(null);

  const guardar = async () => {
    if (!litros.trim()) { setError("Ingresá los litros cargados."); return; }
    setGuardando(true);
    setError(null);
    try {
      const ubicacion = await obtenerUbicacion();
      await db.collection("combustible").add({
        choferId,
        vehiculoId: vehiculoId || null,
        litros: litros.trim(),
        importe: importe.trim() || "0",

      setError("No se pudo guardar. Probá de nuevo.");

    }

  return (

          style={{ borderColor: "var(--line)" }}
        />

        <label className="text-xs font-semibold" style={{ color: "var(--slate)" }}>Importe (opcional)</label>
        <input
          value={importe}
          onChange={(e) => setImporte(e.target.value)}
          placeholder="85000"

        <button
          disabled={guardando}
          onClick={guardar}
          className="de-focus w-full mt-5 py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2"
          style={{ background: "var(--amber)", color: "white", opacity: guardando ? 0.7 : 1 }}
        >
          {guardando ? <><Loader2 size={16} className="animate-spin" /> Guardando...</> : "Guardar carga"}
        </button>
      </div>
    </div>
  );
}

/* Modal de reinicio total (mismo comportamiento de siempre). */
function AdminResetModal({ db, onCancelar }) {
  return (
        <ConfirmModal
          mensaje="Esto borra TODOS los datos (choferes, zonas, clientes y facturas) y vuelve a cargar los datos de fábrica. ¿Continuar?"
          textoConfirmar="Sí, reiniciar"
          onCancelar={onCancelar}
          onConfirmar={async () => {
            try {
              await db.doc("meta/choferes").delete();
              await db.doc("meta/zonas").delete();
              const colClientes = db.collection("clientes_por_zona");
              const colFacturas = db.collection("facturas_por_zona");
              const colUbic = db.collection("ubicaciones");
              const [snapCl, snapFa, snapUb] = await Promise.all([
                colClientes.get(), colFacturas.get(), colUbic.get()
              ]);
              await Promise.all([
                ...snapCl.docs.map((d) => colClientes.doc(d.id).delete()),
                ...snapFa.docs.map((d) => colFacturas.doc(d.id).delete()),
                ...snapUb.docs.map((d) => colUbic.doc(d.id).delete()),
              ]);
            } catch (e) {}
            window.location.reload();
          }}
        />
  );
}

function ResumenTab({ choferes, zonas, facturas }) {

  const entregadas = facturas.filter((f) => f.estado === "entregado").length;
  const pendientes = total - entregadas;
  const importeTotal = facturas.reduce((s, f) => s + parseImporte(f.importe), 0);
  const importeEntregado = facturas.filter((f) => f.estado === "entregado").reduce((s, f) => s + parseImporte(f.importe), 0);

  const porZona = zonas.map((z) => {
    const fz = facturas.filter((f) => f.zonaId === z.id);
    const ent = fz.filter((f) => f.estado === "entregado").length;

            <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>{k.label}</p>
            <p className="de-display text-3xl font-bold mt-1" style={{ color: k.color }}>{k.value}</p>

          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>Importe total cargado</p>

  );

function ClientesTab({ clientes, setClientes, zonas, setZonas }) {
  const [text, setText] = useState("");
  const [filtroZona, setFiltroZona] = useState("todas");
  const [editandoTel, setEditandoTel] = useState(null);
  const [telTemp, setTelTemp] = useState("");
  const [editandoDom, setEditandoDom] = useState(null);
  const [domTemp, setDomTemp] = useState("");
  const [archivoNombre, setArchivoNombre] = useState("");
  const [filasExcel, setFilasExcel] = useState(null);
  const [mapeoExcel, setMapeoExcel] = useState(null);
  const [errorExcel, setErrorExcel] = useState(null);
  const [procesandoExcel, setProcesandoExcel] = useState(false);
  const [resultadoImport, setResultadoImport] = useState(null);

  const cargar = () => {
    const lineas = text.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lineas.length) return;

    const { zonasNuevas, clientesNuevos } = parseClientesLineas(lineas, zonas);

    if (zonasNuevas.length !== zonas.length) setZonas(zonasNuevas);
    if (clientesNuevos.length) setClientes([...clientes, ...clientesNuevos]);
    setText("");
  };

  const manejarArchivoClientes = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setErrorExcel(null);
    setFilasExcel(null);
    setMapeoExcel(null);
    setResultadoImport(null);
    setProcesandoExcel(true);
    try {
      const buffer = await leerArchivoExcel(file);
      const workbook = XLSX.read(buffer, { type: "array" });
      const primeraHoja = workbook.SheetNames[0];
      const filas = XLSX.utils.sheet_to_json(workbook.Sheets[primeraHoja], { defval: "" });
      if (!filas.length) {
        setErrorExcel("El archivo no tiene filas de datos.");
        setProcesandoExcel(false);
        return;
      }
      const headers = Object.keys(filas[0]);
      const mapeo = detectarMapeoFacturas(headers); // reutiliza el mismo detector (código, cliente, domicilio, localidad, teléfono)
      if (!mapeo.cliente && !mapeo.codigo) {
        setErrorExcel(`No pude identificar la columna de nombre del cliente. Columnas encontradas: ${headers.join(", ")}.`);
        setProcesandoExcel(false);
        return;
      }
      setArchivoNombre(file.name);
      setFilasExcel(filas);
      setMapeoExcel(mapeo);
    } catch (err) {
      setErrorExcel("No se pudo leer el archivo. Verificá que sea un .xlsx o .xls válido.");
    }
    setProcesandoExcel(false);
  };

  const confirmarImportClientesExcel = () => {
    if (!filasExcel || !mapeoExcel) return;
    const zonaDefault = zonas[0]?.id || null;
    let clientesActualizados = [...clientes];
    let creados = 0;
    let actualizados = 0;

    filasExcel.forEach((fila) => {
      const codigoRaw = mapeoExcel.codigo ? String(fila[mapeoExcel.codigo] || "").trim() : "";
      const nombreRaw = mapeoExcel.cliente ? String(fila[mapeoExcel.cliente] || "").trim() : "";
      const domicilioRaw = mapeoExcel.domicilio ? String(fila[mapeoExcel.domicilio] || "").trim() : "";
      const localidadRaw = mapeoExcel.localidad ? String(fila[mapeoExcel.localidad] || "").trim() : "";
      const telefonoRaw = mapeoExcel.telefono ? String(fila[mapeoExcel.telefono] || "").trim() : "";
      const nombre = nombreRaw || codigoRaw;
      if (!nombre) return;

      let match = codigoRaw
        ? clientesActualizados.find((c) => c.codigo && c.codigo.toLowerCase() === codigoRaw.toLowerCase())
        : null;
      if (!match) {
        match = clientesActualizados.find((c) => c.nombre.trim().toLowerCase() === nombre.trim().toLowerCase());
      }

      if (!match) {
        const nuevo = {
          id: genId(),
          codigo: codigoRaw || "",
          nombre,
          localidad: localidadRaw || "",
          domicilio: domicilioRaw || "",
          telefono: telefonoRaw || "",
          zonaId: zonaDefault,
        };
        clientesActualizados = [...clientesActualizados, nuevo];
        creados++;
      } else {
        const cambios = {};
        if (domicilioRaw) cambios.domicilio = domicilioRaw;
        if (localidadRaw) cambios.localidad = localidadRaw;
        if (telefonoRaw) cambios.telefono = telefonoRaw;
        if (codigoRaw && !match.codigo) cambios.codigo = codigoRaw;
        if ((cambios.domicilio && cambios.domicilio !== match.domicilio) || (cambios.localidad && cambios.localidad !== match.localidad)) {
          Object.assign(cambios, { lat: null, lng: null, geoFallo: false });
        }
        if (Object.keys(cambios).length) {
          clientesActualizados = clientesActualizados.map((c) => c.id === match.id ? { ...c, ...cambios } : c);
          actualizados++;
        }
      }
    });

    setClientes(clientesActualizados);
    setResultadoImport(`Listo: ${creados} clientes nuevos, ${actualizados} actualizados.`);
    setFilasExcel(null);
    setMapeoExcel(null);
    setArchivoNombre("");
  };

  const cancelarImportClientesExcel = () => {
    setFilasExcel(null);
    setMapeoExcel(null);
    setArchivoNombre("");
    setErrorExcel(null);
  };

  const eliminar = (id) => setClientes(clientes.filter((c) => c.id !== id));

  const guardarTelefono = (id) => {
    setClientes(clientes.map((c) => c.id === id ? { ...c, telefono: telTemp.trim() } : c));
    setEditandoTel(null);
    setTelTemp("");
  };

  const guardarDomicilio = (id) => {
    // Si cambia el domicilio, se borra la ubicación vieja para que se vuelva a geolocalizar.
    setClientes(clientes.map((c) => c.id === id ? { ...c, domicilio: domTemp.trim(), ...(c.domicilio !== domTemp.trim() ? { lat: null, lng: null, geoFallo: false } : {}) } : c));
    setEditandoDom(null);
    setDomTemp("");
  };

  const visibles = filtroZona === "todas" ? clientes : clientes.filter((c) => c.zonaId === filtroZona);

  return (
    <div className="space-y-5">
      <Card>
        <p className="de-display font-semibold mb-1">📤 Carga masiva del maestro de clientes</p>
        <p className="text-sm mb-3" style={{ color: "var(--slate)" }}>
          Subí tu base completa (código, nombre, dirección, localidad, teléfono). Si el cliente ya existe, se actualiza; si no, se crea. La app detecta las columnas sola.
        </p>
        <label
          className="de-focus flex items-center justify-center gap-2 w-full py-3 rounded-xl text-sm font-semibold cursor-pointer"
          style={{ background: "var(--paper)", border: "2px dashed var(--line)", color: "var(--route)" }}
        >
          {procesandoExcel ? (
            <><Loader2 size={16} className="animate-spin" /> Leyendo archivo...</>
          ) : (
            <><Store size={16} /> Elegir archivo Excel (.xlsx)</>
          )}
          <input type="file" accept=".xlsx,.xls,.csv" onChange={manejarArchivoClientes} className="hidden" />
        </label>

        {errorExcel && (
          <div className="mt-3 p-3 rounded-xl text-xs" style={{ background: "var(--danger-soft)", color: "var(--danger)" }}>
            {errorExcel}
          </div>
        )}

        {resultadoImport && (
          <div className="mt-3 p-3 rounded-xl text-xs" style={{ background: "var(--teal-soft)", color: "var(--teal)" }}>
            {resultadoImport}
          </div>
        )}

        {filasExcel && mapeoExcel && (
          <div className="mt-4">
            <p className="text-sm font-semibold mb-1">{archivoNombre} · {filasExcel.length} filas detectadas</p>
            <div className="text-xs mb-3 space-y-0.5" style={{ color: "var(--slate)" }}>
              <p>Columnas identificadas:</p>
              <ul className="de-mono">
                {mapeoExcel.codigo && <li>Código: "{mapeoExcel.codigo}"</li>}
                {mapeoExcel.cliente && <li>Nombre: "{mapeoExcel.cliente}"</li>}
                {mapeoExcel.domicilio && <li>Domicilio: "{mapeoExcel.domicilio}"</li>}
                {mapeoExcel.localidad && <li>Localidad: "{mapeoExcel.localidad}"</li>}
                {mapeoExcel.telefono && <li>Teléfono: "{mapeoExcel.telefono}"</li>}
              </ul>

                    <p className="text-xs de-mono mt-0.5" style={{ color: "var(--slate)" }}>

                        <button onClick={() => guardarDomicilio(c.id)} className="de-focus text-xs font-semibold px-2 py-1 rounded-lg" style={{ background: "var(--teal)", color: "white" }}>Ok</button>
                        <button onClick={() => setEditandoDom(null)} className="de-focus text-xs px-1" style={{ color: "var(--slate)" }}>x</button>

                      <button
                        onClick={() => { setEditandoDom(c.id); setDomTemp(c.domicilio || ""); }}

                    {editandoTel === c.id ? (
                      <div className="flex items-center gap-1.5 mt-1.5">
                        <input
                          value={telTemp}
                          onChange={(e) => setTelTemp(e.target.value)}

                        <button onClick={() => guardarTelefono(c.id)} className="de-focus text-xs font-semibold px-2 py-1 rounded-lg" style={{ background: "var(--teal)", color: "white" }}>Ok</button>
                        <button onClick={() => setEditandoTel(null)} className="de-focus text-xs px-1" style={{ color: "var(--slate)" }}>x</button>
                      </div>
                    ) : (
                      <button
                        onClick={() => { setEditandoTel(c.id); setTelTemp(c.telefono || ""); }}
                        className="de-focus text-xs de-mono mt-1"
                        style={{ color: c.telefono ? "var(--teal)" : "var(--amber)" }}
                      >
                        {c.telefono ? `📱 ${c.telefono}` : "+ agregar teléfono"}
                      </button>
                    )}
                  </div>
                  <button onClick={() => eliminar(c.id)} className="de-focus p-2 rounded-lg shrink-0" style={{ color: "var(--danger)" }}>
                    <Trash2 size={15} />
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </Card>
    </div>
  );
}

function ResumenDiaTab({ db, choferes, zonas, setZonas, facturas, setFacturas }) {
  const [confirmandoCierre, setConfirmandoCierre] = useState(false);
  const [cerrando, setCerrando] = useState(false);
  const [cerrado, setCerrado] = useState(null);
  const [ubicaciones, setUbicaciones] = useState({});
  // Fecha con la que se guarda el cierre: arranca en hoy, pero se puede cambiar antes de cerrar.
  const [fechaDia, setFechaDia] = useState(fechaLocalHoy());

  // Recorrido GPS de los choferes (se actualiza en vivo mientras están en la calle)
  useEffect(() => {
    if (!db) return;
    const unsub = db.collection("ubicaciones").onSnapshot(
      (snap) => {
        const nuevo = {};
        snap.docs.forEach((d) => { nuevo[d.id] = d.data(); });
        setUbicaciones(nuevo);
      },
      () => {}
    );
    return () => unsub();
  }, [db]);

  const zona = zonas[0];
  const facturasZona = zona ? facturas.filter((f) => f.zonaId === zona.id) : [];
  const entregadas = facturasZona.filter((f) => f.estado === "entregado");
  const pendientes = facturasZona.filter((f) => f.estado === "pendiente");
  const importeTotal = facturasZona.reduce((s, f) => s + parseImporte(f.importe), 0);
  const importeEntregado = entregadas.reduce((s, f) => s + parseImporte(f.importe), 0);

  // Km de hoy por chofer: si la zona tiene chofer asignado, solo ese; si no, todos los que salieron hoy.
  const hoy = fechaLocalHoy();
  const kmPorChofer = Object.entries(ubicaciones)
    .filter(([choferId, u]) => u && u.fecha === hoy && (!zona?.choferId || zona.choferId === choferId))
    .map(([choferId, u]) => {
      const kmTotalesHoy = u.kmRecorridos != null ? u.kmRecorridos : kmDeHistorial(u.historial);
      const km = Math.max(0, kmTotalesHoy - (u.kmYaCerrados || 0));
      const chofer = choferes.find((c) => c.id === choferId);
      return { choferId, nombre: chofer ? chofer.nombre : "Chofer", km: Math.round(km * 10) / 10, kmTotalesHoy };
    })
    .sort((a, b) => b.km - a.km);
  const kmTotal = Math.round(kmPorChofer.reduce((s, x) => s + x.km, 0) * 10) / 10;

  const cerrarDia = async () => {
    setCerrando(true);
    const fechaCierre = fechaDia || fechaLocalHoy();
    const resumen = {
      fecha: fechaCierre,
      zonaId: zona.id,
      zonaNombre: zona.nombre,
      total: facturasZona.length,
      entregadas: entregadas.length,
      pendientes: pendientes.length,
      importeTotal,
      importeEntregado,
      kmRecorridos: kmTotal,
      kmEstimados: zona.kmEstimados || null,
      kmPorChofer: kmPorChofer.map(({ choferId, nombre, km }) => ({ choferId, nombre, km })),
      facturas: facturasZona,
    };

    try {
      if (db) {
        await db.collection("historial_dias").doc(`${zona.id}_${fechaCierre}_${genId()}`).set(resumen);
        // Marcamos los km como ya informados, para que si se cierra otra vez hoy no se cuenten dos veces.
        await Promise.all(kmPorChofer.map((x) =>
          db.doc(`ubicaciones/${x.choferId}`).set({ kmYaCerrados: x.kmTotalesHoy }, { merge: true }).catch(() => {})
        ));
      }
    } catch (e) {}

    // Solo sacamos de la lista activa las que YA se entregaron (quedan archivadas en el historial).
    // Las pendientes se quedan activas para que se puedan seguir entregando y replanificando.
    setFacturas(facturas.filter((f) => !(f.zonaId === zona.id && f.estado === "entregado")));
    setZonas(zonas.map((z) => z.id === zona.id ? { ...z, rutaConfirmada: false, rutaFecha: null, kmEstimados: null } : z));

    setCerrando(false);
    setConfirmandoCierre(false);
    setCerrado(resumen);
  };

  if (cerrado) {
    return (
      <Card>
        <div className="text-center py-4">
          <CheckCircle2 size={32} style={{ color: "var(--teal)", margin: "0 auto 10px" }} />
          <p className="de-display font-bold mb-1">Día cerrado · {new Date(cerrado.fecha + "T00:00:00").toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" })}</p>
          <p className="text-sm mb-4" style={{ color: "var(--slate)" }}>
            {cerrado.entregadas} entregadas de {cerrado.total} · {formatMoney(cerrado.importeEntregado)} cobrado
          </p>
          <div className="rounded-xl p-4 mb-4" style={{ background: "var(--paper)" }}>
            <p className="text-xs font-semibold uppercase" style={{ color: "var(--slate)" }}>Kilómetros recorridos</p>
            <p className="de-display text-3xl font-bold" style={{ color: "var(--route)" }}>{formatKm(cerrado.kmRecorridos)}</p>
            {cerrado.kmPorChofer.length > 1 && (
              <div className="mt-2 space-y-0.5 text-xs" style={{ color: "var(--slate)" }}>
                {cerrado.kmPorChofer.map((x) => <p key={x.choferId}>{x.nombre}: <b>{formatKm(x.km)}</b></p>)}
              </div>
            )}
            {cerrado.kmEstimados ? (
              <p className="text-xs mt-1" style={{ color: "var(--slate)" }}>La ruta propuesta estimaba ~{formatKm(cerrado.kmEstimados)}</p>
            ) : null}
            {cerrado.kmPorChofer.length === 0 && (
              <p className="text-xs mt-1" style={{ color: "var(--amber)" }}>No hubo datos de GPS de los choferes hoy.</p>
            )}
          </div>
          <p className="text-xs" style={{ color: "var(--slate)" }}>
            Ya podés cargar el Excel del próximo día en la pestaña Facturas. Este resumen quedó guardado en Administración → Historial.
          </p>
        </div>
      </Card>
    );
  }

  return (
    <div className="space-y-5">
      <Card>
        <p className="de-display font-semibold mb-3">Resumen de hoy</p>
        <div className="grid grid-cols-2 gap-3 mb-2">
          <div className="rounded-xl p-3" style={{ background: "var(--paper)" }}>
            <p className="text-xs font-semibold uppercase" style={{ color: "var(--slate)" }}>Entregadas</p>
            <p className="de-display text-2xl font-bold" style={{ color: "var(--teal)" }}>{entregadas.length}<span className="text-sm font-normal" style={{ color: "var(--slate)" }}>/{facturasZona.length}</span></p>
          </div>
          <div className="rounded-xl p-3" style={{ background: "var(--paper)" }}>
            <p className="text-xs font-semibold uppercase" style={{ color: "var(--slate)" }}>Pendientes</p>
            <p className="de-display text-2xl font-bold" style={{ color: "var(--amber)" }}>{pendientes.length}</p>
          </div>
        </div>
        <div className="rounded-xl p-3" style={{ background: "var(--paper)" }}>
          <p className="text-xs font-semibold uppercase" style={{ color: "var(--slate)" }}>Cobrado / total</p>
          <p className="de-mono font-semibold">{formatMoney(importeEntregado)} <span style={{ color: "var(--slate)" }}>de {formatMoney(importeTotal)}</span></p>
        </div>
        <div className="rounded-xl p-3 mt-3" style={{ background: "var(--paper)" }}>
          <p className="text-xs font-semibold uppercase" style={{ color: "var(--slate)" }}>Km recorridos hoy (GPS, en vivo)</p>
          <p className="de-display text-2xl font-bold" style={{ color: "var(--route)" }}>
            {formatKm(kmTotal)}
            {zona?.kmEstimados ? <span className="text-sm font-normal" style={{ color: "var(--slate)" }}> · estimado ~{formatKm(zona.kmEstimados)}</span> : null}
          </p>
          {kmPorChofer.length > 1 && (
            <div className="mt-1 space-y-0.5 text-xs" style={{ color: "var(--slate)" }}>
              {kmPorChofer.map((x) => <p key={x.choferId}>{x.nombre}: <b>{formatKm(x.km)}</b></p>)}
            </div>
          )}
          {kmPorChofer.length === 0 && (
            <p className="text-xs mt-0.5" style={{ color: "var(--slate)" }}>Todavía no hay recorrido de GPS de hoy. Se mide solo mientras el chofer tiene la app abierta.</p>
          )}
        </div>
      </Card>

      <Card>
        <p className="de-display font-semibold mb-1">Cerrar el día</p>
        <p className="text-sm mb-4" style={{ color: "var(--slate)" }}>
          Esto guarda un resumen del día (con el detalle de cada factura) en el historial, y saca de la lista activa las que ya se entregaron. Las que quedaron pendientes NO se borran: siguen activas para que las puedas entregar y replanificar más adelante, junto con lo que cargues después.
        </p>
        {pendientes.length > 0 && (
          <p className="text-xs mb-3" style={{ color: "var(--danger)" }}>
            ℹ️ Todavía quedan {pendientes.length} facturas sin entregar. Quedan registradas en el historial de hoy, pero van a seguir activas (no se borran) para que las puedas entregar y reordenar en los próximos días.
          </p>
        )}
        <label htmlFor="fecha-cierre" className="block text-xs font-semibold uppercase mb-1" style={{ color: "var(--slate)" }}>Fecha del día que cerrás</label>
        <div className="flex items-center gap-2 mb-3">
          <input
            id="fecha-cierre"
            type="date"
            value={fechaDia}
            max={fechaLocalHoy()}
            onChange={(e) => e.target.value && setFechaDia(e.target.value)}
            className="de-focus de-mono text-sm rounded-xl p-2.5 border"
            style={{ borderColor: "var(--line)", background: "var(--card)" }}
          />
          {fechaDia !== fechaLocalHoy() && (
            <button onClick={() => setFechaDia(fechaLocalHoy())} className="de-focus text-xs font-semibold" style={{ color: "var(--route)" }}>Volver a hoy</button>
          )}
        </div>
        {fechaDia !== fechaLocalHoy() && (
          <p className="text-xs mb-3" style={{ color: "var(--amber)" }}>El cierre se va a guardar con fecha {new Date(fechaDia + "T00:00:00").toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" })}, no con la de hoy.</p>
        )}
        <button
          onClick={() => setConfirmandoCierre(true)}
          disabled={facturasZona.length === 0}
          className="de-focus w-full py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2"
          style={{ background: facturasZona.length === 0 ? "var(--line)" : "var(--route)", color: "white" }}
        >
          <CheckCircle2 size={17} /> Cerrar el día
        </button>
      </Card>

      {confirmandoCierre && (
        <ConfirmModal
          mensaje={`¿Cerrar el día ${new Date(fechaDia + "T00:00:00").toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" })} con ${entregadas.length} entregadas, ${pendientes.length} pendientes y ${formatKm(kmTotal)} recorridos? Se guarda el resumen y se archivan las entregadas. Las ${pendientes.length} pendientes se mantienen activas para seguir trabajándolas.`}
          textoConfirmar={cerrando ? "Cerrando..." : "Sí, cerrar el día"}
          onCancelar={() => setConfirmandoCierre(false)}
          onConfirmar={cerrarDia}
        />
      )}
    </div>
  );
}

function RutaTab({ zonas, setZonas, facturas, clientes, setClientes, deposito, setDeposito }) {
  const [zonaId, setZonaId] = useState(zonas[0]?.id || "");
  const [geocodificando, setGeocodificando] = useState(false);
  const [progresoGeo, setProgresoGeo] = useState(0);
  const [avisoGeo, setAvisoGeo] = useState(null);
  const [editandoDeposito, setEditandoDeposito] = useState(false);
  const [direccionDeposito, setDireccionDeposito] = useState(deposito?.direccion || "");
  const [guardandoDeposito, setGuardandoDeposito] = useState(false);
  const [errorDeposito, setErrorDeposito] = useState(null);
  const [proponiendo, setProponiendo] = useState(null); // texto de estado mientras arma la propuesta
  const [propuesta, setPropuesta] = useState(null); // { km, metodo, sinUbicacion }

  const clientesRef = useRef(clientes);
  useEffect(() => { clientesRef.current = clientes; }, [clientes]);

  const guardarDepositoDireccion = async () => {
    if (!direccionDeposito.trim()) return;
    setGuardandoDeposito(true);
    setErrorDeposito(null);
    try {
      const r = await geocodificarDireccion(direccionDeposito.trim(), "");
      if (r) {
        await setDeposito({ direccion: direccionDeposito.trim(), lat: r.lat, lng: r.lng });
        setEditandoDeposito(false);
      } else {
        setErrorDeposito("No encontré esa dirección. Probá escribiéndola con calle, número y localidad (ej: Av. San Martín 1234, Rosario).");
      }
    } catch (e) {
      setErrorDeposito("No se pudo buscar la dirección. Revisá la conexión.");
    }
    setGuardandoDeposito(false);
  };

  const usarUbicacionActualComoDeposito = async () => {
    setGuardandoDeposito(true);
    setErrorDeposito(null);
    const u = await obtenerUbicacion();
    if (u && u.lat) {
      await setDeposito({ direccion: direccionDeposito.trim() || "Ubicación tomada con el GPS", lat: u.lat, lng: u.lng });
      setEditandoDeposito(false);
    } else {
      setErrorDeposito(`No se pudo obtener la ubicación (${u?.error || "error"}).`);
    }
    setGuardandoDeposito(false);
  };

  useEffect(() => {
    if (!zonaId && zonas.length) setZonaId(zonas[0].id);
  }, [zonas]);

  const zona = zonas.find((z) => z.id === zonaId);

  const coincideCliente = (f, c) => (c.codigo && f.clienteCodigo) ? f.clienteCodigo.toLowerCase() === c.codigo.toLowerCase() : f.cliente.trim().toLowerCase() === c.nombre.trim().toLowerCase();

  const clientesConPendientes = clientes
    .filter((c) => c.zonaId === zonaId)
    .filter((c) => facturas.some((f) => f.zonaId === zonaId && f.estado === "pendiente" && coincideCliente(f, c)));

  const ordenados = [...clientesConPendientes].sort((a, b) => (a.orden ?? 9999) - (b.orden ?? 9999));

  const aplicarNuevoOrden = (nuevoArreglo) => {
    const actualizados = nuevoArreglo.map((c, i) => ({ ...c, orden: i }));
    const idsActualizados = new Set(actualizados.map((c) => c.id));
    const resto = clientesRef.current.filter((c) => !idsActualizados.has(c.id));
    const nuevos = [...resto, ...actualizados];
    clientesRef.current = nuevos;
    setClientes(nuevos);
  };

  const mover = (index, dir) => {
    const j = index + dir;
    if (j < 0 || j >= ordenados.length) return;
    const nuevo = [...ordenados];
    [nuevo[index], nuevo[j]] = [nuevo[j], nuevo[index]];
    aplicarNuevoOrden(nuevo);
  };

  const irAPosicion = (index, nuevaPosicionInput) => {
    const nuevaPosicion = Math.max(1, Math.min(ordenados.length, parseInt(nuevaPosicionInput, 10) || 1)) - 1;
    if (nuevaPosicion === index) return;
    const nuevo = [...ordenados];
    const [item] = nuevo.splice(index, 1);
    nuevo.splice(nuevaPosicion, 0, item);
    aplicarNuevoOrden(nuevo);
  };

  /** Geolocaliza los clientes de la lista que no tienen coordenadas y devuelve la lista con lat/lng. */
  const completarUbicaciones = async (lista, reintentarFallidos) => {
    const aBuscar = lista.filter((c) => !c.lat && (reintentarFallidos || !c.geoFallo) && (c.domicilio || c.localidad));
    if (!aBuscar.length) return { lista, fallidos: [] };
    setProgresoGeo(0);
    const { coords, fallidos } = await geocodificarClientes(aBuscar, (hechos) => {
      setProgresoGeo(hechos);
      setProponiendo(`Ubicando clientes en el mapa ${hechos}/${aBuscar.length}...`);
    });
    const fallidosSet = new Set(fallidos);
    if (Object.keys(coords).length || fallidos.length) {
      const nuevos = clientesRef.current.map((c) => coords[c.id] ? { ...c, ...coords[c.id], geoFallo: false } : fallidosSet.has(c.id) ? { ...c, geoFallo: true } : c);
      clientesRef.current = nuevos;
      await setClientes(nuevos);
    }
    return { lista: lista.map((c) => coords[c.id] ? { ...c, ...coords[c.id] } : c), fallidos };
  };

  const proponerRutaAutomatica = async () => {
    setPropuesta(null);
    setAvisoGeo(null);
    setProponiendo("Preparando...");
    const { lista } = await completarUbicaciones(ordenados, true);
    const conUbicacion = lista.filter((c) => c.lat && c.lng);
    const sinUbicacion = lista.filter((c) => !(c.lat && c.lng));
    if (!conUbicacion.length) {
      setProponiendo(null);
      setAvisoGeo("No pude ubicar a ningún cliente en el mapa, así que no puedo proponer un orden. Revisá que tengan domicilio y localidad cargados.");
      return;
    }
    setProponiendo("Calculando el mejor recorrido...");
    const origen = deposito && deposito.lat ? { lat: deposito.lat, lng: deposito.lng } : null;
    const r = await proponerRuta(origen, conUbicacion.map((c) => ({ id: c.id, lat: c.lat, lng: c.lng })));
    const porId = Object.fromEntries(lista.map((c) => [c.id, c]));
    // Los que tienen ubicación van en el orden propuesto; los que no, quedan al final para ubicarlos a mano.
    aplicarNuevoOrden([...r.orden.map((id) => porId[id]), ...sinUbicacion]);
    setZonas(zonas.map((z) => z.id === zonaId ? { ...z, kmEstimados: Math.round(r.km * 10) / 10 } : z));
    setPropuesta({ km: r.km, metodo: r.metodo, sinUbicacion: sinUbicacion.length, sinDeposito: !origen });
    setProponiendo(null);
  };

  const marcarArmada = async () => {
    setGeocodificando(true);
    const { fallidos } = await completarUbicaciones(ordenados, false);
    if (fallidos.length) {
      setAvisoGeo(`${fallidos.length} paradas no se pudieron ubicar en el mapa; quedaron con el link manual a la dirección.`);
    }
    setGeocodificando(false);
    setZonas(zonas.map((z) => z.id === zonaId ? { ...z, rutaConfirmada: true, rutaFecha: new Date().toISOString().slice(0, 10) } : z));
  };

  /** Link a Google Maps con todo el recorrido (depósito → paradas → depósito). Google acepta hasta ~25 puntos. */
  const urlRutaCompleta = (() => {
    const pts = ordenados.filter((c) => c.lat && c.lng).map((c) => `${c.lat},${c.lng}`);
    if (!pts.length) return null;
    const dep = deposito && deposito.lat ? `${deposito.lat},${deposito.lng}` : null;
    const todos = dep ? [dep, ...pts, dep] : pts;
    if (todos.length < 2 || todos.length > 25) return null;
    return `https://www.google.com/maps/dir/${todos.join("/")}`;
  })();

  const volverAEditar = () => {
    setZonas(zonas.map((z) => z.id === zonaId ? { ...z, rutaConfirmada: false } : z));
  };

  const urlMapa = (c) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([c.domicilio, c.localidad].filter(Boolean).join(", "))}`;

  return (
    <div className="space-y-5">
      <Card>
        <p className="de-display font-semibold mb-1">Armar la ruta del día</p>
        <p className="text-sm mb-3" style={{ color: "var(--slate)" }}>
          Tocá "Proponer ruta automática" para que la app calcule el orden más corto, o numerá vos el orden (escribiendo el número o con las flechas). Este orden es el que va a ver el chofer.
        </p>
        {zonas.length > 1 && (
          <select
            value={zonaId}
            onChange={(e) => { setZonaId(e.target.value); setPropuesta(null); }}
            className="de-focus w-full text-sm rounded-xl p-3 border mb-1 font-semibold"
            style={{ borderColor: "var(--line)" }}
          >
            {zonas.map((z) => <option key={z.id} value={z.id}>{z.nombre}</option>)}
          </select>
        )}
      </Card>

      <Card>
        <div className="flex items-center justify-between gap-2 mb-1">
          <p className="de-display font-semibold flex items-center gap-1.5"><Store size={16} /> Punto de salida (depósito)</p>
          {deposito && !editandoDeposito && (
            <button onClick={() => { setDireccionDeposito(deposito.direccion || ""); setEditandoDeposito(true); }} className="de-focus text-xs font-semibold" style={{ color: "var(--route)" }}>
              Cambiar
            </button>
          )}
        </div>
        {deposito && !editandoDeposito ? (
          <p className="text-sm" style={{ color: "var(--slate)" }}>
            {deposito.direccion}{" "}
            <a href={`https://www.google.com/maps?q=${deposito.lat},${deposito.lng}`} target="_blank" rel="noreferrer" className="de-focus text-xs font-semibold" style={{ color: "var(--teal)" }}>Ver en el mapa</a>
          </p>
        ) : (
          <>
            <p className="text-xs mb-2" style={{ color: "var(--slate)" }}>
              Desde acá sale (y vuelve) el camión. Se usa para calcular la ruta más corta. Se carga una sola vez.
            </p>
            <input
              value={direccionDeposito}
              onChange={(e) => setDireccionDeposito(e.target.value)}
              placeholder="Calle, número y localidad"
              className="de-focus w-full text-sm rounded-xl p-3 border mb-2"
              style={{ borderColor: "var(--line)" }}
            />
            <div className="flex gap-2">
              <button
                onClick={guardarDepositoDireccion}
                disabled={guardandoDeposito || !direccionDeposito.trim()}
                className="de-btn-primary de-focus flex-1 py-2.5 rounded-xl text-sm font-semibold"
                style={{ opacity: guardandoDeposito || !direccionDeposito.trim() ? 0.6 : 1 }}
              >
                {guardandoDeposito ? "Buscando..." : "Guardar dirección"}
              </button>
              <button
                onClick={usarUbicacionActualComoDeposito}
                disabled={guardandoDeposito}
                className="de-focus flex-1 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-1"
                style={{ background: "var(--paper)", color: "var(--route)", border: "1px solid var(--line)" }}
              >
                <MapPin size={14} /> Estoy en el depósito
              </button>
            </div>
            {deposito && (
              <button onClick={() => setEditandoDeposito(false)} className="de-focus text-xs mt-2" style={{ color: "var(--slate)" }}>Cancelar</button>
            )}
            {errorDeposito && <p className="text-xs mt-2" style={{ color: "var(--danger)" }}>{errorDeposito}</p>}
          </>
        )}
      </Card>

      {zona?.rutaConfirmada ? (
        <Card>
          <div className="flex items-center justify-between mb-1">
            <p className="de-display font-semibold flex items-center gap-1.5" style={{ color: "var(--teal)" }}>
              <CheckCircle2 size={18} /> Ruta armada
            </p>
            <button onClick={volverAEditar} className="de-focus text-xs font-semibold" style={{ color: "var(--route)" }}>
              Editar de nuevo
            </button>
          </div>
          <p className="text-sm mb-4" style={{ color: "var(--slate)" }}>
            {ordenados.length} paradas{zona.rutaFecha ? ` · ${new Date(zona.rutaFecha + "T00:00:00").toLocaleDateString("es-AR")}` : ""}{zona.kmEstimados ? ` · ~${formatKm(zona.kmEstimados)} estimados` : ""}, en este orden:
          </p>
          {urlRutaCompleta && (
            <a
              href={urlRutaCompleta}
              target="_blank" rel="noreferrer"
              className="de-focus flex items-center justify-center gap-2 py-2.5 mb-4 rounded-xl text-sm font-semibold"
              style={{ background: "var(--teal-soft)", color: "var(--teal)" }}
            >
              <Route size={15} /> Ver la ruta completa en Google Maps
            </a>
          )}
          <div className="relative pl-6">
            <div className="absolute left-[9px] top-2 bottom-2 de-dash-line w-0.5" />
            {ordenados.map((c, i) => (
              <div key={c.id} className="relative mb-4">
                <div className="absolute -left-6 top-0.5 w-3 h-3 rounded-full border-2" style={{ background: "var(--teal)", borderColor: "var(--teal)" }} />
                <p className="font-semibold text-sm">{i + 1}. {c.nombre}</p>
                {c.domicilio && <p className="text-xs mt-0.5" style={{ color: "var(--slate)" }}>{c.domicilio}{c.localidad ? `, ${c.localidad}` : ""}</p>}
                <a
                  href={c.lat ? `https://www.google.com/maps?q=${c.lat},${c.lng}` : urlMapa(c)}
                  target="_blank" rel="noreferrer"
                  className="de-focus text-xs font-semibold mt-1 flex items-center gap-1"
                  style={{ color: c.lat ? "var(--teal)" : "var(--route)" }}
                >
                  <MapPin size={12} /> {c.lat ? "Ver ubicación exacta" : "Ver dirección en el mapa"}
                </a>
              </div>
            ))}
          </div>
        </Card>
      ) : (
        <Card>
          {ordenados.length === 0 ? (
            <EmptyState icon={Route} title="No hay clientes con facturas pendientes" subtitle="Cargá las facturas del día en la pestaña Facturas." />
          ) : (
            <>
              <button
                onClick={proponerRutaAutomatica}
                disabled={!!proponiendo}
                className="de-btn-primary de-focus w-full mb-3 py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2"
                style={{ opacity: proponiendo ? 0.75 : 1 }}
              >
                {proponiendo ? (
                  <><Loader2 size={17} className="animate-spin" /> {proponiendo}</>
                ) : (
                  <><Route size={17} /> ✨ Proponer ruta automática</>
                )}
              </button>
              {!deposito && !propuesta && (
                <p className="text-xs mb-3" style={{ color: "var(--amber)" }}>
                  Tip: cargá el punto de salida (arriba) para que la ruta arranque y termine en el depósito.
                </p>
              )}
              {propuesta && (
                <div className="mb-3 p-3 rounded-xl text-xs" style={{ background: "var(--teal-soft)", color: "var(--teal)" }}>
                  <p className="font-semibold">
                    Propuesta lista: ~{formatKm(propuesta.km)} {propuesta.metodo === "calles" ? "por calle (ida y vuelta al depósito)" : "en línea recta (el recorrido real por calle va a ser algo más largo)"}.
                  </p>
                  <p className="mt-0.5">Revisala y, si querés, ajustá el orden a mano antes de finalizar.</p>
                  {propuesta.sinUbicacion > 0 && (
                    <p className="mt-1" style={{ color: "var(--amber)" }}>
                      ⚠️ {propuesta.sinUbicacion} clientes no se pudieron ubicar en el mapa y quedaron al final de la lista. Ubicalos vos a mano.
                    </p>
                  )}
                </div>
              )}
              <div className="space-y-2">
                {ordenados.map((c, i) => (
                  <div key={c.id} className="flex items-center gap-3 py-2.5 px-3 rounded-xl" style={{ background: "var(--paper)" }}>
                    <input
                      type="number"
                      value={i + 1}
                      onChange={(e) => irAPosicion(i, e.target.value)}
                      min={1}
                      max={ordenados.length}
                      className="de-focus de-mono w-11 h-9 text-center rounded-lg border text-sm font-bold shrink-0"
                      style={{ borderColor: "var(--line)", background: "var(--card)" }}
                    />
                    <div className="min-w-0 flex-1">
                      <p className="font-semibold text-sm truncate">{c.nombre}</p>
                      {c.domicilio && <p className="text-xs truncate" style={{ color: "var(--slate)" }}>{c.domicilio}</p>}
                      {!c.lat && (c.geoFallo || !(c.domicilio || c.localidad)) && (
                        <p className="text-[11px] font-semibold" style={{ color: "var(--amber)" }}>📍 sin ubicación en el mapa</p>
                      )}
                    </div>
                    <div className="flex flex-col gap-0.5 shrink-0">
                      <button
                        onClick={() => mover(i, -1)}
                        disabled={i === 0}
                        className="de-focus p-1 rounded"
                        style={{ color: i === 0 ? "var(--line)" : "var(--route)" }}
                      >
                        <ArrowLeft size={16} style={{ transform: "rotate(90deg)" }} />
                      </button>
                      <button
                        onClick={() => mover(i, 1)}
                        disabled={i === ordenados.length - 1}
                        className="de-focus p-1 rounded"
                        style={{ color: i === ordenados.length - 1 ? "var(--line)" : "var(--route)" }}
                      >
                        <ArrowLeft size={16} style={{ transform: "rotate(-90deg)" }} />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
              <button
                onClick={marcarArmada}
                disabled={geocodificando}
                className="de-focus w-full mt-4 py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2"
                style={{ background: "var(--teal)", color: "white", opacity: geocodificando ? 0.75 : 1 }}
              >
                {geocodificando ? (
                  <><Loader2 size={17} className="animate-spin" /> Geolocalizando {progresoGeo}/{ordenados.length}...</>
                ) : (
                  <><CheckCircle2 size={17} /> Finalizar ruta</>
                )}
              </button>
              {avisoGeo && (
                <p className="text-xs mt-2 text-center" style={{ color: "var(--amber)" }}>{avisoGeo}</p>
              )}
            </>
          )}
        </Card>
      )}
    </div>
  );
}

function FacturasTab({ facturas, setFacturas, zonas, setZonas, clientes, setClientes }) {
  const [zonaId, setZonaId] = useState(zonas[0]?.id || "");
  const [text, setText] = useState("");
  const [filtroZona, setFiltroZona] = useState("todas");
  const [archivoNombre, setArchivoNombre] = useState("");
  const [filasExcel, setFilasExcel] = useState(null);
  const [mapeoExcel, setMapeoExcel] = useState(null);
  const [errorExcel, setErrorExcel] = useState(null);
  const [procesandoExcel, setProcesandoExcel] = useState(false);
  const [nombreZonaRapida, setNombreZonaRapida] = useState("");
  const [confirmandoVaciar, setConfirmandoVaciar] = useState(false);
  const [geoProgreso, setGeoProgreso] = useState(null); // { hechos, total } mientras geolocaliza
  const [geoResultado, setGeoResultado] = useState(null);

  // Siempre la versión más nueva de clientes, para no pisar cambios mientras se geolocaliza.
  const clientesRef = useRef(clientes);
  useEffect(() => { clientesRef.current = clientes; }, [clientes]);

  /** Guarda lat/lng (o la marca de fallo) sobre la lista de clientes más reciente. */
  const guardarCoords = (coords, fallidos = []) => {
    const ids = Object.keys(coords);
    if (!ids.length && !fallidos.length) return;
    const fallidosSet = new Set(fallidos);
    setClientes(clientesRef.current.map((c) => {
      if (coords[c.id]) return { ...c, lat: coords[c.id].lat, lng: coords[c.id].lng, geoFallo: false };
      if (fallidosSet.has(c.id)) return { ...c, geoFallo: true };
      return c;
    }));
  };

  /** Geolocaliza los clientes que todavía no tienen ubicación (y tienen dirección). */
  const geolocalizarPendientes = async (listaClientes) => {
    const aBuscar = listaClientes.filter((c) => !c.lat && !c.geoFallo && (c.domicilio || c.localidad));
    if (!aBuscar.length) return;
    setGeoResultado(null);
    setGeoProgreso({ hechos: 0, total: aBuscar.length });
    let guardados = 0;
    const { coords, fallidos } = await geocodificarClientes(aBuscar, (hechos, parcial) => {
      setGeoProgreso({ hechos, total: aBuscar.length });
      // Guardado parcial cada 10 clientes, por si se cierra la pantalla a mitad de camino
      const n = Object.keys(parcial).length;
      if (n - guardados >= 10) { guardados = n; guardarCoords({ ...parcial }); }
    });
    guardarCoords(coords, fallidos);
    setGeoProgreso(null);
    const ok = Object.keys(coords).length;
    setGeoResultado(
      fallidos.length
        ? `📍 Se ubicaron ${ok} de ${aBuscar.length} clientes en el mapa. ${fallidos.length} no se encontraron (revisá su domicilio en Administración → Clientes).`
        : `📍 Listo: se ubicaron los ${ok} clientes en el mapa. Ya podés ir a "Armar ruta" y pedir la propuesta automática.`
    );
  };

  const crearZonaRapida = () => {
    if (!nombreZonaRapida.trim()) return;
    const nueva = { id: genId(), nombre: nombreZonaRapida.trim(), choferId: null, choferTexto: "" };
    setZonas([...zonas, nueva]);
    setZonaId(nueva.id);
    setNombreZonaRapida("");
  };

  useEffect(() => {
    if (!zonaId && zonas.length) setZonaId(zonas[0].id);
  }, [zonas]);

  const cargar = () => {
    if (!zonaId) return;
    const lineas = text.split("\n").map((l) => l.trim()).filter(Boolean);
    const nuevas = lineas.map((l) => {
      const [primerCampo, factura, importe, unidades] = l.split(";").map((s) => (s || "").trim());
      const match = clientes.find((c) => c.codigo && c.codigo.toLowerCase() === (primerCampo || "").toLowerCase());
      return {
        id: genId(),
        zonaId,
        factura: factura || "S/N",
        cliente: match ? match.nombre : (primerCampo || "Sin nombre"),
        clienteCodigo: match ? match.codigo : "",
        importe: importe || "0",
        unidades: unidades || "",
        estado: "pendiente",
        fechaHora: null,
      };
    });
    if (nuevas.length) {
      setFacturas([...facturas, ...nuevas]);
      setText("");
    }
  };

  const eliminar = (id) => setFacturas(facturas.filter((f) => f.id !== id));

  const manejarArchivo = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setErrorExcel(null);
    setFilasExcel(null);
    setMapeoExcel(null);
    setProcesandoExcel(true);
    try {
      const buffer = await leerArchivoExcel(file);
      const workbook = XLSX.read(buffer, { type: "array" });
      const primeraHoja = workbook.SheetNames[0];
      const filas = XLSX.utils.sheet_to_json(workbook.Sheets[primeraHoja], { defval: "" });
      if (!filas.length) {
        setErrorExcel("El archivo no tiene filas de datos.");
        setProcesandoExcel(false);
        return;
      }
      const headers = Object.keys(filas[0]);
      const mapeo = detectarMapeoFacturas(headers);
      if (!mapeo.factura || !mapeo.importe || (!mapeo.cliente && !mapeo.codigo)) {
        setErrorExcel(`No pude identificar todas las columnas necesarias (factura, importe y cliente o código). Columnas encontradas: ${headers.join(", ")}. Revisá los nombres de las columnas en el Excel.`);
        setProcesandoExcel(false);
        return;
      }
      setArchivoNombre(file.name);
      setFilasExcel(filas);
      setMapeoExcel(mapeo);
    } catch (err) {
      setErrorExcel("No se pudo leer el archivo. Verificá que sea un .xlsx o .xls válido.");
    }
    setProcesandoExcel(false);
  };

  const confirmarImportExcel = () => {
    if (!filasExcel || !mapeoExcel || !zonaId) return;

    let clientesActualizados = [...clientes];
    const nuevasFacturas = [];

    filasExcel.forEach((fila) => {
      const codigoRaw = mapeoExcel.codigo ? String(fila[mapeoExcel.codigo] || "").trim() : "";
      const clienteRaw = mapeoExcel.cliente ? String(fila[mapeoExcel.cliente] || "").trim() : "";
      const telefonoRaw = mapeoExcel.telefono ? String(fila[mapeoExcel.telefono] || "").trim() : "";
      const domicilioRaw = mapeoExcel.domicilio ? String(fila[mapeoExcel.domicilio] || "").trim() : "";
      const localidadRaw = mapeoExcel.localidad ? String(fila[mapeoExcel.localidad] || "").trim() : "";
      const nombreCliente = clienteRaw || codigoRaw || "Sin nombre";

      let match = codigoRaw
        ? clientesActualizados.find((c) => c.codigo && c.codigo.toLowerCase() === codigoRaw.toLowerCase())
        : null;
      if (!match) {
        match = clientesActualizados.find((c) => c.zonaId === zonaId && c.nombre.trim().toLowerCase() === nombreCliente.trim().toLowerCase());
      }

      if (!match) {
        // El cliente no existía en el maestro: lo creamos automáticamente
        match = {
          id: genId(),
          codigo: codigoRaw || "",
          nombre: nombreCliente,
          localidad: localidadRaw || "",
          domicilio: domicilioRaw || "",
          telefono: telefonoRaw || "",
          zonaId,
        };
        clientesActualizados = [...clientesActualizados, match];
      } else {
        const cambios = {};
        if (telefonoRaw && !match.telefono) cambios.telefono = telefonoRaw;
        if (domicilioRaw && !match.domicilio) cambios.domicilio = domicilioRaw;
        if (localidadRaw && !match.localidad) cambios.localidad = localidadRaw;
        if (Object.keys(cambios).length) {
          const actualizado = { ...match, ...cambios };
          clientesActualizados = clientesActualizados.map((c) => c.id === match.id ? actualizado : c);
          match = actualizado;
        }
      }

      nuevasFacturas.push({
        id: genId(),
        zonaId,
        factura: String(fila[mapeoExcel.factura] || "S/N").trim(),
        cliente: match.nombre,
        clienteCodigo: match.codigo || "",
        importe: formatearImporteDesdeExcel(fila[mapeoExcel.importe]),
        unidades: mapeoExcel.unidades ? String(fila[mapeoExcel.unidades] || "").trim() : "",
        estado: "pendiente",
        fechaHora: null,
        fechaCarga: new Date().toISOString().slice(0, 10),
      });
    });

    setFacturas([...facturas, ...nuevasFacturas]);
    setClientes(clientesActualizados);
    clientesRef.current = clientesActualizados;

    setFilasExcel(null);
    setMapeoExcel(null);
    setArchivoNombre("");

    // Geolocalizar automáticamente a los clientes de estas facturas que todavía no tienen ubicación
    const nombresYCodigos = new Set(nuevasFacturas.map((f) => (f.clienteCodigo || f.cliente).toLowerCase()));
    const clientesDelDia = clientesActualizados.filter((c) => c.zonaId === zonaId && (nombresYCodigos.has((c.codigo || "").toLowerCase()) || nombresYCodigos.has(c.nombre.toLowerCase())));
    geolocalizarPendientes(clientesDelDia);
  };

  const cancelarImportExcel = () => {
    setFilasExcel(null);
    setMapeoExcel(null);
    setArchivoNombre("");
    setErrorExcel(null);
  };

  const visibles = filtroZona === "todas" ? facturas : facturas.filter((f) => f.zonaId === filtroZona);

  return (
    <div className="space-y-5">
      <Card>
        <p className="de-display font-semibold mb-1">📤 Carga masiva desde Excel</p>
        <p className="text-sm mb-3" style={{ color: "var(--slate)" }}>
          Subí el archivo tal cual lo tenés (columnas como Cliente, Factura, Importe, Cantidad/Unidades, Teléfono). La app detecta las columnas sola.
        </p>
        <label
          className="de-focus flex items-center justify-center gap-2 w-full py-3 rounded-xl text-sm font-semibold cursor-pointer"
          style={{ background: "var(--paper)", border: "2px dashed var(--line)", color: "var(--route)" }}
        >
          {procesandoExcel ? (
            <><Loader2 size={16} className="animate-spin" /> Leyendo archivo...</>
          ) : (
            <><Package size={16} /> Elegir archivo Excel (.xlsx)</>
          )}
          <input type="file" accept=".xlsx,.xls,.csv" onChange={manejarArchivo} className="hidden" />
        </label>

        {errorExcel && (
          <div className="mt-3 p-3 rounded-xl text-xs" style={{ background: "var(--danger-soft)", color: "var(--danger)" }}>
            {errorExcel}
          </div>
        )}

        {geoProgreso && (
          <div className="mt-3 p-3 rounded-xl text-xs flex items-center gap-2" style={{ background: "var(--teal-soft)", color: "var(--teal)" }}>
            <Loader2 size={14} className="animate-spin shrink-0" />
            <span>Ubicando clientes en el mapa {geoProgreso.hechos}/{geoProgreso.total}... (tarda ~1 segundo por cliente, no cierres esta pantalla)</span>
          </div>
        )}
        {!geoProgreso && geoResultado && (
          <div className="mt-3 p-3 rounded-xl text-xs" style={{ background: "var(--teal-soft)", color: "var(--teal)" }}>
            {geoResultado}
          </div>
        )}

        {filasExcel && mapeoExcel && (
              <div className="mt-4">
                <p className="text-sm font-semibold mb-1">{archivoNombre} · {filasExcel.length} facturas detectadas</p>
                <div className="text-xs mb-3 space-y-0.5" style={{ color: "var(--slate)" }}>
                  <p>Columnas identificadas:</p>
                  <ul className="de-mono">
                    {mapeoExcel.codigo && <li>Código: "{mapeoExcel.codigo}"</li>}
                    {mapeoExcel.cliente && <li>Cliente: "{mapeoExcel.cliente}"</li>}
                    <li>Factura: "{mapeoExcel.factura}"</li>
                    <li>Importe: "{mapeoExcel.importe}"</li>
                    {mapeoExcel.unidades && <li>Unidades: "{mapeoExcel.unidades}"</li>}
                    {mapeoExcel.telefono && <li>Teléfono: "{mapeoExcel.telefono}"</li>}
                  </ul>
                </div>

                <div className="rounded-xl overflow-hidden border mb-3" style={{ borderColor: "var(--line)" }}>
                  {filasExcel.slice(0, 3).map((fila, i) => (
                    <div key={i} className="text-xs p-2 de-mono truncate" style={{ background: i % 2 ? "var(--paper)" : "var(--card)" }}>
                      {mapeoExcel.cliente && String(fila[mapeoExcel.cliente])} · {String(fila[mapeoExcel.factura])} · {String(fila[mapeoExcel.importe])}
                    </div>
                  ))}
                </div>

                <div className="flex gap-2">
                  <button onClick={cancelarImportExcel} className="de-focus flex-1 py-2.5 rounded-xl text-sm font-semibold" style={{ background: "var(--paper)", color: "var(--ink)" }}>
                    Cancelar
                  </button>
                  <button onClick={confirmarImportExcel} className="de-btn-primary de-focus flex-1 py-2.5 rounded-xl text-sm font-semibold">
                    Cargar {filasExcel.length} facturas
                  </button>
                </div>
              </div>
            )}
      </Card>

      <Card>
        <div className="flex items-center justify-between mb-3 gap-2">
          <p className="de-display font-semibold">Facturas cargadas ({visibles.length})</p>
          <div className="flex items-center gap-2 shrink-0">
            {zonas.length > 1 && (
              <select
                value={filtroZona}
                onChange={(e) => setFiltroZona(e.target.value)}
                className="de-focus text-xs rounded-lg px-2 py-1.5 border"
                style={{ borderColor: "var(--line)" }}
              >
                <option value="todas">Todas las zonas</option>
                {zonas.map((z) => <option key={z.id} value={z.id}>{z.nombre}</option>)}
              </select>
            )}
            {facturas.length > 0 && (
              <button
                onClick={() => setConfirmandoVaciar(true)}
                className="de-focus text-xs font-semibold flex items-center gap-1"
                style={{ color: "var(--danger)" }}
              >
                <Trash2 size={13} /> Vaciar todas
              </button>
            )}
          </div>
        </div>
        {visibles.length === 0 ? (
          <EmptyState icon={Package} title="Sin facturas" subtitle="Cargá una lista arriba." />
        ) : (
          <div className="space-y-2 max-h-[420px] overflow-y-auto de-scrollbar pr-1">
            {visibles.map((f) => {
              const zona = zonas.find((z) => z.id === f.zonaId);
              return (
                <div key={f.id} className="flex items-center justify-between py-2.5 px-3 rounded-xl" style={{ background: "var(--paper)" }}>
                  <div className="min-w-0">
                    <p className="font-semibold text-sm truncate">{f.cliente}</p>
                    <p className="text-xs de-mono mt-0.5" style={{ color: "var(--slate)" }}>
                      {f.factura} · {zona?.nombre || "—"} · {formatMoney(parseImporte(f.importe))}{f.unidades && ` · ${f.unidades} un.`}
                    </p>
                  </div>
                  <div className="flex items-center gap-2 shrink-0 pl-2">
                    <Badge estado={f.estado} />
                    <button onClick={() => eliminar(f.id)} className="de-focus p-2 rounded-lg" style={{ color: "var(--danger)" }}>
                      <Trash2 size={15} />
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      {confirmandoVaciar && (
        <ConfirmModal
          mensaje={`¿Vaciar las ${facturas.length} facturas cargadas? Esto no borra los clientes, solo las facturas del día.`}
          textoConfirmar="Sí, vaciar"
          onCancelar={() => setConfirmandoVaciar(false)}
          onConfirmar={() => {
            setFacturas([]);
            setConfirmandoVaciar(false);
          }}
        />
      )}
    </div>
  );
}
