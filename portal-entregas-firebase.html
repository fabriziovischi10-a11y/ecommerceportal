function IconBase({ children, size = 24, color, strokeWidth = 2, className = "", style = {}, fill = "none" }) {

    <svg

      strokeLinecap="round" strokeLinejoin="round"
      className={className} style={style}

      {children}
    </svg>
  );
}

function parseChoferesLineas(lineas) {
  return lineas.map((l) => {
    const [nombre, acompanante, patente] = l.split(";").map((s) => (s || "").trim());
    return { id: genId(), nombre: nombre || "Sin nombre", acompanante: acompanante || "", patente: patente || "" };
  });
}

function parseClientesLineas(lineas, zonasExistentes) {
  let zonasNuevas = [...zonasExistentes];
  const clientesNuevos = [];
  lineas.forEach((l) => {
    const [nombreZona, codigo, nombre, localidad, domicilio, telefono] = l.split(";").map((s) => (s || "").trim());
    if (!nombreZona || !nombre) return;
    let zona = zonasNuevas.find((z) => z.nombre.toLowerCase() === nombreZona.toLowerCase());
    if (!zona) {
      zona = { id: genId(), nombre: nombreZona, choferId: null, choferTexto: "" };
      zonasNuevas = [...zonasNuevas, zona];
    }
    clientesNuevos.push({
      id: genId(),
      codigo: codigo || "",
      nombre,
      localidad: localidad || "",
      domicilio: domicilio || "",
      telefono: telefono || "",
      zonaId: zona.id,
    });
  });
  return { zonasNuevas, clientesNuevos };
}

function parseImporte(raw) {
  if (raw == null) return 0;
  const s = String(raw).trim();
  if (!s) return 0;
  const cleaned = s.replace(/\./g, "").replace(",", ".").replace(/[^\d.-]/g, "");
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function formatMoney(n) {

function normalizarHeader(h) {
  return String(h || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
}

const MAPEO_CANDIDATOS_FACTURAS = {
  codigo: ["codigo", "codcliente", "codcli", "codigocliente", "cod"],
  cliente: ["cliente", "nombrecliente", "nombre", "razonsocial", "nombredelcliente"],
  factura: ["factura", "numerofactura", "nrofactura", "nfactura", "comprobante", "numero"],
  importe: ["importe", "monto", "total", "montofactura", "valor"],

  telefono: ["telefono", "telefonos", "celular", "celulares", "whatsapp", "tel", "numerotelefono", "telefonocliente", "nrocelular", "numerocelular", "cel", "movil"],
  localidad: ["localidad", "ciudad", "barrio"],
};

function detectarMapeoFacturas(headers) {
  const normalizados = headers.map((h) => ({ original: h, norm: normalizarHeader(h) }));
  const resultado = {};
  for (const [campo, candidatos] of Object.entries(MAPEO_CANDIDATOS_FACTURAS)) {
    const match = normalizados.find((h) => candidatos.includes(h.norm));
    if (match) resultado[campo] = match.original;
  }
  return resultado;
}

function leerArchivoExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

/** Convierte el valor crudo de una celda de Excel (número JS o texto) al formato
 *  argentino que espera parseImporte (coma decimal, sin puntos de miles). */
function formatearImporteDesdeExcel(valor) {
  if (valor == null || valor === "") return "0";
  if (typeof valor === "number") {
    if (Number.isInteger(valor)) return String(valor);
    return valor.toFixed(2).replace(".", ",");
  }
  return String(valor).trim();
}

function obtenerUbicacion() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve({ error: "no_disponible", mensaje: "Este navegador no tiene geolocalización disponible" }); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, precision: Math.round(pos.coords.accuracy || 0) }),
      (err) => {
        const motivos = { 1: "Permiso denegado", 2: "Posición no disponible", 3: "Tiempo agotado" };
        resolve({ error: motivos[err.code] || "Error desconocido", mensaje: err.message || "" });
      },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
    );
  });
}

function useDb() {
  const [db, setDb] = useState(undefined); // undefined = cargando, null = no disponible, obj = listo

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        await firebase.auth().signInAnonymously();
        const firestoreInstance = firebase.firestore();
        try {
          firestoreInstance.settings({ experimentalAutoDetectLongPolling: true, merge: true });
        } catch (settingsErr) {
          // Si ya se configuró antes (por un remount), ignoramos el error.
        }
        if (alive) setDb(firestoreInstance);
      } catch (e) {
        console.error("Error inicializando Firebase:", e);
        if (alive) setDb(null);
      }
    })();
    return () => { alive = false; };
  }, []);

  return db;
}

/** Con Firebase, subir archivos está siempre disponible una vez que la app inicializó. */
function useAssets() {
  return useMemo(() => ({
    upload: async (file) => {
      const nombre = `fotos/${genId()}_${file.name}`;
      const storageRef = firebase.storage().ref(nombre);
      await storageRef.put(file);
      const url = await storageRef.getDownloadURL();
      return { id: url, url };
    },
  }), []);
}

/** Un documento único que guarda un array bajo la clave "list" (choferes, zonas). */
function useDbListDoc(db, path) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (db === undefined) return;
    if (!db) { setLoading(false); return; }
    const ref = db.doc(path);
    const unsub = ref.onSnapshot(
      (snap) => {
        const body = snap.exists ? snap.data() : null;
        setData((body && body.list) || []);
        setLoading(false);
      },
      () => setLoading(false)
    );
    return () => unsub();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [db, path]);

  const setter = useCallback(async (nextArray) => {
    if (!db) return false;
    for (let i = 0; i < 3; i++) {
      try {
        await db.doc(path).set({ list: nextArray });
        return true;
      } catch (e) {
        console.error("Error guardando en Firestore:", e);
        ultimoErrorDb = { codigo: (e && (e.code || e.name)) || "desconocido", mensaje: (e && e.message) || String(e) };
        if (i === 2) return false;
        await new Promise((r) => setTimeout(r, 400 * (i + 1)));
      }
    }
    return false;
  }, [db, path]);

  return [data, setter, loading];
}

/** Una colección con un documento por zona, cada uno con { zonaId, list: [...] } —
 *  se aplana a un solo array plano (clientes o facturas), igual que antes. */
function useDbShardedByZona(db, collectionPath) {
  const [porZona, setPorZona] = useState({});
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (db === undefined) return;
    if (!db) { setLoading(false); return; }
    const unsub = db.collection(collectionPath).onSnapshot(
      (snap) => {
        const nuevo = {};
        snap.docs.forEach((d) => {
          const body = d.data() || {};
          nuevo[d.id] = body.list || [];
        });
        setPorZona(nuevo);
        setLoading(false);
      },
      () => setLoading(false)
    );
    return () => unsub();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [db, collectionPath]);

  const data = useMemo(() => Object.values(porZona).flat(), [porZona]);

  const setter = useCallback(async (nextArrayCompleto) => {
    if (!db) return false;
    const nuevosPorZona = {};
    nextArrayCompleto.forEach((item) => {
      const zid = item.zonaId || "sin_zona";
      if (!nuevosPorZona[zid]) nuevosPorZona[zid] = [];
      nuevosPorZona[zid].push(item);
    });
    const zonasAfectadas = new Set([...Object.keys(porZona), ...Object.keys(nuevosPorZona)]);
    const col = db.collection(collectionPath);

    const escribirConReintento = async (zid, intentos = 3) => {
      const cuerpo = { zonaId: zid, list: nuevosPorZona[zid] || [] };
      const cuerpoTexto = JSON.stringify(cuerpo);
      for (let i = 0; i < intentos; i++) {
        try {
          await col.doc(zid).set(cuerpo);
          return true;
        } catch (e) {
          console.error("Error guardando en Firestore (sharded):", e);
          ultimoErrorDb = {
            codigo: (e && (e.code || e.name)) || "desconocido",
            mensaje: (e && e.message) || String(e),
            tam: `${cuerpoTexto.length}b / ${(cuerpo.list || []).length} items / zonas afectadas: ${zonasAfectadas.size}`,
          };
          if (i === intentos - 1) return false;
          await new Promise((r) => setTimeout(r, 400 * (i + 1)));
        }
      }
      return false;
    };

    const resultados = await Promise.all(Array.from(zonasAfectadas).map((zid) => escribirConReintento(zid)));
    return resultados.every(Boolean);
  }, [db, collectionPath, porZona]);

  return [data, setter, loading];
}

/** Colección con un documento por registro (no shardeada), ordenada por fecha. Para combustible. */
function useDbCollectionLive(db, path, limitN = 300) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (db === undefined) return;
    if (!db) { setLoading(false); return; }
    const unsub = db.collection(path).orderBy("fecha", "desc").limit(limitN).onSnapshot(
      (snap) => {
        setData(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        setLoading(false);
      },
      () => setLoading(false)
    );
    return () => unsub();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [db, path, limitN]);

  return [data, loading];
}

        </>

          mensaje="Esto borra TODOS los datos (choferes, zonas, clientes y facturas) y vuelve a cargar los datos de fábrica. ¿Continuar?"

          onCancelar={() => setConfirmandoReset(false)}
          onConfirmar={async () => {
            try {
              await db.doc("meta/choferes").delete();
              await db.doc("meta/zonas").delete();
              const colClientes = db.collection("clientes_por_zona");
              const colFacturas = db.collection("facturas_por_zona");
              const colUbic = db.collection("ubicaciones");
              const [snapCl, snapFa, snapUb] = await Promise.all([
                colClientes.get(), colFacturas.get(), colUbic.get()
              ]);
              await Promise.all([
                ...snapCl.docs.map((d) => colClientes.doc(d.id).delete()),
                ...snapFa.docs.map((d) => colFacturas.doc(d.id).delete()),
                ...snapUb.docs.map((d) => colUbic.doc(d.id).delete()),
              ]);
            } catch (e) {}
            window.location.reload();
          }}
        />
      )}
    </div>
  );
}

function ResumenTab({ choferes, zonas, facturas }) {
  const total = facturas.length;
  const entregadas = facturas.filter((f) => f.estado === "entregado").length;
  const pendientes = total - entregadas;
  const importeTotal = facturas.reduce((s, f) => s + parseImporte(f.importe), 0);
  const importeEntregado = facturas.filter((f) => f.estado === "entregado").reduce((s, f) => s + parseImporte(f.importe), 0);

  const porZona = zonas.map((z) => {
    const fz = facturas.filter((f) => f.zonaId === z.id);
    const ent = fz.filter((f) => f.estado === "entregado").length;
    const chofer = choferes.find((c) => c.id === z.choferId);
    return { zona: z, total: fz.length, ent, chofer };
  });

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        {[
          { label: "Facturas totales", value: total, color: "var(--route)" },
          { label: "Entregadas", value: entregadas, color: "var(--teal)" },
          { label: "Pendientes", value: pendientes, color: "var(--amber)" },
          { label: "% completado", value: total ? Math.round((entregadas / total) * 100) + "%" : "—", color: "var(--route)" },
        ].map((k) => (
          <Card key={k.label}>
            <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>{k.label}</p>
            <p className="de-display text-3xl font-bold mt-1" style={{ color: k.color }}>{k.value}</p>
          </Card>
        ))}
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        <Card>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>Importe entregado</p>
          <p className="de-mono text-xl font-semibold mt-1" style={{ color: "var(--teal)" }}>{formatMoney(importeEntregado)}</p>
        </Card>
        <Card>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>Importe total cargado</p>
          <p className="de-mono text-xl font-semibold mt-1">{formatMoney(importeTotal)}</p>
        </Card>
      </div>

      <Card>
        <p className="de-display font-semibold mb-4">Avance por zona</p>
        {porZona.length === 0 ? (
          <EmptyState icon={Route} title="Todavía no hay zonas cargadas" subtitle="Andá a la pestaña Zonas para crear las rutas." />
        ) : (
          <div className="space-y-4">
            {porZona.map(({ zona, total, ent, chofer }) => (
              <div key={zona.id}>
                <div className="flex items-center justify-between text-sm mb-1.5">
                  <span className="font-semibold">{zona.nombre}</span>
                  <span style={{ color: "var(--slate)" }}>
                    {chofer ? chofer.nombre : "sin chofer"} · {ent}/{total}
                  </span>
                </div>
                <div className="h-2 rounded-full overflow-hidden" style={{ background: "var(--paper)" }}>
                  <div
                    className="h-full rounded-full"
                    style={{ width: total ? `${(ent / total) * 100}%` : "0%", background: "var(--teal)" }}
                  />
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

function ClientesTab({ clientes, setClientes, zonas, setZonas }) {
  const [text, setText] = useState("");
  const [filtroZona, setFiltroZona] = useState("todas");
  const [editandoTel, setEditandoTel] = useState(null);
  const [telTemp, setTelTemp] = useState("");
  const [editandoDom, setEditandoDom] = useState(null);
  const [domTemp, setDomTemp] = useState("");
  const [archivoNombre, setArchivoNombre] = useState("");
  const [filasExcel, setFilasExcel] = useState(null);
  const [mapeoExcel, setMapeoExcel] = useState(null);
  const [errorExcel, setErrorExcel] = useState(null);
  const [procesandoExcel, setProcesandoExcel] = useState(false);
  const [resultadoImport, setResultadoImport] = useState(null);

  const cargar = () => {
    const lineas = text.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lineas.length) return;

    const { zonasNuevas, clientesNuevos } = parseClientesLineas(lineas, zonas);

    if (zonasNuevas.length !== zonas.length) setZonas(zonasNuevas);
    if (clientesNuevos.length) setClientes([...clientes, ...clientesNuevos]);
    setText("");
  };

  const manejarArchivoClientes = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setErrorExcel(null);
    setFilasExcel(null);
    setMapeoExcel(null);
    setResultadoImport(null);
    setProcesandoExcel(true);
    try {
      const buffer = await leerArchivoExcel(file);
      const workbook = XLSX.read(buffer, { type: "array" });
      const primeraHoja = workbook.SheetNames[0];
      const filas = XLSX.utils.sheet_to_json(workbook.Sheets[primeraHoja], { defval: "" });
      if (!filas.length) {
        setErrorExcel("El archivo no tiene filas de datos.");
        setProcesandoExcel(false);
        return;
      }
      const headers = Object.keys(filas[0]);
      const mapeo = detectarMapeoFacturas(headers); // reutiliza el mismo detector (código, cliente, domicilio, localidad, teléfono)
      if (!mapeo.cliente && !mapeo.codigo) {
        setErrorExcel(`No pude identificar la columna de nombre del cliente. Columnas encontradas: ${headers.join(", ")}.`);
        setProcesandoExcel(false);
        return;
      }
      setArchivoNombre(file.name);
      setFilasExcel(filas);
      setMapeoExcel(mapeo);
    } catch (err) {
      setErrorExcel("No se pudo leer el archivo. Verificá que sea un .xlsx o .xls válido.");
    }
    setProcesandoExcel(false);
  };

  const confirmarImportClientesExcel = () => {
    if (!filasExcel || !mapeoExcel) return;
    const zonaDefault = zonas[0]?.id || null;
    let clientesActualizados = [...clientes];
    let creados = 0;
    let actualizados = 0;

    filasExcel.forEach((fila) => {
      const codigoRaw = mapeoExcel.codigo ? String(fila[mapeoExcel.codigo] || "").trim() : "";
      const nombreRaw = mapeoExcel.cliente ? String(fila[mapeoExcel.cliente] || "").trim() : "";
      const domicilioRaw = mapeoExcel.domicilio ? String(fila[mapeoExcel.domicilio] || "").trim() : "";
      const localidadRaw = mapeoExcel.localidad ? String(fila[mapeoExcel.localidad] || "").trim() : "";
      const telefonoRaw = mapeoExcel.telefono ? String(fila[mapeoExcel.telefono] || "").trim() : "";
      const nombre = nombreRaw || codigoRaw;
      if (!nombre) return;

      let match = codigoRaw
        ? clientesActualizados.find((c) => c.codigo && c.codigo.toLowerCase() === codigoRaw.toLowerCase())
        : null;
      if (!match) {
        match = clientesActualizados.find((c) => c.nombre.trim().toLowerCase() === nombre.trim().toLowerCase());
      }

      if (!match) {
        const nuevo = {
          id: genId(),
          codigo: codigoRaw || "",
          nombre,
          localidad: localidadRaw || "",
          domicilio: domicilioRaw || "",
          telefono: telefonoRaw || "",
          zonaId: zonaDefault,
        };
        clientesActualizados = [...clientesActualizados, nuevo];
        creados++;
      } else {
        const cambios = {};
        if (domicilioRaw) cambios.domicilio = domicilioRaw;
        if (localidadRaw) cambios.localidad = localidadRaw;
        if (telefonoRaw) cambios.telefono = telefonoRaw;
        if (codigoRaw && !match.codigo) cambios.codigo = codigoRaw;
        if (Object.keys(cambios).length) {
          clientesActualizados = clientesActualizados.map((c) => c.id === match.id ? { ...c, ...cambios } : c);
          actualizados++;
        }
      }
    });

    setClientes(clientesActualizados);
    setResultadoImport(`Listo: ${creados} clientes nuevos, ${actualizados} actualizados.`);
    setFilasExcel(null);
    setMapeoExcel(null);
    setArchivoNombre("");
  };

  const cancelarImportClientesExcel = () => {
    setFilasExcel(null);
    setMapeoExcel(null);
    setArchivoNombre("");
    setErrorExcel(null);
  };

  const eliminar = (id) => setClientes(clientes.filter((c) => c.id !== id));

  const guardarTelefono = (id) => {
    setClientes(clientes.map((c) => c.id === id ? { ...c, telefono: telTemp.trim() } : c));
    setEditandoTel(null);
    setTelTemp("");
  };

  const guardarDomicilio = (id) => {
    setClientes(clientes.map((c) => c.id === id ? { ...c, domicilio: domTemp.trim() } : c));
    setEditandoDom(null);
    setDomTemp("");
  };

  const visibles = filtroZona === "todas" ? clientes : clientes.filter((c) => c.zonaId === filtroZona);

  return (
    <div className="space-y-5">
      <Card>
        <p className="de-display font-semibold mb-1">📤 Carga masiva del maestro de clientes</p>
        <p className="text-sm mb-3" style={{ color: "var(--slate)" }}>
          Subí tu base completa (código, nombre, dirección, localidad, teléfono). Si el cliente ya existe, se actualiza; si no, se crea. La app detecta las columnas sola.
        </p>
        <label
          className="de-focus flex items-center justify-center gap-2 w-full py-3 rounded-xl text-sm font-semibold cursor-pointer"
          style={{ background: "var(--paper)", border: "2px dashed var(--line)", color: "var(--route)" }}
        >
          {procesandoExcel ? (
            <><Loader2 size={16} className="animate-spin" /> Leyendo archivo...</>
          ) : (
            <><Store size={16} /> Elegir archivo Excel (.xlsx)</>
          )}
          <input type="file" accept=".xlsx,.xls,.csv" onChange={manejarArchivoClientes} className="hidden" />
        </label>

        {errorExcel && (
          <div className="mt-3 p-3 rounded-xl text-xs" style={{ background: "var(--danger-soft)", color: "var(--danger)" }}>
            {errorExcel}
          </div>
        )}

        {resultadoImport && (
          <div className="mt-3 p-3 rounded-xl text-xs" style={{ background: "var(--teal-soft)", color: "var(--teal)" }}>
            {resultadoImport}
          </div>
        )}

        {filasExcel && mapeoExcel && (
          <div className="mt-4">
            <p className="text-sm font-semibold mb-1">{archivoNombre} · {filasExcel.length} filas detectadas</p>
            <div className="text-xs mb-3 space-y-0.5" style={{ color: "var(--slate)" }}>
              <p>Columnas identificadas:</p>
              <ul className="de-mono">
                {mapeoExcel.codigo && <li>Código: "{mapeoExcel.codigo}"</li>}
                {mapeoExcel.cliente && <li>Nombre: "{mapeoExcel.cliente}"</li>}
                {mapeoExcel.domicilio && <li>Domicilio: "{mapeoExcel.domicilio}"</li>}
                {mapeoExcel.localidad && <li>Localidad: "{mapeoExcel.localidad}"</li>}
                {mapeoExcel.telefono && <li>Teléfono: "{mapeoExcel.telefono}"</li>}
              </ul>
              {!mapeoExcel.domicilio && <p style={{ color: "var(--amber)" }}>⚠️ No encontré columna de dirección — revisá el nombre exacto en tu Excel.</p>}
              {!mapeoExcel.telefono && <p style={{ color: "var(--amber)" }}>⚠️ No encontré columna de teléfono — revisá el nombre exacto en tu Excel.</p>}
            </div>
            <div className="flex gap-2">
              <button onClick={cancelarImportClientesExcel} className="de-focus flex-1 py-2.5 rounded-xl text-sm font-semibold" style={{ background: "var(--paper)", color: "var(--ink)" }}>

              <button onClick={confirmarImportClientesExcel} className="de-btn-primary de-focus flex-1 py-2.5 rounded-xl text-sm font-semibold">

      <Card>

    </div>

function ResumenDiaTab({ db, zonas, setZonas, facturas, setFacturas }) {
  const [confirmandoCierre, setConfirmandoCierre] = useState(false);
  const [cerrando, setCerrando] = useState(false);
  const [cerrado, setCerrado] = useState(null);

  const zona = zonas[0];
  const facturasZona = zona ? facturas.filter((f) => f.zonaId === zona.id) : [];
  const entregadas = facturasZona.filter((f) => f.estado === "entregado");
  const pendientes = facturasZona.filter((f) => f.estado === "pendiente");
  const importeTotal = facturasZona.reduce((s, f) => s + parseImporte(f.importe), 0);
  const importeEntregado = entregadas.reduce((s, f) => s + parseImporte(f.importe), 0);

  const cerrarDia = async () => {
    setCerrando(true);
    const fechaCierre = new Date().toISOString().slice(0, 10);
    const resumen = {
      fecha: fechaCierre,
      zonaId: zona.id,
      zonaNombre: zona.nombre,
      total: facturasZona.length,
      entregadas: entregadas.length,
      pendientes: pendientes.length,
      importeTotal,
      importeEntregado,
      facturas: facturasZona,
    };

    try {
      if (db) {
        await db.collection("historial_dias").doc(`${zona.id}_${fechaCierre}_${genId()}`).set(resumen);
      }
    } catch (e) {}

    setFacturas(facturas.filter((f) => f.zonaId !== zona.id));
    setZonas(zonas.map((z) => z.id === zona.id ? { ...z, rutaConfirmada: false, rutaFecha: null } : z));

    setCerrando(false);
    setConfirmandoCierre(false);
    setCerrado(resumen);
  };

  if (cerrado) {
    return (
      <Card>
        <div className="text-center py-4">
          <CheckCircle2 size={32} style={{ color: "var(--teal)", margin: "0 auto 10px" }} />
          <p className="de-display font-bold mb-1">Día cerrado</p>
          <p className="text-sm mb-4" style={{ color: "var(--slate)" }}>
            {cerrado.entregadas} entregadas de {cerrado.total} · {formatMoney(cerrado.importeEntregado)} cobrado
          </p>
          <p className="text-xs" style={{ color: "var(--slate)" }}>
            Ya podés cargar el Excel del próximo día en la pestaña Facturas. Este resumen quedó guardado en Administración → Historial.
          </p>
        </div>
      </Card>
    );
  }

  return (
    <div className="space-y-5">
      <Card>
        <p className="de-display font-semibold mb-3">Resumen de hoy</p>
        <div className="grid grid-cols-2 gap-3 mb-2">
          <div className="rounded-xl p-3" style={{ background: "var(--paper)" }}>
            <p className="text-xs font-semibold uppercase" style={{ color: "var(--slate)" }}>Entregadas</p>
            <p className="de-display text-2xl font-bold" style={{ color: "var(--teal)" }}>{entregadas.length}<span className="text-sm font-normal" style={{ color: "var(--slate)" }}>/{facturasZona.length}</span></p>
          </div>
          <div className="rounded-xl p-3" style={{ background: "var(--paper)" }}>
            <p className="text-xs font-semibold uppercase" style={{ color: "var(--slate)" }}>Pendientes</p>
            <p className="de-display text-2xl font-bold" style={{ color: "var(--amber)" }}>{pendientes.length}</p>
          </div>
        </div>
        <div className="rounded-xl p-3" style={{ background: "var(--paper)" }}>
          <p className="text-xs font-semibold uppercase" style={{ color: "var(--slate)" }}>Cobrado / total</p>
          <p className="de-mono font-semibold">{formatMoney(importeEntregado)} <span style={{ color: "var(--slate)" }}>de {formatMoney(importeTotal)}</span></p>
        </div>
      </Card>

      <Card>
        <p className="de-display font-semibold mb-1">Cerrar el día</p>
        <p className="text-sm mb-4" style={{ color: "var(--slate)" }}>
          Esto guarda un resumen del día (con el detalle de cada factura) en el historial, y vacía las facturas activas para que mañana puedas cargar un Excel nuevo sin mezclarlo con hoy.
        </p>
        {pendientes.length > 0 && (
          <p className="text-xs mb-3" style={{ color: "var(--danger)" }}>
            ⚠️ Todavía quedan {pendientes.length} facturas sin entregar. Si cerrás igual, van a quedar registradas como pendientes en el historial de hoy.
          </p>
        )}
        <button
          onClick={() => setConfirmandoCierre(true)}
          disabled={facturasZona.length === 0}
          className="de-focus w-full py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2"
          style={{ background: facturasZona.length === 0 ? "var(--line)" : "var(--route)", color: "white" }}
        >
          <CheckCircle2 size={17} /> Cerrar el día
        </button>
      </Card>

      {confirmandoCierre && (
        <ConfirmModal
          mensaje={`¿Cerrar el día con ${entregadas.length} entregadas y ${pendientes.length} pendientes? Se guarda el resumen y se vacían las facturas activas.`}
          textoConfirmar={cerrando ? "Cerrando..." : "Sí, cerrar el día"}
          onCancelar={() => setConfirmandoCierre(false)}
          onConfirmar={cerrarDia}
        />
      )}
    </div>
  );
}

function RutaTab({ zonas, setZonas, facturas, clientes, setClientes }) {
  const [zonaId, setZonaId] = useState(zonas[0]?.id || "");
  const [geocodificando, setGeocodificando] = useState(false);
  const [progresoGeo, setProgresoGeo] = useState(0);
  const [avisoGeo, setAvisoGeo] = useState(null);

  useEffect(() => {
    if (!zonaId && zonas.length) setZonaId(zonas[0].id);
  }, [zonas]);

  const zona = zonas.find((z) => z.id === zonaId);

  const coincideCliente = (f, c) => (c.codigo && f.clienteCodigo) ? f.clienteCodigo.toLowerCase() === c.codigo.toLowerCase() : f.cliente.trim().toLowerCase() === c.nombre.trim().toLowerCase();

  const clientesConPendientes = clientes
    .filter((c) => c.zonaId === zonaId)
    .filter((c) => facturas.some((f) => f.zonaId === zonaId && f.estado === "pendiente" && coincideCliente(f, c)));

  const ordenados = [...clientesConPendientes].sort((a, b) => (a.orden ?? 9999) - (b.orden ?? 9999));

  const aplicarNuevoOrden = (nuevoArreglo) => {
    const actualizados = nuevoArreglo.map((c, i) => ({ ...c, orden: i }));
    const idsActualizados = new Set(actualizados.map((c) => c.id));
    const resto = clientes.filter((c) => !idsActualizados.has(c.id));
    setClientes([...resto, ...actualizados]);
  };

  const mover = (index, dir) => {
    const j = index + dir;
    if (j < 0 || j >= ordenados.length) return;
    const nuevo = [...ordenados];
    [nuevo[index], nuevo[j]] = [nuevo[j], nuevo[index]];
    aplicarNuevoOrden(nuevo);
  };

  const irAPosicion = (index, nuevaPosicionInput) => {
    const nuevaPosicion = Math.max(1, Math.min(ordenados.length, parseInt(nuevaPosicionInput, 10) || 1)) - 1;
    if (nuevaPosicion === index) return;
    const nuevo = [...ordenados];
    const [item] = nuevo.splice(index, 1);
    nuevo.splice(nuevaPosicion, 0, item);
    aplicarNuevoOrden(nuevo);
  };

  const marcarArmada = async () => {
    setGeocodificando(true);
    setProgresoGeo(0);
    let huboExito = false;
    let huboFallo = false;
    let clientesActualizados = clientes;

    for (let i = 0; i < ordenados.length; i++) {
      const c = ordenados[i];
      if (!c.lat && (c.domicilio || c.localidad)) {
        try {
          const query = [c.domicilio, c.localidad].filter(Boolean).join(", ");
          const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
          const datos = await resp.json();
          if (datos && datos[0]) {
            clientesActualizados = clientesActualizados.map((cl) => cl.id === c.id ? { ...cl, lat: parseFloat(datos[0].lat), lng: parseFloat(datos[0].lon) } : cl);
            huboExito = true;
          }
        } catch (e) {
          huboFallo = true;
        }
        await new Promise((r) => setTimeout(r, 1100)); // respetar 1 pedido por segundo
      }
      setProgresoGeo(i + 1);
    }

    if (huboExito) setClientes(clientesActualizados);

    if (huboFallo && !huboExito) {
      setAvisoGeo("No se pudo geolocalizar automáticamente (puede estar bloqueado en este entorno). La ruta quedó armada igual, con el link manual al mapa en cada parada.");
    } else if (huboFallo) {
      setAvisoGeo("Se geolocalizaron algunas paradas; otras quedaron con el link manual al mapa.");
    }

    setGeocodificando(false);
    setZonas(zonas.map((z) => z.id === zonaId ? { ...z, rutaConfirmada: true, rutaFecha: new Date().toISOString().slice(0, 10) } : z));
  };

  const volverAEditar = () => {
    setZonas(zonas.map((z) => z.id === zonaId ? { ...z, rutaConfirmada: false } : z));
  };

  const urlMapa = (c) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([c.domicilio, c.localidad].filter(Boolean).join(", "))}`;

  return (
    <div className="space-y-5">
      <Card>
        <p className="de-display font-semibold mb-1">Armar la ruta del día</p>
        <p className="text-sm mb-3" style={{ color: "var(--slate)" }}>
          Numerá en qué orden conviene visitar a cada cliente (podés escribir el número o usar las flechas). Este orden es el que va a ver el chofer.
        </p>
        {zonas.length > 1 && (
          <select
            value={zonaId}
            onChange={(e) => setZonaId(e.target.value)}
            className="de-focus w-full text-sm rounded-xl p-3 border mb-1 font-semibold"
            style={{ borderColor: "var(--line)" }}
          >
            {zonas.map((z) => <option key={z.id} value={z.id}>{z.nombre}</option>)}
          </select>
        )}
      </Card>

      {zona?.rutaConfirmada ? (
        <Card>
          <div className="flex items-center justify-between mb-1">
            <p className="de-display font-semibold flex items-center gap-1.5" style={{ color: "var(--teal)" }}>
              <CheckCircle2 size={18} /> Ruta armada
            </p>
            <button onClick={volverAEditar} className="de-focus text-xs font-semibold" style={{ color: "var(--route)" }}>
              Editar de nuevo
            </button>
          </div>
          <p className="text-sm mb-4" style={{ color: "var(--slate)" }}>
            {ordenados.length} paradas{zona.rutaFecha ? ` · ${new Date(zona.rutaFecha + "T00:00:00").toLocaleDateString("es-AR")}` : ""}, en este orden:
          </p>
          <div className="relative pl-6">
            <div className="absolute left-[9px] top-2 bottom-2 de-dash-line w-0.5" />
            {ordenados.map((c, i) => (
              <div key={c.id} className="relative mb-4">
                <div className="absolute -left-6 top-0.5 w-3 h-3 rounded-full border-2" style={{ background: "var(--teal)", borderColor: "var(--teal)" }} />
                <p className="font-semibold text-sm">{i + 1}. {c.nombre}</p>
                {c.domicilio && <p className="text-xs mt-0.5" style={{ color: "var(--slate)" }}>{c.domicilio}{c.localidad ? `, ${c.localidad}` : ""}</p>}
                <a
                  href={c.lat ? `https://www.google.com/maps?q=${c.lat},${c.lng}` : urlMapa(c)}
                  target="_blank" rel="noreferrer"
                  className="de-focus text-xs font-semibold mt-1 flex items-center gap-1"
                  style={{ color: c.lat ? "var(--teal)" : "var(--route)" }}
                >
                  <MapPin size={12} /> {c.lat ? "Ver ubicación exacta" : "Ver dirección en el mapa"}
                </a>
              </div>
            ))}
          </div>
        </Card>
      ) : (
        <Card>
          {ordenados.length === 0 ? (
            <EmptyState icon={Route} title="No hay clientes con facturas pendientes" subtitle="Cargá las facturas del día en la pestaña Facturas." />
          ) : (
            <>
              <div className="space-y-2">
                {ordenados.map((c, i) => (
                  <div key={c.id} className="flex items-center gap-3 py-2.5 px-3 rounded-xl" style={{ background: "var(--paper)" }}>
                    <input
                      type="number"
                      value={i + 1}
                      onChange={(e) => irAPosicion(i, e.target.value)}
                      min={1}
                      max={ordenados.length}
                      className="de-focus de-mono w-11 h-9 text-center rounded-lg border text-sm font-bold shrink-0"
                      style={{ borderColor: "var(--line)", background: "var(--card)" }}
                    />
                    <div className="min-w-0 flex-1">
                      <p className="font-semibold text-sm truncate">{c.nombre}</p>
                      {c.domicilio && <p className="text-xs truncate" style={{ color: "var(--slate)" }}>{c.domicilio}</p>}
                    </div>
                    <div className="flex flex-col gap-0.5 shrink-0">
                      <button
                        onClick={() => mover(i, -1)}
                        disabled={i === 0}
                        className="de-focus p-1 rounded"
                        style={{ color: i === 0 ? "var(--line)" : "var(--route)" }}
                      >
                        <ArrowLeft size={16} style={{ transform: "rotate(90deg)" }} />
                      </button>
                      <button
                        onClick={() => mover(i, 1)}
                        disabled={i === ordenados.length - 1}
                        className="de-focus p-1 rounded"
                        style={{ color: i === ordenados.length - 1 ? "var(--line)" : "var(--route)" }}
                      >
                        <ArrowLeft size={16} style={{ transform: "rotate(-90deg)" }} />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
              <button
                onClick={marcarArmada}
                disabled={geocodificando}
                className="de-focus w-full mt-4 py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2"
                style={{ background: "var(--teal)", color: "white", opacity: geocodificando ? 0.75 : 1 }}
              >
                {geocodificando ? (
                  <><Loader2 size={17} className="animate-spin" /> Geolocalizando {progresoGeo}/{ordenados.length}...</>
                ) : (
                  <><CheckCircle2 size={17} /> Finalizar ruta</>
                )}
              </button>
              {avisoGeo && (
                <p className="text-xs mt-2 text-center" style={{ color: "var(--amber)" }}>{avisoGeo}</p>
              )}
            </>
          )}
        </Card>
      )}
    </div>
  );
}

function FacturasTab({ facturas, setFacturas, zonas, setZonas, clientes, setClientes }) {
  const [zonaId, setZonaId] = useState(zonas[0]?.id || "");
  const [text, setText] = useState("");
  const [filtroZona, setFiltroZona] = useState("todas");
  const [archivoNombre, setArchivoNombre] = useState("");
  const [filasExcel, setFilasExcel] = useState(null);
  const [mapeoExcel, setMapeoExcel] = useState(null);
  const [errorExcel, setErrorExcel] = useState(null);
  const [procesandoExcel, setProcesandoExcel] = useState(false);
  const [nombreZonaRapida, setNombreZonaRapida] = useState("");
  const [confirmandoVaciar, setConfirmandoVaciar] = useState(false);

  const crearZonaRapida = () => {
    if (!nombreZonaRapida.trim()) return;
    const nueva = { id: genId(), nombre: nombreZonaRapida.trim(), choferId: null, choferTexto: "" };
    setZonas([...zonas, nueva]);
    setZonaId(nueva.id);
    setNombreZonaRapida("");
  };

  useEffect(() => {
    if (!zonaId && zonas.length) setZonaId(zonas[0].id);
  }, [zonas]);

  const cargar = () => {
    if (!zonaId) return;
    const lineas = text.split("\n").map((l) => l.trim()).filter(Boolean);
    const nuevas = lineas.map((l) => {
      const [primerCampo, factura, importe, unidades] = l.split(";").map((s) => (s || "").trim());
      const match = clientes.find((c) => c.codigo && c.codigo.toLowerCase() === (primerCampo || "").toLowerCase());
      return {
        id: genId(),
        zonaId,
        factura: factura || "S/N",
        cliente: match ? match.nombre : (primerCampo || "Sin nombre"),
        clienteCodigo: match ? match.codigo : "",
        importe: importe || "0",
        unidades: unidades || "",
        estado: "pendiente",
        fechaHora: null,
      };
    });
    if (nuevas.length) {
      setFacturas([...facturas, ...nuevas]);
      setText("");
    }
  };

  const eliminar = (id) => setFacturas(facturas.filter((f) => f.id !== id));

  const manejarArchivo = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setErrorExcel(null);
    setFilasExcel(null);
    setMapeoExcel(null);
    setProcesandoExcel(true);
    try {
      const buffer = await leerArchivoExcel(file);
      const workbook = XLSX.read(buffer, { type: "array" });
      const primeraHoja = workbook.SheetNames[0];
      const filas = XLSX.utils.sheet_to_json(workbook.Sheets[primeraHoja], { defval: "" });
      if (!filas.length) {
        setErrorExcel("El archivo no tiene filas de datos.");
        setProcesandoExcel(false);
        return;
      }
      const headers = Object.keys(filas[0]);
      const mapeo = detectarMapeoFacturas(headers);
      if (!mapeo.factura || !mapeo.importe || (!mapeo.cliente && !mapeo.codigo)) {
        setErrorExcel(`No pude identificar todas las columnas necesarias (factura, importe y cliente o código). Columnas encontradas: ${headers.join(", ")}. Revisá los nombres de las columnas en el Excel.`);
        setProcesandoExcel(false);
        return;
      }
      setArchivoNombre(file.name);
      setFilasExcel(filas);
      setMapeoExcel(mapeo);
    } catch (err) {
      setErrorExcel("No se pudo leer el archivo. Verificá que sea un .xlsx o .xls válido.");
    }
    setProcesandoExcel(false);
  };

  const confirmarImportExcel = () => {
    if (!filasExcel || !mapeoExcel || !zonaId) return;

    let clientesActualizados = [...clientes];
    const nuevasFacturas = [];

    filasExcel.forEach((fila) => {
      const codigoRaw = mapeoExcel.codigo ? String(fila[mapeoExcel.codigo] || "").trim() : "";
      const clienteRaw = mapeoExcel.cliente ? String(fila[mapeoExcel.cliente] || "").trim() : "";
      const telefonoRaw = mapeoExcel.telefono ? String(fila[mapeoExcel.telefono] || "").trim() : "";
      const domicilioRaw = mapeoExcel.domicilio ? String(fila[mapeoExcel.domicilio] || "").trim() : "";
      const localidadRaw = mapeoExcel.localidad ? String(fila[mapeoExcel.localidad] || "").trim() : "";
      const nombreCliente = clienteRaw || codigoRaw || "Sin nombre";

      let match = codigoRaw
        ? clientesActualizados.find((c) => c.codigo && c.codigo.toLowerCase() === codigoRaw.toLowerCase())
        : null;
      if (!match) {
        match = clientesActualizados.find((c) => c.zonaId === zonaId && c.nombre.trim().toLowerCase() === nombreCliente.trim().toLowerCase());
      }

      if (!match) {
        // El cliente no existía en el maestro: lo creamos automáticamente
        match = {
          id: genId(),
          codigo: codigoRaw || "",
          nombre: nombreCliente,
          localidad: localidadRaw || "",
          domicilio: domicilioRaw || "",
          telefono: telefonoRaw || "",
          zonaId,
        };
        clientesActualizados = [...clientesActualizados, match];
      } else {
        const cambios = {};
        if (telefonoRaw && !match.telefono) cambios.telefono = telefonoRaw;
        if (domicilioRaw && !match.domicilio) cambios.domicilio = domicilioRaw;
        if (localidadRaw && !match.localidad) cambios.localidad = localidadRaw;
        if (Object.keys(cambios).length) {
          const actualizado = { ...match, ...cambios };
          clientesActualizados = clientesActualizados.map((c) => c.id === match.id ? actualizado : c);
          match = actualizado;
        }
      }

      nuevasFacturas.push({
        id: genId(),
        zonaId,
        factura: String(fila[mapeoExcel.factura] || "S/N").trim(),
        cliente: match.nombre,
        clienteCodigo: match.codigo || "",
        importe: formatearImporteDesdeExcel(fila[mapeoExcel.importe]),
        unidades: mapeoExcel.unidades ? String(fila[mapeoExcel.unidades] || "").trim() : "",
        estado: "pendiente",
        fechaHora: null,
        fechaCarga: new Date().toISOString().slice(0, 10),
      });
    });

    setFacturas([...facturas, ...nuevasFacturas]);
    setClientes(clientesActualizados);

    setFilasExcel(null);
    setMapeoExcel(null);
    setArchivoNombre("");
  };

  const cancelarImportExcel = () => {
    setFilasExcel(null);
    setMapeoExcel(null);
    setArchivoNombre("");
    setErrorExcel(null);
  };

  const visibles = filtroZona === "todas" ? facturas : facturas.filter((f) => f.zonaId === filtroZona);

  return (
    <div className="space-y-5">
      <Card>
        <p className="de-display font-semibold mb-1">📤 Carga masiva desde Excel</p>
        <p className="text-sm mb-3" style={{ color: "var(--slate)" }}>
          Subí el archivo tal cual lo tenés (columnas como Cliente, Factura, Importe, Cantidad/Unidades, Teléfono). La app detecta las columnas sola.
        </p>
        <label
          className="de-focus flex items-center justify-center gap-2 w-full py-3 rounded-xl text-sm font-semibold cursor-pointer"
          style={{ background: "var(--paper)", border: "2px dashed var(--line)", color: "var(--route)" }}
        >
          {procesandoExcel ? (
            <><Loader2 size={16} className="animate-spin" /> Leyendo archivo...</>
          ) : (
            <><Package size={16} /> Elegir archivo Excel (.xlsx)</>
          )}
          <input type="file" accept=".xlsx,.xls,.csv" onChange={manejarArchivo} className="hidden" />
        </label>

        {errorExcel && (
          <div className="mt-3 p-3 rounded-xl text-xs" style={{ background: "var(--danger-soft)", color: "var(--danger)" }}>
            {errorExcel}
          </div>
        )}

        {filasExcel && mapeoExcel && (
              <div className="mt-4">
                <p className="text-sm font-semibold mb-1">{archivoNombre} · {filasExcel.length} facturas detectadas</p>
                <div className="text-xs mb-3 space-y-0.5" style={{ color: "var(--slate)" }}>
                  <p>Columnas identificadas:</p>
                  <ul className="de-mono">
                    {mapeoExcel.codigo && <li>Código: "{mapeoExcel.codigo}"</li>}
                    {mapeoExcel.cliente && <li>Cliente: "{mapeoExcel.cliente}"</li>}
                    <li>Factura: "{mapeoExcel.factura}"</li>
                    <li>Importe: "{mapeoExcel.importe}"</li>
                    {mapeoExcel.unidades && <li>Unidades: "{mapeoExcel.unidades}"</li>}
                    {mapeoExcel.telefono && <li>Teléfono: "{mapeoExcel.telefono}"</li>}
                  </ul>
                </div>

                <div className="rounded-xl overflow-hidden border mb-3" style={{ borderColor: "var(--line)" }}>
                  {filasExcel.slice(0, 3).map((fila, i) => (
                    <div key={i} className="text-xs p-2 de-mono truncate" style={{ background: i % 2 ? "var(--paper)" : "var(--card)" }}>
                      {mapeoExcel.cliente && String(fila[mapeoExcel.cliente])} · {String(fila[mapeoExcel.factura])} · {String(fila[mapeoExcel.importe])}
                    </div>
                  ))}
                </div>

                <div className="flex gap-2">
                  <button onClick={cancelarImportExcel} className="de-focus flex-1 py-2.5 rounded-xl text-sm font-semibold" style={{ background: "var(--paper)", color: "var(--ink)" }}>
                    Cancelar
                  </button>
                  <button onClick={confirmarImportExcel} className="de-btn-primary de-focus flex-1 py-2.5 rounded-xl text-sm font-semibold">
                    Cargar {filasExcel.length} facturas
                  </button>
                </div>
              </div>
            )}
      </Card>

      <Card>
        <div className="flex items-center justify-between mb-3 gap-2">
          <p className="de-display font-semibold">Facturas cargadas ({visibles.length})</p>
          <div className="flex items-center gap-2 shrink-0">
            {zonas.length > 1 && (
              <select
                value={filtroZona}
                onChange={(e) => setFiltroZona(e.target.value)}
                className="de-focus text-xs rounded-lg px-2 py-1.5 border"
                style={{ borderColor: "var(--line)" }}
              >
                <option value="todas">Todas las zonas</option>
                {zonas.map((z) => <option key={z.id} value={z.id}>{z.nombre}</option>)}
              </select>
            )}
            {facturas.length > 0 && (
              <button
                onClick={() => setConfirmandoVaciar(true)}
                className="de-focus text-xs font-semibold flex items-center gap-1"
                style={{ color: "var(--danger)" }}
              >
                <Trash2 size={13} /> Vaciar todas
              </button>
            )}
          </div>
        </div>
        {visibles.length === 0 ? (
          <EmptyState icon={Package} title="Sin facturas" subtitle="Cargá una lista arriba." />
        ) : (
          <div className="space-y-2 max-h-[420px] overflow-y-auto de-scrollbar pr-1">
            {visibles.map((f) => {
              const zona = zonas.find((z) => z.id === f.zonaId);
              return (
                <div key={f.id} className="flex items-center justify-between py-2.5 px-3 rounded-xl" style={{ background: "var(--paper)" }}>
                  <div className="min-w-0">
                    <p className="font-semibold text-sm truncate">{f.cliente}</p>
                    <p className="text-xs de-mono mt-0.5" style={{ color: "var(--slate)" }}>
                      {f.factura} · {zona?.nombre || "—"} · {formatMoney(parseImporte(f.importe))}{f.unidades && ` · ${f.unidades} un.`}
                    </p>
                  </div>
                  <div className="flex items-center gap-2 shrink-0 pl-2">
                    <Badge estado={f.estado} />
                    <button onClick={() => eliminar(f.id)} className="de-focus p-2 rounded-lg" style={{ color: "var(--danger)" }}>
                      <Trash2 size={15} />
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      {confirmandoVaciar && (
        <ConfirmModal
          mensaje={`¿Vaciar las ${facturas.length} facturas cargadas? Esto no borra los clientes, solo las facturas del día.`}
          textoConfirmar="Sí, vaciar"
          onCancelar={() => setConfirmandoVaciar(false)}
          onConfirmar={() => {
            setFacturas([]);
            setConfirmandoVaciar(false);
          }}
        />
      )}
    </div>
  );
}

function SeguimientoTab({ facturas, setFacturas, zonas, choferes }) {
  const [fZona, setFZona] = useState("todas");
  const [fEstado, setFEstado] = useState("todos");
  const [aDeshacer, setADeshacer] = useState(null);

  const rows = facturas.filter((f) => {
    if (fZona !== "todas" && f.zonaId !== fZona) return false;
    if (fEstado !== "todos" && f.estado !== fEstado) return false;
    return true;
  });

  const destildar = (facturaId) => setADeshacer(facturaId);

  return (
    <>
    <Card>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
        <p className="de-display font-semibold">Seguimiento de entregas</p>
        <div className="flex gap-2">
          <select value={fZona} onChange={(e) => setFZona(e.target.value)} className="de-focus text-xs rounded-lg px-2 py-1.5 border" style={{ borderColor: "var(--line)" }}>
            <option value="todas">Todas las zonas</option>
            {zonas.map((z) => <option key={z.id} value={z.id}>{z.nombre}</option>)}
          </select>
          <select value={fEstado} onChange={(e) => setFEstado(e.target.value)} className="de-focus text-xs rounded-lg px-2 py-1.5 border" style={{ borderColor: "var(--line)" }}>
            <option value="todos">Todos</option>
            <option value="entregado">Entregado</option>
            <option value="pendiente">Pendiente</option>
          </select>
        </div>
      </div>

      {rows.length === 0 ? (
        <EmptyState icon={ListChecks} title="Sin resultados" subtitle="Probá cambiar los filtros." />
      ) : (
        <div className="space-y-2 max-h-[520px] overflow-y-auto de-scrollbar pr-1">
          {rows.map((f) => {
            const zona = zonas.find((z) => z.id === f.zonaId);
            const chofer = choferes.find((c) => c.id === zona?.choferId);
            return (
              <div key={f.id} className="rounded-xl p-3" style={{ background: "var(--paper)" }}>
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p className="font-semibold text-sm truncate">{f.cliente}</p>
                    <p className="text-xs de-mono mt-0.5" style={{ color: "var(--slate)" }}>{f.factura}</p>
                  </div>
                  <Badge estado={f.estado} />
                </div>
                <div className="flex items-center justify-between mt-2 text-xs" style={{ color: "var(--slate)" }}>
                  <span className="truncate pr-2">{zona?.nombre || "—"} · {chofer?.nombre || "sin chofer"}</span>
                  <span className="de-mono font-semibold shrink-0" style={{ color: "var(--ink)" }}>{formatMoney(parseImporte(f.importe))}{f.unidades && ` · ${f.unidades} un.`}</span>
                </div>
                {f.fechaHora && (
                  <div className="flex items-center justify-between mt-1 gap-2">
                    <p className="text-xs de-mono" style={{ color: "var(--slate)" }}>
                      {new Date(f.fechaHora).toLocaleString("es-AR")}
                    </p>
                    {f.estado === "entregado" && (
                      <button
                        onClick={() => destildar(f.id)}
                        className="de-focus text-xs font-semibold shrink-0 flex items-center gap-1"
                        style={{ color: "var(--danger)" }}
                      >
                        <RefreshCw size={11} /> Deshacer
                      </button>
                    )}
                  </div>
                )}
                {f.estado === "entregado" && f.ubicacion && f.ubicacion.lat && (
                  <a
                    href={`https://www.google.com/maps?q=${f.ubicacion.lat},${f.ubicacion.lng}`}
                    target="_blank"
                    rel="noreferrer"
                    className="de-focus text-xs font-semibold mt-1 flex items-center gap-1"
                    style={{ color: "var(--teal)" }}
                  >
                    <MapPin size={11} /> Ver ubicación
                  </a>
                )}
                {f.estado === "entregado" && f.ubicacion && f.ubicacion.error && (
                  <p className="text-xs mt-1 flex items-center gap-1" style={{ color: "var(--amber)" }}>
                    <AlertCircle size={11} /> Sin ubicación ({f.ubicacion.error})
                  </p>
                )}
                {f.estado === "entregado" && f.fotoId && (
                  <a href={f.fotoId} target="_blank" rel="noreferrer" className="de-focus mt-1.5 block">
                    <img src={f.fotoId} alt="Foto factura" className="h-16 rounded-lg" style={{ border: "1px solid var(--line)" }} />
                  </a>
                )}
              </div>
            );
          })}
        </div>
      )}
    </Card>

      {aDeshacer && (
        <ConfirmModal
          mensaje="¿Deshacer esta entrega? Va a volver a quedar como pendiente."
          textoConfirmar="Sí, deshacer"
          onCancelar={() => setADeshacer(null)}
          onConfirmar={() => {
            setFacturas(facturas.map((f) => f.id === aDeshacer ? { ...f, estado: "pendiente", fechaHora: null, ubicacion: null } : f));
            setADeshacer(null);
          }}
        />
      )}
    </>
  );
}

function HistorialTab({ historialDias }) {
  const [diaAbierto, setDiaAbierto] = useState(null);

  const ordenados = [...historialDias].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));

  if (diaAbierto) {
    const dia = ordenados.find((d) => d.id === diaAbierto);
    if (!dia) { setDiaAbierto(null); return null; }
    const facturasOrdenadas = [...(dia.facturas || [])].sort((a, b) => (a.estado === b.estado ? 0 : a.estado === "pendiente" ? -1 : 1));
    return (
      <Card>
        <button onClick={() => setDiaAbierto(null)} className="de-focus flex items-center gap-1 text-sm font-semibold mb-3" style={{ color: "var(--route)" }}>
          <ArrowLeft size={16} /> Volver al historial
        </button>
        <p className="de-display font-semibold">{new Date(dia.fecha + "T00:00:00").toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" })}</p>
        <p className="text-sm mb-4" style={{ color: "var(--slate)" }}>{dia.zonaNombre} · {dia.entregadas}/{dia.total} entregadas · {formatMoney(dia.importeEntregado)} cobrado</p>
        <div className="space-y-2 max-h-[480px] overflow-y-auto de-scrollbar pr-1">
          {facturasOrdenadas.map((f) => (
            <div key={f.id} className="flex items-center justify-between py-2.5 px-3 rounded-xl" style={{ background: "var(--paper)" }}>
              <div className="min-w-0">
                <p className="font-semibold text-sm truncate">{f.cliente}</p>
                <p className="text-xs de-mono mt-0.5" style={{ color: "var(--slate)" }}>{f.factura} · {formatMoney(parseImporte(f.importe))}</p>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                {f.fotoId && (
                  <a href={f.fotoId} target="_blank" rel="noreferrer" className="de-focus">
                    <img src={f.fotoId} alt="Foto factura" className="h-10 w-10 object-cover rounded-lg" style={{ border: "1px solid var(--line)" }} />
                  </a>
                )}
                <Badge estado={f.estado} />
              </div>
            </div>
          ))}
        </div>
      </Card>
    );
  }

  return (
    <Card>
      <p className="de-display font-semibold mb-1">Historial de días cerrados</p>
      <p className="text-sm mb-4" style={{ color: "var(--slate)" }}>Cada vez que Logística cierra el día, queda guardado acá.</p>
      {ordenados.length === 0 ? (
        <EmptyState icon={Clock} title="Sin días cerrados todavía" subtitle="Van a aparecer cuando Logística cierre el primer día." />
      ) : (
        <div className="space-y-2">
          {ordenados.map((dia) => (
            <button
              key={dia.id}
              onClick={() => setDiaAbierto(dia.id)}
              className="de-focus w-full flex items-center justify-between py-3 px-3 rounded-xl text-left"
              style={{ background: "var(--paper)" }}
            >
              <div>
                <p className="font-semibold text-sm">{new Date(dia.fecha + "T00:00:00").toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" })}</p>
                <p className="text-xs" style={{ color: "var(--slate)" }}>{dia.entregadas}/{dia.total} entregadas · {formatMoney(dia.importeEntregado)}</p>
              </div>
              <ArrowLeft size={16} style={{ transform: "rotate(180deg)", color: "var(--slate)" }} />
            </button>
          ))}
        </div>
      )}
    </Card>
  );
}

function CombustibleTab({ combustible, choferes, vehiculos }) {
  const totalLitros = combustible.reduce((s, c) => s + (parseFloat(String(c.litros).replace(",", ".")) || 0), 0);

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 gap-3">
        <Card>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>Litros cargados</p>
          <p className="de-display text-2xl font-bold mt-1" style={{ color: "var(--amber)" }}>{totalLitros.toLocaleString("es-AR")} L</p>
        </Card>
        <Card>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--slate)" }}>Gastado en total</p>
          <p className="de-mono text-xl font-semibold mt-1">{formatMoney(totalImporte)}</p>
        </Card>
      </div>

      <Card>
        <p className="de-display font-semibold mb-3">Historial de cargas ({combustible.length})</p>
        {combustible.length === 0 ? (
          <EmptyState icon={Fuel} title="Sin cargas registradas" subtitle="Aparecerán acá cuando el chofer cargue combustible desde su celular." />
        ) : (
          <div className="space-y-2 max-h-[520px] overflow-y-auto de-scrollbar pr-1">
            {combustible.map((c) => {
              const chofer = choferes.find((ch) => ch.id === c.choferId);
              const vehiculo = vehiculos.find((v) => v.id === c.vehiculoId);

                <div key={c.id} className="flex items-center justify-between py-2.5 px-3 rounded-xl" style={{ background: "var(--paper)" }}>
                  <div className="min-w-0">
                    <p className="font-semibold text-sm truncate">{chofer?.nombre || "Chofer desconocido"}</p>
                    <p className="text-xs de-mono mt-0.5" style={{ color: "var(--slate)" }}>
                      {vehiculo?.patente || "s/patente"} · {new Date(c.fecha).toLocaleString("es-AR")}
                    </p>
                  </div>
                  <div className="text-right shrink-0 pl-2">
                    <p className="de-mono font-semibold text-sm">{c.litros} L</p>
                    {parseImporte(c.importe) > 0 && <p className="de-mono text-xs" style={{ color: "var(--slate)" }}>{formatMoney(parseImporte(c.importe))}</p>}

function MapaVivoTab({ db, choferes, zonas, facturas }) {
  const [ubicaciones, setUbicaciones] = useState({});
  const [cargando, setCargando] = useState(true);
  const [choferDetalle, setChoferDetalle] = useState(null);

  useEffect(() => {
    if (!db) { setCargando(false); return; }
    const unsub = db.collection("ubicaciones").onSnapshot(
      (snap) => {
        const nuevo = {};
        snap.docs.forEach((d) => { nuevo[d.id] = d.data(); });
        setUbicaciones(nuevo);
        setCargando(false);
      },
      () => setCargando(false)
    );
    return () => unsub();
  }, [db]);

  const haceTiempo = (iso) => {
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return "hace instantes";
    if (min < 60) return `hace ${min} min`;
    return `hace ${Math.round(min / 60)} h`;
  };

  const activos = choferes
    .map((c) => ({ chofer: c, datos: ubicaciones[c.id] }))
    .filter((x) => x.datos && x.datos.ultima)
    .sort((a, b) => new Date(b.datos.ultima.ts) - new Date(a.datos.ultima.ts));

  if (choferDetalle) {
    const chofer = choferes.find((c) => c.id === choferDetalle);
    const datos = ubicaciones[choferDetalle];
    const zonasChofer = zonas.filter((z) => z.choferId === choferDetalle);
    const entregas = facturas
      .filter((f) => f.estado === "entregado" && zonasChofer.some((z) => z.id === f.zonaId))
      .sort((a, b) => new Date(a.fechaHora) - new Date(b.fechaHora));

    const historial = (datos && datos.historial) || [];
    // Reduce a un máximo de ~20 puntos para el link de ruta (límite práctico de Google Maps)
    const paso = Math.max(1, Math.ceil(historial.length / 20));
    const puntosRuta = historial.filter((_, i) => i % paso === 0);
    const urlRuta = puntosRuta.length >= 2
      ? `https://www.google.com/maps/dir/${puntosRuta.map((p) => `${p.lat},${p.lng}`).join("/")}`
      : null;

    return (
      <Card>
        <div className="flex items-center gap-2 mb-1">
          <button onClick={() => setChoferDetalle(null)} className="de-focus p-1 -ml-1 rounded-lg" style={{ color: "var(--route)" }}>
            <ArrowLeft size={18} />
          </button>
          <p className="de-display font-semibold">{chofer?.nombre}</p>
        </div>
        <p className="text-xs mb-4 ml-7" style={{ color: "var(--slate)" }}>
          {zonasChofer.map((z) => z.nombre).join(", ") || "sin zona"} · {datos?.ultima ? haceTiempo(datos.ultima.ts) : "sin datos"}
        </p>

        <div className="flex flex-col gap-2 mb-5">
          {datos?.ultima && (
            <a
              href={`https://www.google.com/maps?q=${datos.ultima.lat},${datos.ultima.lng}`}
              target="_blank"
              rel="noreferrer"
              className="de-focus flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold"
              style={{ background: "var(--teal-soft)", color: "var(--teal)" }}
            >
              <MapPin size={15} /> Ver posición actual
            </a>
          )}
          {urlRuta && (
            <a
              href={urlRuta}
              target="_blank"
              rel="noreferrer"
              className="de-focus flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold"
              style={{ background: "var(--paper)", color: "var(--route)", border: "1px solid var(--line)" }}
            >
              <Route size={15} /> Ver recorrido completo del día ({historial.length} puntos)
            </a>
          )}
        </div>

        <p className="de-display font-semibold mb-3 text-sm">Entregas de hoy ({entregas.length})</p>
        {entregas.length === 0 ? (
          <EmptyState icon={Package} title="Todavía no entregó ninguna factura" />
        ) : (
          <div className="relative pl-6">
            <div className="absolute left-[9px] top-2 bottom-2 de-dash-line w-0.5" />
            {entregas.map((f) => (
              <div key={f.id} className="relative mb-3">
                <div className="absolute -left-6 top-1.5 w-3 h-3 rounded-full border-2" style={{ background: "var(--teal)", borderColor: "var(--teal)" }} />
                <div className="flex items-start justify-between gap-2 text-sm">
                  <div className="min-w-0">
                    <p className="font-semibold truncate">{f.cliente}</p>
                    <p className="text-xs de-mono" style={{ color: "var(--slate)" }}>
                      {f.factura} · {formatMoney(parseImporte(f.importe))}{f.unidades && ` · ${f.unidades} un.`} · {new Date(f.fechaHora).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}
                    </p>
                  </div>
                  {f.ubicacion && f.ubicacion.lat && (
                    <a
                      href={`https://www.google.com/maps?q=${f.ubicacion.lat},${f.ubicacion.lng}`}
                      target="_blank"
                      rel="noreferrer"
                      className="de-focus shrink-0"
                      style={{ color: "var(--teal)" }}
                    >
                      <MapPin size={16} />
                    </a>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
    );
  }

  return (
    <Card>
      <div className="flex items-center justify-between mb-1">
        <p className="de-display font-semibold">Mapa en vivo</p>
        <span className="text-xs font-semibold flex items-center gap-1.5" style={{ color: "var(--teal)" }}>
          <span className="w-2 h-2 rounded-full" style={{ background: "var(--teal)" }} /> En vivo
        </span>
      </div>
      <p className="text-xs mb-4" style={{ color: "var(--slate)" }}>Tocá un chofer para ver su recorrido y las entregas del día. Esta pantalla se actualiza sola, al instante.</p>

      {cargando ? (
        <div className="flex justify-center py-10"><Loader2 className="animate-spin" size={22} style={{ color: "var(--route)" }} /></div>
      ) : activos.length === 0 ? (
        <EmptyState icon={MapPin} title="Ningún chofer transmitiendo ubicación ahora" subtitle="Se activa solo cuando el chofer entra a 'Soy chofer' y acepta el permiso de ubicación en su celular." />
      ) : (
        <div className="space-y-2">
          {activos.map(({ chofer, datos }) => {
            const zona = zonas.find((z) => z.choferId === chofer.id);
            const vieja = (Date.now() - new Date(datos.ultima.ts).getTime()) > 10 * 60000;
            return (
              <button
                key={chofer.id}
                onClick={() => setChoferDetalle(chofer.id)}
                className="de-focus w-full flex items-center justify-between gap-2 p-3 rounded-xl text-left"
                style={{ background: "var(--paper)" }}
              >
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-9 h-9 rounded-full flex items-center justify-center de-display font-bold text-sm shrink-0" style={{ background: vieja ? "var(--slate)" : "var(--teal)", color: "white" }}>
                    {chofer.nombre.charAt(0).toUpperCase()}
                  </div>
                  <div className="min-w-0">
                    <p className="font-semibold text-sm truncate">{chofer.nombre}</p>
                    <p className="text-xs truncate" style={{ color: "var(--slate)" }}>
                      {zona?.nombre || "sin zona"} · {haceTiempo(datos.ultima.ts)}{vieja ? " · sin señal reciente" : ""}
                    </p>
                  </div>
                </div>
                <MapPin size={16} className="shrink-0" style={{ color: vieja ? "var(--slate)" : "var(--teal)" }} />
              </button>
            );
          })}
        </div>
      )}
    </Card>
  );
}
