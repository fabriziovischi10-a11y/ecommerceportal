function HistorialTab({ db, historialDias }) {
  const [diaAbierto, setDiaAbierto] = useState(null);
  const [editFecha, setEditFecha] = useState(null); // fecha nueva mientras se edita
  const [guardandoFecha, setGuardandoFecha] = useState(false);
  const [msgFecha, setMsgFecha] = useState("");

  const guardarFecha = async (dia) => {
    if (!db || !editFecha || editFecha === dia.fecha) { setEditFecha(null); return; }
    setGuardandoFecha(true); setMsgFecha("");
    try {
      await db.collection("historial_dias").doc(dia.id).set(
        { fecha: editFecha, fechaOriginal: dia.fechaOriginal || dia.fecha, fechaModificada: new Date().toISOString() },
        { merge: true }
      );
      setMsgFecha("Fecha cambiada");
      setEditFecha(null);
    } catch (e) {
      setMsgFecha("No se pudo guardar la fecha. Revisá la conexión y probá de nuevo.");
    }
    setGuardandoFecha(false);
  };

  const ordenados = [...historialDias].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));

  if (diaAbierto) {
    const dia = ordenados.find((d) => d.id === diaAbierto);
    if (!dia) { setDiaAbierto(null); return null; }
    const facturasOrdenadas = [...(dia.facturas || [])].sort((a, b) => (a.estado === b.estado ? 0 : a.estado === "pendiente" ? -1 : 1));
    return (
      <Card>
        <button onClick={() => { setDiaAbierto(null); setEditFecha(null); setMsgFecha(""); }} className="de-focus flex items-center gap-1 text-sm font-semibold mb-3" style={{ color: "var(--route)" }}>
          <ArrowLeft size={16} /> Volver al historial
        </button>
        {editFecha === null ? (
          <div className="flex items-center gap-3 flex-wrap">
            <p className="de-display font-semibold">{new Date(dia.fecha + "T00:00:00").toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</p>
            {db && (
              <button onClick={() => { setEditFecha(dia.fecha); setMsgFecha(""); }} className="de-focus text-xs font-semibold px-2.5 py-1 rounded-lg border" style={{ borderColor: "var(--line)", color: "var(--route)" }}>Cambiar fecha</button>
            )}
          </div>
        ) : (
          <div className="flex items-center gap-2 flex-wrap mb-1">
            <label htmlFor="hist-fecha" className="text-xs font-semibold uppercase" style={{ color: "var(--slate)" }}>Nueva fecha</label>
            <input
              id="hist-fecha"
              type="date"
              value={editFecha}
              max={fechaLocalHoy()}
              onChange={(e) => e.target.value && setEditFecha(e.target.value)}
              className="de-focus de-mono text-sm rounded-xl p-2 border"
              style={{ borderColor: "var(--line)", background: "var(--card)" }}
            />
            <button onClick={() => guardarFecha(dia)} disabled={guardandoFecha} className="de-focus text-sm font-semibold px-3 py-1.5 rounded-lg" style={{ background: "var(--route)", color: "white" }}>{guardandoFecha ? "Guardando..." : "Guardar"}</button>
            <button onClick={() => setEditFecha(null)} className="de-focus text-sm font-semibold px-3 py-1.5" style={{ color: "var(--slate)" }}>Cancelar</button>
          </div>
        )}
        {msgFecha && <p className="text-xs mt-1" style={{ color: msgFecha === "Fecha cambiada" ? "var(--teal)" : "var(--danger)" }}>{msgFecha}</p>}
        {dia.fechaOriginal && dia.fechaOriginal !== dia.fecha && (
          <p className="text-xs mt-1" style={{ color: "var(--slate)" }}>Fecha corregida (originalmente se cerró el {new Date(dia.fechaOriginal + "T00:00:00").toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" })}).</p>
        )}
        <p className="text-sm mb-4" style={{ color: "var(--slate)" }}>{dia.zonaNombre} · {dia.entregadas}/{dia.total} entregadas · {formatMoney(dia.importeEntregado)} cobrado{dia.kmRecorridos != null ? ` · ${formatKm(dia.kmRecorridos)}` : ""}</p>
        {(dia.kmPorChofer || []).length > 1 && (
          <p className="text-xs -mt-3 mb-4" style={{ color: "var(--slate)" }}>{dia.kmPorChofer.map((x) => `${x.nombre}: ${formatKm(x.km)}`).join(" · ")}</p>
        )}
        <div className="space-y-2 max-h-[480px] overflow-y-auto de-scrollbar pr-1">
          {facturasOrdenadas.map((f) => (
            <div key={f.id} className="flex items-center justify-between py-2.5 px-3 rounded-xl" style={{ background: "var(--paper)" }}>
              <div className="min-w-0">
                <p className="font-semibold text-sm truncate">{f.cliente}</p>
                <p className="text-xs de-mono mt-0.5" style={{ color: "var(--slate)" }}>{f.factura} · {formatMoney(parseImporte(f.importe))}</p>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                {f.fotoId && (
                  <FotoFactura fotoId={f.fotoId} alt="Foto factura" className="h-10 w-10 object-cover rounded-lg" linkClassName="de-focus" />
                )}
                <Badge estado={f.estado} />
              </div>
            </div>
          ))}
        </div>
      </Card>
    );
  }

  return (
    <Card>
      <p className="de-display font-semibold mb-1">Historial de días cerrados</p>
      <p className="text-sm mb-4" style={{ color: "var(--slate)" }}>Cada vez que Logística cierra el día, queda guardado acá.</p>
      {ordenados.length === 0 ? (
        <EmptyState icon={Clock} title="Sin días cerrados todavía" subtitle="Van a aparecer cuando Logística cierre el primer día." />
      ) : (
        <div className="space-y-2">
          {ordenados.map((dia) => (
            <button
              key={dia.id}
              onClick={() => setDiaAbierto(dia.id)}
              className="de-focus w-full flex items-center justify-between py-3 px-3 rounded-xl text-left"
              style={{ background: "var(--paper)" }}
            >
              <div>
                <p className="font-semibold text-sm">{new Date(dia.fecha + "T00:00:00").toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" })}</p>
                <p className="text-xs" style={{ color: "var(--slate)" }}>{dia.entregadas}/{dia.total} entregadas · {formatMoney(dia.importeEntregado)}{dia.kmRecorridos != null ? ` · ${formatKm(dia.kmRecorridos)}` : ""}</p>
              </div>
              <ArrowLeft size={16} style={{ transform: "rotate(180deg)", color: "var(--slate)" }} />
            </button>
          ))}
        </div>
      )}
    </Card>
  );
}

/* ------------------------------------------------------------------ */
/*  COSTOS DE VIAJE POR DÍA Y RENDIMIENTO                               */
/* ------------------------------------------------------------------ */

/** Número escrito a mano: acepta "7500", "7.500,50", "7500,5" o "7500.5". */
function parseNum(raw) {
  if (raw == null) return 0;
  const s = String(raw).trim();
  if (!s) return 0;
  const limpio = s.includes(",") ? s.replace(/\./g, "").replace(",", ".") : s;
  const n = parseFloat(limpio.replace(/[^\d.-]/g, ""));
  return isNaN(n) ? 0 : n;
}

function fechaLocalDe(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Consumo estimado de los vehículos de reparto: el combustible del día se calcula como
// km del día ÷ KM_POR_LITRO = litros consumidos, y litros × precio por litro = costo.
const KM_POR_LITRO = 11;

// Campos de costo que se cargan por día. Los "fijos" se pueden guardar como valores por defecto.
const CAMPOS_COSTO = [
  { id: "otros", label: "Otros costos / caja chica", fijo: false },
  { id: "amortizacion", label: "Amortización", fijo: true },
  { id: "gps", label: "GPS", fijo: true },
  { id: "sueldoChofer", label: "Sueldo chofer", fijo: true },
  { id: "sueldoCobrador", label: "Sueldo cobrador/a", fijo: true },
];

// Tipo de rendimiento según el costo del viaje sobre la facturación del día.
const NIVELES_RENDIMIENTO = [
  { max: 3, label: "Excelente", color: "var(--teal)", bg: "var(--teal-soft)" },
  { max: 5, label: "Bueno", color: "var(--teal)", bg: "var(--teal-soft)" },
  { max: 8, label: "Regular", color: "#9A6B00", bg: "var(--amber-soft)" },
  { max: Infinity, label: "Bajo", color: "var(--danger)", bg: "var(--danger-soft)" },
];

function tipoRendimiento(r) {
  if (!r.base) return { label: "Sin facturación", color: "var(--slate)", bg: "var(--paper)" };
  if (!r.costoTotal) return { label: "Sin costos cargados", color: "var(--slate)", bg: "var(--paper)" };
  if (r.utilidad < 0) return { label: "Pérdida", color: "white", bg: "var(--danger)" };
  return NIVELES_RENDIMIENTO.find((n) => r.costoSobreFact * 100 <= n.max);
}

function formatPct(n) {
  return (n * 100).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
}

function BadgeRendimiento({ r }) {
  const t = tipoRendimiento(r);
  return (
    <span className="text-xs font-bold px-2.5 py-1 rounded-full whitespace-nowrap" style={{ color: t.color, background: t.bg }}>
      {t.label}
    </span>
  );
}

function CostosTab({ db, facturas, combustible, historialDias }) {
  const [registros, setRegistros, loadingCostos] = useDbListDoc(db, "meta/costos");
  const [ubicaciones, setUbicaciones] = useState({});
  const hoy = fechaLocalHoy();
  const [fecha, setFecha] = useState(hoy);
  const [form, setForm] = useState(null);
  const [guardando, setGuardando] = useState(false);
  const [mensaje, setMensaje] = useState(null);

  // Km de hoy en vivo (los días cerrados ya traen sus km en el historial).
  useEffect(() => {
    if (!db) return;
    const unsub = db.collection("ubicaciones").onSnapshot(
      (snap) => {
        const nuevo = {};
        snap.docs.forEach((d) => { nuevo[d.id] = d.data(); });
        setUbicaciones(nuevo);
      },
      () => {}
    );
    return () => unsub();
  }, [db]);

  const config = registros.find((r) => r.id === "config") || {};
  const base = config.base || "entregado"; // "entregado" | "total"
  const costosGuardados = useMemo(() => {
    const m = {};
    registros.forEach((r) => { if (r.id !== "config" && r.fecha) m[r.fecha] = r; });
    return m;
  }, [registros]);

  // Datos operativos de cada día: facturación, entregas, km y combustible.
  const datosPorDia = useMemo(() => {
    const dias = {};
    const dia = (f) => (dias[f] = dias[f] || { fecha: f, facturas: {}, km: 0, litros: 0, litrosSinImporte: 0, combustible: 0, zonas: new Set() });

    historialDias.forEach((h) => {
      if (!h.fecha) return;
      const d = dia(h.fecha);
      d.km += h.kmRecorridos || 0;
      if (h.zonaNombre) d.zonas.add(h.zonaNombre);
      // Si el día se cerró más de una vez, una factura pendiente aparece repetida: se cuenta una sola vez.
      (h.facturas || []).forEach((f) => {
        const prev = d.facturas[f.id];
        if (!prev || f.estado === "entregado") d.facturas[f.id] = f;
      });
    });

    // Hoy: sumamos lo que sigue activo y los km que todavía no se cerraron.
    const dHoy = dia(hoy);
    facturas.forEach((f) => {
      const prev = dHoy.facturas[f.id];
      if (!prev || f.estado === "entregado") dHoy.facturas[f.id] = f;
    });
    Object.values(ubicaciones).forEach((u) => {
      if (!u || u.fecha !== hoy) return;
      const kmTotalesHoy = u.kmRecorridos != null ? u.kmRecorridos : kmDeHistorial(u.historial);
      dHoy.km += Math.max(0, kmTotalesHoy - (u.kmYaCerrados || 0));
    });

    combustible.forEach((c) => {
      const f = fechaLocalDe(c.fecha);
      if (!f) return;
      const d = dia(f);
      const litros = parseFloat(String(c.litros).replace(",", ".")) || 0;
      const importe = parseImporte(c.importe);
      d.litros += litros;
      // Las cargas sin importe se valorizan después con el precio por litro.
      if (importe > 0) d.combustible += importe;
      else d.litrosSinImporte += litros;
    });

    Object.keys(costosGuardados).forEach((f) => dia(f));

    return Object.values(dias).map((d) => {
      const lista = Object.values(d.facturas);
      const entregadas = lista.filter((f) => f.estado === "entregado");
      return {
        fecha: d.fecha,
        zonas: [...d.zonas],
        cantFacturas: lista.length,
        cantEntregadas: entregadas.length,
        importeTotal: lista.reduce((s, f) => s + parseImporte(f.importe), 0),
        importeEntregado: entregadas.reduce((s, f) => s + parseImporte(f.importe), 0),
        km: Math.round(d.km * 10) / 10,
        litros: d.litros,
        litrosSinImporte: d.litrosSinImporte,
        combustible: d.combustible,
      };
    }).sort((a, b) => b.fecha.localeCompare(a.fecha));
  }, [historialDias, facturas, combustible, ubicaciones, costosGuardados, hoy]);

  const valoresDe = (f) => {
    const g = costosGuardados[f];
    const v = {};
    CAMPOS_COSTO.forEach((c) => {
      v[c.id] = g && g[c.id] != null ? g[c.id] : (c.fijo && config[c.id] != null ? config[c.id] : "");
    });
    v.markup = g && g.markup != null ? g.markup : (config.markup != null ? config.markup : "");
    v.precioLitro = g && g.precioLitro != null ? g.precioLitro : (config.precioLitro != null ? config.precioLitro : "");
    v.km = g && g.km != null ? g.km : ""; // vacío = se usan los km del GPS
    return v;
  };

  const calcular = (d, v) => {
    const costos = {};
    CAMPOS_COSTO.forEach((c) => { costos[c.id] = parseNum(v[c.id]); });
    const km = parseNum(v.km) > 0 ? parseNum(v.km) : d.km;
    const litrosConsumidos = km / KM_POR_LITRO;
    const combustibleCosto = litrosConsumidos * parseNum(v.precioLitro);
    const costoTotal = combustibleCosto + Object.values(costos).reduce((s, x) => s + x, 0);
    const baseImporte = base === "total" ? d.importeTotal : d.importeEntregado;
    const markup = parseNum(v.markup) / 100;
    const gananciaBruta = baseImporte * markup;
    const utilidad = gananciaBruta - costoTotal;
    return {
      ...costos,
      combustible: combustibleCosto,
      costoTotal,
      base: baseImporte,
      markup,
      gananciaBruta,
      utilidad,
      margenNeto: baseImporte ? utilidad / baseImporte : 0,
      costoSobreFact: baseImporte ? costoTotal / baseImporte : 0,
      costoPorKm: km ? costoTotal / km : null,
      costoPorEntrega: d.cantEntregadas ? costoTotal / d.cantEntregadas : null,
      litrosConsumidos,
      km,
    };
  };

  const diaSel = datosPorDia.find((d) => d.fecha === fecha) || {
    fecha, zonas: [], cantFacturas: 0, cantEntregadas: 0, importeTotal: 0, importeEntregado: 0, km: 0, litros: 0, litrosSinImporte: 0, combustible: 0,
  };

  // Confirmación antes de guardar: { porDefecto, fechaDestino }.
  const [confirmando, setConfirmando] = useState(null);
  // Si se guardó en otro día, se pasa a ese día sin pisar lo que se acaba de cargar.
  const mantenerForm = useRef(false);

  // Al cambiar de día (o cuando terminan de cargar los costos guardados) se rellena el formulario.
  useEffect(() => {
    if (loadingCostos) return;
    if (mantenerForm.current) { mantenerForm.current = false; return; }
    setConfirmando(null);
    setForm(valoresDe(fecha));
    setMensaje(null);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [fecha, loadingCostos]);

  const v = form || valoresDe(fecha);
  const r = calcular(diaSel, v);

  const guardar = async (tambienPorDefecto, fechaDestino) => {
    setGuardando(true);
    const registro = { id: fechaDestino, fecha: fechaDestino, ...v, actualizado: new Date().toISOString() };
    let siguiente = registros.filter((x) => x.id !== fechaDestino);
    siguiente.push(registro);
    if (tambienPorDefecto) {
      const nuevaConfig = { ...config, id: "config", markup: v.markup, precioLitro: v.precioLitro };
      CAMPOS_COSTO.filter((c) => c.fijo).forEach((c) => { nuevaConfig[c.id] = v[c.id]; });
      siguiente = siguiente.filter((x) => x.id !== "config");
      siguiente.push(nuevaConfig);
    }
    const ok = await setRegistros(siguiente);
    setGuardando(false);
    if (ok) {
      setConfirmando(null);
      if (fechaDestino !== fecha) { mantenerForm.current = true; setFecha(fechaDestino); }
    }
    const diaTexto = fechaLarga(fechaDestino);
    setMensaje(ok
      ? (tambienPorDefecto ? `Guardado en el ${diaTexto}. Los costos fijos y el markup quedan como valores por defecto para los próximos días.` : `Costos guardados en el ${diaTexto}.`)
      : "No se pudo guardar. Revisá la conexión y probá de nuevo.");
  };

  // Suma o resta días a una fecha AAAA-MM-DD sin pasar de hoy.
  const moverDia = (f, delta) => {
    const d = new Date(f + "T00:00:00");
    d.setDate(d.getDate() + delta);
    const n = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    return n > hoy ? hoy : n;
  };
  const ayer = moverDia(hoy, -1);

  const cambiarBase = async (nueva) => {
    const nuevaConfig = { ...config, id: "config", base: nueva };
    await setRegistros([...registros.filter((x) => x.id !== "config"), nuevaConfig]);
  };

  const fechaLarga = (f) => new Date(f + "T00:00:00").toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const fechaCorta = (f) => new Date(f + "T00:00:00").toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });

  // Tabla de días: los que no tienen costos guardados usan los valores por defecto (se marcan como estimados).
  const filas = datosPorDia.slice(0, 31).map((d) => ({ d, r: calcular(d, valoresDe(d.fecha)), guardado: !!costosGuardados[d.fecha] }));
  const totales = filas.reduce((t, { d, r }) => ({
    base: t.base + r.base, costo: t.costo + r.costoTotal, utilidad: t.utilidad + r.utilidad, km: t.km + r.km, entregas: t.entregas + d.cantEntregadas,
  }), { base: 0, costo: 0, utilidad: 0, km: 0, entregas: 0 });
  const rTotales = { base: totales.base, costoTotal: totales.costo, utilidad: totales.utilidad, costoSobreFact: totales.base ? totales.costo / totales.base : 0 };

  const Kpi = ({ label, value, color, sub }) => (
    <div className="rounded-xl p-3" style={{ background: "var(--paper)" }}>
      <p className="text-[10px] font-bold uppercase tracking-wide" style={{ color: "var(--slate)" }}>{label}</p>
      <p className="de-mono text-base font-semibold mt-1" style={{ color: color || "var(--ink)" }}>{value}</p>
      {sub && <p className="text-[11px] mt-0.5" style={{ color: "var(--slate)" }}>{sub}</p>}
    </div>
  );

  if (loadingCostos) {
    return <Card><p className="text-sm flex items-center gap-2" style={{ color: "var(--slate)" }}><Loader2 size={16} className="animate-spin" /> Cargando costos...</p></Card>;
  }

  return (
    <div className="space-y-5">
      <Card>
        <p className="de-display font-semibold mb-3">Costos del viaje por día</p>

        <div className="rounded-xl p-3 mb-2" style={{ background: "var(--paper)" }}>
          <label htmlFor="costos-dia" className="text-xs font-bold uppercase tracking-wide" style={{ color: "var(--slate)" }}>Día que estás cargando</label>
          <div className="flex flex-wrap items-center gap-2 mt-1.5">
            <button
              type="button"
              onClick={() => setFecha(moverDia(fecha, -1))}
              aria-label="Día anterior"
              className="de-focus w-10 h-10 rounded-xl border font-bold"
              style={{ borderColor: "var(--line)", background: "var(--card)", color: "var(--route)" }}
            >‹</button>
            <input
              id="costos-dia"
              type="date"
              value={fecha}
              max={hoy}
              onChange={(e) => e.target.value && setFecha(e.target.value)}
              className="de-focus de-mono text-sm rounded-xl p-2.5 border"
              style={{ borderColor: "var(--line)", background: "var(--card)" }}
            />
            <button
              type="button"
              onClick={() => setFecha(moverDia(fecha, 1))}
              disabled={fecha >= hoy}
              aria-label="Día siguiente"
              className="de-focus w-10 h-10 rounded-xl border font-bold"
              style={{ borderColor: "var(--line)", background: "var(--card)", color: "var(--route)", opacity: fecha >= hoy ? 0.4 : 1 }}
            >›</button>
            {[{ f: hoy, l: "Hoy" }, { f: ayer, l: "Ayer" }].map((o) => (
              <button
                key={o.l}
                type="button"
                onClick={() => setFecha(o.f)}
                className="de-focus px-3 py-2 rounded-full text-xs font-semibold"
                style={fecha === o.f ? { background: "var(--route)", color: "white" } : { background: "var(--card)", color: "var(--route)", border: "1px solid var(--line)" }}
              >{o.l}</button>
            ))}
          </div>
          <p className="text-sm font-semibold mt-2">
            {fechaLarga(fecha).replace(/^./, (x) => x.toUpperCase())}{fecha === hoy ? " · hoy (en curso)" : ""}
            {costosGuardados[fecha] && <span className="ml-2 text-xs font-semibold px-2 py-0.5 rounded-full" style={{ background: "var(--teal-soft)", color: "var(--teal)" }}>con costos guardados</span>}
          </p>
        </div>
        <p className="text-xs mb-4" style={{ color: "var(--slate)" }}>
          {diaSel.zonas.length ? diaSel.zonas.join(", ") + " · " : ""}
          {diaSel.cantEntregadas}/{diaSel.cantFacturas} entregadas · {formatKm(diaSel.km)} · {diaSel.litros.toLocaleString("es-AR")} L de combustible
        </p>

        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          {CAMPOS_COSTO.map((c) => (
            <div key={c.id}>
              <label className="text-xs font-semibold" style={{ color: "var(--slate)" }}>{c.label}</label>
              <input
                value={v[c.id]}
                onChange={(e) => setForm({ ...v, [c.id]: e.target.value })}
                placeholder="0"
                inputMode="decimal"
                className="de-focus de-mono w-full text-sm rounded-xl p-3 border mt-1"
                style={{ borderColor: "var(--line)" }}
              />
            </div>
          ))}
          <div>
            <label className="text-xs font-semibold" style={{ color: "var(--slate)" }}>Combustible (km ÷ {KM_POR_LITRO} × $/L)</label>
            <div className="de-mono w-full text-sm rounded-xl p-3 border mt-1" style={{ borderColor: "var(--line)", background: "var(--paper)" }}>
              {formatMoney(r.combustible)}
            </div>
            <p className="text-[11px] mt-1 de-mono" style={{ color: "var(--slate)" }}>
              {r.km.toLocaleString("es-AR", { maximumFractionDigits: 1 })} km ÷ {KM_POR_LITRO} = {r.litrosConsumidos.toLocaleString("es-AR", { maximumFractionDigits: 2 })} L
            </p>
          </div>
          <div>
            <label className="text-xs font-semibold" style={{ color: "var(--slate)" }}>Precio combustible ($/L)</label>
            <input
              value={v.precioLitro}
              onChange={(e) => setForm({ ...v, precioLitro: e.target.value })}
              placeholder="0"
              inputMode="decimal"
              className="de-focus de-mono w-full text-sm rounded-xl p-3 border mt-1"
              style={{ borderColor: "var(--line)" }}
            />
            <p className="text-[11px] mt-1" style={{ color: "var(--slate)" }}>
              Se multiplica por los litros consumidos.
            </p>
          </div>
          <div>
            <label className="text-xs font-semibold" style={{ color: "var(--slate)" }}>Km del día (opcional)</label>
            <input
              value={v.km}
              onChange={(e) => setForm({ ...v, km: e.target.value })}
              placeholder={`GPS: ${diaSel.km.toLocaleString("es-AR")}`}
              inputMode="decimal"
              className="de-focus de-mono w-full text-sm rounded-xl p-3 border mt-1"
              style={{ borderColor: "var(--line)" }}
            />
          </div>
          <div>
            <label className="text-xs font-semibold" style={{ color: "var(--slate)" }}>Markup sobre facturación (%)</label>
            <input
              value={v.markup}
              onChange={(e) => setForm({ ...v, markup: e.target.value })}
              placeholder="30"
              inputMode="decimal"
              className="de-focus de-mono w-full text-sm rounded-xl p-3 border mt-1"
              style={{ borderColor: "var(--line)" }}
            />
          </div>
        </div>

        {!confirmando ? (
          <div className="flex flex-wrap gap-2 mt-4">
            <button
              disabled={guardando}
              onClick={() => { setMensaje(null); setConfirmando({ porDefecto: false, fechaDestino: fecha }); }}
              className="de-focus px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2"
              style={{ background: "var(--route)", color: "white", opacity: guardando ? 0.7 : 1 }}
            >
              Guardar costos del día
            </button>
            <button
              disabled={guardando}
              onClick={() => { setMensaje(null); setConfirmando({ porDefecto: true, fechaDestino: fecha }); }}
              className="de-focus px-4 py-2.5 rounded-xl font-semibold text-sm border"
              style={{ borderColor: "var(--route)", color: "var(--route)" }}
            >
              Guardar y usar como valores por defecto
            </button>
          </div>
        ) : (
          <div className="mt-4 rounded-xl p-4 border-2" style={{ borderColor: "var(--route)", background: "var(--card)" }}>
            <p className="de-display font-semibold">¿A qué día corresponden estos costos?</p>
            <p className="text-xs mt-0.5 mb-3" style={{ color: "var(--slate)" }}>
              Elegí el día y confirmá. Se guarda un costo total de <b className="de-mono">{formatMoney(r.costoTotal)}</b>
              {confirmando.porDefecto ? " y estos valores quedan por defecto para los próximos días." : "."}
            </p>
            <div className="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onClick={() => setConfirmando({ ...confirmando, fechaDestino: moverDia(confirmando.fechaDestino, -1) })}
                aria-label="Día anterior"
                className="de-focus w-10 h-10 rounded-xl border font-bold"
                style={{ borderColor: "var(--line)", color: "var(--route)" }}
              >‹</button>
              <input
                type="date"
                aria-label="Día en que se guardan los costos"
                value={confirmando.fechaDestino}
                max={hoy}
                onChange={(e) => e.target.value && setConfirmando({ ...confirmando, fechaDestino: e.target.value })}
                className="de-focus de-mono text-sm rounded-xl p-2.5 border"
                style={{ borderColor: "var(--line)" }}
              />
              <button
                type="button"
                onClick={() => setConfirmando({ ...confirmando, fechaDestino: moverDia(confirmando.fechaDestino, 1) })}
                disabled={confirmando.fechaDestino >= hoy}
                aria-label="Día siguiente"
                className="de-focus w-10 h-10 rounded-xl border font-bold"
                style={{ borderColor: "var(--line)", color: "var(--route)", opacity: confirmando.fechaDestino >= hoy ? 0.4 : 1 }}
              >›</button>
              {[{ f: hoy, l: "Hoy" }, { f: ayer, l: "Ayer" }].map((o) => (
                <button
                  key={o.l}
                  type="button"
                  onClick={() => setConfirmando({ ...confirmando, fechaDestino: o.f })}
                  className="de-focus px-3 py-2 rounded-full text-xs font-semibold"
                  style={confirmando.fechaDestino === o.f ? { background: "var(--route)", color: "white" } : { color: "var(--route)", border: "1px solid var(--line)" }}
                >{o.l}</button>
              ))}
            </div>
            <p className="text-sm font-semibold mt-2">{fechaLarga(confirmando.fechaDestino).replace(/^./, (x) => x.toUpperCase())}</p>
            {confirmando.fechaDestino !== fecha && costosGuardados[confirmando.fechaDestino] && (
              <p className="text-xs mt-1 font-semibold" style={{ color: "#9A6B00" }}>Ese día ya tiene costos guardados: se van a reemplazar por los de este formulario.</p>
            )}
            <div className="flex flex-wrap gap-2 mt-3">
              <button
                disabled={guardando}
                onClick={() => guardar(confirmando.porDefecto, confirmando.fechaDestino)}
                className="de-focus px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2"
                style={{ background: "var(--teal)", color: "white", opacity: guardando ? 0.7 : 1 }}
              >
                {guardando && <Loader2 size={14} className="animate-spin" />} Confirmar y guardar
              </button>
              <button
                disabled={guardando}
                onClick={() => setConfirmando(null)}
                className="de-focus px-4 py-2.5 rounded-xl font-semibold text-sm border"
                style={{ borderColor: "var(--line)", color: "var(--slate)" }}
              >
                Cancelar
              </button>
            </div>
          </div>
        )}
        {mensaje && <p className="text-xs mt-2" style={{ color: mensaje.startsWith("No se") ? "var(--danger)" : "var(--teal)" }}>{mensaje}</p>}
        {!costosGuardados[fecha] && (
          <p className="text-xs mt-2" style={{ color: "var(--slate)" }}>Este día todavía no tiene costos guardados: se muestran los valores por defecto.</p>
        )}
      </Card>

      <Card>
        <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
          <p className="de-display font-semibold">Rentabilidad del día</p>
          <div className="flex items-center gap-2 text-xs">
            <span style={{ color: "var(--slate)" }}>Calcular sobre:</span>
            {[{ id: "entregado", label: "Lo entregado" }, { id: "total", label: "Todo lo cargado" }].map((o) => (
              <button
                key={o.id}
                onClick={() => cambiarBase(o.id)}
                className="de-focus px-2.5 py-1 rounded-full font-semibold"
                style={base === o.id ? { background: "var(--route)", color: "white" } : { background: "var(--paper)", color: "var(--route)" }}
              >
                {o.label}
              </button>
            ))}
          </div>
        </div>

        <div className="flex flex-wrap items-center gap-3 rounded-xl p-4 mb-4" style={{ background: tipoRendimiento(r).bg }}>
          <div className="flex-1 min-w-[180px]">
            <p className="text-[10px] font-bold uppercase tracking-wide" style={{ color: tipoRendimiento(r).color }}>Tipo de rendimiento</p>

function MapaVivoTab({ db, choferes, zonas, facturas }) {
  const [ubicaciones, setUbicaciones] = useState({});
  const [cargando, setCargando] = useState(true);
  const [choferDetalle, setChoferDetalle] = useState(null);

  useEffect(() => {
    if (!db) { setCargando(false); return; }
    const unsub = db.collection("ubicaciones").onSnapshot(
      (snap) => {
        const nuevo = {};
        snap.docs.forEach((d) => { nuevo[d.id] = d.data(); });
        setUbicaciones(nuevo);
        setCargando(false);
      },
      () => setCargando(false)
    );
    return () => unsub();
  }, [db]);

  const haceTiempo = (iso) => {
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return "hace instantes";
    if (min < 60) return `hace ${min} min`;
    return `hace ${Math.round(min / 60)} h`;
  };

  const activos = choferes
    .map((c) => ({ chofer: c, datos: ubicaciones[c.id] }))
    .filter((x) => x.datos && x.datos.ultima)
    .sort((a, b) => new Date(b.datos.ultima.ts) - new Date(a.datos.ultima.ts));

  if (choferDetalle) {
    const chofer = choferes.find((c) => c.id === choferDetalle);
    const datos = ubicaciones[choferDetalle];
    const zonasChofer = zonas.filter((z) => z.choferId === choferDetalle);
    const entregas = facturas
      .filter((f) => f.estado === "entregado" && zonasChofer.some((z) => z.id === f.zonaId))
      .sort((a, b) => new Date(a.fechaHora) - new Date(b.fechaHora));

    const historial = (datos && datos.historial) || [];
    // Reduce a un máximo de ~20 puntos para el link de ruta (límite práctico de Google Maps)
    const paso = Math.max(1, Math.ceil(historial.length / 20));
    const puntosRuta = historial.filter((_, i) => i % paso === 0);
    const urlRuta = puntosRuta.length >= 2
      ? `https://www.google.com/maps/dir/${puntosRuta.map((p) => `${p.lat},${p.lng}`).join("/")}`
      : null;

    return (
      <Card>
        <div className="flex items-center gap-2 mb-1">
          <button onClick={() => setChoferDetalle(null)} className="de-focus p-1 -ml-1 rounded-lg" style={{ color: "var(--route)" }}>
            <ArrowLeft size={18} />
          </button>
          <p className="de-display font-semibold">{chofer?.nombre}</p>
        </div>
        <p className="text-xs mb-4 ml-7" style={{ color: "var(--slate)" }}>
          {zonasChofer.map((z) => z.nombre).join(", ") || "sin zona"} · {datos?.ultima ? haceTiempo(datos.ultima.ts) : "sin datos"}
          {datos && datos.fecha === fechaLocalHoy() && ` · ${formatKm(datos.kmRecorridos != null ? datos.kmRecorridos : kmDeHistorial(datos.historial))} hoy`}
        </p>

        <div className="flex flex-col gap-2 mb-5">
          {datos?.ultima && (
            <a
              href={`https://www.google.com/maps?q=${datos.ultima.lat},${datos.ultima.lng}`}
              target="_blank"
              rel="noreferrer"
              className="de-focus flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold"
              style={{ background: "var(--teal-soft)", color: "var(--teal)" }}
            >
              <MapPin size={15} /> Ver posición actual
            </a>
          )}
          {urlRuta && (
            <a
              href={urlRuta}
              target="_blank"
              rel="noreferrer"
              className="de-focus flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold"
              style={{ background: "var(--paper)", color: "var(--route)", border: "1px solid var(--line)" }}
            >
              <Route size={15} /> Ver recorrido completo del día ({historial.length} puntos)
            </a>
          )}
        </div>

        <p className="de-display font-semibold mb-3 text-sm">Entregas de hoy ({entregas.length})</p>
        {entregas.length === 0 ? (
          <EmptyState icon={Package} title="Todavía no entregó ninguna factura" />
        ) : (
          <div className="relative pl-6">
            <div className="absolute left-[9px] top-2 bottom-2 de-dash-line w-0.5" />
            {entregas.map((f) => (
              <div key={f.id} className="relative mb-3">
                <div className="absolute -left-6 top-1.5 w-3 h-3 rounded-full border-2" style={{ background: "var(--teal)", borderColor: "var(--teal)" }} />
                <div className="flex items-start justify-between gap-2 text-sm">
                  <div className="min-w-0">
                    <p className="font-semibold truncate">{f.cliente}</p>
                    <p className="text-xs de-mono" style={{ color: "var(--slate)" }}>
                      {f.factura} · {formatMoney(parseImporte(f.importe))}{f.unidades && ` · ${f.unidades} un.`} · {new Date(f.fechaHora).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}
                    </p>
                  </div>
                  {f.ubicacion && f.ubicacion.lat && (
                    <a
                      href={`https://www.google.com/maps?q=${f.ubicacion.lat},${f.ubicacion.lng}`}
                      target="_blank"
                      rel="noreferrer"
                      className="de-focus shrink-0"
                      style={{ color: "var(--teal)" }}
                    >
                      <MapPin size={16} />
                    </a>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
    );
  }

  return (
    <Card>
      <div className="flex items-center justify-between mb-1">
        <p className="de-display font-semibold">Mapa en vivo</p>
        <span className="text-xs font-semibold flex items-center gap-1.5" style={{ color: "var(--teal)" }}>
          <span className="w-2 h-2 rounded-full" style={{ background: "var(--teal)" }} /> En vivo
        </span>
      </div>
      <p className="text-xs mb-4" style={{ color: "var(--slate)" }}>Tocá un chofer para ver su recorrido y las entregas del día. Esta pantalla se actualiza sola, al instante.</p>

      {cargando ? (
        <div className="flex justify-center py-10"><Loader2 className="animate-spin" size={22} style={{ color: "var(--route)" }} /></div>
      ) : activos.length === 0 ? (
        <EmptyState icon={MapPin} title="Ningún chofer transmitiendo ubicación ahora" subtitle="Se activa solo cuando el chofer entra a 'Soy chofer' y acepta el permiso de ubicación en su celular." />
      ) : (
        <div className="space-y-2">
          {activos.map(({ chofer, datos }) => {
            const zona = zonas.find((z) => z.choferId === chofer.id);
            const vieja = (Date.now() - new Date(datos.ultima.ts).getTime()) > 10 * 60000;
            return (
              <button
                key={chofer.id}
                onClick={() => setChoferDetalle(chofer.id)}
                className="de-focus w-full flex items-center justify-between gap-2 p-3 rounded-xl text-left"
                style={{ background: "var(--paper)" }}
              >
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-9 h-9 rounded-full flex items-center justify-center de-display font-bold text-sm shrink-0" style={{ background: vieja ? "var(--slate)" : "var(--teal)", color: "white" }}>
                    {chofer.nombre.charAt(0).toUpperCase()}
                  </div>
                  <div className="min-w-0">
                    <p className="font-semibold text-sm truncate">{chofer.nombre}</p>
                    <p className="text-xs truncate" style={{ color: "var(--slate)" }}>
                      {zona?.nombre || "sin zona"} · {haceTiempo(datos.ultima.ts)}{vieja ? " · sin señal reciente" : ""}
                    </p>
                  </div>
                </div>
                <MapPin size={16} className="shrink-0" style={{ color: vieja ? "var(--slate)" : "var(--teal)" }} />
              </button>
            );
          })}
        </div>
      )}
    </Card>
  );
}

function ChoferFlow({ db, assetsApi, choferes, zonas, facturas, setFacturas, clientes, vehiculos, onExit }) {
  const [choferId, setChoferId] = useState(null);
  const [vehiculoId, setVehiculoId] = useState(null);
  const [zonaId, setZonaId] = useState(null);
  const [clienteId, setClienteId] = useState(null);
  const [busqueda, setBusqueda] = useState("");
  const [marcando, setMarcando] = useState(null);
  const [aDeshacer, setADeshacer] = useState(null);
  const [cargandoCombustible, setCargandoCombustible] = useState(false);
  const [errorGuardado, setErrorGuardado] = useState(null);
  const [subiendoFoto, setSubiendoFoto] = useState(null);
  const [errorFoto, setErrorFoto] = useState(null);
  const [proximaParada, setProximaParada] = useState(null);

  const chofer = choferes.find((c) => c.id === choferId);
  const vehiculo = vehiculos.find((v) => v.id === vehiculoId);
  const zonasDeChofer = zonas.length === 1 ? zonas : zonas.filter((z) => z.choferId === choferId);
  const zona = zonas.find((z) => z.id === zonaId);
  const cliente = clientes.find((c) => c.id === clienteId);

  useEffect(() => {
    if (choferId && !vehiculoId && vehiculos.length === 1) {
      setVehiculoId(vehiculos[0].id);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [choferId, vehiculos.length]);

  useEffect(() => {
    if (!zonaId && zonasDeChofer.length === 1) {
      setZonaId(zonasDeChofer[0].id);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [choferId, zonasDeChofer.length]);

  useEffect(() => {
    if (!choferId || !db) return;
    let cancelado = false;

    const transmitirUbicacion = async () => {
      const ubic = await obtenerUbicacion();
      if (cancelado || !ubic || !ubic.lat) return;
      try {
        const ref = db.doc(`ubicaciones/${choferId}`);
        const snap = await ref.get();
        const previo = snap.exists ? snap.data() : null;
        const hoy = fechaLocalHoy();
        const mismoDia = previo && previo.fecha === hoy;
        const historialPrevio = mismoDia ? (previo.historial || []) : [];
        const punto = { lat: ubic.lat, lng: ubic.lng, ts: new Date().toISOString() };

        // Kilómetros: se miden desde el último punto "ancla". El ancla solo avanza cuando el
        // camión se movió más de 40 m (así el temblor del GPS estando parado no suma), y las
        // lecturas imprecisas (>100 m) o los saltos imposibles (>150 km/h) se ignoran.
        let km = mismoDia ? (previo.kmRecorridos || 0) : 0;
        let ancla = mismoDia ? (previo.anclaKm || null) : null;
        if ((ubic.precision || 0) <= 100) {
          if (!ancla) {
            ancla = punto;
          } else {
            const d = distanciaKm(ancla, punto);
            const horas = Math.max((new Date(punto.ts) - new Date(ancla.ts)) / 3600000, 1 / 3600);
            if (d / horas > 150) ancla = punto; // salto raro: se reinicia el ancla sin sumar
            else if (d >= 0.04) { km += d; ancla = punto; }
          }
        }

        await ref.set({
          fecha: hoy,
          ultima: punto,
          historial: [...historialPrevio, punto].slice(-1500), // ~18 h de recorrido a 1 punto cada 45 s
          kmRecorridos: Math.round(km * 1000) / 1000,
          // km que ya se informaron en un cierre anterior del mismo día (para no contarlos dos veces)
          kmYaCerrados: mismoDia ? (previo.kmYaCerrados || 0) : 0,
          anclaKm: ancla,
          vehiculoId: vehiculoId || null,
        });
      } catch (e) {}
    };

    transmitirUbicacion();
    const intervalo = setInterval(transmitirUbicacion, 45000);
    return () => { cancelado = true; clearInterval(intervalo); };
  }, [choferId, db, vehiculoId]);

  const facturasDeCliente = (cli) => facturas.filter((f) => {
    if (f.zonaId !== cli.zonaId) return false;
    if (cli.codigo && f.clienteCodigo) return f.clienteCodigo.toLowerCase() === cli.codigo.toLowerCase();
    return f.cliente.trim().toLowerCase() === cli.nombre.trim().toLowerCase();
  });

  const marcarEntregado = async (facturaId) => {
    setMarcando(facturaId);
    const ahora = new Date().toISOString();
    const ubicacion = await obtenerUbicacion();
    const facturasActualizadas = facturas.map((f) => f.id === facturaId ? { ...f, estado: "entregado", fechaHora: ahora, ubicacion } : f);
    let guardadoOk = await setFacturas(facturasActualizadas);

    if (!guardadoOk && db) {
      // La escritura pudo haber llegado igual (conexión inestable, se perdió la confirmación).
      // Antes de mostrar un error, verificamos contra lo que realmente quedó guardado.
      try {
        const snap = await db.doc(`facturas_por_zona/${zonaId}`).get();
        const lista = (snap.exists && snap.data() && snap.data().list) || [];
        const enServidor = lista.find((f) => f.id === facturaId);
        if (enServidor && enServidor.estado === "entregado") {
          guardadoOk = true;
        }
      } catch (e) {
        ultimoErrorDb = { codigo: (e && (e.code || e.name)) || "desconocido_verificacion", mensaje: (e && e.message) || String(e) };
      }
    }

    setMarcando(null);

    if (!guardadoOk) {
      const detalle = ultimoErrorDb ? ` (motivo: ${ultimoErrorDb.codigo} — ${ultimoErrorDb.mensaje}${ultimoErrorDb.tam ? ` — ${ultimoErrorDb.tam}` : ""})` : "";
      setErrorGuardado(`No se pudo registrar la entrega. Revisá tu conexión y volvé a tocar 'Marcar entregado'.${detalle}`);
      return;
    }
    setErrorGuardado(null);

    // Buscar la próxima parada, pero solo si este cliente ya no tiene más facturas pendientes
    const coincideCliente = (f, c) => (c.codigo && f.clienteCodigo) ? f.clienteCodigo.toLowerCase() === c.codigo.toLowerCase() : f.cliente.trim().toLowerCase() === c.nombre.trim().toLowerCase();

    const quedanPendientesDeEsteCliente = cliente
      ? facturasActualizadas.some((f) => f.zonaId === zonaId && f.estado === "pendiente" && coincideCliente(f, cliente))
      : false;
    if (quedanPendientesDeEsteCliente) return;

    const clientesZonaOrdenados = clientes
      .filter((c) => c.zonaId === zonaId)
      .sort((a, b) => (a.orden ?? 9999) - (b.orden ?? 9999));
    const siguiente = clientesZonaOrdenados.find((c) => {
      if (c.id === clienteId) return false;
      return facturasActualizadas.some((f) => f.zonaId === zonaId && f.estado === "pendiente" && coincideCliente(f, c));
    });
    if (siguiente) setProximaParada(siguiente);
  };

  const destildarEntrega = (facturaId) => setADeshacer(facturaId);

  const subirFoto = async (facturaId, file) => {
    if (!file) return;
    if (!assetsApi) {
      setErrorFoto("La función de fotos no está disponible en esta vista.");
      return;
    }
    setSubiendoFoto(facturaId);
    setErrorFoto(null);
    try {
      const resultado = await assetsApi.upload(file);
      const facturasActualizadas = facturas.map((f) => f.id === facturaId ? { ...f, fotoId: resultado.id } : f);
      const ok = await setFacturas(facturasActualizadas);
      if (!ok) setErrorFoto("La foto se subió pero no se pudo guardar la referencia. Probá de nuevo.");
    } catch (e) {
      const codigo = (e && e.code) || "desconocido";
      setErrorFoto(`No se pudo subir la foto (${codigo}).`);
    }
    setSubiendoFoto(null);
  };

  // --- Paso 1: elegir chofer ---
  if (!choferId) {
    return (
      <div className="max-w-md mx-auto px-4 pb-16">
        <Header title="¿Quién sos?" subtitle="Elegí tu nombre para ver tus entregas" onExit={onExit} />
        <div className="flex items-start gap-2 mt-3 mb-1 p-3 rounded-xl text-xs" style={{ background: "var(--amber-soft)", color: "var(--amber)" }}>
          <MapPin size={14} className="mt-0.5 shrink-0" />
          <span>Mientras uses la app como chofer, tu ubicación se comparte con el administrador para el seguimiento en vivo.</span>
        </div>
        {choferes.length === 0 ? (
          <EmptyState icon={Users} title="Todavía no hay choferes cargados" subtitle="Pedile al administrador que cargue la lista." />
        ) : (
          <div className="space-y-2 mt-4">
            {choferes.map((c) => (
              <button
                key={c.id}
                onClick={() => setChoferId(c.id)}
                className="de-focus w-full flex items-center gap-3 p-4 rounded-2xl text-left"
                style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}
              >
                <div className="w-11 h-11 rounded-full flex items-center justify-center de-display font-bold" style={{ background: "var(--route)", color: "white" }}>
                  {c.nombre.charAt(0).toUpperCase()}
                </div>
                <div>
                  <p className="font-semibold">{c.nombre}</p>
                  {c.acompanante && (
                    <p className="text-xs de-mono" style={{ color: "var(--slate)" }}>{c.acompanante}</p>
                  )}
                </div>
              </button>
            ))}
          </div>
        )}
      </div>
    );
  }

  // --- Paso 1.5: elegir vehículo de hoy (se salta si hay uno solo o ninguno cargado) ---
  if (!vehiculoId && vehiculos.length > 1) {
    return (
      <div className="max-w-md mx-auto px-4 pb-16">
        <Header title={chofer.nombre} subtitle="¿Qué vehículo sale hoy?" onBack={() => setChoferId(null)} onExit={onExit} />
        <div className="space-y-2 mt-4">
          {vehiculos.map((v) => (
            <button
              key={v.id}
              onClick={() => setVehiculoId(v.id)}
              className="de-focus w-full flex items-center gap-3 p-4 rounded-2xl text-left"
              style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}
            >
              <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style={{ background: "var(--amber-soft)", color: "var(--amber)" }}>
                <Truck size={20} />
              </div>
              <div>
                <p className="font-semibold de-mono">{v.patente}</p>
                {v.modelo && <p className="text-xs" style={{ color: "var(--slate)" }}>{v.modelo}</p>}
              </div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  // --- Paso 2: elegir zona (si tiene más de una; se salta si solo tiene una) ---
  if (!zonaId) {
    if (zonasDeChofer.length === 1) {
      return (
        <div className="de-root flex items-center justify-center min-h-[300px]">
          <Loader2 className="animate-spin" size={22} style={{ color: "var(--route)" }} />
        </div>
      );
    }
    return (
      <div className="max-w-md mx-auto px-4 pb-16">
        <Header
          title={chofer.nombre}
          subtitle={vehiculo ? `Elegí la zona de hoy · 🚐 ${vehiculo.patente}` : "Elegí la zona de hoy"}
          onBack={() => setChoferId(null)}
          onExit={onExit}
          onCombustible={vehiculoId ? () => setCargandoCombustible(true) : undefined}
        />
        {zonasDeChofer.length === 0 ? (
          <EmptyState icon={Route} title="No tenés zonas asignadas" subtitle="Avisale al administrador." />
        ) : (
          <div className="space-y-2 mt-4">
            {zonasDeChofer.map((z) => {
              const fz = facturas.filter((f) => f.zonaId === z.id);
              const pend = fz.filter((f) => f.estado === "pendiente").length;
              return (
                <button
                  key={z.id}
                  onClick={() => setZonaId(z.id)}
                  className="de-focus w-full flex items-center justify-between p-4 rounded-2xl text-left"
                  style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}
                >
                  <div className="flex items-center gap-2">
                    <MapPin size={16} style={{ color: "var(--amber)" }} />
                    <span className="font-semibold">{z.nombre}</span>
                  </div>
                  <span className="text-xs font-semibold px-2 py-1 rounded-full" style={{ background: "var(--amber-soft)", color: "var(--amber)" }}>
                    {pend} pendiente{pend !== 1 ? "s" : ""}
                  </span>
                </button>
              );
            })}
          </div>
        )}

        {cargandoCombustible && (
          <CombustibleModal
            db={db}
            choferId={choferId}
            vehiculoId={vehiculoId}
            onCerrar={() => setCargandoCombustible(false)}
          />
        )}
      </div>
    );
  }

  const volverAZona = () => {
    setClienteId(null);
    setBusqueda("");
    if (zonasDeChofer.length > 1) setZonaId(null); else setChoferId(null);
  };

  // --- Paso 3: elegir cliente de la zona ---
  if (!clienteId) {
    const clientesZona = clientes
      .filter((c) => c.zonaId === zonaId)
      .filter((c) => facturasDeCliente(c).length > 0)
      .sort((a, b) => (a.orden ?? 9999) - (b.orden ?? 9999));
    const filtrados = busqueda.trim()
      ? clientesZona.filter((c) => c.nombre.toLowerCase().includes(busqueda.trim().toLowerCase()))
      : clientesZona;

    return (
      <div className="max-w-md mx-auto px-4 pb-16">
        <Header title={zona.nombre} subtitle={vehiculo ? `Elegí el cliente · 🚐 ${vehiculo.patente}` : "Elegí el cliente"} onBack={volverAZona} onExit={onExit} onCombustible={vehiculoId ? () => setCargandoCombustible(true) : undefined} />

        {clientesZona.length === 0 ? (
          <EmptyState icon={Store} title="No hay clientes cargados en esta zona" subtitle="Pedile al administrador que los cargue." />
        ) : (
          <>
            <div className="relative mt-4 mb-3">
              <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: "var(--slate)" }} />
              <input
                value={busqueda}
                onChange={(e) => setBusqueda(e.target.value)}
                placeholder="Buscar cliente..."
                className="de-focus w-full text-sm rounded-xl pl-9 pr-3 py-2.5 border"
                style={{ borderColor: "var(--line)", background: "var(--card)" }}
              />
            </div>
            <div className="space-y-2">
              {filtrados.map((c) => {
                const fc = facturasDeCliente(c);
                const pend = fc.filter((f) => f.estado === "pendiente").length;
                return (
                  <button
                    key={c.id}
                    onClick={() => setClienteId(c.id)}
                    className="de-focus w-full flex items-center justify-between gap-3 p-4 rounded-2xl text-left"
                    style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}
                  >
                    <div className="min-w-0">
                      <p className="font-semibold text-sm truncate">{c.nombre}</p>
                      {c.domicilio && <p className="text-xs truncate mt-0.5" style={{ color: "var(--ink)" }}>{c.domicilio}</p>}
                      {c.localidad && <p className="text-xs mt-0.5" style={{ color: "var(--slate)" }}>{c.localidad}</p>}
                    </div>
                    {fc.length > 0 ? (
                      <span
                        className="text-xs font-semibold px-2 py-1 rounded-full whitespace-nowrap shrink-0"
                        style={{ background: pend > 0 ? "var(--amber-soft)" : "var(--teal-soft)", color: pend > 0 ? "var(--amber)" : "var(--teal)" }}
                      >
                        {pend > 0 ? `${pend} pend.` : "entregado"}
                      </span>
                    ) : (
                      <span className="text-xs px-2 py-1 rounded-full whitespace-nowrap shrink-0" style={{ background: "var(--paper)", color: "var(--slate)" }}>
                        sin fact.
                      </span>
                    )}
                  </button>
                );
              })}
              {filtrados.length === 0 && (
                <EmptyState icon={Search} title="Sin resultados" subtitle="Probá con otro nombre." />
              )}
            </div>
          </>
        )}

        {cargandoCombustible && (
          <CombustibleModal
            db={db}
            choferId={choferId}
            vehiculoId={vehiculoId}
            onCerrar={() => setCargandoCombustible(false)}
          />
        )}

        {proximaParada && (
          <ProximaParadaBanner
            cliente={proximaParada}
            onCerrar={() => setProximaParada(null)}
            onVerCliente={() => { setClienteId(proximaParada.id); setProximaParada(null); }}
          />
        )}
      </div>
    );
  }

  // --- Paso 4: facturas del cliente elegido ---
  const facturasCliente = facturasDeCliente(cliente);
  const pendientes = facturasCliente.filter((f) => f.estado === "pendiente");
  const entregadas = facturasCliente.filter((f) => f.estado === "entregado");

  return (
    <div className="max-w-md mx-auto px-4 pb-16">
      <Header
        title={cliente.nombre}
        subtitle={`${zona.nombre} · ${pendientes.length} pendiente${pendientes.length !== 1 ? "s" : ""}`}
        onBack={() => setClienteId(null)}
        onExit={onExit}
        onCombustible={vehiculoId ? () => setCargandoCombustible(true) : undefined}
      />

      {errorGuardado && (
        <div className="flex items-start gap-2 mt-3 p-3 rounded-xl" style={{ background: "var(--danger-soft)" }}>
          <AlertCircle size={16} className="mt-0.5 shrink-0" style={{ color: "var(--danger)" }} />
          <p className="text-sm" style={{ color: "var(--danger)" }}>{errorGuardado}</p>
        </div>
      )}

      {errorFoto && (
        <div className="flex items-start gap-2 mt-3 p-3 rounded-xl" style={{ background: "var(--danger-soft)" }}>
          <AlertCircle size={16} className="mt-0.5 shrink-0" style={{ color: "var(--danger)" }} />
          <p className="text-sm" style={{ color: "var(--danger)" }}>{errorFoto}</p>
        </div>
      )}

      {(cliente.domicilio || cliente.localidad) && (
        <a
          href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([cliente.domicilio, cliente.localidad].filter(Boolean).join(", "))}`}
          target="_blank"
          rel="noreferrer"
          className="de-focus flex items-start gap-2 mt-3 mb-1 p-3 rounded-xl"
          style={{ background: "var(--amber-soft)" }}
        >
          <MapPin size={16} className="mt-0.5 shrink-0" style={{ color: "var(--amber)" }} />
          <div className="min-w-0">
            {cliente.domicilio && <p className="text-sm font-semibold" style={{ color: "var(--ink)" }}>{cliente.domicilio}</p>}
            {cliente.localidad && <p className="text-xs" style={{ color: "var(--slate)" }}>{cliente.localidad}</p>}
            <p className="text-xs font-semibold mt-0.5" style={{ color: "var(--amber)" }}>Ver en el mapa →</p>
          </div>
        </a>
      )}

      {cliente.telefono ? (
        <a
          href={`https://wa.me/${cliente.telefono.replace(/\D/g, "")}?text=${encodeURIComponent(`Hola! Le escribimos de Portal Distribuidora, en breve llega su pedido a ${cliente.domicilio || "su domicilio"}. ¡Gracias por su compra!`)}`}
          target="_blank"
          rel="noreferrer"
          className="de-focus w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold mb-3"
          style={{ background: "#25D366", color: "white" }}
        >
          📲 Avisar por WhatsApp que estoy llegando
        </a>
      ) : (
        <p className="text-xs mb-3" style={{ color: "var(--slate)" }}>Este cliente no tiene teléfono cargado (se agrega desde el panel administrador).</p>
      )}

      {facturasCliente.length === 0 ? (
        <EmptyState icon={Package} title="Este cliente no tiene facturas cargadas hoy" />
      ) : (
        <div className="mt-4 relative pl-6">
          <div className="absolute left-[9px] top-2 bottom-2 de-dash-line w-0.5" />
          {[...pendientes, ...entregadas].map((f) => (
            <div key={f.id} className="relative mb-3">
              <div
                className="absolute -left-6 top-5 w-3 h-3 rounded-full border-2"
                style={{
                  background: f.estado === "entregado" ? "var(--teal)" : "var(--card)",
                  borderColor: f.estado === "entregado" ? "var(--teal)" : "var(--amber)",
                }}
              />
              <div className="rounded-2xl p-4" style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}>
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <p className="font-semibold text-sm de-mono truncate">{f.factura}</p>
                    <p className="text-sm de-mono font-semibold mt-1">
                      {formatMoney(parseImporte(f.importe))}{f.unidades && <span className="font-normal" style={{ color: "var(--slate)" }}> · {f.unidades} un.</span>}
                    </p>
                  </div>
                  <Badge estado={f.estado} />
                </div>
                {f.estado === "pendiente" ? (
                  <button
                    onClick={() => marcarEntregado(f.id)}
                    disabled={marcando === f.id}
                    className="de-btn-amber de-focus w-full mt-3 py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2"
                    style={{ opacity: marcando === f.id ? 0.7 : 1 }}
                  >
                    {marcando === f.id ? (
                      <><Loader2 size={17} className="animate-spin" /> Ubicando...</>
                    ) : (
                      <><CheckCircle2 size={17} /> Marcar entregado</>
                    )}
                  </button>
                ) : (
                  <div className="flex items-center justify-between mt-2 gap-2">
                    <p className="text-xs flex items-center gap-1 min-w-0" style={{ color: "var(--slate)" }}>
                      <Clock size={12} className="shrink-0" />
                      <span className="truncate">
                        {new Date(f.fechaHora).toLocaleString("es-AR")}
                      </span>
                    </p>
                    <button
                      onClick={() => destildarEntrega(f.id)}
                      className="de-focus text-xs font-semibold shrink-0 flex items-center gap-1"
                      style={{ color: "var(--danger)" }}
                    >
                      <RefreshCw size={11} /> Deshacer
                    </button>
                  </div>
                )}
                {f.estado === "entregado" && (
                  f.ubicacion && f.ubicacion.lat ? (
                    <a
                      href={`https://www.google.com/maps?q=${f.ubicacion.lat},${f.ubicacion.lng}`}
                      target="_blank"
                      rel="noreferrer"
                      className="de-focus text-xs font-semibold mt-1.5 flex items-center gap-1"
                      style={{ color: "var(--teal)" }}
                    >
                      <MapPin size={12} /> Ver ubicación de la entrega
                    </a>
                  ) : (
                    <p className="text-xs mt-1.5 flex items-center gap-1" style={{ color: "var(--amber)" }}>
                      <AlertCircle size={12} /> Sin ubicación{f.ubicacion?.error ? ` (${f.ubicacion.error})` : ""}
                    </p>
                  )
                )}

                {f.estado === "entregado" && (
                  f.fotoId ? (
                    <FotoFactura fotoId={f.fotoId} alt="Foto de la factura" className="w-full max-h-40 object-cover rounded-lg" linkClassName="de-focus block mt-2 w-full" />
                  ) : subiendoFoto === f.id ? (
                    <div
                      className="flex items-center justify-center gap-1.5 w-full mt-2 py-2 rounded-lg text-xs font-semibold"
                      style={{ background: "var(--paper)", border: "1px dashed var(--line)", color: "var(--route)" }}
                    >
                      <Loader2 size={13} className="animate-spin" /> Subiendo foto...
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-2 mt-2">
                      {/* capture="environment" abre directo la cámara trasera del celular */}
                      <label
                        className="de-focus flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-xs font-semibold cursor-pointer"
                        style={{ background: "var(--route)", color: "white" }}
                      >
                        📷 Sacar foto
                        <input
                          type="file"
                          accept="image/*"
                          capture="environment"
                          className="hidden"
                          onChange={(e) => subirFoto(f.id, e.target.files && e.target.files[0])}
                        />
                      </label>
                      <label
                        className="de-focus flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-xs font-semibold cursor-pointer"
                        style={{ background: "var(--paper)", border: "1px dashed var(--line)", color: "var(--route)" }}
                      >
                        🖼️ Desde galería
                        <input
                          type="file"
                          accept="image/*"
                          className="hidden"
                          onChange={(e) => subirFoto(f.id, e.target.files && e.target.files[0])}
                        />
                      </label>
                    </div>
                  )
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      {aDeshacer && (
        <ConfirmModal
          mensaje="¿Deshacer esta entrega? Va a volver a quedar como pendiente."
          textoConfirmar="Sí, deshacer"
          onCancelar={() => setADeshacer(null)}
          onConfirmar={() => {
            setFacturas(facturas.map((f) => f.id === aDeshacer ? { ...f, estado: "pendiente", fechaHora: null, ubicacion: null } : f));
            setADeshacer(null);
          }}
        />
      )}

      {cargandoCombustible && (
        <CombustibleModal
          db={db}
          choferId={choferId}
          vehiculoId={vehiculoId}
          onCerrar={() => setCargandoCombustible(false)}
        />
      )}

      {proximaParada && (
        <ProximaParadaBanner
          cliente={proximaParada}
          onCerrar={() => setProximaParada(null)}
          onVerCliente={() => { setClienteId(proximaParada.id); setProximaParada(null); }}
        />
      )}
    </div>
  );
}

function Header({ title, subtitle, onBack, onExit, onCombustible }) {
  return (
    <div className="flex items-start justify-between pt-6 pb-2">
      <div className="flex items-start gap-2">
        {onBack && (
          <button onClick={onBack} className="de-focus p-1.5 mt-0.5 rounded-lg" style={{ color: "var(--route)" }}>
            <ArrowLeft size={20} />
          </button>
        )}
        <div>
          <h1 className="de-display text-xl font-bold leading-tight">{title}</h1>
          {subtitle && <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>{subtitle}</p>}
        </div>
      </div>
      <div className="flex items-center gap-1 shrink-0">
        {onCombustible && (
          <button onClick={onCombustible} className="de-focus p-1.5 rounded-lg" style={{ color: "var(--amber)" }} aria-label="Cargar combustible">
            <Fuel size={18} />
          </button>
        )}
        {onExit && (
          <button onClick={onExit} className="de-focus text-xs font-semibold px-2.5 py-1.5 rounded-lg" style={{ color: "var(--slate)" }}>
            Salir
          </button>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  APP RAÍZ                                                            */
/* ------------------------------------------------------------------ */

function App() {
  const db = useDb();
  const assetsApi = useAssets();
  const [choferes, setChoferes, loadingC] = useDbListDoc(db, "meta/choferes");
  const [zonas, setZonas, loadingZ] = useDbListDoc(db, "meta/zonas");
  const [clientes, setClientes, loadingCl] = useDbShardedByZona(db, "clientes_por_zona");
  const [facturas, setFacturas, loadingF] = useDbShardedByZona(db, "facturas_por_zona");
  const [vehiculos, setVehiculos, loadingV] = useDbListDoc(db, "meta/vehiculos");
  const [combustible, loadingCo] = useDbCollectionLive(db, "combustible");
  const [historialDias, loadingHist] = useDbCollectionLive(db, "historial_dias");
  // Punto de salida de los camiones (se guarda como lista de un solo elemento: [{ direccion, lat, lng }])
  const [depositoList, setDepositoList, loadingDep] = useDbListDoc(db, "meta/deposito");
  const [role, setRole] = useState(null);
  // En celular solo se ofrece "Soy chofer"; Logística y Administración quedan para la PC.
  const detectarMovil = () => {
    const ua = navigator.userAgent || "";
    if (/Android|iPhone|iPod|Mobile|Windows Phone/i.test(ua)) return true;
    return !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches && window.matchMedia("(max-width: 900px)").matches);
  };
  const [esMovil, setEsMovil] = useState(detectarMovil);
  useEffect(() => {
    const onResize = () => setEsMovil(detectarMovil());
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const [testGeo, setTestGeo] = useState(null);
  const [testGeoLoading, setTestGeoLoading] = useState(false);
  const [testGeoApi, setTestGeoApi] = useState(null);
  const [testGeoApiLoading, setTestGeoApiLoading] = useState(false);

  const loading = db === undefined || loadingC || loadingZ || loadingCl || loadingF || loadingV || loadingCo || loadingHist || loadingDep;
  const dbNoDisponible = db === null;

  useEffect(() => {
    if (loading || dbNoDisponible) return;
    if (zonas.length === 0) {
      setZonas([{ id: "zona_unica", nombre: "Ruta del día", choferId: null, choferTexto: "" }]);
    }
  }, [loading, dbNoDisponible, zonas.length]);

  if (dbNoDisponible) {
    return (
      <div className="de-root flex items-center justify-center min-h-[400px] px-6 text-center">
        <GlobalStyle />
        <div>
          <AlertCircle size={28} style={{ color: "var(--danger)", margin: "0 auto 10px" }} />
          <p className="de-display font-semibold mb-1">No se pudo conectar a la base de datos</p>
          <p className="text-sm" style={{ color: "var(--slate)" }}>Recargá la página. Si el problema sigue, avisá al administrador de la cuenta.</p>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div className="de-root flex items-center justify-center min-h-[400px]">
        <Loader2 className="animate-spin" size={26} style={{ color: "var(--route)" }} />
        <GlobalStyle />
      </div>
    );
  }

  return (
    <div className="de-root min-h-full">
      <GlobalStyle />

      {role === "admin" && (
        <AdminPanel
          db={db}
          choferes={choferes} setChoferes={setChoferes}
          zonas={zonas} setZonas={setZonas}
          facturas={facturas} setFacturas={setFacturas}
          clientes={clientes} setClientes={setClientes}
          vehiculos={vehiculos} setVehiculos={setVehiculos}
          combustible={combustible}
          historialDias={historialDias}
          onExit={() => setRole(null)}
        />
      )}

      {role === "logistica" && (
        <LogisticaPanel
          db={db}
          choferes={choferes}
          deposito={depositoList[0] || null}
          setDeposito={(d) => setDepositoList(d ? [d] : [])}
          zonas={zonas} setZonas={setZonas}
          facturas={facturas} setFacturas={setFacturas}
          clientes={clientes} setClientes={setClientes}
          onExit={() => setRole(null)}
        />
      )}

      {role === "chofer" && (
        <ChoferFlow
          db={db}
          assetsApi={assetsApi}
          choferes={choferes} zonas={zonas}
          facturas={facturas} setFacturas={setFacturas}
          clientes={clientes} vehiculos={vehiculos}
          onExit={() => setRole(null)}
        />
      )}

      {!role && (
        <div className="de-landing max-w-md mx-auto px-4 pt-14 pb-16 text-center">
          <div className="de-hero">
            <img className="de-hero-logo" src={LOGO_BLANCO} alt="Portal Distribuidora" />
            <h1 className="de-display font-bold">Control de entregas</h1>
            <p className="text-sm mt-1.5">Elegí cómo querés entrar</p>
          </div>

          {(clientes.length > 0 || facturas.length > 0) && (
            <div className="de-stats grid grid-cols-3 gap-2 mb-6">
              <div className="rounded-2xl p-3" style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}>
                <Store size={16} className="mx-auto mb-1" style={{ color: "var(--route)" }} />
                <p className="de-display text-lg font-bold leading-none">{clientes.length}</p>
                <p className="text-[11px] mt-1" style={{ color: "var(--slate)" }}>Clientes</p>
              </div>
              <div className="rounded-2xl p-3" style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}>
                <Package size={16} className="mx-auto mb-1" style={{ color: "var(--amber)" }} />
                <p className="de-display text-lg font-bold leading-none">
                  {facturas.filter((f) => f.estado === "entregado").length}<span className="text-xs font-normal" style={{ color: "var(--slate)" }}>/{facturas.length}</span>
                </p>
                <p className="text-[11px] mt-1" style={{ color: "var(--slate)" }}>Boletas entreg.</p>
              </div>
              <div className="rounded-2xl p-3" style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}>
                <ClipboardList size={16} className="mx-auto mb-1" style={{ color: "var(--teal)" }} />
                <p className="de-display text-lg font-bold leading-none">
                  {facturas.filter((f) => f.estado === "entregado").reduce((s, f) => s + (parseInt(f.unidades, 10) || 0), 0)}
                </p>
                <p className="text-[11px] mt-1" style={{ color: "var(--slate)" }}>Unidades entreg.</p>
              </div>
            </div>
          )}

          <div className="de-roles space-y-3">
            <button
              onClick={() => setRole("chofer")}
              className="de-btn-amber de-focus w-full flex items-center gap-3 p-5 rounded-2xl text-left"
            >
              <span className="de-role-ico"><Truck size={22} /></span>
              <div>
                <p className="de-display font-bold text-lg leading-tight">Soy chofer</p>
                <p className="text-xs opacity-80">Ver mis entregas de hoy</p>
              </div>
              <ArrowLeft size={18} className="de-role-chev" style={{ transform: "rotate(180deg)" }} />
            </button>
            {!esMovil && (<>
            <button
              onClick={() => setRole("logistica")}
              className="de-focus w-full flex items-center gap-3 p-5 rounded-2xl text-left border-2"
              style={{ borderColor: "var(--teal)", color: "var(--teal)" }}
            >
              <span className="de-role-ico"><Route size={22} /></span>
              <div>
                <p className="de-display font-bold text-lg leading-tight">Logística</p>
                <p className="text-xs" style={{ color: "var(--slate)" }}>Cargar facturas y armar la ruta</p>
              </div>
              <ArrowLeft size={18} className="de-role-chev" style={{ transform: "rotate(180deg)" }} />
            </button>
            <button
              onClick={() => setRole("admin")}
              className="de-focus w-full flex items-center gap-3 p-5 rounded-2xl text-left border-2"
              style={{ borderColor: "var(--route)", color: "var(--route)" }}
            >
              <span className="de-role-ico"><LayoutGrid size={22} /></span>
              <div>
                <p className="de-display font-bold text-lg leading-tight">Administración</p>
                <p className="text-xs" style={{ color: "var(--slate)" }}>Choferes, vehículos y reportes</p>
              </div>
              <ArrowLeft size={18} className="de-role-chev" style={{ transform: "rotate(180deg)" }} />
            </button>
            </>)}
          </div>

          <p className="text-xs mt-8" style={{ color: "var(--slate)" }}>
            Los datos se guardan compartidos en la nube. Cualquiera con este link puede usar la app.
          </p>

          <button
            onClick={async () => {
              setTestGeoLoading(true);
              setTestGeo(null);
              const r = await obtenerUbicacion();
              setTestGeo(r);
              setTestGeoLoading(false);
            }}
            className="de-focus text-xs font-semibold mt-4 flex items-center gap-1.5 mx-auto"
            style={{ color: "var(--route)" }}
          >
            <MapPin size={13} /> {testGeoLoading ? "Probando..." : "Probar geolocalización en este celular"}
          </button>

          {testGeo && (
            <div className="mt-3 p-3 rounded-xl text-xs text-left" style={{ background: testGeo.lat ? "var(--teal-soft)" : "var(--amber-soft)", color: testGeo.lat ? "var(--teal)" : "var(--amber)" }}>
              {testGeo.lat ? (
                <>✅ Funciona. Lat {testGeo.lat.toFixed(5)}, Lng {testGeo.lng.toFixed(5)} (precisión ~{testGeo.precision}m)</>
              ) : (
                <>⚠️ No se pudo obtener: <b>{testGeo.error}</b>{testGeo.mensaje ? ` — ${testGeo.mensaje}` : ""}</>
              )}
            </div>
          )}

          <button
            onClick={async () => {
              setTestGeoApiLoading(true);
              setTestGeoApi(null);
              try {
                const resp = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent("Casa Rosada, Buenos Aires"));
                const datos = await resp.json();
                if (datos && datos[0]) {
                  setTestGeoApi({ ok: true, lat: datos[0].lat, lon: datos[0].lon });
                } else {
                  setTestGeoApi({ ok: false, error: "sin_resultados", mensaje: "La conexión funcionó pero no devolvió datos." });
                }
              } catch (e) {
                setTestGeoApi({ ok: false, error: (e && e.name) || "desconocido", mensaje: (e && e.message) || String(e) });
              }
              setTestGeoApiLoading(false);
            }}
            className="de-focus text-xs font-semibold mt-3 flex items-center gap-1.5 mx-auto"
            style={{ color: "var(--route)" }}
          >
            <Route size={13} /> {testGeoApiLoading ? "Probando..." : "Probar geolocalización automática de direcciones"}
          </button>

          {testGeoApi && (
            <div className="mt-3 p-3 rounded-xl text-xs text-left" style={{ background: testGeoApi.ok ? "var(--teal-soft)" : "var(--amber-soft)", color: testGeoApi.ok ? "var(--teal)" : "var(--amber)" }}>
              {testGeoApi.ok ? (
                <>✅ Funciona. Encontró: Lat {testGeoApi.lat}, Lng {testGeoApi.lon}</>
              ) : (
                <>⚠️ No se pudo conectar: <b>{testGeoApi.error}</b>{testGeoApi.mensaje ? ` — ${testGeoApi.mensaje}` : ""}</>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);

</script>

<style>

<script>
/* Si debajo del botón hay una barra fija (por ej. la barra de pestañas del celular), lo sube por encima. */
(function(){var b=document.getElementById("btn-escritorio");if(!b)return;
function ubicar(){b.style.bottom="";var r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;b.style.visibility="hidden";var e=document.elementFromPoint(x,y);b.style.visibility="";
for(var p=e;p&&p!==document.body&&p!==document.documentElement;p=p.parentElement){var cs=getComputedStyle(p);if(cs.position==="fixed"||cs.position==="sticky"){var top=p.getBoundingClientRect().top;if(top>innerHeight/2)b.style.bottom=(innerHeight-top+12)+"px";break;}}}
addEventListener("load",function(){setTimeout(ubicar,600)});addEventListener("resize",function(){clearTimeout(ubicar.t);ubicar.t=setTimeout(ubicar,250)});})();
</script>
