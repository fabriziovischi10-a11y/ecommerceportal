function ChoferFlow({ db, assetsApi, choferes, zonas, facturas, setFacturas, clientes, vehiculos, onExit }) {
  const [choferId, setChoferId] = useState(null);
  const [vehiculoId, setVehiculoId] = useState(null);
  const [zonaId, setZonaId] = useState(null);
  const [clienteId, setClienteId] = useState(null);
  const [busqueda, setBusqueda] = useState("");
  const [marcando, setMarcando] = useState(null);
  const [aDeshacer, setADeshacer] = useState(null);
  const [cargandoCombustible, setCargandoCombustible] = useState(false);
  const [errorGuardado, setErrorGuardado] = useState(null);
  const [subiendoFoto, setSubiendoFoto] = useState(null);
  const [errorFoto, setErrorFoto] = useState(null);
  const [proximaParada, setProximaParada] = useState(null);

  const chofer = choferes.find((c) => c.id === choferId);
  const vehiculo = vehiculos.find((v) => v.id === vehiculoId);
  const zonasDeChofer = zonas.length === 1 ? zonas : zonas.filter((z) => z.choferId === choferId);
  const zona = zonas.find((z) => z.id === zonaId);
  const cliente = clientes.find((c) => c.id === clienteId);

  useEffect(() => {
    if (choferId && !vehiculoId && vehiculos.length === 1) {
      setVehiculoId(vehiculos[0].id);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [choferId, vehiculos.length]);

  useEffect(() => {
    if (!zonaId && zonasDeChofer.length === 1) {
      setZonaId(zonasDeChofer[0].id);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [choferId, zonasDeChofer.length]);

  useEffect(() => {
    if (!choferId || !db) return;
    let cancelado = false;

    const transmitirUbicacion = async () => {
      const ubic = await obtenerUbicacion();
      if (cancelado || !ubic || !ubic.lat) return;
      try {
        const ref = db.doc(`ubicaciones/${choferId}`);
        const snap = await ref.get();
        const previo = snap.exists ? snap.data() : null;
        const hoy = new Date().toISOString().slice(0, 10);
        const historialPrevio = (previo && previo.fecha === hoy) ? (previo.historial || []) : [];
        const punto = { lat: ubic.lat, lng: ubic.lng, ts: new Date().toISOString() };
        await ref.set({ fecha: hoy, ultima: punto, historial: [...historialPrevio, punto].slice(-300), vehiculoId: vehiculoId || null });
      } catch (e) {}
    };

    transmitirUbicacion();
    const intervalo = setInterval(transmitirUbicacion, 45000);
    return () => { cancelado = true; clearInterval(intervalo); };
  }, [choferId, db, vehiculoId]);

  const facturasDeCliente = (cli) => facturas.filter((f) => {
    if (f.zonaId !== cli.zonaId) return false;
    if (cli.codigo && f.clienteCodigo) return f.clienteCodigo.toLowerCase() === cli.codigo.toLowerCase();
    return f.cliente.trim().toLowerCase() === cli.nombre.trim().toLowerCase();
  });

  const marcarEntregado = async (facturaId) => {
    setMarcando(facturaId);
    const ahora = new Date().toISOString();
    const ubicacion = await obtenerUbicacion();
    const facturasActualizadas = facturas.map((f) => f.id === facturaId ? { ...f, estado: "entregado", fechaHora: ahora, ubicacion } : f);
    let guardadoOk = await setFacturas(facturasActualizadas);

    if (!guardadoOk && db) {
      // La escritura pudo haber llegado igual (conexión inestable, se perdió la confirmación).
      // Antes de mostrar un error, verificamos contra lo que realmente quedó guardado.
      try {
        const snap = await db.doc(`facturas_por_zona/${zonaId}`).get();
        const lista = (snap.exists && snap.data() && snap.data().list) || [];
        const enServidor = lista.find((f) => f.id === facturaId);
        if (enServidor && enServidor.estado === "entregado") {
          guardadoOk = true;
        }
      } catch (e) {
        ultimoErrorDb = { codigo: (e && (e.code || e.name)) || "desconocido_verificacion", mensaje: (e && e.message) || String(e) };
      }
    }

    setMarcando(null);

    if (!guardadoOk) {
      const detalle = ultimoErrorDb ? ` (motivo: ${ultimoErrorDb.codigo} — ${ultimoErrorDb.mensaje}${ultimoErrorDb.tam ? ` — ${ultimoErrorDb.tam}` : ""})` : "";
      setErrorGuardado(`No se pudo registrar la entrega. Revisá tu conexión y volvé a tocar 'Marcar entregado'.${detalle}`);
      return;
    }
    setErrorGuardado(null);

    // Buscar la próxima parada, pero solo si este cliente ya no tiene más facturas pendientes
    const coincideCliente = (f, c) => (c.codigo && f.clienteCodigo) ? f.clienteCodigo.toLowerCase() === c.codigo.toLowerCase() : f.cliente.trim().toLowerCase() === c.nombre.trim().toLowerCase();

    const quedanPendientesDeEsteCliente = cliente
      ? facturasActualizadas.some((f) => f.zonaId === zonaId && f.estado === "pendiente" && coincideCliente(f, cliente))
      : false;
    if (quedanPendientesDeEsteCliente) return;

    const clientesZonaOrdenados = clientes
      .filter((c) => c.zonaId === zonaId)
      .sort((a, b) => (a.orden ?? 9999) - (b.orden ?? 9999));
    const siguiente = clientesZonaOrdenados.find((c) => {
      if (c.id === clienteId) return false;
      return facturasActualizadas.some((f) => f.zonaId === zonaId && f.estado === "pendiente" && coincideCliente(f, c));
    });
    if (siguiente) setProximaParada(siguiente);
  };

  const destildarEntrega = (facturaId) => setADeshacer(facturaId);

  const subirFoto = async (facturaId, file) => {
    if (!file) return;
    if (!assetsApi) {
      setErrorFoto("La función de fotos no está disponible en esta vista.");
      return;
    }
    setSubiendoFoto(facturaId);
    setErrorFoto(null);
    try {
      const resultado = await assetsApi.upload(file);
      const facturasActualizadas = facturas.map((f) => f.id === facturaId ? { ...f, fotoId: resultado.id } : f);
      const ok = await setFacturas(facturasActualizadas);
      if (!ok) setErrorFoto("La foto se subió pero no se pudo guardar la referencia. Probá de nuevo.");
    } catch (e) {
      const codigo = (e && e.code) || "desconocido";
      setErrorFoto(`No se pudo subir la foto (${codigo}).`);
    }
    setSubiendoFoto(null);
  };

  // --- Paso 1: elegir chofer ---
  if (!choferId) {
    return (
      <div className="max-w-md mx-auto px-4 pb-16">
        <Header title="¿Quién sos?" subtitle="Elegí tu nombre para ver tus entregas" onExit={onExit} />
        <div className="flex items-start gap-2 mt-3 mb-1 p-3 rounded-xl text-xs" style={{ background: "var(--amber-soft)", color: "var(--amber)" }}>
          <MapPin size={14} className="mt-0.5 shrink-0" />
          <span>Mientras uses la app como chofer, tu ubicación se comparte con el administrador para el seguimiento en vivo.</span>
        </div>
        {choferes.length === 0 ? (
          <EmptyState icon={Users} title="Todavía no hay choferes cargados" subtitle="Pedile al administrador que cargue la lista." />
        ) : (
          <div className="space-y-2 mt-4">
            {choferes.map((c) => (
              <button
                key={c.id}
                onClick={() => setChoferId(c.id)}
                className="de-focus w-full flex items-center gap-3 p-4 rounded-2xl text-left"
                style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}
              >
                <div className="w-11 h-11 rounded-full flex items-center justify-center de-display font-bold" style={{ background: "var(--route)", color: "white" }}>
                  {c.nombre.charAt(0).toUpperCase()}
                </div>
                <div>
                  <p className="font-semibold">{c.nombre}</p>
                  {c.acompanante && (
                    <p className="text-xs de-mono" style={{ color: "var(--slate)" }}>{c.acompanante}</p>
                  )}
                </div>
              </button>
            ))}
          </div>
        )}
      </div>
    );
  }

  // --- Paso 1.5: elegir vehículo de hoy (se salta si hay uno solo o ninguno cargado) ---
  if (!vehiculoId && vehiculos.length > 1) {
    return (
      <div className="max-w-md mx-auto px-4 pb-16">
        <Header title={chofer.nombre} subtitle="¿Qué vehículo sale hoy?" onBack={() => setChoferId(null)} onExit={onExit} />
        <div className="space-y-2 mt-4">
          {vehiculos.map((v) => (
            <button
              key={v.id}
              onClick={() => setVehiculoId(v.id)}
              className="de-focus w-full flex items-center gap-3 p-4 rounded-2xl text-left"
              style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}
            >
              <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style={{ background: "var(--amber-soft)", color: "var(--amber)" }}>
                <Truck size={20} />
              </div>
              <div>
                <p className="font-semibold de-mono">{v.patente}</p>
                {v.modelo && <p className="text-xs" style={{ color: "var(--slate)" }}>{v.modelo}</p>}
              </div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  // --- Paso 2: elegir zona (si tiene más de una; se salta si solo tiene una) ---
  if (!zonaId) {
    if (zonasDeChofer.length === 1) {
      return (
        <div className="de-root flex items-center justify-center min-h-[300px]">
          <Loader2 className="animate-spin" size={22} style={{ color: "var(--route)" }} />
        </div>
      );
    }
    return (
      <div className="max-w-md mx-auto px-4 pb-16">
        <Header
          title={chofer.nombre}
          subtitle={vehiculo ? `Elegí la zona de hoy · 🚐 ${vehiculo.patente}` : "Elegí la zona de hoy"}
          onBack={() => setChoferId(null)}
          onExit={onExit}
          onCombustible={vehiculoId ? () => setCargandoCombustible(true) : undefined}
        />
        {zonasDeChofer.length === 0 ? (
          <EmptyState icon={Route} title="No tenés zonas asignadas" subtitle="Avisale al administrador." />
        ) : (
          <div className="space-y-2 mt-4">
            {zonasDeChofer.map((z) => {
              const fz = facturas.filter((f) => f.zonaId === z.id);
              const pend = fz.filter((f) => f.estado === "pendiente").length;
              return (
                <button
                  key={z.id}
                  onClick={() => setZonaId(z.id)}
                  className="de-focus w-full flex items-center justify-between p-4 rounded-2xl text-left"
                  style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}
                >
                  <div className="flex items-center gap-2">
                    <MapPin size={16} style={{ color: "var(--amber)" }} />
                    <span className="font-semibold">{z.nombre}</span>
                  </div>
                  <span className="text-xs font-semibold px-2 py-1 rounded-full" style={{ background: "var(--amber-soft)", color: "var(--amber)" }}>
                    {pend} pendiente{pend !== 1 ? "s" : ""}
                  </span>
                </button>
              );
            })}
          </div>
        )}

        {cargandoCombustible && (
          <CombustibleModal
            db={db}
            choferId={choferId}
            vehiculoId={vehiculoId}
            onCerrar={() => setCargandoCombustible(false)}
          />
        )}
      </div>
    );
  }

  const volverAZona = () => {
    setClienteId(null);
    setBusqueda("");
    if (zonasDeChofer.length > 1) setZonaId(null); else setChoferId(null);
  };

  // --- Paso 3: elegir cliente de la zona ---
  if (!clienteId) {
    const clientesZona = clientes
      .filter((c) => c.zonaId === zonaId)
      .filter((c) => facturasDeCliente(c).length > 0)
      .sort((a, b) => (a.orden ?? 9999) - (b.orden ?? 9999));
    const filtrados = busqueda.trim()
      ? clientesZona.filter((c) => c.nombre.toLowerCase().includes(busqueda.trim().toLowerCase()))
      : clientesZona;

    return (
      <div className="max-w-md mx-auto px-4 pb-16">
        <Header title={zona.nombre} subtitle={vehiculo ? `Elegí el cliente · 🚐 ${vehiculo.patente}` : "Elegí el cliente"} onBack={volverAZona} onExit={onExit} onCombustible={vehiculoId ? () => setCargandoCombustible(true) : undefined} />

        {clientesZona.length === 0 ? (
          <EmptyState icon={Store} title="No hay clientes cargados en esta zona" subtitle="Pedile al administrador que los cargue." />
        ) : (
          <>
            <div className="relative mt-4 mb-3">
              <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: "var(--slate)" }} />
              <input
                value={busqueda}
                onChange={(e) => setBusqueda(e.target.value)}
                placeholder="Buscar cliente..."
                className="de-focus w-full text-sm rounded-xl pl-9 pr-3 py-2.5 border"
                style={{ borderColor: "var(--line)", background: "var(--card)" }}
              />
            </div>
            <div className="space-y-2">
              {filtrados.map((c) => {
                const fc = facturasDeCliente(c);
                const pend = fc.filter((f) => f.estado === "pendiente").length;
                return (
                  <button
                    key={c.id}
                    onClick={() => setClienteId(c.id)}
                    className="de-focus w-full flex items-center justify-between gap-3 p-4 rounded-2xl text-left"
                    style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}
                  >
                    <div className="min-w-0">
                      <p className="font-semibold text-sm truncate">{c.nombre}</p>
                      {c.domicilio && <p className="text-xs truncate mt-0.5" style={{ color: "var(--ink)" }}>{c.domicilio}</p>}
                      {c.localidad && <p className="text-xs mt-0.5" style={{ color: "var(--slate)" }}>{c.localidad}</p>}
                    </div>
                    {fc.length > 0 ? (
                      <span
                        className="text-xs font-semibold px-2 py-1 rounded-full whitespace-nowrap shrink-0"
                        style={{ background: pend > 0 ? "var(--amber-soft)" : "var(--teal-soft)", color: pend > 0 ? "var(--amber)" : "var(--teal)" }}
                      >
                        {pend > 0 ? `${pend} pend.` : "entregado"}
                      </span>
                    ) : (
                      <span className="text-xs px-2 py-1 rounded-full whitespace-nowrap shrink-0" style={{ background: "var(--paper)", color: "var(--slate)" }}>
                        sin fact.
                      </span>
                    )}
                  </button>
                );
              })}
              {filtrados.length === 0 && (
                <EmptyState icon={Search} title="Sin resultados" subtitle="Probá con otro nombre." />
              )}
            </div>
          </>
        )}

        {cargandoCombustible && (
          <CombustibleModal
            db={db}
            choferId={choferId}
            vehiculoId={vehiculoId}
            onCerrar={() => setCargandoCombustible(false)}
          />
        )}

        {proximaParada && (
          <ProximaParadaBanner
            cliente={proximaParada}
            onCerrar={() => setProximaParada(null)}
            onVerCliente={() => { setClienteId(proximaParada.id); setProximaParada(null); }}
          />
        )}
      </div>
    );
  }

  // --- Paso 4: facturas del cliente elegido ---
  const facturasCliente = facturasDeCliente(cliente);
  const pendientes = facturasCliente.filter((f) => f.estado === "pendiente");
  const entregadas = facturasCliente.filter((f) => f.estado === "entregado");

  return (
    <div className="max-w-md mx-auto px-4 pb-16">
      <Header
        title={cliente.nombre}
        subtitle={`${zona.nombre} · ${pendientes.length} pendiente${pendientes.length !== 1 ? "s" : ""}`}
        onBack={() => setClienteId(null)}
        onExit={onExit}
        onCombustible={vehiculoId ? () => setCargandoCombustible(true) : undefined}
      />

      {errorGuardado && (
        <div className="flex items-start gap-2 mt-3 p-3 rounded-xl" style={{ background: "var(--danger-soft)" }}>
          <AlertCircle size={16} className="mt-0.5 shrink-0" style={{ color: "var(--danger)" }} />
          <p className="text-sm" style={{ color: "var(--danger)" }}>{errorGuardado}</p>
        </div>
      )}

      {errorFoto && (
        <div className="flex items-start gap-2 mt-3 p-3 rounded-xl" style={{ background: "var(--danger-soft)" }}>
          <AlertCircle size={16} className="mt-0.5 shrink-0" style={{ color: "var(--danger)" }} />
          <p className="text-sm" style={{ color: "var(--danger)" }}>{errorFoto}</p>
        </div>
      )}

      {(cliente.domicilio || cliente.localidad) && (
        <a
          href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([cliente.domicilio, cliente.localidad].filter(Boolean).join(", "))}`}
          target="_blank"
          rel="noreferrer"
          className="de-focus flex items-start gap-2 mt-3 mb-1 p-3 rounded-xl"
          style={{ background: "var(--amber-soft)" }}
        >
          <MapPin size={16} className="mt-0.5 shrink-0" style={{ color: "var(--amber)" }} />
          <div className="min-w-0">
            {cliente.domicilio && <p className="text-sm font-semibold" style={{ color: "var(--ink)" }}>{cliente.domicilio}</p>}
            {cliente.localidad && <p className="text-xs" style={{ color: "var(--slate)" }}>{cliente.localidad}</p>}
            <p className="text-xs font-semibold mt-0.5" style={{ color: "var(--amber)" }}>Ver en el mapa →</p>
          </div>
        </a>
      )}

      {cliente.telefono ? (
        <a
          href={`https://wa.me/${cliente.telefono.replace(/\D/g, "")}?text=${encodeURIComponent(`Hola! Le escribimos de Portal Distribuidora, en breve llega su pedido a ${cliente.domicilio || "su domicilio"}. ¡Gracias por su compra!`)}`}
          target="_blank"
          rel="noreferrer"
          className="de-focus w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold mb-3"
          style={{ background: "#25D366", color: "white" }}
        >
          📲 Avisar por WhatsApp que estoy llegando
        </a>
      ) : (
        <p className="text-xs mb-3" style={{ color: "var(--slate)" }}>Este cliente no tiene teléfono cargado (se agrega desde el panel administrador).</p>
      )}

      {facturasCliente.length === 0 ? (
        <EmptyState icon={Package} title="Este cliente no tiene facturas cargadas hoy" />
      ) : (
        <div className="mt-4 relative pl-6">
          <div className="absolute left-[9px] top-2 bottom-2 de-dash-line w-0.5" />
          {[...pendientes, ...entregadas].map((f) => (
            <div key={f.id} className="relative mb-3">
              <div
                className="absolute -left-6 top-5 w-3 h-3 rounded-full border-2"
                style={{
                  background: f.estado === "entregado" ? "var(--teal)" : "var(--card)",
                  borderColor: f.estado === "entregado" ? "var(--teal)" : "var(--amber)",
                }}
              />
              <div className="rounded-2xl p-4" style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}>
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <p className="font-semibold text-sm de-mono truncate">{f.factura}</p>
                    <p className="text-sm de-mono font-semibold mt-1">
                      {formatMoney(parseImporte(f.importe))}{f.unidades && <span className="font-normal" style={{ color: "var(--slate)" }}> · {f.unidades} un.</span>}
                    </p>
                  </div>
                  <Badge estado={f.estado} />
                </div>
                {f.estado === "pendiente" ? (
                  <button
                    onClick={() => marcarEntregado(f.id)}
                    disabled={marcando === f.id}
                    className="de-btn-amber de-focus w-full mt-3 py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2"
                    style={{ opacity: marcando === f.id ? 0.7 : 1 }}
                  >
                    {marcando === f.id ? (
                      <><Loader2 size={17} className="animate-spin" /> Ubicando...</>
                    ) : (
                      <><CheckCircle2 size={17} /> Marcar entregado</>
                    )}
                  </button>
                ) : (
                  <div className="flex items-center justify-between mt-2 gap-2">
                    <p className="text-xs flex items-center gap-1 min-w-0" style={{ color: "var(--slate)" }}>
                      <Clock size={12} className="shrink-0" />
                      <span className="truncate">
                        {new Date(f.fechaHora).toLocaleString("es-AR")}
                      </span>
                    </p>
                    <button
                      onClick={() => destildarEntrega(f.id)}
                      className="de-focus text-xs font-semibold shrink-0 flex items-center gap-1"
                      style={{ color: "var(--danger)" }}
                    >
                      <RefreshCw size={11} /> Deshacer
                    </button>
                  </div>
                )}
                {f.estado === "entregado" && (
                  f.ubicacion && f.ubicacion.lat ? (
                    <a
                      href={`https://www.google.com/maps?q=${f.ubicacion.lat},${f.ubicacion.lng}`}
                      target="_blank"
                      rel="noreferrer"
                      className="de-focus text-xs font-semibold mt-1.5 flex items-center gap-1"
                      style={{ color: "var(--teal)" }}
                    >
                      <MapPin size={12} /> Ver ubicación de la entrega
                    </a>
                  ) : (
                    <p className="text-xs mt-1.5 flex items-center gap-1" style={{ color: "var(--amber)" }}>
                      <AlertCircle size={12} /> Sin ubicación{f.ubicacion?.error ? ` (${f.ubicacion.error})` : ""}
                    </p>
                  )
                )}

                {f.estado === "entregado" && (
                  f.fotoId ? (
                    <a href={f.fotoId} target="_blank" rel="noreferrer" className="de-focus block mt-2">
                      <img src={f.fotoId} alt="Foto de la factura" className="w-full max-h-40 object-cover rounded-lg" style={{ border: "1px solid var(--line)" }} />
                    </a>
                  ) : (
                    <label
                      className="de-focus flex items-center justify-center gap-1.5 w-full mt-2 py-2 rounded-lg text-xs font-semibold cursor-pointer"
                      style={{ background: "var(--paper)", border: "1px dashed var(--line)", color: "var(--route)" }}
                    >
                      {subiendoFoto === f.id ? (
                        <><Loader2 size={13} className="animate-spin" /> Subiendo foto...</>
                      ) : (
                        <>📷 Foto de la factura / firma</>
                      )}
                      <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        className="hidden"
                        onChange={(e) => subirFoto(f.id, e.target.files && e.target.files[0])}
                      />
                    </label>
                  )
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      {aDeshacer && (
        <ConfirmModal
          mensaje="¿Deshacer esta entrega? Va a volver a quedar como pendiente."
          textoConfirmar="Sí, deshacer"
          onCancelar={() => setADeshacer(null)}
          onConfirmar={() => {
            setFacturas(facturas.map((f) => f.id === aDeshacer ? { ...f, estado: "pendiente", fechaHora: null, ubicacion: null } : f));
            setADeshacer(null);
          }}
        />
      )}

      {cargandoCombustible && (
        <CombustibleModal
          db={db}
          choferId={choferId}
          vehiculoId={vehiculoId}
          onCerrar={() => setCargandoCombustible(false)}
        />
      )}

      {proximaParada && (
        <ProximaParadaBanner
          cliente={proximaParada}
          onCerrar={() => setProximaParada(null)}
          onVerCliente={() => { setClienteId(proximaParada.id); setProximaParada(null); }}
        />
      )}
    </div>
  );
}

function Header({ title, subtitle, onBack, onExit, onCombustible }) {
  return (
    <div className="flex items-start justify-between pt-6 pb-2">
      <div className="flex items-start gap-2">
        {onBack && (
          <button onClick={onBack} className="de-focus p-1.5 mt-0.5 rounded-lg" style={{ color: "var(--route)" }}>
            <ArrowLeft size={20} />
          </button>
        )}
        <div>
          <h1 className="de-display text-xl font-bold leading-tight">{title}</h1>
          {subtitle && <p className="text-sm mt-0.5" style={{ color: "var(--slate)" }}>{subtitle}</p>}
        </div>
      </div>
      <div className="flex items-center gap-1 shrink-0">
        {onCombustible && (
          <button onClick={onCombustible} className="de-focus p-1.5 rounded-lg" style={{ color: "var(--amber)" }} aria-label="Cargar combustible">
            <Fuel size={18} />
          </button>
        )}
        {onExit && (
          <button onClick={onExit} className="de-focus text-xs font-semibold px-2.5 py-1.5 rounded-lg" style={{ color: "var(--slate)" }}>
            Salir
          </button>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  APP RAÍZ                                                            */
/* ------------------------------------------------------------------ */

function App() {
  const db = useDb();
  const assetsApi = useAssets();
  const [choferes, setChoferes, loadingC] = useDbListDoc(db, "meta/choferes");
  const [zonas, setZonas, loadingZ] = useDbListDoc(db, "meta/zonas");
  const [clientes, setClientes, loadingCl] = useDbShardedByZona(db, "clientes_por_zona");
  const [facturas, setFacturas, loadingF] = useDbShardedByZona(db, "facturas_por_zona");
  const [vehiculos, setVehiculos, loadingV] = useDbListDoc(db, "meta/vehiculos");
  const [combustible, loadingCo] = useDbCollectionLive(db, "combustible");
  const [historialDias, loadingHist] = useDbCollectionLive(db, "historial_dias");
  const [role, setRole] = useState(null);
  const [testGeo, setTestGeo] = useState(null);
  const [testGeoLoading, setTestGeoLoading] = useState(false);
  const [testGeoApi, setTestGeoApi] = useState(null);
  const [testGeoApiLoading, setTestGeoApiLoading] = useState(false);

  const loading = db === undefined || loadingC || loadingZ || loadingCl || loadingF || loadingV || loadingCo || loadingHist;
  const dbNoDisponible = db === null;

  useEffect(() => {
    if (loading || dbNoDisponible) return;
    if (zonas.length === 0) {
      setZonas([{ id: "zona_unica", nombre: "Ruta del día", choferId: null, choferTexto: "" }]);
    }
  }, [loading, dbNoDisponible, zonas.length]);

  if (dbNoDisponible) {
    return (
      <div className="de-root flex items-center justify-center min-h-[400px] px-6 text-center">
        <GlobalStyle />
        <div>
          <AlertCircle size={28} style={{ color: "var(--danger)", margin: "0 auto 10px" }} />
          <p className="de-display font-semibold mb-1">No se pudo conectar a la base de datos</p>
          <p className="text-sm" style={{ color: "var(--slate)" }}>Recargá la página. Si el problema sigue, avisá al administrador de la cuenta.</p>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div className="de-root flex items-center justify-center min-h-[400px]">
        <Loader2 className="animate-spin" size={26} style={{ color: "var(--route)" }} />
        <GlobalStyle />
      </div>
    );
  }

  return (
    <div className="de-root min-h-full">
      <GlobalStyle />

      {role === "admin" && (
        <AdminPanel
          db={db}
          choferes={choferes} setChoferes={setChoferes}
          zonas={zonas} setZonas={setZonas}
          facturas={facturas} setFacturas={setFacturas}
          clientes={clientes} setClientes={setClientes}
          vehiculos={vehiculos} setVehiculos={setVehiculos}
          combustible={combustible}
          historialDias={historialDias}
          onExit={() => setRole(null)}
        />
      )}

      {role === "logistica" && (
        <LogisticaPanel
          db={db}
          zonas={zonas} setZonas={setZonas}
          facturas={facturas} setFacturas={setFacturas}
          clientes={clientes} setClientes={setClientes}
          onExit={() => setRole(null)}
        />
      )}

      {role === "chofer" && (
        <ChoferFlow
          db={db}
          assetsApi={assetsApi}
          choferes={choferes} zonas={zonas}
          facturas={facturas} setFacturas={setFacturas}
          clientes={clientes} vehiculos={vehiculos}
          onExit={() => setRole(null)}
        />
      )}

      {!role && (
        <div className="max-w-md mx-auto px-4 pt-14 pb-16 text-center">
          <div
            className="w-40 h-28 rounded-3xl flex items-center justify-center mx-auto mb-5 p-3"
            style={{ background: "var(--brand-yellow)", boxShadow: "0 4px 18px rgba(251,201,0,0.35)" }}
          >
            <img src={LOGO_DATA_URI} alt="Portal Distribuidora" className="max-w-full max-h-full object-contain" />
          </div>
          <h1 className="de-display text-2xl font-bold" style={{ color: "var(--route)" }}>Control de entregas</h1>
          <p className="text-sm mt-1.5 mb-5" style={{ color: "var(--slate)" }}>Elegí cómo querés entrar</p>

          {(clientes.length > 0 || facturas.length > 0) && (
            <div className="grid grid-cols-3 gap-2 mb-6">
              <div className="rounded-2xl p-3" style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}>
                <Store size={16} className="mx-auto mb-1" style={{ color: "var(--route)" }} />
                <p className="de-display text-lg font-bold leading-none">{clientes.length}</p>
                <p className="text-[11px] mt-1" style={{ color: "var(--slate)" }}>Clientes</p>
              </div>
              <div className="rounded-2xl p-3" style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}>
                <Package size={16} className="mx-auto mb-1" style={{ color: "var(--amber)" }} />
                <p className="de-display text-lg font-bold leading-none">
                  {facturas.filter((f) => f.estado === "entregado").length}<span className="text-xs font-normal" style={{ color: "var(--slate)" }}>/{facturas.length}</span>
                </p>
                <p className="text-[11px] mt-1" style={{ color: "var(--slate)" }}>Boletas entreg.</p>
              </div>
              <div className="rounded-2xl p-3" style={{ background: "var(--card)", boxShadow: "0 1px 2px rgba(22,32,43,0.06)" }}>
                <ClipboardList size={16} className="mx-auto mb-1" style={{ color: "var(--teal)" }} />
                <p className="de-display text-lg font-bold leading-none">
                  {facturas.filter((f) => f.estado === "entregado").reduce((s, f) => s + (parseInt(f.unidades, 10) || 0), 0)}
                </p>
                <p className="text-[11px] mt-1" style={{ color: "var(--slate)" }}>Unidades entreg.</p>
              </div>
            </div>
          )}

          <div className="space-y-3">
            <button
              onClick={() => setRole("chofer")}
              className="de-btn-amber de-focus w-full flex items-center gap-3 p-5 rounded-2xl text-left"
            >
              <Truck size={22} />
              <div>
                <p className="de-display font-bold">Soy chofer</p>
                <p className="text-xs opacity-90">Ver mis entregas de hoy</p>
              </div>
            </button>
            <button
              onClick={() => setRole("logistica")}
              className="de-focus w-full flex items-center gap-3 p-5 rounded-2xl text-left border-2"
              style={{ borderColor: "var(--teal)", color: "var(--teal)" }}
            >
              <Route size={22} />
              <div>
                <p className="de-display font-bold">Logística</p>
                <p className="text-xs" style={{ color: "var(--slate)" }}>Cargar facturas y armar la ruta</p>
              </div>
            </button>
            <button
              onClick={() => setRole("admin")}
              className="de-focus w-full flex items-center gap-3 p-5 rounded-2xl text-left border-2"
              style={{ borderColor: "var(--route)", color: "var(--route)" }}
            >
              <LayoutGrid size={22} />
              <div>
                <p className="de-display font-bold">Administración</p>
                <p className="text-xs" style={{ color: "var(--slate)" }}>Choferes, vehículos y reportes</p>
              </div>
            </button>
          </div>

          <p className="text-xs mt-8" style={{ color: "var(--slate)" }}>
            Los datos se guardan compartidos en la nube. Cualquiera con este link puede usar la app.
          </p>

          <button
            onClick={async () => {
              setTestGeoLoading(true);
              setTestGeo(null);
              const r = await obtenerUbicacion();
              setTestGeo(r);
              setTestGeoLoading(false);
            }}
            className="de-focus text-xs font-semibold mt-4 flex items-center gap-1.5 mx-auto"
            style={{ color: "var(--route)" }}
          >
            <MapPin size={13} /> {testGeoLoading ? "Probando..." : "Probar geolocalización en este celular"}
          </button>

          {testGeo && (
            <div className="mt-3 p-3 rounded-xl text-xs text-left" style={{ background: testGeo.lat ? "var(--teal-soft)" : "var(--amber-soft)", color: testGeo.lat ? "var(--teal)" : "var(--amber)" }}>
              {testGeo.lat ? (
                <>✅ Funciona. Lat {testGeo.lat.toFixed(5)}, Lng {testGeo.lng.toFixed(5)} (precisión ~{testGeo.precision}m)</>
              ) : (
                <>⚠️ No se pudo obtener: <b>{testGeo.error}</b>{testGeo.mensaje ? ` — ${testGeo.mensaje}` : ""}</>
              )}
            </div>
          )}

          <button
            onClick={async () => {
              setTestGeoApiLoading(true);
              setTestGeoApi(null);
              try {
                const resp = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent("Casa Rosada, Buenos Aires"));
                const datos = await resp.json();
                if (datos && datos[0]) {
                  setTestGeoApi({ ok: true, lat: datos[0].lat, lon: datos[0].lon });
                } else {
                  setTestGeoApi({ ok: false, error: "sin_resultados", mensaje: "La conexión funcionó pero no devolvió datos." });
                }
              } catch (e) {
                setTestGeoApi({ ok: false, error: (e && e.name) || "desconocido", mensaje: (e && e.message) || String(e) });
              }
              setTestGeoApiLoading(false);
            }}
            className="de-focus text-xs font-semibold mt-3 flex items-center gap-1.5 mx-auto"
            style={{ color: "var(--route)" }}
          >
            <Route size={13} /> {testGeoApiLoading ? "Probando..." : "Probar geolocalización automática de direcciones"}
          </button>

          {testGeoApi && (
            <div className="mt-3 p-3 rounded-xl text-xs text-left" style={{ background: testGeoApi.ok ? "var(--teal-soft)" : "var(--amber-soft)", color: testGeoApi.ok ? "var(--teal)" : "var(--amber)" }}>
              {testGeoApi.ok ? (
                <>✅ Funciona. Encontró: Lat {testGeoApi.lat}, Lng {testGeoApi.lon}</>
              ) : (
                <>⚠️ No se pudo conectar: <b>{testGeoApi.error}</b>{testGeoApi.mensaje ? ` — ${testGeoApi.mensaje}` : ""}</>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);

</script>
</body>
</html>
