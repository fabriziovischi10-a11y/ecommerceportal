<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="https://fabriziovischi10-a11y.github.io/ecommerceportal/intro-portal.js"></script>
<meta name="theme-color" content="#14181b">
<title>Galpón Racks Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: mesa de dibujo — vista grande a la izquierda (planta / alzados / 3D / listado), panel técnico a la derecha */
:root{
  --bg:#eef0ec; --paper:#fbfcfa; --panel:#ffffff; --ink:#1c2226; --ink2:#5b656b; --line:#d5d9d3; --grid:#e3e6e0; --grid2:#d3d8d0;
  --rack:#e2561d; --rack-soft:#fbe3d6; --yellow:#e9b821; --steel:#8d969b; --pal:#e7dcc6; --palA:#d9e2ea; --red:#d6332b; --green:#4f8f3a;
  --sel:#1f6fd1; --sel-soft:rgba(31,111,209,.12); --warn:#c27a00; --bad:#c7322a; --ok:#3a7d44; --wall:#3a4247; --dim:#2a5c86;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181b; --paper:#1a1f23; --panel:#1f252a; --ink:#e3e7ea; --ink2:#9aa5ac; --line:#323a40; --grid:#232a2f; --grid2:#2d353b;
  --rack:#f06a33; --rack-soft:#3a2418; --yellow:#e9c040; --steel:#9aa3a8; --pal:#5b5141; --palA:#3f4c58; --red:#ef5249; --green:#6cb057;
  --sel:#5aa2ff; --sel-soft:rgba(90,162,255,.16); --warn:#e5a33a; --bad:#ff6b61; --ok:#6cc27a; --wall:#c4ccd1; --dim:#7fb5e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b; --paper:#1a1f23; --panel:#1f252a; --ink:#e3e7ea; --ink2:#9aa5ac; --line:#323a40; --grid:#232a2f; --grid2:#2d353b;
  --rack:#f06a33; --rack-soft:#3a2418; --yellow:#e9c040; --steel:#9aa3a8; --pal:#5b5141; --palA:#3f4c58; --red:#ef5249; --green:#6cb057;
  --sel:#5aa2ff; --sel-soft:rgba(90,162,255,.16); --warn:#e5a33a; --bad:#ff6b61; --ok:#6cc27a; --wall:#c4ccd1; --dim:#7fb5e6; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;gap:8px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.brand h1 b{color:var(--rack)}
.brand span{color:var(--ink2);font-size:13px}
.hdr-r{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{width:78px;font-family:var(--f-mono);font-size:13px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.btn.pri{background:var(--rack);border-color:var(--rack);color:#fff}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 14px 7px;font-family:var(--f-disp);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--rack)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px;min-height:0}
.view{background:var(--paper);border:1px solid var(--line);border-radius:8px;min-height:0;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;display:flex;flex-direction:column}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line)}
.toolbar .hint{color:var(--ink2);font-size:12px;margin-left:auto}
#svgPlanta{flex:1;width:100%;min-height:0;touch-action:none;cursor:grab;display:block}
#svgPlanta.dragging{cursor:grabbing}
#svgPlanta.measuring{cursor:crosshair}
.scroll{flex:1;overflow:auto;padding:14px;min-height:0}
aside{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.card h2{font-family:var(--f-disp);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi b{display:block;font-family:var(--f-disp);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi .d{font-family:var(--f-mono);font-size:11px}
.d.up{color:var(--ok)} .d.dn{color:var(--bad)}
.banner{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--sel-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row label{font-size:12px;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:2px}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid2 input{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-family:var(--f-mono);font-size:12px;cursor:pointer;background:var(--paper);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.chip small{font-size:9.5px;color:var(--ink2)}
.chip.sel{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel-soft)}
.chip.t-pasillo{border-bottom:3px solid var(--red)} .chip.t-porton{border-bottom:3px solid var(--green)}
.warns{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.warns li{padding-left:16px;position:relative}
.warns li::before{content:"";position:absolute;left:2px;top:6px;width:8px;height:8px;border-radius:2px;background:var(--warn)}
.warns li.bad::before{background:var(--bad)} .warns li.ok::before{background:var(--ok)}
.muted{color:var(--ink2);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-disp);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--ink2)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-top:2px solid var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sel-soft)} tr.selr td{background:var(--sel-soft)}
.tw{overflow-x:auto}
.sec-title{font-family:var(--f-disp);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 6px}
.sec-title:first-child{margin-top:0}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);min-width:0}
.tcard h3{margin:0 0 2px;font-family:var(--f-disp);font-size:17px;font-weight:600}
.tcard svg{width:100%;height:auto;display:block}
.lv{display:grid;grid-template-columns:1fr auto auto;gap:4px;align-items:center;margin-top:6px}
.lv input{width:70px}
.elev{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.elev svg{display:block}
#v3d{flex:1;min-height:0;position:relative}
#v3d canvas{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{width:min(640px,100%);max-height:90%;display:flex;flex-direction:column;gap:8px}
.modal textarea{width:100%;min-height:260px;font-family:var(--f-mono);font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.confirm{display:inline-flex;gap:4px;align-items:center;font-size:12px}
/* SVG */
.s-grid{stroke:var(--grid);stroke-width:.03}
.s-grid2{stroke:var(--grid2);stroke-width:.05}
.s-floor{fill:var(--paper)}
.s-wall{fill:none;stroke:var(--wall);stroke-width:.25;stroke-linejoin:miter}
.s-col{fill:var(--wall)}
.s-gate{stroke:var(--paper);stroke-width:.4}
.s-gatel{fill:none;stroke:var(--green);stroke-width:.08;stroke-dasharray:.3 .2}
.s-door{fill:none;stroke:var(--ink2);stroke-width:.05}
.s-foot{fill:var(--rack-soft);stroke:var(--ink);stroke-width:.05}
.s-foot.sel{stroke:var(--sel);stroke-width:.14;fill:var(--sel-soft)}
.s-foot.bad{stroke:var(--bad);stroke-width:.14}
.s-frame{stroke:var(--ink);stroke-width:.08}
.s-beam{stroke:var(--rack);stroke-width:.05}
.s-pal{fill:var(--pal);stroke:var(--ink);stroke-width:.025}
.s-palA{fill:var(--palA);stroke:var(--ink);stroke-width:.025}
.s-arrR{fill:var(--red);stroke:var(--ink);stroke-width:.02}
.s-arrV{fill:var(--green);stroke:var(--ink);stroke-width:.02}
.s-lbl{font-family:var(--f-disp);font-weight:700;fill:var(--ink)}
.s-tag{font-family:var(--f-disp);font-weight:600;fill:var(--ink2)}
.s-dim{stroke:var(--dim);stroke-width:.035;fill:none}
.s-dimt{font-family:var(--f-mono);fill:var(--dim)}
.s-dimt.warn{fill:var(--warn);font-weight:600}
.s-meas{stroke:var(--sel);stroke-width:.06;fill:none}
.s-meast{font-family:var(--f-mono);fill:var(--sel);font-weight:600}
.s-up{fill:var(--steel)}
.e-beam{fill:var(--rack)}
.e-deck{fill:var(--steel)}
.e-wood{fill:#9b6b3d}
.e-load{fill:var(--pal);stroke:var(--ink);stroke-width:.015}
.e-txt{font-family:var(--f-mono);fill:var(--ink2)}
.e-ground{fill:var(--grid2)}
.e-roof{fill:none;stroke:var(--wall);stroke-width:.12}
.e-wallf{fill:var(--wall)}
@media (max-width: 860px){
  .app{height:auto;grid-template-rows:auto auto auto}
  html,body{height:auto}
  .work{grid-template-columns:minmax(0,1fr)}
  #selVer{max-width:100%}
  .hdr-r{margin-left:0}
  .view{height:72vh;min-height:420px}
  aside{overflow:visible}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
/* ================= Constantes de racks (medidas de los planos SOTIC OP 29285) ================= */
const F = 0.118;   // ancho de bastidor (columna) en planta, m
const D = 1.10;    // profundidad de bastidor
const G = 0.05;    // separador entre bastidores espalda con espalda
const KEY = 'galpon-racks-portal-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d=2) => (Math.round(v*10**d)/10**d).toFixed(d).replace('.', ',');
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Galpón (reconstruido de la planta SOTIC; origen = esquina SO interior, x al Este, y al Norte) ---------- */
function galpon(){
  const xs = 64.03, k = 0.352;              // muro Este inclinado: x = 64.03 - 0.352·y
  const jog = 46.9, s = 0.086, y0 = 15.03;  // muro Norte con pendiente 0.086 y quiebre de 0.30 m
  const yj = y0 + s*jog;
  const xne = (xs - k*(yj + 0.30 - s*jog)) / (1 + k*s);
  const yne = yj + 0.30 + s*(xne - jog);
  const cols = [];
  for (let x = 1.35; x < xs - 1; x += 5.05) cols.push([x, -0.05]);
  for (let x = 3.82; x < xne - 0.5; x += 5.05) cols.push([x, (x < jog ? y0 + s*x : yj + 0.30 + s*(x-jog)) + 0.05]);
  return {
    poly: [[0,0],[xs,0],[+xne.toFixed(3), +yne.toFixed(3)],[jog, +(yj+0.30).toFixed(3)],[jog, +yj.toFixed(3)],[0,y0]],
    gates: [{edge:0, c:11.14, w:3.6, h:4.6, name:'Portón 1'},{edge:0, c:30.48, w:3.6, h:4.6, name:'Portón 2'},{edge:0, c:61.92, w:3.6, h:4.6, name:'Portón 3'}],
    doors: [{edge:0, c:32.4, w:0.9},{edge:0, c:37.0, w:0.9}],
    cols
  };
}
function tiposSotic(){ return {
  S:{nombre:'Estándar con estantes', tunel:null, niveles:[{h:0,k:'P'},{h:1.3,k:'E'},{h:2.6,k:'E'},{h:3.9,k:'E'},{h:5.25,k:'P'},{h:7.55,k:'P'}]},
  A:{nombre:'Conjunto tipo A', tunel:null, niveles:[{h:0,k:'P'},{h:2.6,k:'E'},{h:3.9,k:'E'},{h:5.25,k:'P'},{h:7.55,k:'P'}]},
  TR:{nombre:'Túnel de paso (pasillo)', tunel:'pasillo', niveles:[{h:4.1,k:'P'},{h:6.1,k:'P'},{h:8.1,k:'P'}]},
  TV:{nombre:'Túnel de portón', tunel:'porton', niveles:[{h:2.6,k:'P'},{h:4.4,k:'P'},{h:6.2,k:'P'},{h:8.0,k:'P'}]}
};}
const M = (t, w=2.3) => ({t, w});
function baseSotic(){
  const racks = [];
  // Rack contra muro Sur: 26 módulos, túneles de portón en 5º, 13º y 26º
  racks.push({id:'P1', nombre:'Muro Sur', x:0.2, y:0.25, ang:0, doble:false, mods:Array.from({length:26},(_,i)=>M([4,12,25].includes(i)?'TV':'S'))});
  // 9 filas dobles a 90°, frente a 3.50 del muro Oeste, pasillos de 3.75, a 3.58 del rack de muro
  const n   = [3,3,3,3,4,4,4,4,5];
  const aj  = [0,0,1,1,0,0,0,1,0];
  for (let i=0;i<9;i++){
    const t = i<5 ? 'A' : 'S';
    const mods = [M(t), M(t), M('TR')];
    for (let j=2;j<n[i];j++) mods.push(M(t));
    if (aj[i]) mods.push(M(t,1.2));
    racks.push({id:'F'+(i+1), nombre:'Fila '+(i+1), x:3.5+2*D+G+6*i, y:4.93, ang:90, doble:true, mods});
  }
  // Rack simple contra el muro Este inclinado (4 módulos, a 4.72 de la fila 9)
  racks.push({id:'E1', nombre:'Muro Este', x:62.13, y:4.63, ang:109.4, doble:false, mods:[M('S'),M('S'),M('S'),M('S')]});
  return {id:'sotic', nombre:'Instalado — SOTIC rev. 5', base:true, nota:'Plano SOTIC OP 29285, rev. 5 (01/09/2026). 708 posiciones.',
    params:{palletH:1.5, palletPiso:1.1, alero:10.5, flecha:1.8, portico:8.5, pasilloMin:3.2}, galpon:galpon(), tipos:tiposSotic(), racks};
}
function baseOpcionB(){
  const tipos = {
    B:{nombre:'Común (3 niveles + estantes)', tunel:null, niveles:[{h:0,k:'P'},{h:2.6,k:'E'},{h:3.9,k:'E'},{h:5.2,k:'P'},{h:7.55,k:'P'}]},
    BI:{nombre:'Paso intermedio', tunel:'pasillo', niveles:[{h:4.0,k:'P'},{h:5.875,k:'P'},{h:7.75,k:'P'}]},
    BV:{nombre:'Paso galpón lateral', tunel:'porton', niveles:[{h:2.55,k:'P'},{h:4.35,k:'P'},{h:6.15,k:'P'},{h:7.95,k:'P'}]},
    BS:{nombre:'Común simple', tunel:null, niveles:[{h:0,k:'P'},{h:5.2,k:'P'},{h:7.55,k:'P'}]}
  };
  const racks = [{id:'P1', nombre:'Muro Sur', x:0.2, y:0.25, ang:0, doble:false, mods:Array.from({length:21},(_,i)=>M([4,12,20].includes(i)?'BV':'B'))}];
  for (let i=0;i<8;i++){
    const mods = [M('B'),M('B'),M('BI'),M('B'),M('B')];
    if ([2,3,7].includes(i)) mods.push(M('BS',1.2));
    racks.push({id:'F'+(i+1), nombre:'Fila '+(i+1), x:3.3+2*D+G+5.55*i, y:4.93, ang:90, doble:true, mods});
  }
  return {id:'opb', nombre:'Opción 23-9-26 (esquemática)', base:true, nota:'Plano «Opción FINAL galpón Portal 23-9-26», dibujado sin escala: posiciones aproximadas. 630 posiciones.',
    params:{palletH:1.5, palletPiso:1.1, alero:10.5, flecha:1.8, portico:8.5, pasilloMin:3.2}, galpon:galpon(), tipos, racks};
}
const BASES = {sotic: baseSotic(), opb: baseOpcionB()};

/* ================= Estado ================= */
let store = {versions:[], cur:'sotic', tab:'planta'};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.versions)) store = Object.assign(store, s); } catch(e){}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
let L = null;                // plano activo
let sel = null, selMod = -1; // rack y módulo elegidos
let undoStack = [];
let showDims = true, showPal = true, measuring = false, meas = [];
function layoutById(id){ return BASES[id] || store.versions.find(v=>v.id===id) || null; }
function editable(){ return L && !L.base; }
function setLayout(id){
  L = layoutById(id) || BASES.sotic; store.cur = L.id; persist();
  sel = null; selMod = -1; undoStack = []; refreshAll(); fitView();
}
function commit(){ // llamar ANTES de cambiar
  if (!editable()) return false;
  undoStack.push(JSON.stringify({racks:L.racks, tipos:L.tipos, params:L.params}));
  if (undoStack.length > 80) undoStack.shift();

}
function saved(){ L.mod = new Date().toISOString(); persist(); refreshAll(); }

  if (!editable() || !undoStack.length) return;
  const s = JSON.parse(undoStack.pop()); L.racks = s.racks; L.tipos = s.tipos; L.params = s.params;
  if (sel && !L.racks.find(r=>r.id===sel)) sel = null;

}

/* ================= Geometría ================= */
function uv(r){ const a = r.ang*Math.PI/180; return {u:[Math.cos(a),Math.sin(a)], n:[-Math.sin(a),Math.cos(a)]}; }
const depth = r => r.doble ? 2*D+G : D;
const runLen = r => F + r.mods.reduce((s,m)=>s+m.w+F, 0);
function W(r, s, d){ const {u,n} = uv(r); return [r.x + s*u[0] + d*n[0], r.y + s*u[1] + d*n[1]]; }
function foot(r){ const Lr = runLen(r), Dt = depth(r); return [W(r,0,0), W(r,Lr,0), W(r,Lr,Dt), W(r,0,Dt)]; }
const sidesOf = r => r.doble ? [0, D+G] : [0];
function modStarts(r){ const a=[]; let s=F; for (const m of r.mods){ a.push(s); s += m.w + F; } return a; }
const palPer = m => m.w >= 1.9 ? 2 : 1;
const tipo = t => L.tipos[t] || {nombre:t, tunel:null, niveles:[]};
function pip(p, poly){ let c=false; for (let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,yi]=poly[i],[xj,yj]=poly[j]; if (((yi>p[1])!==(yj>p[1])) && (p[0] < (xj-xi)*(p[1]-yi)/(yj-yi)+xi)) c=!c; } return c; }
function proj(poly, ax){ let a=Infinity,b=-Infinity; for (const p of poly){ const v=p[0]*ax[0]+p[1]*ax[1]; if(v<a)a=v; if(v>b)b=v; } return [a,b]; }
function overlapSAT(A,B){
  for (const P of [A,B]) for (let i=0;i<P.length;i++){ const p=P[i], q=P[(i+1)%P.length]; const ax=[-(q[1]-p[1]), q[0]-p[0]];
    const a=proj(A,ax), b=proj(B,ax); const len=Math.hypot(ax[0],ax[1]); if (Math.min(a[1],b[1]) - Math.max(a[0],b[0]) < 0.01*len) return false; }
  return true;
}
function centroid(P){ return [P.reduce((s,p)=>s+p[0],0)/P.length, P.reduce((s,p)=>s+p[1],0)/P.length]; }
function edgeInfo(poly, i){ const a=poly[i], b=poly[(i+1)%poly.length]; const len=Math.hypot(b[0]-a[0],b[1]-a[1]); const u=[(b[0]-a[0])/len,(b[1]-a[1])/len]; return {a,b,len,u,out:[u[1],-u[0]]}; }
function northY(x){ // borde superior del galpón en x
  const P = L.galpon.poly; let best = 0;
  for (let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length];
    if ((a[0]-x)*(b[0]-x) <= 0 && a[0]!==b[0]){ const y = a[1] + (b[1]-a[1])*(x-a[0])/(b[0]-a[0]); if (y>best) best=y; }
    else if (a[0]===b[0] && Math.abs(a[0]-x)<1e-9) best=Math.max(best,a[1],b[1]); }
  return best;
}

/* ================= Cálculos ================= */
function rackStats(r){
  const st = {pos:0, est:0, mods:r.mods.length, largo:runLen(r), bast:(r.mods.length+1)*(r.doble?2:1), larg:{}, tabl:{}, porTipo:{}};
  const k = r.doble ? 2 : 1;
  for (const m of r.mods){
    const T = tipo(m.t);
    st.porTipo[m.t] = (st.porTipo[m.t]||0) + k;
    for (const lv of T.niveles){
      if (lv.k==='P') st.pos += palPer(m)*k;
      if (lv.k==='E'){ st.est += m.w*D*k; st.tabl[m.w] = (st.tabl[m.w]||0) + k; }
      if (lv.h > 0) st.larg[m.w] = (st.larg[m.w]||0) + 2*k;
    }
  }
  return st;
}
function totals(lay){
  const prev = L; L = lay;
  const t = {pos:0, est:0, mods:0, bast:0, larg:{}, tabl:{}, porTipo:{}, prot:0, racks:lay.racks.length};
  for (const r of lay.racks){ const s = rackStats(r); t.pos+=s.pos; t.est+=s.est; t.mods+=s.mods*(r.doble?2:1); t.bast+=s.bast; t.prot += r.doble ? 2 : 1;
    for (const w in s.larg) t.larg[w]=(t.larg[w]||0)+s.larg[w]; for (const w in s.tabl) t.tabl[w]=(t.tabl[w]||0)+s.tabl[w];
    for (const ty in s.porTipo) t.porTipo[ty]=(t.porTipo[ty]||0)+s.porTipo[ty]; }
  L = prev; return t;
}
function gaps(){
  const out = [], R = L.racks, Fs = R.map(foot);
  for (let i=0;i<R.length;i++) for (let j=i+1;j<R.length;j++){
    const da = ((R[i].ang - R[j].ang) % 90 + 90) % 90; if (Math.min(da, 90-da) > 1) continue;
    const {u,n} = uv(R[i]); let best = null;
    for (const [ax,pp] of [[u,n],[n,u]]){
      const a=proj(Fs[i],ax), b=proj(Fs[j],ax), oa=proj(Fs[i],pp), ob=proj(Fs[j],pp);
      const o0=Math.max(oa[0],ob[0]), o1=Math.min(oa[1],ob[1]); if (o1-o0 < 0.3) continue;
      let g, t0; if (b[0]-a[1] > 0.05){ g=b[0]-a[1]; t0=a[1]; } else if (a[0]-b[1] > 0.05){ g=a[0]-b[1]; t0=b[1]; } else continue;
      if (g > 8.5) continue;
      const q = (o1-o0) > 2.6 ? o0 + 1.0 : (o0+o1)/2;
      const P1=[t0*ax[0]+q*pp[0], t0*ax[1]+q*pp[1]], P2=[(t0+g)*ax[0]+q*pp[0], (t0+g)*ax[1]+q*pp[1]];
      let blocked = false;
      for (let k=0;k<R.length && !blocked;k++){ if (k===i||k===j) continue; for (const f of [.25,.5,.75]){ const p=[P1[0]+(P2[0]-P1[0])*f, P1[1]+(P2[1]-P1[1])*f]; if (pip(p,Fs[k])){blocked=true;break;} } }
      if (blocked) continue;
      if (!best || g < best.g) best = {g, P1, P2, i, j};
    }
    if (best) out.push(best);
  }
  return out;
}
function avisos(){
  const A = [], R = L.racks, Fs = R.map(foot), B = L.galpon.poly, p = L.params;
  for (let i=0;i<R.length;i++){
    const c = centroid(Fs[i]);
    if (Fs[i].some(q => !pip([q[0]+(c[0]-q[0])*0.004, q[1]+(c[1]-q[1])*0.004], B))) A.push({lvl:'bad', rack:R[i].id, t:`${R[i].nombre}: queda fuera del galpón o pegado al muro.`});
    for (let j=i+1;j<R.length;j++) if (overlapSAT(Fs[i],Fs[j])) A.push({lvl:'bad', rack:R[i].id, t:`${R[i].nombre} se superpone con ${R[j].nombre}.`});
  }
  // racks no paralelos (p. ej. fila contra el rack inclinado del muro Este): distancia mínima entre huellas
  const segD = (q,a,b) => { const dx=b[0]-a[0], dy=b[1]-a[1]; const t=Math.max(0,Math.min(1,((q[0]-a[0])*dx+(q[1]-a[1])*dy)/(dx*dx+dy*dy||1))); return Math.hypot(q[0]-a[0]-t*dx, q[1]-a[1]-t*dy); };
  const polyD = (A,B) => { let m=Infinity; for (const [X,Y] of [[A,B],[B,A]]) for (const q of X) for (let k=0;k<Y.length;k++) m=Math.min(m, segD(q,Y[k],Y[(k+1)%Y.length])); return m; };
  for (let i=0;i<R.length;i++) for (let j=i+1;j<R.length;j++){
    const da = ((R[i].ang - R[j].ang) % 90 + 90) % 90; if (Math.min(da, 90-da) <= 1 || (!R[i].doble && !R[j].doble)) continue;
    const d = polyD(Fs[i],Fs[j]); if (d > 0.01 && d < p.pasilloMin) A.push({lvl:'warn', rack:R[i].id, t:`Solo ${fmt(d)} m entre ${R[i].nombre} y ${R[j].nombre} (mínimo ${fmt(p.pasilloMin)} m).`});
  }
  for (const g of gaps()) if (g.g < p.pasilloMin) A.push({lvl:'warn', rack:R[g.i].id, t:`Pasillo de ${fmt(g.g)} m entre ${R[g.i].nombre} y ${R[g.j].nombre} (mínimo ${fmt(p.pasilloMin)} m).`});
  for (const [key,T] of Object.entries(L.tipos)){
    if (!L.racks.some(r=>r.mods.some(m=>m.t===key))) continue;
    const lv = [...T.niveles].sort((a,b)=>a.h-b.h);
    for (let i=0;i<lv.length-1;i++){
      const ph = lv[i].h===0 ? (p.palletPiso||p.palletH) : p.palletH;
      const need = lv[i].k==='P' ? ph + 0.12 + 0.08 : 0.30;
      if (lv[i+1].h - lv[i].h < need - 1e-6) A.push({lvl:'warn', t:`Tipo «${T.nombre}»: entre ${fmt(lv[i].h)} y ${fmt(lv[i+1].h)} m hay ${fmt(lv[i+1].h-lv[i].h)} m; un pallet de ${fmt(ph)} m necesita ${fmt(need)} m.`});
    }
    if (T.tunel && lv.length && lv[0].h < 2.4) A.push({lvl:'warn', t:`Tipo «${T.nombre}»: el paso libre bajo el primer nivel es de ${fmt(lv[0].h-0.12)} m.`});
    const top = lv.length ? lv[lv.length-1] : null;
    if (top && top.k==='P' && top.h + p.palletH > p.alero - 0.3) A.push({lvl:'warn', t:`Tipo «${T.nombre}»: el pallet superior llega a ${fmt(top.h+p.palletH)} m; el alero está a ${fmt(p.alero)} m.`});
  }
  return A;
}

/* ================= PLANTA (SVG) ================= */
const svg = $('#svgPlanta');
let vb = {x:-5, y:-25, s:14}; // px por metro
function vbApply(){ const w=svg.clientWidth||800, h=svg.clientHeight||500; svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${w/vb.s} ${h/vb.s}`); }
function fitView(){
  const w=svg.clientWidth||800, h=svg.clientHeight||500; const P=L.galpon.poly;
  const xs=P.map(p=>p[0]), ys=P.map(p=>-p[1]); const x0=Math.min(...xs)-4, x1=Math.max(...xs)+4, y0=Math.min(...ys)-4, y1=Math.max(...ys)+4;
  vb.s = Math.min(w/(x1-x0), h/(y1-y0)); vb.x = (x0+x1)/2 - w/vb.s/2; vb.y = (y0+y1)/2 - h/vb.s/2; vbApply();
}
const pt = p => `${(+p[0]).toFixed(3)},${(-p[1]).toFixed(3)}`;
function lpoly(r, pts){ return pts.map(q=>pt(W(r,q[0],q[1]))).join(' '); }
function dimSVG(P1, P2, off, txt, cls='', size=0.42){
  const dx=P2[0]-P1[0], dy=P2[1]-P1[1], len=Math.hypot(dx,dy); if (len<0.05) return '';
  const u=[dx/len,dy/len], n=[-u[1],u[0]];
  const a=[P1[0]+n[0]*off, P1[1]+n[1]*off], b=[P2[0]+n[0]*off, P2[1]+n[1]*off];
  let s = '';
  if (Math.abs(off)>0.05) s += `<line class="s-dim" x1="${pt(P1).split(',')[0]}" y1="${pt(P1).split(',')[1]}" x2="${pt(a).split(',')[0]}" y2="${pt(a).split(',')[1]}"/><line class="s-dim" x1="${pt(P2).split(',')[0]}" y1="${pt(P2).split(',')[1]}" x2="${pt(b).split(',')[0]}" y2="${pt(b).split(',')[1]}"/>`;
  s += `<polyline class="s-dim" points="${pt(a)} ${pt(b)}"/>`;
  const tk = 0.18; // marcas oblicuas de arquitectura
  for (const q of [a,b]) s += `<line class="s-dim" style="stroke-width:.06" x1="${q[0]-(u[0]+n[0])*tk}" y1="${-(q[1]-(u[1]+n[1])*tk)}" x2="${q[0]+(u[0]+n[0])*tk}" y2="${-(q[1]+(u[1]+n[1])*tk)}"/>`;
  let ang = Math.atan2(-dy, dx)*180/Math.PI; if (ang>90) ang-=180; if (ang<-90) ang+=180;
  const side = off>=0 ? 1 : -1; const m=[(a[0]+b[0])/2 + n[0]*0.22*side, (a[1]+b[1])/2 + n[1]*0.22*side];
  s += `<text class="s-dimt ${cls}" font-size="${size}" text-anchor="middle" dominant-baseline="middle" transform="translate(${m[0].toFixed(3)} ${(-m[1]).toFixed(3)}) rotate(${ang.toFixed(2)})" paint-order="stroke" stroke="var(--paper)" stroke-width="0.14">${txt}</text>`;
  return s;
}
function arrowLocal(r, s0, s1, d0, d1){ // flecha doble a lo largo de la profundidad
  const sc=(s0+s1)/2, hw=Math.min(0.32,(s1-s0)/3), sw=hw*0.45, hl=Math.min(0.32,(d1-d0)/3);
  return lpoly(r, [[sc,d0],[sc+hw,d0+hl],[sc+sw,d0+hl],[sc+sw,d1-hl],[sc+hw,d1-hl],[sc,d1],[sc-hw,d1-hl],[sc-sw,d1-hl],[sc-sw,d0+hl],[sc-hw,d0+hl]]);
}
function drawPlanta(){
  if (!L) return;
  const G0 = L.galpon, P = G0.poly, bad = new Set(avisos().filter(a=>a.lvl==='bad'&&a.rack).map(a=>a.rack));
  let s = '';
  // grilla
  const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]); const gx0=Math.floor(Math.min(...xs))-6, gx1=Math.ceil(Math.max(...xs))+6, gy0=Math.floor(Math.min(...ys))-6, gy1=Math.ceil(Math.max(...ys))+6;
  for (let x=gx0;x<=gx1;x++) s += `<line class="${x%5?'s-grid':'s-grid2'}" x1="${x}" y1="${-gy0}" x2="${x}" y2="${-gy1}"/>`;
  for (let y=gy0;y<=gy1;y++) s += `<line class="${y%5?'s-grid':'s-grid2'}" x1="${gx0}" y1="${-y}" x2="${gx1}" y2="${-y}"/>`;
  s += `<polygon class="s-floor" points="${P.map(pt).join(' ')}"/>`;
  s += `<polygon class="s-wall" points="${P.map(pt).join(' ')}"/>`;
  for (const g of G0.gates){ const e=edgeInfo(P,g.edge); const a=[e.a[0]+e.u[0]*(g.c-g.w/2), e.a[1]+e.u[1]*(g.c-g.w/2)], b=[e.a[0]+e.u[0]*(g.c+g.w/2), e.a[1]+e.u[1]*(g.c+g.w/2)];
    s += `<line class="s-gate" x1="${a[0]}" y1="${-a[1]}" x2="${b[0]}" y2="${-b[1]}"/>`;
    const o=e.out; s += `<polyline class="s-gatel" points="${pt(a)} ${pt([a[0]+o[0]*1.2,a[1]+o[1]*1.2])} ${pt([b[0]+o[0]*1.2,b[1]+o[1]*1.2])} ${pt(b)}"/>`;
    const m=[(a[0]+b[0])/2+o[0]*1.9,(a[1]+b[1])/2+o[1]*1.9]; s += `<text class="s-tag" font-size="0.6" text-anchor="middle" x="${m[0]}" y="${-m[1]}" dominant-baseline="middle">${esc(g.name)}</text>`; }
  for (const d of G0.doors){ const e=edgeInfo(P,d.edge); const a=[e.a[0]+e.u[0]*(d.c-d.w/2), e.a[1]+e.u[1]*(d.c-d.w/2)]; const ii=[-e.out[0],-e.out[1]];
    const b=[a[0]+e.u[0]*d.w, a[1]+e.u[1]*d.w], c=[a[0]+ii[0]*d.w, a[1]+ii[1]*d.w];
    s += `<line class="s-gate" x1="${a[0]}" y1="${-a[1]}" x2="${b[0]}" y2="${-b[1]}"/><path class="s-door" d="M${pt(c)} L${pt(a)} M${pt(c)} A${d.w} ${d.w} 0 0 1 ${pt(b)}"/>`; }
  for (const c of G0.cols) s += `<rect class="s-col" x="${c[0]-0.18}" y="${-c[1]-0.18}" width="0.36" height="0.36"/>`;
  // cotas del galpón
  if (showDims) for (let i=0;i<P.length;i++){ const e=edgeInfo(P,i); if (e.len<1) continue; s += dimSVG(e.a, e.b, -1.6, `${fmt(e.len)} m`, '', 0.55); }
  // racks
  for (const r of L.racks){
    const Lr=runLen(r), Dt=depth(r), st=modStarts(r), isSel = r.id===sel;
    s += `<g data-rack="${esc(r.id)}">`;
    s += `<polygon class="s-foot ${isSel?'sel':''} ${bad.has(r.id)?'bad':''}" points="${foot(r).map(pt).join(' ')}"/>`;
    for (const sd of sidesOf(r)){
      r.mods.forEach((m,mi)=>{
        const T=tipo(m.t), s0=st[mi], s1=s0+m.w;
        if (T.tunel){ s += `<polygon class="${T.tunel==='pasillo'?'s-arrR':'s-arrV'}" points="${arrowLocal(r,s0,s1,sd+0.08,sd+D-0.08)}"/>`; }
        else if (showPal){ const k=palPer(m), pw=Math.min(1.0,(m.w-0.1)/k); for (let q=0;q<k;q++){ const c=s0+m.w*(q+0.5)/k; s += `<polygon class="${m.t==='A'?'s-palA':'s-pal'}" points="${lpoly(r,[[c-pw/2,sd+0.03],[c+pw/2,sd+0.03],[c+pw/2,sd+D-0.03],[c-pw/2,sd+D-0.03]])}"/>`; } }
        if (isSel && mi===selMod) s += `<polygon style="fill:none;stroke:var(--sel);stroke-width:.12" points="${lpoly(r,[[s0,0],[s1,0],[s1,Dt],[s0,Dt]])}"/>`;
      });
      for (let f=0; f<=r.mods.length; f++){ const sf=(f===0?0:st[f-1]+r.mods[f-1].w)+F/2; const a=W(r,sf,sd+0.05), b=W(r,sf,sd+D-0.05); s += `<line class="s-frame" x1="${a[0]}" y1="${-a[1]}" x2="${b[0]}" y2="${-b[1]}"/>`; }
    }
    // etiqueta
    const lp = W(r, -0.9, Dt/2);
    s += `<text class="s-lbl" font-size="0.75" text-anchor="middle" dominant-baseline="middle" x="${lp[0]}" y="${-lp[1]}">${esc(r.id)}</text>`;
    if (showDims){ s += dimSVG(W(r,0,Dt), W(r,Lr,Dt), r.doble?0.75:0.75, `${fmt(Lr)} m · ${r.mods.length} mód.`, '', 0.4); }
    s += `</g>`;
  }
  if (showDims){
    for (const g of gaps()) s += dimSVG(g.P1, g.P2, 0, `${fmt(g.g)}`, g.g < L.params.pasilloMin ? 'warn':'', 0.45);
    // ancho del galpón en el Oeste y fondo útil
  }
  // medición
  if (meas.length){ const a=meas[0], b=meas[1]||meas[0];
    s += `<circle cx="${a[0]}" cy="${-a[1]}" r="0.15" style="fill:var(--sel)"/>`;
    if (meas[1]){ s += `<line class="s-meas" x1="${a[0]}" y1="${-a[1]}" x2="${b[0]}" y2="${-b[1]}"/><circle cx="${b[0]}" cy="${-b[1]}" r="0.15" style="fill:var(--sel)"/>`;
      const m=[(a[0]+b[0])/2,(a[1]+b[1])/2]; s += `<text class="s-meast" font-size="0.6" x="${m[0]+0.3}" y="${-m[1]-0.3}" paint-order="stroke" stroke="var(--paper)" stroke-width="0.18">${fmt(Math.hypot(b[0]-a[0],b[1]-a[1]))} m</text>`; }

  svg.innerHTML = s;
}

let drag = null;
function toWorld(ev){ const r=svg.getBoundingClientRect(); return [vb.x + (ev.clientX-r.left)/vb.s, -(vb.y + (ev.clientY-r.top)/vb.s)]; }
function snapPoint(p){
  let best=null, bd=0.35*14/vb.s+0.1;
  const cands=[...L.galpon.poly]; for (const r of L.racks) cands.push(...foot(r));
  for (const c of cands){ const d=Math.hypot(c[0]-p[0],c[1]-p[1]); if (d<bd){bd=d;best=c;} }
  return best ? [...best] : p;
}
svg.addEventListener('pointerdown', ev => {
  const w = toWorld(ev);
  if (measuring){ const p = snapPoint(w); if (meas.length!==1) meas=[p]; else meas=[meas[0],p]; drawPlanta(); return; }
  const g = ev.target.closest('[data-rack]');
  if (g){
    const id = g.getAttribute('data-rack');
    if (sel !== id){ sel = id; selMod = -1; refreshSide(); }
    // módulo bajo el cursor
    const r = L.racks.find(x=>x.id===id); const {u} = uv(r); const sAlong=(w[0]-r.x)*u[0]+(w[1]-r.y)*u[1];
    const st = modStarts(r); selMod = st.findIndex((s0,i)=> sAlong>=s0-F/2 && sAlong<=s0+r.mods[i].w+F/2);
    refreshSide(); drawPlanta();
    if (editable()){ drag = {mode:'rack', id, start:w, ox:r.x, oy:r.y, moved:false}; svg.setPointerCapture(ev.pointerId); svg.classList.add('dragging'); }
    return;
  }
  if (sel){ sel=null; selMod=-1; refreshSide(); drawPlanta(); }
  drag = {mode:'pan', sx:ev.clientX, sy:ev.clientY, vx:vb.x, vy:vb.y}; svg.setPointerCapture(ev.pointerId); svg.classList.add('dragging');

svg.addEventListener('pointermove', ev => {

  const w = toWorld(ev); const r = L.racks.find(x=>x.id===drag.id); if (!r) return;
  let nx = drag.ox + (w[0]-drag.start[0]), ny = drag.oy + (w[1]-drag.start[1]);
  const st = ev.shiftKey ? 0.01 : 0.05; nx = Math.round(nx/st)*st; ny = Math.round(ny/st)*st;
  if (!drag.moved && Math.hypot(nx-drag.ox, ny-drag.oy) > 0){ commit(); drag.moved = true; }
  r.x = +nx.toFixed(3); r.y = +ny.toFixed(3); drawPlanta(); refreshEditorFields();
});
const endDrag = () => { if (drag && drag.mode==='rack' && drag.moved) saved(); drag=null; svg.classList.remove('dragging'); };

function zoomAt(f, ev){ const rc=svg.getBoundingClientRect(); const cx = ev ? ev.clientX-rc.left : rc.width/2, cy = ev ? ev.clientY-rc.top : rc.height/2;
  const wx = vb.x + cx/vb.s, wy = vb.y + cy/vb.s; vb.s = Math.max(2, Math.min(200, vb.s*f)); vb.x = wx - cx/vb.s; vb.y = wy - cy/vb.s; vbApply(); }

/* ================= ALZADOS Y CORTE ================= */
function elevModuleSVG(s0, m, T, sx, opts={}){ // dibuja un módulo en coordenadas (X = s, Y = -z)
  const p = L.params; let s = '';
  const x0 = s0, x1 = s0 + m.w, lv = [...T.niveles].sort((a,b)=>a.h-b.h);
  for (const l of lv){
    if (l.h > 0) s += `<rect class="e-beam" x="${x0}" y="${-l.h}" width="${m.w}" height="0.12"/>`;
    if (l.k === 'E') s += `<rect class="e-deck" x="${x0}" y="${-l.h-0.03}" width="${m.w}" height="0.03"/>`;
    if (l.k === 'P' && opts.pallets !== false){ const k = palPer(m), pw = Math.min(1.0,(m.w-0.1)/k);
      for (let q=0;q<k;q++){ const c = x0 + m.w*(q+0.5)/k, a = c-pw/2;
        s += `<rect class="e-wood" x="${a}" y="${-l.h-0.15}" width="${pw}" height="0.15"/>`;
        const ph = l.h===0 ? (p.palletPiso||p.palletH) : p.palletH;
        s += `<rect class="e-load" x="${a+0.02}" y="${-l.h-ph}" width="${pw-0.04}" height="${ph-0.15}"/>`; } }
  }
  if (T.tunel){ const c=(x0+x1)/2, y=-0.9; const col = T.tunel==='pasillo'?'var(--red)':'var(--green)';
    s += `<text class="e-txt" x="${c}" y="${y}" font-size="0.32" text-anchor="middle" style="fill:${col};font-weight:600">PASO</text>`; }
  return s;
}
function upright(x, h){ return `<rect class="s-up" x="${x}" y="${-h}" width="${F}" height="${h}"/>`; }
function vdimSVG(x, z0, z1, txt, size=0.26){
  if (z1-z0 < 0.05) return '';
  return `<line class="s-dim" x1="${x}" y1="${-z0}" x2="${x}" y2="${-z1}"/><line class="s-dim" x1="${x-0.12}" y1="${-z0+0.12}" x2="${x+0.12}" y2="${-z0-0.12}"/><line class="s-dim" x1="${x-0.12}" y1="${-z1+0.12}" x2="${x+0.12}" y2="${-z1-0.12}"/>`+
    `<text class="s-dimt" font-size="${size}" text-anchor="middle" transform="translate(${x-0.12} ${-(z0+z1)/2}) rotate(-90)">${txt}</text>`;
}
function hdimSVG(x0, x1, z, txt, size=0.26){
  return `<line class="s-dim" x1="${x0}" y1="${-z}" x2="${x1}" y2="${-z}"/><line class="s-dim" x1="${x0-0.1}" y1="${-z+0.1}" x2="${x0+0.1}" y2="${-z-0.1}"/><line class="s-dim" x1="${x1-0.1}" y1="${-z+0.1}" x2="${x1+0.1}" y2="${-z-0.1}"/>`+
    `<text class="s-dimt" font-size="${size}" text-anchor="middle" x="${(x0+x1)/2}" y="${-z-0.1}">${txt}</text>`;
}
function typeCardSVG(key){
  const T = L.tipos[key], p = L.params, m = {t:key, w:2.3}, lv = [...T.niveles].sort((a,b)=>a.h-b.h);
  const top = Math.max(p.portico, ...lv.map(l=>l.h + (l.k==='P'?p.palletH:0.3))) + 0.4;
  let s = `<rect class="e-ground" x="-1.9" y="0" width="${2.3+2*F+2.4}" height="0.15"/>`;
  s += upright(0, p.portico) + upright(F+2.3, p.portico) + elevModuleSVG(F, m, T);
  let prev = 0; for (const l of lv){ s += vdimSVG(-0.45, prev, l.h, fmt(l.h-prev)); prev = l.h; }
  s += vdimSVG(-1.25, 0, p.portico, 'Bastidor '+fmt(p.portico));
  for (const l of lv) s += `<text class="e-txt" font-size="0.27" x="${2.3+2*F+0.12}" y="${-l.h+0.05}">${l.h===0?'piso':'+'+fmt(l.h)}${l.k==='E'?' est.':''}</text>`;
  s += hdimSVG(F, F+2.3, -0.45, '2,30');
  return `<svg viewBox="-1.9 ${-top} ${2.3+2*F+3.3} ${top+0.9}" role="img" aria-label="Alzado del tipo ${esc(T.nombre)}">${s}</svg>`;
}
function rackElevationSVG(r){
  const p=L.params, st=modStarts(r), Lr=runLen(r), sc=34;
  const top = Math.max(p.portico, ...r.mods.flatMap(m=>tipo(m.t).niveles.map(l=>l.h+(l.k==='P'?p.palletH:0.3)))) + 0.5;
  let s = `<rect class="e-ground" x="-1.2" y="0" width="${Lr+2.4}" height="0.15"/>`;
  for (let f=0; f<=r.mods.length; f++) s += upright(f===0?0:st[f-1]+r.mods[f-1].w, p.portico);
  r.mods.forEach((m,i)=>{ s += elevModuleSVG(st[i], m, tipo(m.t));
    s += `<text class="e-txt" font-size="0.3" text-anchor="middle" x="${st[i]+m.w/2}" y="0.5" style="${i===selMod?'fill:var(--sel);font-weight:600':''}">${i+1} · ${esc(m.t)}</text>`;
    s += hdimSVG(st[i], st[i]+m.w, -0.95, fmt(m.w), 0.24); });
  s += hdimSVG(0, Lr, -1.45, `${fmt(Lr)} m`, 0.3);
  s += vdimSVG(-0.6, 0, p.portico, fmt(p.portico));
  const W0 = (Lr+2.4)*sc, H0 = (top+1.7)*sc;
  return `<svg width="${W0}" height="${H0}" viewBox="-1.2 ${-top} ${Lr+2.4} ${top+1.7}" role="img" aria-label="Alzado frontal de ${esc(r.nombre)}">${s}</svg>`;
}
function sectionSVG(r){
  // Corte N-S del galpón por el eje del rack elegido (solo racks a 90°/270°)
  const p = L.params, c = centroid(foot(r)), x = c[0];
  const yN = northY(x), eave = p.alero, rise = p.flecha, sc = 26;
  let s = `<rect class="e-ground" x="-1" y="0" width="${yN+2}" height="0.25"/>`;
  s += `<rect class="e-wallf" x="-0.2" y="${-eave}" width="0.2" height="${eave}"/><rect class="e-wallf" x="${yN}" y="${-eave}" width="0.2" height="${eave}"/>`;
  let path = ''; for (let i=0;i<=40;i++){ const t=i/40; path += (i?' L':'M') + `${(t*yN).toFixed(3)} ${(-(eave + rise*Math.sin(Math.PI*t))).toFixed(3)}`; }
  s += `<path class="e-roof" d="${path}"/>`;
  let maxTop = 0;
  for (const q of L.racks){
    const a = ((q.ang%360)+360)%360; const st = modStarts(q), Lr = runLen(q);
    if (Math.abs(a-90)<1 || Math.abs(a-270)<1){
      const xs = proj(foot(q),[1,0]); if (x < xs[0] || x > xs[1]) continue;
      const dir = Math.abs(a-90)<1 ? 1 : -1;
      // frente del rack visto en el corte: posición y = q.y + dir*s
      for (let f=0; f<=q.mods.length; f++){ const sf = f===0?0:st[f-1]+q.mods[f-1].w; const y = q.y + dir*sf; s += upright(dir>0?y:y-F, p.portico); }
      q.mods.forEach((m,i)=>{ const y0 = q.y + dir*st[i]; const xx = dir>0 ? y0 : y0 - m.w; s += elevModuleSVG(xx, m, tipo(m.t));
        for (const l of tipo(m.t).niveles) maxTop = Math.max(maxTop, l.h + (l.k==='P'?p.palletH:0)); });
      const lbl = q.y + dir*Lr/2; s += `<text class="s-lbl" font-size="0.5" text-anchor="middle" x="${lbl}" y="0.8">${esc(q.id)}</text>`;
      s += hdimSVG(Math.min(q.y, q.y+dir*Lr), Math.max(q.y, q.y+dir*Lr), -1.25, `${fmt(Lr)}`, 0.3);
    } else if (Math.abs(a)<1 || Math.abs(a-180)<1){
      const dir = Math.abs(a)<1 ? 1 : -1; const sAl = dir*(x - q.x); if (sAl < 0 || sAl > Lr) continue;
      const mi = st.findIndex((s0,i)=> sAl>=s0-F && sAl<=s0+q.mods[i].w+F); const m = q.mods[Math.max(0,mi)]; const T = tipo(m.t);
      for (const sd of sidesOf(q)){ const y0 = q.y + dir*sd, y1 = q.y + dir*(sd+D); const lo=Math.min(y0,y1);
        s += upright(lo, p.portico) + upright(lo+D-F, p.portico);
        for (const l of T.niveles){ if (l.h>0) s += `<rect class="e-beam" x="${lo}" y="${-l.h}" width="${D}" height="0.12"/>`;
          if (l.k==='P'){ s += `<rect class="e-wood" x="${lo-0.05}" y="${-l.h-0.15}" width="1.2" height="0.15"/><rect class="e-load" x="${lo-0.03}" y="${-l.h-p.palletH}" width="1.16" height="${p.palletH-0.15}"/>`; maxTop=Math.max(maxTop,l.h+p.palletH); }
          if (l.k==='E') s += `<rect class="e-deck" x="${lo}" y="${-l.h-0.03}" width="${D}" height="0.03"/>`; }
        // diagonales del bastidor
        let zig=''; for (let z=0.3, k=0; z<p.portico-0.3; z+=0.9, k++) zig += `${k?'L':'M'}${(k%2?lo+D-F/2:lo+F/2).toFixed(3)} ${(-z).toFixed(3)} `;
        s += `<path d="${zig}" style="fill:none;stroke:var(--steel);stroke-width:.04"/>`; }
      s += `<text class="s-lbl" font-size="0.5" text-anchor="middle" x="${q.y+dir*depth(q)/2}" y="0.8">${esc(q.id)}</text>`;
    }
  }
  // cotas
  s += vdimSVG(-0.7, 0, eave, `Alero ${fmt(eave)}`, 0.32);
  if (maxTop>0){ s += `<line style="stroke:var(--warn);stroke-width:.04;stroke-dasharray:.2 .15" x1="0" y1="${-maxTop}" x2="${yN}" y2="${-maxTop}"/>`;
    s += `<text class="e-txt" font-size="0.32" x="${yN-0.2}" y="${-maxTop-0.15}" text-anchor="end" style="fill:var(--warn)">Tope de carga +${fmt(maxTop)} · libre al alero ${fmt(eave-maxTop)} m</text>`; }
  s += hdimSVG(0, yN, -2.0, `Ancho interior en este corte ${fmt(yN)} m`, 0.34);
  s += `<text class="e-txt" font-size="0.36" x="0" y="${-(eave+rise)-0.5}">Sur</text><text class="e-txt" font-size="0.36" x="${yN}" y="${-(eave+rise)-0.5}" text-anchor="end">Norte</text>`;
  const top = eave + rise + 1.2;
  return `<svg width="${(yN+3)*sc}" height="${(top+2.6)*sc}" viewBox="-1.6 ${-top} ${yN+3} ${top+2.6}" role="img" aria-label="Corte transversal del galpón">${s}</svg>`;
}
function drawAlzados(){
  const el = $('#alzBody'), r = L.racks.find(x=>x.id===sel), ed = editable();
  let h = `<h3 class="sec-title">Tipos de módulo</h3><p class="muted" style="margin:0 0 10px">Altura de cada nivel desde el piso, en metros (cara superior del larguero). P = nivel de pallets, E = estante de tablilla lisa.${ed?' Los cambios se aplican a todos los módulos de ese tipo.':''}</p><div class="types">`;
  for (const [k,T] of Object.entries(L.tipos)){
    const used = L.racks.reduce((s,r)=>s + r.mods.filter(m=>m.t===k).length*(r.doble?2:1), 0);
    h += `<div class="tcard"><h3>${esc(k)} · ${esc(T.nombre)}</h3><div class="muted">${used} módulos en este plano${T.tunel?` · túnel de ${T.tunel==='pasillo'?'paso entre pasillos':'portón'}`:''}</div>${typeCardSVG(k)}`;
    h += [...T.niveles].map((l,i)=>({...l,i})).sort((a,b)=>a.h-b.h).map(l=>`<div class="lv"><input type="number" step="0.05" data-t="${esc(k)}" data-i="${l.i}" data-f="h" value="${l.h}" ${ed?'':'disabled'} aria-label="Altura del nivel"><select data-t="${esc(k)}" data-i="${l.i}" data-f="k" ${ed?'':'disabled'} aria-label="Uso del nivel"><option value="P" ${l.k==='P'?'selected':''}>P · pallets</option><option value="E" ${l.k==='E'?'selected':''}>E · estante</option></select>${ed?`<button class="btn danger" data-t="${esc(k)}" data-del="${l.i}" aria-label="Quitar nivel">×</button>`:'<span></span>'}</div>`).join('');
    if (ed) h += `<div class="row" style="margin-top:6px"><button class="btn" data-addlv="${esc(k)}">+ Nivel</button></div>`;
    h += `</div>`;
  }
  h += `</div>`;
  if (ed) h += `<div class="row" style="margin-top:10px"><button class="btn" id="bNewType">+ Nuevo tipo (copia del Estándar)</button></div>`;
  h += `<h3 class="sec-title">Alzado frontal ${r?'· '+esc(r.nombre):''}</h3>`;
  h += r ? `<div class="elev">${rackElevationSVG(r)}</div>` : `<p class="muted">Elegí un rack en la planta para ver su alzado completo, módulo por módulo.</p>`;
  h += `<h3 class="sec-title">Corte transversal del galpón</h3>`;
  if (r && [90,270].some(a=>Math.abs(((r.ang%360)+360)%360 - a) < 1)) h += `<p class="muted" style="margin:0 0 8px">Corte Sur–Norte por el eje de ${esc(r.nombre)} (x = ${fmt(centroid(foot(r))[0])} m). Alero y techo estimados.</p><div class="elev">${sectionSVG(r)}</div>`;
  else h += `<p class="muted">Elegí una fila perpendicular al muro Sur (por ejemplo F5) para ver el corte con el rack de muro, la fila y el techo.</p>`;
  el.innerHTML = h;
  if (!ed) return;
  el.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>{ const T=L.tipos[i.dataset.t], l=T.niveles[+i.dataset.i]; commit();
    if (i.dataset.f==='h'){ const v=parseFloat(i.value); if (!isNaN(v) && v>=0) l.h=+v.toFixed(3); } else l.k=i.value; saved(); });
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const T=L.tipos[b.dataset.t]; if (T.niveles.length<2) return; commit(); T.niveles.splice(+b.dataset.del,1); saved(); });
  el.querySelectorAll('[data-addlv]').forEach(b=>b.onclick=()=>{ const T=L.tipos[b.dataset.addlv]; commit(); const mx=Math.max(0,...T.niveles.map(l=>l.h)); T.niveles.push({h:+(mx+L.params.palletH+0.25).toFixed(2), k:'P'}); saved(); });
  const nt = $('#bNewType'); if (nt) nt.onclick = () => { commit(); let n=1; while (L.tipos['N'+n]) n++; const src = L.tipos.S || L.tipos.B || Object.values(L.tipos)[0]; L.tipos['N'+n] = {...clone(src), nombre:'Nuevo tipo '+n, tunel:null}; saved(); };
}

function drawListado(){
  const t = totals(L), ref = totals(BASES.sotic), diff = L.id !== 'sotic';
  const dcell = (a,b,d=0) => { if (!diff) return ''; const x=a-b; return `<td class="n" style="color:${x>0?'var(--ok)':x<0?'var(--bad)':'var(--ink2)'}">${x>0?'+':''}${d?fmt(x,d):x}</td>`; };
  let h = `<h3 class="sec-title">Racks</h3><div class="tw"><table><thead><tr><th>Rack</th><th>Nombre</th><th>Prof.</th><th class="n">Módulos</th><th class="n">Largo m</th><th class="n">Posiciones</th><th class="n">Estantes m²</th><th>Composición (de inicio a fin)</th></tr></thead><tbody>`;
  for (const r of L.racks){ const s = rackStats(r);
    h += `<tr class="click ${r.id===sel?'selr':''}" data-r="${esc(r.id)}"><td><b>${esc(r.id)}</b></td><td>${esc(r.nombre)}</td><td>${r.doble?'Doble':'Simple'}</td><td class="n">${r.mods.length}</td><td class="n">${fmt(s.largo)}</td><td class="n">${s.pos}</td><td class="n">${fmt(s.est,1)}</td><td style="font-family:var(--f-mono);font-size:12px">${r.mods.map(m=>m.t+(m.w!==2.3?'('+fmt(m.w,1)+')':'')).join(' ')}</td></tr>`; }
  h += `<tr class="tot"><td colspan="3">Total</td><td class="n">${L.racks.reduce((s,r)=>s+r.mods.length,0)}</td><td class="n"></td><td class="n">${t.pos}</td><td class="n">${fmt(t.est,1)}</td><td></td></tr></tbody></table></div>`;
  h += `<h3 class="sec-title">Materiales${diff?' y diferencia con lo instalado':''}</h3><p class="muted" style="margin:0 0 8px">Conteo teórico a partir del plano: sirve para pedir cotización de una modificación. Verificar con el proveedor.</p><div class="tw"><table><thead><tr><th>Elemento</th><th class="n">Cantidad</th>${diff?'<th class="n">Instalado</th><th class="n">Diferencia</th>':''}</tr></thead><tbody>`;
  const row = (lab, a, b) => `<tr><td>${lab}</td><td class="n">${a}</td>${diff?`<td class="n">${b}</td>${dcell(a,b)}`:''}</tr>`;
  h += row(`Bastidores de ${fmt(L.params.portico)} m`, t.bast, ref.bast);
  const ws = [...new Set([...Object.keys(t.larg), ...Object.keys(ref.larg)])].sort((a,b)=>b-a);
  for (const w of ws) h += row(`Largueros de ${fmt(+w)} m`, t.larg[w]||0, ref.larg[w]||0);
  const wt = [...new Set([...Object.keys(t.tabl), ...Object.keys(ref.tabl)])].sort((a,b)=>b-a);
  for (const w of wt) h += row(`Niveles de tablilla lisa de ${fmt(+w)} m`, t.tabl[w]||0, ref.tabl[w]||0);
  h += row('Protecciones de cabecera (aprox.)', t.prot, ref.prot);
  h += row('Posiciones de pallet', t.pos, ref.pos);
  h += `</tbody></table></div>`;
  h += `<h3 class="sec-title">Módulos por tipo</h3><div class="tw"><table><thead><tr><th>Tipo</th><th>Descripción</th><th class="n">Módulos (caras)</th><th class="n">Pos. por módulo 2,30</th></tr></thead><tbody>`;
  for (const [k,T] of Object.entries(L.tipos)) h += `<tr><td><b>${esc(k)}</b></td><td>${esc(T.nombre)}</td><td class="n">${t.porTipo[k]||0}</td><td class="n">${T.niveles.filter(l=>l.k==='P').length*2}</td></tr>`;
  h += `</tbody></table></div>`;
  const el = $('#lstBody'); el.innerHTML = h;
  el.querySelectorAll('tr[data-r]').forEach(tr=>tr.onclick=()=>{ sel=tr.dataset.r; selMod=-1; refreshSide(); drawListado(); });
}

const V = {init:false, dirty:true};
function init3D(){
  if (V.init) return; V.init = true;
  const host = $('#v3d');
  V.renderer = new THREE.WebGLRenderer({antialias:true}); V.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  host.appendChild(V.renderer.domElement);
  V.scene = new THREE.Scene(); V.camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
  V.controls = new THREE.OrbitControls(V.camera, V.renderer.domElement); V.controls.enableDamping = true; V.controls.maxPolarAngle = Math.PI*0.495;
  V.scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a80, 0.85));
  const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(-30, 60, 25); V.scene.add(dl);
  V.root = new THREE.Group(); V.scene.add(V.root);
  new ResizeObserver(resize3D).observe(host); resize3D();
  let down = null;
  V.renderer.domElement.addEventListener('pointerdown', e=>{ down=[e.clientX,e.clientY]; });
  V.renderer.domElement.addEventListener('pointerup', e=>{ if (!down || Math.hypot(e.clientX-down[0],e.clientY-down[1])>4) return; pick3D(e); });
  const loop = () => { requestAnimationFrame(loop); if (store.tab!=='tres') return; V.controls.update(); V.renderer.render(V.scene, V.camera); };
  loop(); camPreset('aerea');
}
function resize3D(){ const h=$('#v3d'); const w=h.clientWidth||600, hh=h.clientHeight||400; V.renderer.setSize(w,hh,false); V.camera.aspect=w/hh; V.camera.updateProjectionMatrix(); }
const T3 = (x,y,z) => new THREE.Vector3(x, z, -y);
function themeDark(){ const a=document.documentElement.getAttribute('data-theme'); return a ? a==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function rng(seed){ let s = seed>>>0 || 1; return () => (s = (s*1664525 + 1013904223)>>>0) / 4294967296; }
function build3D(){
  if (!V.init) return; V.dirty = false;
  while (V.root.children.length){ const o=V.root.children.pop(); o.traverse(c=>{ if (c.geometry) c.geometry.dispose(); }); }

  const p = L.params, Gp = L.galpon.poly, box = new THREE.BoxGeometry(1,1,1);
  const batches = {}; const B = (key, mat) => batches[key] || (batches[key] = {mat, items:[], col:false});
  const add = (key, mat, r, sC, dC, zC, ls, ld, lz, color, rid) => { // centro en coords locales del rack
    const w = W(r, sC, dC); B(key,mat).items.push({x:w[0], y:w[1], z:zC, sx:ls, sy:lz, sz:ld, rot:r.ang*Math.PI/180, color, rid}); if (color!==undefined) batches[key].col = true; };
  const mats = {
    up: new THREE.MeshStandardMaterial({color:0xb5bcc0, metalness:0.55, roughness:0.38}),
    beam: new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.5}),
    deck: new THREE.MeshStandardMaterial({color:0x9ba2a6, metalness:0.4, roughness:0.5}),
    prot: new THREE.MeshStandardMaterial({color:0xf0c22e, roughness:0.6}),
    wood: new THREE.MeshStandardMaterial({color:0x9b6b3d, roughness:0.9}),
    load: new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.85}),

  V.pick = [];

        for (const dd of [sd+0.04, sd+D-0.04]) add('up', mats.up, r, sf, dd, p.portico/2, 0.09, 0.07, p.portico, undefined, rid);
        for (let z=0.25; z<p.portico; z+=1.2) add('up', mats.up, r, sf, sd+D/2, z, 0.04, D-0.08, 0.035, undefined, rid);
        // diagonales
        for (let z=0.25, k=0; z+1.2<=p.portico+0.01; z+=1.2, k++){ const len=Math.hypot(1.2, D-0.08), a=Math.atan2(1.2, D-0.08)*(k%2?1:-1);
          const w=W(r,sf,sd+D/2); B('diag',mats.up).items.push({x:w[0],y:w[1],z:z+0.6,sx:0.03,sy:0.03,sz:len,rot:r.ang*Math.PI/180,tilt:a,rid}); }
      }

      add('prot', mats.prot, r, -0.07, sd+D/2, 0.2, 0.1, D, 0.4, undefined, rid);

        const T = tipo(m.t), s0 = st[mi], sc = s0 + m.w/2;

          if (l.k==='E') add('deck', mats.deck, r, sc, sd+D/2, l.h+0.01, m.w, D-0.04, 0.02, undefined, rid);
          if (l.k==='P'){ const k = palPer(m), pw = Math.min(1.0,(m.w-0.1)/k);
            for (let q=0;q<k;q++){ if (rnd() > occ) continue; const c = s0 + m.w*(q+0.5)/k, hh = (l.h===0 ? (p.palletPiso||p.palletH) : p.palletH)*(0.75+0.25*rnd());

              add('load', mats.load, r, c, sd+D/2, l.h+0.15+(hh-0.15)/2, pw-0.04, 1.14, hh-0.15, loadCols[Math.floor(rnd()*loadCols.length)], rid); } }

      if (b.col) im.setColorAt(i, col.setHex(it.color===undefined?0xffffff:it.color)); });
    im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.userData.rids = b.items.map(it=>it.rid); V.root.add(im); V.pick.push(im);
  }
  // piso
  const shape = new THREE.Shape(Gp.map(q=>new THREE.Vector2(q[0],q[1])));
  const fl = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshStandardMaterial({color: themeDark()?0x6d706e:0xcfd0cb, roughness:0.95, side:THREE.DoubleSide}));
  fl.rotation.x = -Math.PI/2; V.root.add(fl);
  // líneas de pasillo amarillas frente a los racks
  // muros
  const wm = $('#selWalls').value, eave = p.alero;
  const wallMat = new THREE.MeshStandardMaterial({color:0xe3dfd2, roughness:0.95});
  if (wm !== 'none'){
    const H = wm==='low' ? 1.2 : eave;
    for (let i=0;i<Gp.length;i++){
      const e = edgeInfo(Gp,i); const cuts = L.galpon.gates.filter(g=>g.edge===i).map(g=>[g.c-g.w/2, g.c+g.w/2, g.h]).sort((a,b)=>a[0]-b[0]);
      let t = 0; const seg = (t0,t1,z0,z1) => { if (t1-t0<0.01 || z1-z0<0.01) return; const m=new THREE.Mesh(box, wallMat); const c=(t0+t1)/2;
        m.position.copy(T3(e.a[0]+e.u[0]*c+e.out[0]*0.1, e.a[1]+e.u[1]*c+e.out[1]*0.1, (z0+z1)/2)); m.rotation.y = Math.atan2(e.u[1],e.u[0]); m.scale.set(t1-t0, z1-z0, 0.2); V.root.add(m); };
      for (const [a,b,gh] of cuts){ seg(t,a,0,H); if (H>gh) seg(a,b,gh,H); t=b; }
      seg(t, e.len, 0, H);
    }
    for (const c of L.galpon.cols){ const m=new THREE.Mesh(box, mats.col); m.position.copy(T3(c[0],c[1],H/2)); m.scale.set(0.35,H,0.35); V.root.add(m); }
  }

  const rm = $('#selRoof').value;
  const xs = Gp.map(q=>q[0]), xmin=Math.min(...xs), xmax=Math.max(...xs);
  const nx = 90, nt = 20, pos = [], idx = [];
  for (let i=0;i<=nx;i++){ const x = xmin + (xmax-xmin)*i/nx; const yN = Math.max(0.01, northY(Math.min(x, xmax-0.001)));
    for (let j=0;j<=nt;j++){ const t=j/nt; const v=T3(x, t*yN, eave + p.flecha*Math.sin(Math.PI*t)); pos.push(v.x,v.y,v.z); } }
  for (let i=0;i<nx;i++) for (let j=0;j<nt;j++){ const a=i*(nt+1)+j, b=a+nt+1; idx.push(a,b,a+1, b,b+1,a+1); }
  if (rm !== 'none'){
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
    V.root.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:0xdfe4e8, roughness:0.6, side:THREE.DoubleSide, transparent:rm==='glass', opacity:rm==='glass'?0.28:1, depthWrite:rm!=='glass'})));
  }
  // cabriadas
  const tr = []; for (let x = 3.82; x < xmax-0.5; x += 5.05){ const yN = northY(x); if (yN<1) continue;
    for (let j=0;j<24;j++){ for (const dz of [0, -0.45]){ const t0=j/24, t1=(j+1)/24; const a=T3(x,t0*yN,eave+dz+p.flecha*Math.sin(Math.PI*t0)), b=T3(x,t1*yN,eave+dz+p.flecha*Math.sin(Math.PI*t1)); tr.push(a.x,a.y,a.z,b.x,b.y,b.z); }
      const t0=j/24, t1=(j+1)/24; const a=T3(x,t0*yN,eave+p.flecha*Math.sin(Math.PI*t0)), b=T3(x,t1*yN,eave-0.45+p.flecha*Math.sin(Math.PI*t1)); tr.push(a.x,a.y,a.z,b.x,b.y,b.z); } }
  const tg = new THREE.BufferGeometry(); tg.setAttribute('position', new THREE.Float32BufferAttribute(tr,3));
  V.root.add(new THREE.LineSegments(tg, new THREE.LineBasicMaterial({color: themeDark()?0x9aa3a8:0x2b2f31})));
  // etiquetas
  for (const r of L.racks){ const c = W(r, -1.4, depth(r)/2); V.root.add(label3D(r.id, T3(c[0], c[1], 0.9), r.id===sel)); }
}
function label3D(txt, pos, hi){
  const c = document.createElement('canvas'); c.width=128; c.height=64; const g=c.getContext('2d');
  g.fillStyle = hi ? '#2f80ed' : '#1c2226'; g.beginPath(); g.roundRect ? g.roundRect(4,8,120,48,10) : g.rect(4,8,120,48); g.fill();
  g.fillStyle='#fff'; g.font='bold 34px Barlow Condensed, Arial Narrow, sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,64,33);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false})); sp.position.copy(pos); sp.scale.set(1.6,0.8,1); sp.renderOrder = 5; return sp;
}
function pick3D(e){
  const rc = V.renderer.domElement.getBoundingClientRect(); const m = new THREE.Vector2(((e.clientX-rc.left)/rc.width)*2-1, -((e.clientY-rc.top)/rc.height)*2+1);
  const ray = new THREE.Raycaster(); ray.setFromCamera(m, V.camera); const hit = ray.intersectObjects(V.pick)[0];
  if (hit && hit.instanceId !== undefined){ const r = L.racks[hit.object.userData.rids[hit.instanceId]]; if (r){ sel = r.id; selMod=-1; refreshSide(); build3D(); } }
}
function camPreset(k){
  if (!V.init) return; const P=L.galpon.poly, xs=P.map(q=>q[0]), cx=(Math.min(...xs)+Math.max(...xs))/2;
  const r = L.racks.find(x=>x.id===sel);
  if (k==='aerea'){ V.camera.position.copy(T3(cx-14, -22, 38)); V.controls.target.copy(T3(cx, 10, 2)); }
  else if (k==='porton'){ const g = L.galpon.gates[1] || L.galpon.gates[0]; V.camera.position.copy(T3(g.c, -3, 1.7)); V.controls.target.copy(T3(g.c+0.5, 12, 3.5)); }
  else if (k==='pasillo'){ const q = r || L.racks.find(x=>x.doble) || L.racks[0]; const a=W(q,-3.5,-1.85), b=W(q,runLen(q),-1.85); V.camera.position.copy(T3(a[0],a[1],1.7)); V.controls.target.copy(T3(b[0],b[1],3.2)); }
  V.controls.update();
}
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>camPreset(b.dataset.cam));
['#selWalls','#selRoof','#rngOcc'].forEach(s=>$(s).addEventListener('change',()=>build3D()));

/* ================= Versiones / navegación ================= */
function fillVersions(){
  const s = $('#selVer'); let h = `<optgroup label="Planos de referencia">`;
  for (const b of Object.values(BASES)) h += `<option value="${b.id}">${esc(b.nombre)}</option>`;
  h += `</optgroup>`;
  if (store.versions.length){ h += `<optgroup label="Mis versiones">`; for (const v of store.versions) h += `<option value="${esc(v.id)}">${esc(v.nombre)}</option>`; h += `</optgroup>`; }
  s.innerHTML = h; s.value = L.id;
  $('#bRen').disabled = !editable(); $('#bDel').disabled = !editable();
  $('#bAddD').disabled = !editable(); $('#bAddS').disabled = !editable(); $('#bUndo').disabled = !editable() || !undoStack.length;
  $('#bDup').textContent = L.base ? 'Crear versión editable' : 'Duplicar versión';
}
$('#selVer').onchange = e => setLayout(e.target.value);
$('#bDup').onclick = () => {
  const c = clone(L); c.id = 'v' + Date.now().toString(36); c.base = false; delete c.nota;
  c.nombre = L.base ? `Modificación ${store.versions.length+1} (desde ${L.id==='sotic'?'instalado':'opción 23-9'})` : L.nombre + ' (copia)';
  store.versions.push(c); setLayout(c.id);
};
$('#bRen').onclick = () => {
  if (!editable()) return; const sp = $('#bRen');
  const inp = document.createElement('input'); inp.type='text'; inp.value=L.nombre; inp.id='renInp'; inp.style.width='220px'; sp.replaceWith(inp); inp.focus(); inp.select();
  const done = () => { const v = inp.value.trim(); if (v) L.nombre = v; persist(); inp.replaceWith(sp); fillVersions(); };
  inp.onkeydown = e => { if (e.key==='Enter') done(); if (e.key==='Escape'){ inp.replaceWith(sp); } }; inp.onblur = done;
};
function setupDel(){ const w=$('#delWrap'); w.innerHTML = `<button class="btn danger" id="bDel" ${editable()?'':'disabled'}>Borrar</button>`;
  inlineConfirm(w, 'Borrar', () => { store.versions = store.versions.filter(v=>v.id!==L.id); setLayout('sotic'); }); }
$('#bJson').onclick = () => { $('#taJson').value = JSON.stringify({nombre:L.nombre, params:L.params, galpon:L.galpon, tipos:L.tipos, racks:L.racks}, null, 1); $('#impMsg').textContent=''; $('#modal').hidden=false; };
$('#bClose').onclick = () => $('#modal').hidden = true;
$('#bCopy').onclick = () => { const ta=$('#taJson'); navigator.clipboard?.writeText(ta.value).then(()=>$('#impMsg').textContent='Copiado.').catch(()=>{ ta.select(); $('#impMsg').textContent='Seleccionado: copiá con Ctrl+C.'; }) || (ta.select()); };
$('#bImp').onclick = () => { try { const o = JSON.parse($('#taJson').value); if (!Array.isArray(o.racks) || !o.tipos) throw 0;
  const base = clone(BASES.sotic); const c = {...base, ...o, id:'v'+Date.now().toString(36), base:false, nombre:(o.nombre||'Importado')+' (importado)'}; delete c.nota;
  store.versions.push(c); $('#modal').hidden = true; setLayout(c.id); } catch(e){ $('#impMsg').textContent = 'El texto no es un plano válido: tiene que tener "racks" y "tipos".'; } };

function setTab(t){
  store.tab = t; persist();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t));
  for (const k of ['planta','alzados','tres','listado']) $('#p-'+k).hidden = k!==t;
  if (t==='planta'){ vbApply(); drawPlanta(); }
  if (t==='alzados') drawAlzados();
  if (t==='listado') drawListado();
  if (t==='tres'){ if (typeof THREE === 'undefined'){ $('#v3d').innerHTML = '<p class="muted" style="padding:16px">No se pudo cargar el motor 3D (sin conexión a internet).</p>'; return; } init3D(); resize3D(); build3D(); }
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function refreshAll(){
  fillVersions(); setupDel(); refreshSide();
  if (store.tab==='planta') drawPlanta(); else if (store.tab==='alzados') drawAlzados(); else if (store.tab==='listado') drawListado(); else if (store.tab==='tres') build3D();
  else V.dirty = true;
}
new ResizeObserver(()=>{ if (store.tab==='planta') vbApply(); }).observe(svg);

// arranque
L = layoutById(store.cur) || BASES.sotic;
refreshAll(); setTab(store.tab || 'planta'); fitView();
</script>

<style>
#btn-escritorio{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2147483000;display:flex;align-items:center;gap:0;height:46px;padding:0 13px;border-radius:999px;
  background:linear-gradient(145deg,#2f6bd1,#1f4a9b);color:#fff;text-decoration:none;font:700 14px/1 "Figtree","Montserrat","Segoe UI",system-ui,sans-serif;

<script>
/* Si debajo del botón hay una barra fija (por ej. la barra de pestañas del celular), lo sube por encima. */
(function(){var b=document.getElementById("btn-escritorio");if(!b)return;
function ubicar(){b.style.bottom="";var r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;b.style.visibility="hidden";var e=document.elementFromPoint(x,y);b.style.visibility="";
for(var p=e;p&&p!==document.body&&p!==document.documentElement;p=p.parentElement){var cs=getComputedStyle(p);if(cs.position==="fixed"||cs.position==="sticky"){var top=p.getBoundingClientRect().top;if(top>innerHeight/2)b.style.bottom=(innerHeight-top+12)+"px";break;}}}
addEventListener("load",function(){setTimeout(ubicar,600)});addEventListener("resize",function(){clearTimeout(ubicar.t);ubicar.t=setTimeout(ubicar,250)});})();
</script>
