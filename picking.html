<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="https://fabriziovischi10-a11y.github.io/ecommerceportal/intro-portal.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B3D">
<title>Picking · Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
/* Tokens y estilo de las apps del Portal (copiados de gestientrega/replica/app/comun.css) */
:root{
  --amarillo:#FFD100;--azul:#1F4A9B;--azul-2:#2f6bd1;--noche:#0B1B3D;--rojo:#E0261C;--verde:#2fbf71;
  --f-disp:"Montserrat","Segoe UI",sans-serif;--f-txt:"Figtree","Segoe UI",sans-serif;
  --fg:#fff;--card:#12285a;--muted-fg:rgba(255,255,255,.62);--border:rgba(255,255,255,.13);--radius:1rem;
  --amber-bg:rgba(255,209,0,.13);--amber:#ffd84d;--emerald-bg:rgba(47,191,113,.15);--emerald:#5fe09a;
  --rose-bg:rgba(224,38,28,.18);--rose:#ff8f87;--orange-bg:rgba(255,145,40,.15);--orange:#ffb46e;
  --blue-bg:rgba(47,107,209,.24);--blue:#9cc2ff;--slate-bg:rgba(255,255,255,.08);--slate:#dbe4f0;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{color:var(--fg);font:16px/1.4 var(--f-txt);-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overscroll-behavior-y:contain;
  background:radial-gradient(900px 600px at 85% -10%,rgba(255,209,0,.18),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(224,38,28,.16),transparent 60%),linear-gradient(160deg,#10275a 0%,#0b1b3d 55%,#081430 100%);background-color:var(--noche);background-attachment:fixed}
h1,h2,h3{margin:0 0 .4rem;line-height:1.2;font-family:var(--f-disp);font-weight:800}
h1{font-size:1.45rem;font-weight:900}h2{font-size:1.15rem}h3{font-size:1rem}
.muted{color:var(--muted-fg)}.small{font-size:.85rem}.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace}
button{font:inherit;color:inherit}
.card{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px -18px rgba(0,0,0,.6);padding:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:.6rem 1rem;font:700 15px var(--f-txt);cursor:pointer;background:rgba(255,255,255,.08);color:#fff;min-height:48px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--amarillo);color:var(--noche);border-color:var(--amarillo)}
.btn-success{background:var(--verde);border-color:var(--verde);color:#06281a}
.btn-danger{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn-ghost{background:transparent;border-color:transparent}
.btn-lg{min-height:60px;font-size:1.1rem;border-radius:16px;padding:.8rem 1.2rem}
.btn-sm{min-height:36px;padding:.3rem .75rem;font-size:.88rem;border-radius:11px}
.btn-block{width:100%}
input,select,textarea{font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:.55rem .75rem;width:100%;min-height:46px}
input::placeholder{color:rgba(255,255,255,.45)}
select option{background:#12285a;color:#fff}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
input:focus,select:focus{outline:2px solid var(--amarillo);outline-offset:0}
.badge{display:inline-block;border-radius:999px;padding:.14rem .6rem;font-size:.76rem;font-weight:800;white-space:nowrap}
.t-amber{background:var(--amber-bg);color:var(--amber)}.t-emerald{background:var(--emerald-bg);color:var(--emerald)}.t-rose{background:var(--rose-bg);color:var(--rose)}
.t-orange{background:var(--orange-bg);color:var(--orange)}.t-blue{background:var(--blue-bg);color:var(--blue)}.t-slate{background:var(--slate-bg);color:var(--slate)}
.fila{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.entre{justify-content:space-between}
.vacio{text-align:center;color:var(--muted-fg);padding:1.5rem 1rem;border:1px dashed rgba(255,255,255,.2);border-radius:var(--radius)}
/* cabecera con franja de colores Portal */
header.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.6rem;padding:.6rem 16px;padding-top:calc(.6rem + env(safe-area-inset-top,0px));background:rgba(8,20,48,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
header.top::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--amarillo) 0 55%,#ffb000 55% 75%,var(--rojo) 75% 88%,var(--azul-2) 88%)}
header.top img{height:24px;width:auto}
.tit-cab{font:800 13px var(--f-disp);letter-spacing:.04em;color:rgba(255,255,255,.75);border-left:1px solid var(--border);padding-left:10px;text-transform:uppercase}
.cab-der{margin-left:auto;display:flex;align-items:center;gap:.4rem;min-width:0}
.yo{display:flex;align-items:center;gap:.35rem;max-width:44vw;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:999px;padding:.25rem .65rem;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--verde)}
.offline{display:none;background:var(--rojo);color:#fff;text-align:center;font-weight:800;font-size:.85rem;padding:.35rem 16px;position:sticky;top:0;z-index:49}
body.sin-red .offline{display:block}body.sin-red .dot{background:var(--rojo)}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.paso{font:800 .75rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--amarillo);margin:.2rem 0 .3rem}
/* tarjetas de pasillo */
.pasillos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.pas{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;min-height:116px;padding:14px 14px 12px;border-radius:18px;border:1px solid var(--border);background:rgba(255,255,255,.06);cursor:pointer;text-align:left;overflow:hidden}
.pas::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--c)}
.pas .n{font:900 1.15rem var(--f-disp);line-height:1.1}
.pas .u{font-size:.78rem;color:var(--muted-fg)}
.pas .cnt{margin-top:auto;font-weight:800;font-size:.9rem}
.pas .cnt b{font:900 1.6rem var(--f-disp);color:var(--c);margin-right:.25rem;vertical-align:-2px}
.pas:active{transform:scale(.98)}
.lista{display:grid;gap:10px;margin-top:12px}
.item{display:flex;align-items:center;gap:.7rem;padding:14px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.06);cursor:pointer;text-align:left;width:100%;min-height:60px}
.item .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:900 1rem var(--f-disp);background:var(--c,#2f6bd1);color:#0B1B3D;flex:none}
.item .tx{flex:1;min-width:0}.item .t{font-weight:800;font-size:1.05rem}.item .d{font-size:.84rem;color:var(--muted-fg)}
/* pedidos */
.ped{padding:14px;border-radius:18px;border:1px solid var(--border);background:rgba(255,255,255,.06)}
.ped .nro{font:900 1.35rem var(--f-disp)}.ped .meta{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.86rem;color:var(--muted-fg);margin:.25rem 0 .55rem}
.ped .meta b{color:#fff}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--verde);border-radius:99px;transition:width .3s}
.bar i.f{background:var(--rojo)}
/* picking */
.pk-cab{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:20;margin:-14px -16px 12px;padding:10px 16px;background:rgba(8,20,48,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
body.sin-red .pk-cab{top:calc(78px + env(safe-area-inset-top,0px))}
.pk-cab .r1{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.pk-cab .r1 .t{font:900 1rem var(--f-disp);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-cab .r1 .p{font-weight:800;font-size:.9rem;white-space:nowrap}
.actual{border-radius:20px;border:2px solid var(--amarillo);background:linear-gradient(180deg,rgba(255,209,0,.09),rgba(255,255,255,.04));padding:16px}
.actual.ok{border-color:var(--verde);background:linear-gradient(180deg,rgba(47,191,113,.14),rgba(255,255,255,.04))}
.actual.parcial,.actual.cambio{border-color:#ff9a2e}.actual.faltante{border-color:var(--rojo);background:linear-gradient(180deg,rgba(224,38,28,.14),rgba(255,255,255,.04))}
.actual .desc{font:800 1.4rem/1.2 var(--f-disp);margin:.4rem 0 .6rem;word-break:break-word}
.actual .cods{font-size:.85rem;color:var(--muted-fg)}
.ubi{display:flex;align-items:center;gap:.6rem;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.07);margin:.5rem 0}
.ubi .big{font:900 1.45rem var(--f-disp);letter-spacing:.02em;color:var(--amarillo);white-space:nowrap}
.ubi .tx{font-size:.8rem;color:var(--muted-fg);line-height:1.25}
.cant{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .2rem}
.cant .q{font:900 2.6rem/1 var(--f-disp)}.cant .u{font-weight:800;font-size:1.05rem}
.cant .eq{width:100%;font-weight:700;color:var(--amber);font-size:.95rem}
.hint{display:flex;align-items:center;gap:.5rem;margin-top:.7rem;padding:10px 12px;border-radius:12px;background:var(--amber-bg);color:var(--amber);font-weight:800;font-size:.95rem}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lin{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;padding:11px 12px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.05);cursor:pointer;min-height:56px}
.lin.sel{border-color:var(--amarillo);background:rgba(255,209,0,.08)}
.lin .ic{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:.95rem;background:rgba(255,255,255,.1)}
.lin.ok .ic{background:var(--verde);color:#06281a}.lin.parcial .ic,.lin.cambio .ic{background:#ff9a2e;color:#2b1600}.lin.faltante .ic{background:var(--rojo)}
.lin.quitada{opacity:.5}.lin.quitada .t{text-decoration:line-through}
.lin .tx{flex:1;min-width:0}.lin .t{font-weight:700;font-size:.95rem;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lin .d{font-size:.78rem;color:var(--muted-fg)}
.lin .q{font:900 1.05rem var(--f-disp);white-space:nowrap;text-align:right}
.sep{font:800 .74rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg);margin:16px 0 6px}
/* barra de escaneo fija */
#scanbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(8,20,48,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border)}
#scanbar .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
#scanbar input{min-height:56px;font-size:18px;font-weight:700;letter-spacing:.03em}
#scanbar .btn{min-height:56px;min-width:56px;padding:0 .8rem}
body.ver-scan #scanbar{display:block}
/* flash de color al escanear */
#flash{position:fixed;inset:0;z-index:9500;pointer-events:none;opacity:0}
#flash.ok{background:rgba(47,191,113,.38);animation:fl .5s ease-out}
#flash.err{background:rgba(224,38,28,.5);animation:fl .7s ease-out}
#flash.info{background:rgba(255,209,0,.3);animation:fl .5s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
/* toasts */
.toasts{position:fixed;z-index:9999;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:grid;gap:.5rem;width:min(92vw,440px)}
.toast{padding:.85rem 1rem;border-radius:14px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.45);background:#12285a;border:1px solid var(--border);border-left:5px solid var(--verde);transition:opacity .3s,transform .3s}
.toast.err{border-left-color:var(--rojo);background:#3a1220}.toast.info{border-left-color:var(--amarillo)}
.toast.fuera{opacity:0;transform:translateY(-8px)}
/* modal (hoja desde abajo en el celular) */
.m-fondo{position:fixed;inset:0;z-index:9000;background:rgba(4,10,26,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.m-fondo{align-items:center;padding:1rem}}
.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:1.3rem 1.3rem 0 0;background:#11265a;box-shadow:0 30px 80px rgba(0,0,0,.55);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:640px){.modal{border-radius:1.3rem}}
.m-cab{position:sticky;top:0;background:#11265a;display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.9rem 1rem;border-bottom:1px solid var(--border);z-index:1}
.m-cab::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--amarillo) 0 55%,#ffb000 55% 75%,var(--rojo) 75% 88%,var(--azul-2) 88%)}
.m-cab h2{margin:0;font-size:1.1rem}
.m-cuerpo{padding:1rem}
.m-acc{display:flex;gap:.6rem;margin-top:1rem}.m-acc .btn{flex:1}
/* selector de cantidad */
.qsel{display:grid;grid-template-columns:72px 1fr 72px;gap:10px;align-items:center;margin:.6rem 0}
.qsel .btn{min-height:72px;font-size:2rem;font-weight:900;border-radius:18px}
.qsel input{min-height:72px;text-align:center;font:900 2.4rem var(--f-disp);padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:rgba(255,255,255,.07);border-radius:999px;padding:.5rem .85rem;font-weight:700;cursor:pointer;min-height:40px}
.chip.on{background:var(--amarillo);color:var(--noche);border-color:var(--amarillo)}
/* cámara */
#cam{position:fixed;inset:0;z-index:9200;background:#000;display:none;flex-direction:column}
#cam.on{display:flex}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .marco{position:absolute;left:10%;right:10%;top:35%;height:22%;border:3px solid var(--amarillo);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#cam .pie{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:#081430}
/* supervisión */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 12px;padding:0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--border);background:rgba(255,255,255,.06);border-radius:999px;padding:.5rem .95rem;font-weight:800;cursor:pointer;min-height:42px}
.tab.on{background:var(--amarillo);color:var(--noche);border-color:var(--amarillo)}
.pp{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:.86rem;margin:.35rem 0}
.pp .nm{font-weight:800;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .nm::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.pp .sub{grid-column:2/4;font-size:.78rem;color:var(--muted-fg);margin-top:-4px}
.tabla{width:100%;border-collapse:collapse;font-size:.88rem}
.tabla td,.tabla th{padding:.45rem .4rem;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.tabla th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg)}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.catchip{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.35rem .7rem;background:rgba(255,255,255,.08);border:1px solid var(--border);font-size:.84rem;font-weight:700;cursor:pointer;margin:0 6px 6px 0}
.prueba{font-size:.7rem;font-weight:800;background:var(--amber-bg);color:var(--amber);border-radius:6px;padding:0 .35rem;margin-left:.3rem}
/* tiempos: cronómetro, pausa, resumen y pestaña Tiempos */
.pk-cab .r2{display:flex;align-items:center;gap:.6rem;margin-bottom:.45rem}
.crono-w{display:flex;flex-direction:column;min-width:0}
.crono-l{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-fg);line-height:1.1}
.crono{font:900 2.1rem/1.05 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.01em;color:#fff}
.crono.pausa{color:var(--amber)}.crono.fin{color:var(--emerald)}.crono.quieto{color:var(--muted-fg)}
.btn-pausa{margin-left:auto;min-height:44px;border-color:rgba(255,209,0,.55);color:var(--amber)}
.pausa-pant{margin-top:4px;border-radius:22px;border:3px solid var(--amarillo);background:repeating-linear-gradient(135deg,rgba(255,209,0,.11) 0 18px,rgba(255,209,0,.03) 18px 36px);padding:26px 18px;text-align:center}
.pausa-pant .gr{font:900 2.7rem/1 var(--f-disp);color:var(--amarillo);letter-spacing:.05em;margin-top:.3rem}
.resumen-t{font:900 3.6rem/1 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--emerald)}
.tz-f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tz-f label{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg);margin-bottom:3px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.kpi .k{display:block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg)}
.kpi .v{display:block;font:900 1.35rem var(--f-disp);font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabla.ancha{min-width:720px}.tabla.ancha td,.tabla.ancha th{white-space:nowrap}
.tabla .rk{font:900 1rem var(--f-disp);color:var(--amarillo)}
/* control a ciegas (2026-11-16) */
.ctl-falta{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--violeta-bg);border:1px solid rgba(183,140,255,.35)}.ctl-falta .bar.gruesa{height:16px;margin:6px 0 4px;border-radius:9px}.ctl-falta .bar.gruesa i{border-radius:9px}
#ctl-q{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid rgba(183,140,255,.45);background:rgba(255,255,255,.06);color:inherit;font-size:1.05rem}.ctl-buscar{margin:0 0 10px;scroll-margin-top:12px}.ctl-buscar .small{display:block;margin-top:4px}.lin.enpk{opacity:.5}
:root{--violeta:#b78cff;--violeta-bg:rgba(183,140,255,.16)}
.t-violet{background:var(--violeta-bg);color:#d9c4ff}
.pas.ctl-card{width:100%;margin-top:14px;min-height:104px;border-color:rgba(183,140,255,.45);background:linear-gradient(135deg,rgba(183,140,255,.22),rgba(255,255,255,.05) 70%)}
.pas.ctl-card .n{font-size:1.35rem}
.ctl-pas{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:800;border-radius:999px;padding:.15rem .55rem;background:rgba(255,255,255,.08);margin:0 4px 4px 0}
.ctl-pas::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.actual.ctl{border-color:var(--violeta);background:linear-gradient(180deg,rgba(183,140,255,.12),rgba(255,255,255,.04))}
.actual.ctl.ok{border-color:var(--verde)}.actual.ctl.corregido{border-color:#ff9a2e}.actual.ctl.diferencia{border-color:var(--rojo)}
.lin.corregido .ic{background:#ff9a2e;color:#2b1600}.lin.diferencia .ic{background:var(--rojo)}
.lin .est{font-size:.74rem;font-weight:800;white-space:nowrap;text-align:right}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.teclado .btn{min-height:62px;font:900 1.6rem var(--f-disp);border-radius:16px}
.ctl-alerta{border-radius:18px;padding:18px 16px;text-align:center;border:3px solid var(--rojo);background:rgba(224,38,28,.16)}
.ctl-alerta.ambar{border-color:#ff9a2e;background:rgba(255,145,40,.15)}
.ctl-alerta .gr{font:900 2rem/1.1 var(--f-disp)}
.ctl-alerta .q{font:900 3.4rem/1 var(--f-disp);font-variant-numeric:tabular-nums}
.ctl-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.ctl-cmp div{border-radius:14px;background:rgba(255,255,255,.07);padding:10px;text-align:center}
.ctl-cmp b{display:block;font:900 2.4rem/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.m-col{display:grid;gap:10px;margin-top:14px}
.tabla tr.dif td{background:rgba(224,38,28,.08)}
.tabla.ancha td.wr{white-space:normal;min-width:150px;max-width:210px}
/* esperas y pausas (2026-11-16) */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px}
.subtabs .chip{min-height:38px;padding:.3rem .85rem;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--fg);font-weight:800;font-size:.86rem;cursor:pointer}
.subtabs .chip.on{background:var(--amarillo);color:#0B1B3D;border-color:var(--amarillo)}
.kpi .v.t{font-size:1.12rem;line-height:1.25;margin:2px 0}
.eb{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.06);min-width:24px}
.eb i{display:block;height:100%;min-width:2px}
.eb i.ab{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px)!important}
.eb-ley{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.76rem;color:var(--muted-fg);margin:6px 2px 0}
.eb-ley span{display:inline-flex;align-items:center;gap:5px}.eb-ley span::before{content:"";width:12px;height:8px;border-radius:2px;background:var(--c)}
.tabla td.amb{color:var(--amber);font-weight:800}.tabla td.roj{color:var(--rose);font-weight:800}
.tabla tr.pz-ab td{background:rgba(224,38,28,.10)}.tabla tr.pz-la td{background:rgba(255,209,0,.07)}
.esp-sub{display:block;font-size:.72rem;color:var(--muted-fg);font-weight:400}
.tl{list-style:none;margin:.4rem 0 .6rem;padding:0 0 0 4px}
.tl li{position:relative;padding:0 0 10px 20px;border-left:2px solid var(--border);margin-left:6px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--muted-fg));border:2px solid var(--card)}
.tl li.no::before{background:transparent;border:2px dashed var(--muted-fg)}
.tl .h{font-weight:800}.tl .w{display:block;font-size:.78rem;color:var(--muted-fg);margin-top:1px}
.tl .w.amb{color:var(--amber);font-weight:800}.tl .w.roj{color:var(--rose);font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
/* =====================================================================
   PICKING · Portal Distribuidora
   Datos: Realtime Database pública del Parte diario (portal-logistica), rama picking/
   - picking/catalogo   {v,fecha,items:{codigo:[ean,desc,catA,catB,catC,equi,unidad]}}  (se cachea en el teléfono por v)
   - picking/pasillos   {<id>:{nombre,orden,color,ubicacion,cats:[...],integrantes:{<id>:{nombre,alta,prueba?}}}}
   - picking/ubicaciones {fecha,items:{codigo:[[ubicacion,unidades],...]}}  (lo sube la PC cada 10 min)
   - picking/pedidos/<id>  lo arma el TMS: «Cargar guías de Excel» (id "z_<zonaId>_<ts>" o "s_<sucursalId>_<ts>", origen:"excel", zonaId, zona,
       sucursalId?, destinos, fecha, archivo, guiasNro, sin nro; al cargarlo en una orden el TMS agrega ordenId, ordenNro, cargadoEn)
       o «Enviar a picking» desde una orden (id = salidaId, con nro, camion, chofer). Listo NO se archiva solo: espera al TMS.
       pasillos/<p>: {estado:"pendiente"|"en curso"|"listo",picker,pickerId,inicio,fin,terminadoPor,terminadoPorId,duracionSeg,pausasSeg,
                      tramos:{<push>:{pickerId,picker,desde,hasta?}}, pausas:{<push>:{desde,hasta?,motivo,por,porId}},
                      lineas:{<codigo>:{c,d,q,ean,equi,cat,quitada?,tomado,estado,por,porId,at,at1,qVista,motivo}}}
       TIEMPOS (2026-11-16): inicio = primer «Tomar» (no se pisa nunca); cada tramo = quién tuvo el pasillo y desde/hasta cuándo
       (abierto = sin hasta); duracionSeg = suma de tramos − pausas, se guarda al terminar; at = última confirmación del renglón, at1 = la primera.
       CONTROL A CIEGAS (2026-11-16): cuando TODOS los pasillos con renglones están «listo», el pedido pasa a Control 1; al terminarlo, «controlado».
       HOY HAY UNA SOLA ETAPA (c1). El CONTROL 2 queda para más adelante: se suma agregando "c2" a CTL_ETAPAS (etapa "control2", nodo control/c2
       con la misma forma que c1, comparando contra lo ya corregido en el 1) sin migrar datos.
       pedidos/<id>/control = {etapa:"control1"|"controlado" (informativo; la etapa real se calcula con ctlEtapa), controladoEn?,
         c1:{estado:"en curso"|"listo", controlador, controladorId, inicio, fin, terminadoPor, terminadoPorId, duracionSeg, pausasSeg,
                tramos:{<push>:{pickerId,picker,desde,hasta?}} (pickerId = id del controlador), pausas:{…igual que el picking},
                resumen:{ren,ok,recontados,corregidos,diferencias,sobrantes},
                lineas:{<codigo>:{contado, piqueado (lo que había piqueado al comparar), ok:bool (contado==piqueado), intentos, conteos:[…],
                                  accion:"ok"|"recontado"|"corregido"|"diferencia", at, por, porId}},
                sobrantes:{<push>:{cod,c,d,cantidad,at,por,porId}}}}
         El control es del PEDIDO COMPLETO: renglones consolidados por código (si un código está en 2 pasillos se suman), se compara contra
         lo PIQUEADO (tomado), nunca contra lo pedido. «Corregir lo piqueado» cambia pasillos/<p>/lineas/<cod>/tomado (y estado) y deja
         historial en lineas/<cod>/correcciones/<push>{antes,despues,por,porId,at,etapa}.
         Etapa (ctlEtapa): picking → control1 (falta c1 terminado con todos los renglones) → controlado. El TMS usa la misma regla (pkCtl).
       ESPERAS (2026-11-16): control.listoParaControlEn = cuando terminó el último pasillo (lo guarda «Terminar»); pasillos/<p>/creado = cuando
         el pasillo llegó a picking (TMS en pkFusion y «Asignar a un pasillo»). Pedidos viejos: fin máximo de los pasillos / pedido.creado.
         Cálculos en esperasDe / pausasDe (Supervisión → Tiempos → Esperas y Pausas; línea de tiempo en el detalle del pedido).
   - picking/control/integrantes/<push>{nombre,alta,prueba?}  (los controladores: grupo aparte de los pasillos)
   - picking/archivo/<salidaId>  (pedidos archivados por el supervisor)
   - picking/config/pinSupervisor  (por defecto "1234": NO es seguridad, solo evita que los chicos entren por error)
   ===================================================================== */

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fN=n=>Number(n||0).toLocaleString("es-AR");
let OFF=0;   // diferencia con el reloj del servidor (.info/serverTimeOffset): así todos los teléfonos miden igual
const ahora=()=>new Date(Date.now()+OFF).toISOString();
const pl=(n,a,b)=>fN(n)+" "+(Number(n)===1?a:b);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const keyDe=c=>String(c==null?"":c).trim().replace(/[.#$\[\]\/]/g,"_");
const normCod=s=>String(s==null?"":s).replace(/\s+/g,"").replace(/^0+/,"").toUpperCase();
const fFecha=f=>{if(!f)return"";const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(f);return m?m[3]+"/"+m[2]:f};
const fHora=iso=>{if(!iso)return"";const d=new Date(iso);return isNaN(d)?"":d.toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})};
const iniciales=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
/* pedido: con N° de orden (flujo viejo, desde una orden del TMS) o por ZONA / sucursal (Excel + zona, sin orden todavía) */
const porZona=x=>!x.nro&&(x.origen==="excel"||x.zona);
const pedTit=x=>x.nro?"N° "+x.nro:(x.zona||(x.destinos||[]).join(", ")||x.id);
const pedOrd=x=>String(x.nro||x.zona||x.id||"");
/* datos secundarios: fecha, destino (si el título es el N°), camión, chofer, orden de carga en que se cargó */
function pedMeta(x,corto){const m=['<span><b>'+esc(fFecha(x.fecha)||"sin fecha")+'</b></span>'];
  if(x.nro)m.push('<span><b>'+esc((x.destinos||[]).join(", ")||"—")+'</b></span>');else m.push('<span>'+(x.sucursalId&&!x.zonaId?"Sucursal":"Zona")+'</span>');
  if(x.camion)m.push('<span>Camión <b>'+esc(x.camion)+'</b></span>');if(x.chofer&&!corto)m.push('<span>'+esc(x.chofer)+'</span>');
  if(!x.nro&&x.ordenId)m.push('<span style="color:var(--emerald)">En orden N° <b>'+esc(x.ordenNro||"…")+'</b></span>');
  if(!corto&&(x.guiasNro||[]).length)m.push('<span>'+pl(x.guiasNro.length,"guía","guías")+'</span>');return m.join("")}
/* pedido por zona listo que todavía no se cargó en una orden: sigue en picking/pedidos esperando al TMS */

/* ---------- escrituras que no se pierden: se guardan en el teléfono hasta que la base confirma ---------- */
const PEND=LS.get("pk-pend",{});
function guardar(path,obj){const id=Date.now()+"-"+Math.random().toString(36).slice(2,7);
  PEND[path]={v:Object.assign({},(PEND[path]||{}).v||{},obj),id};LS.set("pk-pend",PEND);
  return db.ref(path).update(obj).then(()=>{if(PEND[path]&&PEND[path].id===id){delete PEND[path];LS.set("pk-pend",PEND)}}).catch(e=>{console.error(e);toast("No se pudo guardar: "+e.message,"err")})}
function reenviarPendientes(){Object.keys(PEND).forEach(path=>{const m=/^picking\/pedidos\/([^/]+)/.exec(path);
  if(m&&!ST.pedidos[m[1]]){delete PEND[path];return}   // el pedido ya no existe (archivado o borrado)
  const p=PEND[path],id=p.id;db.ref(path).update(p.v).then(()=>{if(PEND[path]&&PEND[path].id===id){delete PEND[path];LS.set("pk-pend",PEND)}})});LS.set("pk-pend",PEND)}

/* ---------- feedback: vibración, sonido, color ---------- */
let AC=null;
function beep(tipo){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const tonos=tipo==="ok"?[[1046,.09],[1568,.12]]:tipo==="err"?[[220,.18],[160,.32]]:[[880,.12]];let t=AC.currentTime;
  tonos.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=tipo==="err"?"square":"sine";o.frequency.value=f;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d})}catch(e){}}
function senal(tipo,msg){const f=$("#flash");f.className="";void f.offsetWidth;f.className=tipo;
  try{navigator.vibrate&&navigator.vibrate(tipo==="ok"?60:tipo==="err"?[220,90,220]:[40,60,40])}catch(e){}
  beep(tipo);if(msg)toast(msg,tipo)}
function toast(msg,tipo){const t=document.createElement("div");t.className="toast "+(tipo||"ok");t.textContent=msg;$("#toasts").appendChild(t);
  while($("#toasts").children.length>3)$("#toasts").firstChild.remove();
  setTimeout(()=>{t.classList.add("fuera");setTimeout(()=>t.remove(),350)},tipo==="err"?4200:2600)}

/* ---------- modal ---------- */
function modal(titulo,cuerpo,opc){cerrarModal();opc=opc||{};const f=document.createElement("div");f.className="m-fondo";f.id="m";
  f.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="m-cab"><h2>'+esc(titulo)+'</h2><button class="btn btn-ghost btn-sm" data-a="m-cerrar" aria-label="Cerrar">✕</button></div><div class="m-cuerpo">'+cuerpo+'</div></div>';
  f.addEventListener("click",e=>{if(e.target===f&&!opc.fijo)cerrarModal()});document.body.appendChild(f);
  ST.modalAbierto=true;actualizarScanbar();return f}
function cerrarModal(){const m=$("#m");if(m)m.remove();ST.modalAbierto=false;actualizarScanbar()}
function confirmar(titulo,texto,boton,fn,peligro){const m=modal(titulo,'<p>'+texto+'</p><div class="m-acc"><button class="btn" data-a="m-cerrar">Cancelar</button><button class="btn '+(peligro?"btn-danger":"btn-primary")+'" id="m-ok">'+esc(boton)+'</button></div>');
  m.querySelector("#m-ok").onclick=()=>{cerrarModal();fn()}}

/* ---------- pasillos y líneas ---------- */
const listaPasillos=()=>Object.keys(ST.pasillos).map(id=>Object.assign({id},ST.pasillos[id])).sort((a,b)=>(a.orden||0)-(b.orden||0));
const pasDe=id=>id==="sinpasillo"?SINP:id==="control"?CTLP:Object.assign({id},ST.pasillos[id]||{nombre:id});
const activas=pp=>Object.keys((pp&&pp.lineas)||{}).filter(k=>!pp.lineas[k].quitada).map(k=>Object.assign({k},pp.lineas[k]));
/* estado efectivo de una línea */
function est(l){if(l.quitada)return"quitada";
  if(l.tomado==null&&l.estado!=="faltante")return"pendiente";
  if(l.qVista!=null&&Number(l.qVista)!==Number(l.q))return"cambio";   // el TMS cambió la cantidad pedida después de piquear
  const t=Number(l.tomado)||0,q=Number(l.q)||0;
  if(t>=q&&q>0)return"ok";return t>0?"parcial":"faltante"}
const resuelta=e=>e==="ok"||e==="parcial"||e==="faltante";
const EST_T={pendiente:["Pendiente","t-slate"],ok:["Completo","t-emerald"],parcial:["Parcial","t-orange"],faltante:["Faltante","t-rose"],cambio:["Cambió la cantidad","t-orange"],quitada:["Quitada del pedido","t-slate"]};
const EST_IC={pendiente:"",ok:"✓",parcial:"½",faltante:"✕",cambio:"!",quitada:"–"};
function avance(pp){const L=activas(pp);let res=0,ok=0,falt=0,uni=0,tom=0;
  L.forEach(l=>{const e=est(l);if(resuelta(e))res++;if(e==="ok")ok++;if(e==="parcial"||e==="faltante")falt++;uni+=Number(l.q)||0;tom+=Math.min(Number(l.tomado)||0,Number(l.q)||0)});
  return{tot:L.length,res,ok,falt,uni,tom}}
function pedidosDe(p){return Object.values(ST.pedidos).filter(x=>x.pasillos&&x.pasillos[p]&&activas(x.pasillos[p]).length&&x.pasillos[p].estado!=="listo")
  .sort((a,b)=>String(a.fecha||"").localeCompare(String(b.fecha||""))||pedOrd(a).localeCompare(pedOrd(b)))}
/* ubicación sugerida y orden de recorrido (cara, posición, nivel; sin ubicación al final) */
const ubiDe=c=>{const u=ST.ubic[c]||ST.ubic[keyDe(c)];return u&&u.length?u:null};
function partesUbi(u){const m=/^D15([A-Z]+)(\d+)N(\d+)$/.exec(u||"");if(!m)return null;const f=m[1];
  const dep=(f.length===1&&f<="J")?"15":(f.length===1||f<="AG")?"3":"1";return{cara:f,pos:+m[2],niv:+m[3],dep}}
function claveRec(l){const u=ubiDe(l.c);if(!u)return"9"+l.d;const p=partesUbi(u[0][0]);
  if(!p)return"6"+u[0][0];return(p.dep==="3"?"1":"4")+p.cara.length+p.cara.padStart(2," ")+String(p.pos).padStart(3,"0")+String(p.niv).padStart(2,"0")}
function ubiHtml(l,grande){const u=ubiDe(l.c);if(!u)return'<div class="ubi"><span class="big" style="color:var(--muted-fg)">—</span><span class="tx">Sin ubicación en el WMS<br>buscalo en el pasillo</span></div>';
  const p=partesUbi(u[0][0]),otras=u.slice(1).map(x=>esc(x[0])).join(", ");

function equiTxt(q,equi){return ""; /* 2026-11-16: todo en unidades (pedido del usuario) */ q=Number(q)||0;equi=Number(equi)||1;if(equi<=1||q<equi)return equi>1?"bulto de "+equi+" u":"";

/* ---------- tiempos: cronómetro por pasillo, tramos por integrante y pausas ---------- */
const msDe=iso=>{const t=Date.parse(iso||"");return isNaN(t)?null:t};
const ahoraMs=()=>Date.now()+OFF;
const nuevoId=()=>db.ref().push().key;
const pasPath=(id,p)=>"picking/pedidos/"+id+"/pasillos/"+(p||ST.yo.pasillo);
const fHM=iso=>{const d=new Date(iso||"");return isNaN(d)?"":d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})};
function fDur(seg){seg=Math.max(0,Math.round(Number(seg)||0));const h=Math.floor(seg/3600),m=Math.floor(seg%3600/60),s=seg%60;
  return(h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(s).padStart(2,"0")}
/* tiempo activo de un pasillo = tramos − pausas. Pedidos viejos sin tramos: un tramo inicio→fin a nombre de pickerId.
   Devuelve seg (total), por {<pickerId>:{seg,nom}}, pausaSeg, nPausas, pausado, corre (el reloj avanza), empezo, listo */
function tiempos(pp,now){pp=pp||{};now=now==null?ahoraMs():now;const listo=pp.estado==="listo",fin=msDe(pp.fin),tope=listo&&fin?fin:now;
  const TK=Object.keys(pp.tramos||{}),PK=Object.keys(pp.pausas||{});
  let iv=TK.map(k=>{const t=pp.tramos[k]||{};return{d:msDe(t.desde),h:t.hasta?msDe(t.hasta):tope,abierto:!t.hasta,id:t.pickerId||"",nom:t.picker||""}}).filter(t=>t.d!=null&&t.h!=null);
  if(!iv.length&&msDe(pp.inicio)!=null)iv=[{d:msDe(pp.inicio),h:tope,abierto:!listo,id:pp.pickerId||"",nom:pp.picker||pp.terminadoPor||""}];
  const pz=PK.map(k=>{const p=pp.pausas[k]||{};return{d:msDe(p.desde),h:p.hasta?msDe(p.hasta):tope}}).filter(p=>p.d!=null&&p.h!=null);
  const por={};let act=0,pau=0;
  iv.forEach(t=>{let s=Math.max(0,t.h-t.d);pz.forEach(p=>{const o=Math.min(t.h,p.h)-Math.max(t.d,p.d);if(o>0)s-=o});s=Math.max(0,s)/1000;act+=s;
    const k=t.id||("n:"+t.nom);(por[k]=por[k]||{seg:0,nom:""}).seg+=s;if(t.nom)por[k].nom=t.nom});
  pz.forEach(p=>{if(p.h>p.d)pau+=(p.h-p.d)/1000});
  const pa=listo?null:PK.find(k=>pp.pausas[k]&&!pp.pausas[k].hasta)||null;
  return{seg:listo&&pp.duracionSeg!=null?Number(pp.duracionSeg):act,pausaSeg:listo&&pp.pausasSeg!=null?Number(pp.pausasSeg):pau,nPausas:PK.length,por,
    pausado:!!pa,pausaKey:pa,pausa:pa?pp.pausas[pa]:null,corre:!listo&&!pa&&iv.some(t=>t.abierto),empezo:iv.length>0,listo}}
const tramoAbierto=pp=>{const T=(pp&&pp.tramos)||{};return Object.keys(T).find(k=>T[k]&&!T[k].hasta)||null};
/* cambios (rutas hoja, para que se puedan juntar sin pisarse) para que el pasillo corra a nombre de «quien» desde t:
   cierra el tramo y la pausa abiertos de otro y abre uno propio. Si ya corre a su nombre no cambia nada. */
function updTramo(pp,quien,t){const u={},T=pp.tramos||{},ab=Object.keys(T).filter(k=>T[k]&&!T[k].hasta);
  if(ab.some(k=>T[k].pickerId===quien.id))return u;
  ab.forEach(k=>{u["tramos/"+k+"/hasta"]=t});
  Object.keys(pp.pausas||{}).forEach(k=>{if(pp.pausas[k]&&!pp.pausas[k].hasta)u["pausas/"+k+"/hasta"]=t});
  // pasillo empezado antes de que existieran los tramos: su tiempo desde «inicio» va a nombre de quien lo tenía
  const legado=!Object.keys(T).length&&pp.inicio&&pp.estado==="en curso"&&!pp.terminadoPor,suyo=!pp.pickerId||pp.pickerId===quien.id;
  if(legado&&!suyo){const k=nuevoId();Object.assign(u,{["tramos/"+k+"/pickerId"]:pp.pickerId,["tramos/"+k+"/picker"]:pp.picker||"",["tramos/"+k+"/desde"]:pp.inicio,["tramos/"+k+"/hasta"]:t})}
  const k=nuevoId();Object.assign(u,{["tramos/"+k+"/pickerId"]:quien.id,["tramos/"+k+"/picker"]:quien.nombre,["tramos/"+k+"/desde"]:legado&&suyo?pp.inicio:t});
  return u}
/* deja el pasillo «en curso» con el reloj corriendo a mi nombre. forzar = «Tomar» / «Tomarlo yo» (le saca el pasillo a otro) */
function arrancarTiempo(id,forzar){const x=ST.pedidos[id],pp=x&&x.pasillos&&x.pasillos[ST.yo.pasillo];if(!pp||pp.estado==="listo")return;
  if(!forzar&&(tramoAbierto(pp)||(pp.estado==="en curso"&&pp.pickerId&&pp.pickerId!==ST.yo.id)))return;   // ya corre, o lo tiene otro (se toma con «Tomarlo yo»)
  const t=ahora();guardar(pasPath(id),Object.assign({estado:"en curso",picker:ST.yo.nombre,pickerId:ST.yo.id,inicio:pp.inicio||t},updTramo(pp,ST.yo,t)))}
function cronoHtml(id,p,tm,grande){const cls=tm.listo?"fin":tm.pausado?"pausa":tm.corre?"":"quieto";
  const lab=tm.listo?"Tiempo final":tm.pausado?"En pausa":tm.corre?"Tiempo":tm.empezo?"Detenido":"Sin empezar";
  return grande?'<div class="crono-w"><span class="crono-l">'+lab+'</span><span class="crono '+cls+'" data-crono="'+esc(id)+'|'+esc(p)+'" role="timer">'+fDur(tm.seg)+'</span></div>'
    :'<span class="mono" data-crono="'+esc(id)+'|'+esc(p)+'">'+fDur(tm.seg)+'</span>'}
/* el reloj avanza solo: cada segundo se reescriben los [data-crono] y [data-pausa] sin redibujar la pantalla */
function tic(){const now=ahoraMs();
  document.querySelectorAll("[data-crono],[data-pausa]").forEach(el=>{const [id,p]=(el.dataset.crono||el.dataset.pausa).split("|"),x=ST.pedidos[id],pp=x&&(p.charAt(0)==="@"?(x.control||{})[p.slice(1)]:x.pasillos&&x.pasillos[p]);if(!pp)return;
    let v;if(el.dataset.crono)v=fDur(tiempos(pp,now).seg);else{const tm=tiempos(pp,now);v=tm.pausa?fDur((now-msDe(tm.pausa.desde))/1000):""}
    if(el.textContent!==v)el.textContent=v})}

    +A.map(z=>{const e=est(z);return'<button class="lin '+e+(z.k===ST.sel?" sel":"")+'" data-a="sel" data-id="'+esc(z.k)+'"><span class="ic">'+EST_IC[e]+'</span><span class="tx"><span class="t">'+esc(z.d)+'</span><span class="d mono">'+esc(ubiCorta(z))+' · '+esc(z.c)+'</span></span><span class="q">'+(resuelta(e)||e==="cambio"?fN(z.tomado||0)+'/':"")+fN(z.q)+'</span></button>'}).join("")+'</div>';
  if(Q.length)h+='<div class="sep">Quitadas del pedido</div><div class="lista" style="margin-top:0;gap:8px">'+Q.map(z=>'<div class="lin quitada"><span class="ic">–</span><span class="tx"><span class="t">'+esc(z.d)+'</span><span class="d">'+(Number(z.tomado)>0?"Ya tomaste "+fN(z.tomado)+": devolvelo a su lugar":"Ya no va en este pedido")+'</span></span></div>').join("")+'</div>';

/* ---------- acciones del picker ---------- */
function rutaLinea(k){return"picking/pedidos/"+ST.pedidoId+"/pasillos/"+ST.yo.pasillo+"/lineas/"+k}
function guardarLinea(l,tomado,estado,motivo){const pp=pedidoActual().pasillos[ST.yo.pasillo];
  const t=ahora(),obj={tomado:Number(tomado)||0,estado,por:ST.yo.nombre,porId:ST.yo.id,at:t,at1:l.at1||l.at||t,qVista:Number(l.q)||0,motivo:motivo||null};
  guardar(rutaLinea(l.k),obj);
  if(pp.estado!=="listo")arrancarTiempo(ST.pedidoId,!pp.estado||pp.estado==="pendiente")}
function siguiente(){const x=pedidoActual();if(!x)return;const {A}=lineasOrdenadas(x.pasillos[ST.yo.pasillo]);const i=A.findIndex(l=>l.k===ST.sel);
  const sig=A.slice(i+1).concat(A.slice(0,i)).find(l=>!resuelta(est(l)));ST.sel=sig?sig.k:ST.sel;render();window.scrollTo({top:0,behavior:"smooth"})}
function lineaSel(){const x=pedidoActual();if(!x)return null;return activas(x.pasillos[ST.yo.pasillo]).find(l=>l.k===ST.sel)||null}
/* escaneo: EAN o código interno */
function procesarCodigo(cod){cod=String(cod||"").trim();if(!cod)return;if(ST.vista==="control"){ctlProcesarCodigo(cod);return}const x=pedidoActual();if(!x)return;
  const n=normCod(cod),A=activas(x.pasillos[ST.yo.pasillo]),l=lineaSel();
  const coincide=z=>(z.ean&&normCod(z.ean)===n)||normCod(z.c)===n;
  if(l&&coincide(l)){senal("ok");pedirCantidad(l);return}
  const otra=A.find(coincide);
  if(otra){ST.sel=otra.k;render();window.scrollTo({top:0});senal("info","Es otro renglón del pedido: «"+otra.d+"»");pedirCantidad(otra);return}
  const ck=ST.eanIdx[n]||(ST.cat&&ST.cat[cod]?cod:null),it=ck&&ST.cat[ck];
  const enOtroPas=Object.keys(x.pasillos).find(p=>p!==ST.yo.pasillo&&activas(x.pasillos[p]).some(coincide));
  senal("err",it?"✕ Ese es «"+it[1]+"»"+(enOtroPas?" (va en "+pasDe(enOtroPas).nombre+")":" y no está en este pedido"):"✕ Código "+cod+" no corresponde a este pedido")}
/* hoja de cantidad tomada */
function pedirCantidad(l){const q=Number(l.q)||0,equi=Number(l.equi)||1;let n=l.tomado!=null&&est(l)!=="cambio"?Number(l.tomado):q;
  const m=modal("¿Cuántas tomaste?",'<div class="small muted mono">Cód. '+esc(l.c)+'</div><div style="font:800 1.1rem/1.25 var(--f-disp);margin:.2rem 0 .4rem">'+esc(l.d)+'</div>'
    +'<div class="small">Pide <b>'+fN(q)+' u</b>'+(equiTxt(q,equi)?' · '+esc(equiTxt(q,equi).replace(/^[\d.]+ u = /,"")):"")+'</div>'
    +'<div class="qsel"><button class="btn" id="q-menos" aria-label="Una menos">−</button><input id="q-n" type="number" inputmode="numeric" min="0" value="'+n+'"><button class="btn" id="q-mas" aria-label="Una más">+</button></div>'
    +'<div class="chips" style="justify-content:center">'+(false?'<button class="chip" id="q-bm">− bulto</button><button class="chip" id="q-bp">+ bulto ('+equi+')</button>':"")+'<button class="chip" id="q-todo">Todo ('+fN(q)+')</button><button class="chip" id="q-cero">0</button></div>'
    +'<div id="q-av" class="small" style="text-align:center;margin-top:8px;min-height:1.2em"></div>'
    +'<div class="m-acc"><button class="btn btn-lg" data-a="m-cerrar">Cancelar</button><button class="btn btn-lg btn-success" id="q-ok">Confirmar</button></div>');
  const inp=m.querySelector("#q-n"),av=m.querySelector("#q-av");
  const set=v=>{n=Math.max(0,Math.round(Number(v)||0));inp.value=n;av.innerHTML=n>q?'<span style="color:var(--orange)">Ojo: es más de lo que pide el pedido</span>':n<q?'<span style="color:var(--orange)">Quedaría <b>parcial</b>: faltan '+fN(q-n)+'</span>':'<span style="color:var(--emerald)">Completo</span>'};
  set(n);inp.oninput=()=>set(inp.value);
  m.querySelector("#q-menos").onclick=()=>set(n-1);m.querySelector("#q-mas").onclick=()=>set(n+1);
  m.querySelector("#q-todo").onclick=()=>set(q);m.querySelector("#q-cero").onclick=()=>set(0);
  if(false){m.querySelector("#q-bm").onclick=()=>set(n-equi);m.querySelector("#q-bp").onclick=()=>set(n+equi)}
  m.querySelector("#q-ok").onclick=()=>{cerrarModal();const e=n>=q?"ok":n>0?"parcial":"faltante";guardarLinea(l,n,e,n<q?(l.motivo||null):null);
    senal(e==="ok"?"ok":"info",e==="ok"?"✓ "+fN(n)+" u cargadas":e==="parcial"?"Parcial: "+fN(n)+" de "+fN(q):"Marcado como faltante");setTimeout(siguiente,60)}}
function noHay(l){const MOT=["No hay stock","No lo encuentro","Roto / vencido","Hay menos"];let mot="";
  const m=modal("No hay: "+l.d,'<p class="small muted" style="margin-top:0">Queda como <b>faltante</b> para el supervisor. Motivo (opcional):</p><div class="chips">'+MOT.map(x=>'<button class="chip" data-m="'+esc(x)+'">'+esc(x)+'</button>').join("")+'</div>'
    +'<input id="nh-t" placeholder="Otro motivo…" style="margin-top:10px"><label for="nh-n">¿Encontraste algunas? (unidades)</label><input id="nh-n" type="number" inputmode="numeric" min="0" value="0">'
    +'<div class="m-acc"><button class="btn btn-lg" data-a="m-cerrar">Cancelar</button><button class="btn btn-lg btn-danger" id="nh-ok">Marcar faltante</button></div>');

  m.querySelector("#nh-ok").onclick=()=>{const t=m.querySelector("#nh-t").value.trim(),n=Math.max(0,Number(m.querySelector("#nh-n").value)||0);cerrarModal();
    guardarLinea(l,n,n>0?"parcial":"faltante",[mot,t].filter(Boolean).join(" · ")||"Sin motivo");senal("info","Faltante registrado");setTimeout(siguiente,60)}}
function terminar(){const x=pedidoActual(),pp=x.pasillos[ST.yo.pasillo],a=avance(pp);
  confirmar("Terminar pasillo",'<b>'+a.ok+'</b> completos'+(a.falt?' · <b style="color:var(--rose)">'+a.falt+' con faltante</b>':"")+'.<br>El pedido '+esc(pedTit(x))+' queda <b>listo</b> en '+esc(pasDe(ST.yo.pasillo).nombre)+'.',"Terminar",()=>{
    const pp2=(pedidoActual()||x).pasillos[ST.yo.pasillo]||pp,t=ahora(),u={estado:"listo",fin:t,terminadoPor:ST.yo.nombre,terminadoPorId:ST.yo.id};
    // se cierran el tramo y la pausa abiertos y se guarda el tiempo exacto (tramos − pausas)
    Object.keys(pp2.tramos||{}).forEach(k=>{if(pp2.tramos[k]&&!pp2.tramos[k].hasta)u["tramos/"+k+"/hasta"]=t});
    Object.keys(pp2.pausas||{}).forEach(k=>{if(pp2.pausas[k]&&!pp2.pausas[k].hasta)u["pausas/"+k+"/hasta"]=t});
    const tm=tiempos(Object.assign({},pp2,{estado:"listo",fin:t,duracionSeg:null,pausasSeg:null}),msDe(t));
    u.duracionSeg=Math.round(tm.seg);u.pausasSeg=Math.round(tm.pausaSeg);
    const uni=activas(pp2).reduce((s,l)=>s+(Number(l.tomado)||0),0),tit=pedTit(x),pas=pasDe(ST.yo.pasillo).nombre;
    guardar(pasPath(ST.pedidoId),u);
    // ESPERAS (2026-11-16): si con este pasillo quedan TODOS listos, se guarda el momento en que el pedido pasa a esperar control
    const xa=pedidoActual()||x;if(pasillosDePed(xa).every(p=>p===ST.yo.pasillo||xa.pasillos[p].estado==="listo"))guardar("picking/pedidos/"+xa.id+"/control",{listoParaControlEn:t});
    senal("ok");ST.vista="pedidos";ST.pedidoId=null;render();resumenFin(tit,pas,tm,a,uni)})}
/* resumen al terminar: «Tardaste 12:34 · 18 renglones · 240 u» */
function resumenFin(tit,pas,tm,a,uni){const K=Object.keys(tm.por).filter(k=>tm.por[k].seg>=1),rh=tm.seg>=60?a.tot/(tm.seg/3600):null;
  modal("¡Pasillo terminado!",'<div style="text-align:center"><div class="small muted">'+esc(tit)+' · '+esc(pas)+'</div>'
    +'<div style="margin:.6rem 0 .2rem;font:800 1.2rem var(--f-disp)">Tardaste</div><div class="resumen-t">'+fDur(tm.seg)+'</div>'
    +'<p style="font-weight:800;font-size:1.15rem;margin:.7rem 0 .3rem">'+pl(a.tot,"renglón","renglones")+' · '+fN(uni)+' u</p>'
    +(rh?'<p class="muted" style="margin:0">≈ '+fN(Math.round(rh))+' renglones por hora · '+fN(Math.round(tm.seg/Math.max(1,a.tot)))+' s por renglón</p>':"")
    +(a.falt?'<p style="color:var(--rose);font-weight:800;margin:.4rem 0 0">'+pl(a.falt,"renglón con faltante","renglones con faltante")+'</p>':"")
    +(tm.pausaSeg>=1?'<p class="small muted" style="margin:.4rem 0 0">Pausas: '+fDur(tm.pausaSeg)+' (no cuentan)</p>':"")
    +(K.length>1?'<p class="small" style="margin:.4rem 0 0">'+K.map(k=>esc(tm.por[k].nom||"?")+' <b class="mono">'+fDur(tm.por[k].seg)+'</b>').join(" · ")+'</p>':"")
    +'</div><div class="m-acc"><button class="btn btn-primary btn-lg" data-a="m-cerrar">Listo</button></div>')}
function tomar(id,otro){const x=ST.pedidos[id];if(!x)return;const pp=x.pasillos[ST.yo.pasillo];
  const hacer=()=>{arrancarTiempo(id,true);abrirPedido(id,true)};
  if(otro)confirmar("Tomar el pedido","Este pedido lo tiene <b>"+esc(pp.picker)+"</b>. Si lo tomás, queda a tu nombre (lo que ya cargó no se pierde) y el tiempo corre a tu nombre desde ahora.","Tomarlo",hacer);else hacer()}
function abrirPedido(id,yaArranco){ST.pedidoId=id;ST.sel=null;ST.vista="picking";if(!yaArranco)arrancarTiempo(id,false);render();window.scrollTo(0,0);despierto(true)}
/* pausa (almuerzo, otra tarea): el reloj se detiene hasta «Reanudar»; rutas hoja para no pisarse si se manda sin señal */
function pausar(){const x=pedidoActual();if(!x||!tiempos(x.pasillos[ST.yo.pasillo]).corre)return;const MOT=MOTIVOS_PAUSA;
  const m=modal("Pausar el tiempo",'<p class="small muted" style="margin-top:0">El cronómetro se detiene hasta que toques <b>Reanudar</b>. ¿Por qué parás?</p><div class="acc" style="margin-top:0">'+MOT.map(z=>'<button class="btn btn-lg" data-mp="'+esc(z)+'">'+esc(z)+'</button>').join("")+'</div><div class="m-acc"><button class="btn" data-a="m-cerrar">Cancelar</button></div>');
  m.querySelectorAll("[data-mp]").forEach(b=>b.onclick=()=>{cerrarModal();const k=nuevoId(),t=ahora();
    guardar(pasPath(ST.pedidoId),{["pausas/"+k+"/desde"]:t,["pausas/"+k+"/motivo"]:b.dataset.mp,["pausas/"+k+"/por"]:ST.yo.nombre,["pausas/"+k+"/porId"]:ST.yo.id});
    senal("info","Tiempo en pausa");window.scrollTo(0,0)})}
function reanudar(){const x=pedidoActual();if(!x)return;const tm=tiempos(x.pasillos[ST.yo.pasillo]);if(!tm.pausaKey)return;
  guardar(pasPath(ST.pedidoId),{["pausas/"+tm.pausaKey+"/hasta"]:ahora()});senal("ok","¡Seguimos! El tiempo vuelve a correr")}

const CTLP={id:"control",nombre:"Control",color:"#b78cff",orden:0,ubicacion:"Control a ciegas de los pedidos piqueados"};
const CTL_ETAPAS=["c1"];   // para sumar el CONTROL 2 más adelante: ["c1","c2"] (etapa "control2", mismo formato); lo demás recorre esta lista
const ctlEtNom=s=>"control"+s.slice(1);   // "c1" → "control1"
const ctlEtTxt=s=>CTL_ETAPAS.length>1?"Control "+s.slice(1):"Control";
const vistaInicio=()=>ST.yo&&ST.yo.rol==="control"?"ctl-pedidos":"pedidos";
const ctlInts=()=>(ST.ctl&&ST.ctl.integrantes)||{};
const nombreCtl=k=>{const i=ctlInts()[k];return(i&&i.nombre)||""};
const ctlPath=id=>"picking/pedidos/"+id;
const SVG_SCAN='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M11 8v8M15 8v8"/></svg>';
/* renglones del PEDIDO COMPLETO consolidados por código (si un código está en 2 pasillos se suman q y tomado) */
function ctlLineas(x){const M={};pasillosDePed(x).forEach(p=>activas(x.pasillos[p]).forEach(l=>{const o=M[l.k]=M[l.k]||{k:l.k,c:l.c,d:l.d,ean:l.ean||"",q:0,tomado:0,partes:[]};
    o.q+=Number(l.q)||0;o.tomado+=Number(l.tomado)||0;if(!o.ean&&l.ean)o.ean=l.ean;o.partes.push({p,l})}));
  Object.values(M).forEach(o=>{o.pk=o.partes.every(pt=>ctlPkParte(x,pt))});   // CONTROL PARCIAL (2026-11-17): por pasillo terminado o por producto ya confirmado
  return Object.values(M).sort((a,b)=>claveRec(a).localeCompare(claveRec(b)))}
/* etapa del pedido: picking (algún pasillo sin terminar) → control1 … → controlado. Una etapa está hecha si quedó «listo» con TODOS los renglones */
function ctlEtapa(x){if(!x||!x.pasillos||!pedListo(x))return"picking";const c=x.control||{},L=ctlLineas(x);
  for(const s of CTL_ETAPAS){const cs=c[s]||{};if(cs.estado!=="listo"||L.some(l=>!(cs.lineas||{})[l.k]))return ctlEtNom(s)}return"controlado"}
/* CONTROL PARCIAL (2026-11-17): el pedido se puede empezar a controlar apenas termina el PRIMER pasillo; se controla lo de los pasillos
   ya terminados y lo demás espera. «Terminar control» sigue pidiendo TODO piqueado y TODO controlado (ctlEtapa no cambia: el TMS igual). */
const ctlPkParte=(x,pt)=>(x.pasillos[pt.p]||{}).estado==="listo"||resuelta(est(pt.l));   // el pasillo terminó o el pickeador ya confirmó ese producto
const ctlParcial=x=>!!(x&&x.pasillos&&!x.archivado&&!pedListo(x)&&pasillosDePed(x).some(p=>x.pasillos[p].estado==="listo"||activas(x.pasillos[p]).some(l=>resuelta(est(l)))));
const ctlS=x=>{const e=ctlEtapa(x);return/^control\d$/.test(e)?"c"+e.slice(7):e==="picking"&&ctlParcial(x)?CTL_ETAPAS[0]:null};
const pasEnPicking=x=>pasillosDePed(x).filter(p=>x.pasillos[p].estado!=="listo");
const pedControlado=x=>ctlEtapa(x)==="controlado";
const ctlEspera=()=>Object.values(ST.pedidos).filter(x=>ctlS(x)).sort((a,b)=>String(a.fecha||"").localeCompare(String(b.fecha||""))||pedOrd(a).localeCompare(pedOrd(b)));
const ctlEst=r=>!r?"pendiente":r.accion==="corregido"?"corregido":r.accion==="diferencia"?"diferencia":"ok";
const CTL_T={pendiente:["Sin controlar","t-slate",""],ok:["Correcto","t-emerald","✓"],corregido:["Corregido","t-orange","✎"],diferencia:["Con diferencia","t-rose","✕"]};
const pickersPed=x=>[...new Set(pasillosDePed(x).map(p=>x.pasillos[p].terminadoPor||x.pasillos[p].picker).filter(Boolean))];
function ctlResumenDe(cs){const R=Object.values((cs&&cs.lineas)||{}),n=a=>R.filter(r=>r.accion===a).length;
  return{ren:R.length,ok:n("ok"),recontados:n("recontado"),corregidos:n("corregido"),diferencias:n("diferencia"),sobrantes:Object.keys((cs&&cs.sobrantes)||{}).length}}

    case"ir":ST.vista=b.dataset.v;if(ST.vista!=="picking")ST.pedidoId=null;render();window.scrollTo(0,0);break;
    case"elegir-pas":ST.pasSel=id;ST.vista="integrantes";render();window.scrollTo(0,0);break;
    case"otro-pas":{const p=b.dataset.p,i=((pasDe(p).integrantes)||{})[id];if(!i)return;ST.yo={pasillo:p,id,nombre:i.nombre};LS.set("pk-yo",ST.yo);ST.vista="pedidos";ST.pedidoId=null;render();window.scrollTo(0,0);beep("ok");break}
    case"elegir-int":{const p=pasDe(ST.pasSel),i=(p.integrantes||{})[id];if(!i)return;ST.yo={pasillo:ST.pasSel,id,nombre:i.nombre};LS.set("pk-yo",ST.yo);ST.vista="pedidos";render();despierto(true);beep("ok");break}
    case"cambiar":confirmar("Cambiar de usuario","¿Querés salir y elegir otro pasillo o integrante?","Cambiar",()=>{ST.yo=null;LS.del("pk-yo");ST.vista="ingreso";ST.pedidoId=null;render()});break;
    case"tomar":tomar(id,b.dataset.otro);break;
    case"abrir-ped":abrirPedido(id);break;
    case"sel":ST.sel=id;render();window.scrollTo({top:0,behavior:"smooth"});break;
    case"saltar":siguiente();break;
    case"cantidad":{const l=lineaSel();if(l)pedirCantidad(l);break}
    case"sin-escanear":{const l=lineaSel();if(l)pedirCodInterno(l,()=>pedirCantidad(l));break}
    case"no-hay":{const l=lineaSel();if(l)noHay(l);break}
    case"terminar":terminar();break;
    case"pausa":pausar();break;
    case"reanudar":reanudar();break;
    case"tz-recargar":cargarArchivo();render();break;
    case"tz-excel":exportarTiempos();break;
    case"tz-sub":ST.tzSub=b.dataset.v;render();break;
    case"camara":abrirCamara();break;
    case"cerrar-cam":cerrarCamara();break;
    case"teclado":{const s=$("#scan");ST.tecleando=s.inputMode!=="numeric";s.inputMode=ST.tecleando?"numeric":"none";s.placeholder=ST.tecleando?"Escribí el código y Enter":"Escaneá el producto";b.classList.toggle("btn-primary",ST.tecleando);s.blur();setTimeout(()=>s.focus(),50);break}
    case"super":pedirPin();break;
    case"salir-super":ST.vista=ST.yo?vistaInicio():"ingreso";render();break;
    case"stab":ST.superTab=b.dataset.v;render();break;
    case"ver-ped":verPedido(id);break;
    case"reasignar":reasignar(id);break;
    case"archivar":confirmar("Archivar pedido",(esperaTMS(ST.pedidos[id]||{})?"<b>Ojo:</b> este pedido todavía no se cargó en una orden de carga; archivado ya no aparece en el TMS al elegir la zona. ":"")+"Sale de las listas de picking y queda guardado en el archivo. Si el TMS lo vuelve a enviar, se recupera con lo piqueado.","Archivar",()=>archivar([id]).then(()=>toast("Pedido archivado")));break;
    case"archivar-listos":{const ids=Object.values(ST.pedidos).filter(x=>pedControlado(x)&&!esperaTMS(x)).map(x=>x.id);confirmar("Archivar pedidos controlados","Se archivan "+pl(ids.length,"pedido","pedidos")+" ya piqueados y controlados.","Archivar",()=>archivar(ids).then(()=>toast("Archivados")));break}
    case"borrar-ped":confirmar("Borrar pedido","Se borra el pedido "+esc(pedTit(ST.pedidos[id]||{id}))+" con todo lo piqueado. <b>No se puede deshacer.</b>","Borrar",()=>R("pedidos/"+id).remove().then(()=>toast("Pedido borrado")),true);break;
    case"int-add":{const p=b.dataset.p,inp=$("#ni-"+CSS.escape(p)),n=inp.value.trim();if(!n)return inp.focus();await R("pasillos/"+p+"/integrantes").push({nombre:n,alta:ahora()});toast(n+" agregado a "+pasDe(p).nombre);break}
    case"int-ed":{const p=b.dataset.p,i=pasDe(p).integrantes[id];const m=modal("Editar integrante",'<input id="ie-n" value="'+esc(i.nombre)+'"><div class="m-acc"><button class="btn" data-a="m-cerrar">Cancelar</button><button class="btn btn-primary" id="ie-ok">Guardar</button></div>');
      m.querySelector("#ie-ok").onclick=async()=>{const n=m.querySelector("#ie-n").value.trim();if(!n)return;await R("pasillos/"+p+"/integrantes/"+id).update({nombre:n});cerrarModal();toast("Guardado")};break}
    case"int-del":{const p=b.dataset.p,i=pasDe(p).integrantes[id];confirmar("Quitar integrante","¿Quitar a <b>"+esc(i.nombre)+"</b> de "+esc(pasDe(p).nombre)+"? Lo que ya piqueó queda registrado.","Quitar",()=>R("pasillos/"+p+"/integrantes/"+id).remove(),true);break}
    case"cat-mov":{const p=b.dataset.p,i=Number(b.dataset.i),c=(ST.pasillos[p].cats||[])[i];if(c==null)return;
      const m=modal("Categoría «"+c+"»",'<p class="small muted" style="margin-top:0">Moverla a otro pasillo:</p><div class="chips">'+listaPasillos().filter(o=>o.id!==p).map(o=>'<button class="chip" data-mv="'+esc(o.id)+'">'+esc(o.nombre)+'</button>').join("")+'</div><div class="m-acc"><button class="btn btn-danger" id="cm-del">Quitar de '+esc(pasDe(p).nombre)+'</button></div>');
      m.querySelectorAll("[data-mv]").forEach(x=>x.onclick=async()=>{await agregarCats(x.dataset.mv,[c]);cerrarModal();toast("Movida a "+pasDe(x.dataset.mv).nombre)});
      m.querySelector("#cm-del").onclick=async()=>{await R("pasillos/"+p+"/cats").set((ST.pasillos[p].cats||[]).filter((z,j)=>j!==i));cerrarModal();toast("Categoría quitada")};break}
    case"cat-add":{const c=$("#cat-nueva").value.trim(),p=$("#cat-nueva-p").value;if(!c)return;await agregarCats(p,[c]);toast("Agregada a "+pasDe(p).nombre);break}
    case"pin-set":{const v=$("#pin-n").value.trim();if(v.length<3)return toast("Poné al menos 3 números","err");await R("config/pinSupervisor").set(v);toast("PIN guardado");break}
    /* control a ciegas */
    case"ctl-ir":ST.vista="ctl-integrantes";render();window.scrollTo(0,0);break;
    case"ctl-elegir":{const i=ctlInts()[id];if(!i)return;ST.yo={rol:"control",pasillo:"control",id,nombre:i.nombre};LS.set("pk-yo",ST.yo);ST.vista="ctl-pedidos";render();despierto(true);beep("ok");break}
    case"ctl-tomar":ctlTomar(id,b.dataset.otro);break;
    case"ctl-abrir":ctlAbrir(id);break;
    case"ctl-sel":ST.sel=id;ST.ctlQ="";render();window.scrollTo({top:0,behavior:"smooth"});break;
    case"ctl-buscar":{const i=document.getElementById("ctl-q");if(i){i.scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>{try{i.focus({preventScroll:true})}catch(e){}},250)}break}
    case"ctl-contar":{const l=ctlLineaSel();if(!l)break;const A=ctlActual(),r=A&&(A.cs.lineas||{})[l.k];if(!l.ean&&!r)pedirCodInterno(l,()=>ctlContar(l,[]));else ctlContar(l,[]);break}
    case"ctl-nohay":{const l=ctlLineaSel();if(l)ctlConfirmar(l,0,[]);break}
    case"ctl-terminar":ctlTerminar();break;
    case"ctl-pausa":ctlPausar();break;
    case"ctl-reanudar":ctlReanudar();break;
    case"ctl-excel":exportarControles();break;
    case"ctl-int-add":{const inp=$("#ni-ctl"),n=inp.value.trim();if(!n)return inp.focus();await R("control/integrantes").push({nombre:n,alta:ahora()});toast(n+" agregado a Control");break}
    case"ctl-int-ed":{const i=ctlInts()[id];if(!i)return;const m=modal("Editar controlador",'<input id="ie-n" value="'+esc(i.nombre)+'"><div class="m-acc"><button class="btn" data-a="m-cerrar">Cancelar</button><button class="btn btn-primary" id="ie-ok">Guardar</button></div>');
      m.querySelector("#ie-ok").onclick=async()=>{const n=m.querySelector("#ie-n").value.trim();if(!n)return;await R("control/integrantes/"+id).update({nombre:n});cerrarModal();toast("Guardado")};break}
    case"ctl-int-del":{const i=ctlInts()[id];if(!i)return;confirmar("Quitar controlador","¿Quitar a <b>"+esc(i.nombre)+"</b> de Control? Lo que ya controló queda registrado.","Quitar",()=>R("control/integrantes/"+id).remove(),true);break}
    case"recargar-cat":LS.del("pk-cat");ST.cat=null;await cargarCatalogo();toast("Catálogo actualizado");render();break}
  }catch(err){console.error(err);toast("Error: "+(err.message||err),"err")}});
document.addEventListener("change",async e=>{const s=e.target;
  if(/^tz-/.test(s.dataset.a2||"")){ST.tz[s.dataset.a2.slice(3)]=s.value;render();return}if(s.dataset.a2==="cat-asig"&&s.value){const k=s.dataset.k;await agregarCats(s.value,[k]);toast("«"+k+"» → "+pasDe(s.value).nombre)}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const t=e.target;
  if(t.id==="scan"){e.preventDefault();const v=t.value;t.value="";procesarCodigo(v);return}
  if(t.dataset&&t.dataset.enter){e.preventDefault();const b=document.querySelector('[data-a="'+t.dataset.enter+'"][data-p="'+t.dataset.p+'"]');if(b)b.click()}
  if(t.id==="q-n"){e.preventDefault();const ok=$("#q-ok");if(ok)ok.click()}});
/* los lectores físicos tipean rápido: si la barra de escaneo está visible, todo lo que llegue va al campo */
document.addEventListener("keydown",e=>{if(!document.body.classList.contains("ver-scan")||ST.modalAbierto)return;const t=e.target;if(t.id==="scan"||/INPUT|SELECT|TEXTAREA/.test(t.tagName))return;
  if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){$("#scan").focus()}},true);
$("#scan").addEventListener("blur",()=>{if(!ST.tecleando)setTimeout(actualizarScanbar,400)});
function pedirPin(cb){const m=modal(cb?"PIN del supervisor":"Supervisión",'<p class="small muted" style="margin-top:0">PIN del supervisor (solo para que nadie entre por error).</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><div class="m-acc"><button class="btn" data-a="m-cerrar">Cancelar</button><button class="btn btn-primary" id="pin-ok">Entrar</button></div>');
  const inp=m.querySelector("#pin");setTimeout(()=>inp.focus(),50);
  const ok=()=>{const pin=String((ST.config&&ST.config.pinSupervisor)||"1234");if(inp.value.trim()===pin){cerrarModal();if(cb){cb();return}ST.superOk=true;ST.vista="super";render();window.scrollTo(0,0)}else{senal("err","PIN incorrecto");inp.value=""}};
  m.querySelector("#pin-ok").onclick=ok;inp.addEventListener("keydown",e=>{if(e.key==="Enter")ok()})}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
$("#logo").src=LOGO;
db.ref(".info/connected").on("value",s=>{ST.conectado=s.val()===true;document.body.classList.toggle("sin-red",!ST.conectado&&ST.cargado.pas)});
setTimeout(()=>document.body.classList.toggle("sin-red",!ST.conectado),4000);
R("pasillos").on("value",s=>{ST.pasillos=s.val()||{};ST.cargado.pas=true;
  if(ST.yo&&ST.yo.rol!=="control"&&!ST.pasillos[ST.yo.pasillo]){ST.yo=null;LS.del("pk-yo")}
  if(ST.yo&&ST.vista==="ingreso")ST.vista=vistaInicio();render()});
R("control").on("value",s=>{ST.ctl=s.val()||{};if(/^(ingreso|ctl-|super)/.test(ST.vista))render()});
let primeraVez=true;
R("pedidos").on("value",s=>{const v=s.val()||{};Object.keys(v).forEach(k=>{if(v[k]&&!v[k].id)v[k].id=k});ST.pedidos=v;ST.cargado.ped=true;
  if(primeraVez){primeraVez=false;reenviarPendientes()}
  if(ST.vista==="picking"&&!pedidoActual()){toast("El pedido ya no está disponible","info");ST.vista="pedidos"}
  render()});
R("config").on("value",s=>{ST.config=s.val()||{}});
db.ref(".info/serverTimeOffset").on("value",s=>{OFF=Number(s.val())||0});
setInterval(tic,1000);
if(ST.yo)despierto(true);
cargarCatalogo();cargarUbicaciones();setInterval(cargarUbicaciones,10*60e3);
</script>

#btn-escritorio{left:auto!important;right:16px}

<script>
/* Si debajo del botón hay una barra fija (por ej. la barra de pestañas del celular), lo sube por encima. */
(function(){var b=document.getElementById("btn-escritorio");if(!b)return;
function ubicar(){b.style.bottom="";var r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;b.style.visibility="hidden";var e=document.elementFromPoint(x,y);b.style.visibility="";
for(var p=e;p&&p!==document.body&&p!==document.documentElement;p=p.parentElement){var cs=getComputedStyle(p);if(cs.position==="fixed"||cs.position==="sticky"){var top=p.getBoundingClientRect().top;if(top>innerHeight/2)b.style.bottom=(innerHeight-top+12)+"px";break;}}}
addEventListener("load",function(){setTimeout(ubicar,600)});addEventListener("resize",function(){clearTimeout(ubicar.t);ubicar.t=setTimeout(ubicar,250)});})();
</script>
