<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recepción de vehículos</title>
<meta name="theme-color" content="#0b1b3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Recepción de vehículos: misma estética que el Escritorio (azul noche, amarillo de marca), pensada primero para el celular. */
:root{
  --amarillo:#FFD100; --azul:#1F4A9B; --azul-2:#2f6bd1; --noche:#0B1B3D; --rojo:#E0261C; --verde:#2fbf71;
  --tinta:#fff; --tinta-2:rgba(255,255,255,.72); --tinta-3:rgba(255,255,255,.5);
  --vidrio:rgba(255,255,255,.07); --borde:rgba(255,255,255,.13);
  --f-disp:"Montserrat","Segoe UI",sans-serif; --f-txt:"Figtree","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--noche);color:var(--tinta);font-family:var(--f-txt);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;
  background:
    radial-gradient(900px 600px at 85% -10%,rgba(255,209,0,.22),transparent 60%),
    radial-gradient(700px 500px at -10% 110%,rgba(224,38,28,.20),transparent 60%),
    linear-gradient(160deg,#10275a 0%,#0b1b3d 55%,#081430 100%);
  background-attachment:fixed}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}
[hidden]{display:none!important}

.barra{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:rgba(8,20,48,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.barra::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--amarillo) 0 55%,#ffb000 55% 75%,var(--rojo) 75% 88%,var(--azul-2) 88%)}
.barra img{height:28px;width:auto;display:block}
.barra .tit{font:800 14px var(--f-disp);letter-spacing:.02em;color:var(--tinta-2);border-left:1px solid var(--borde);padding-left:12px;white-space:nowrap}
.barra .acc{margin-left:auto;display:flex;gap:8px}
.bt{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:9px 13px;font:700 14px var(--f-txt);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;text-decoration:none;min-height:42px}
.bt:hover{background:rgba(255,255,255,.15)}
.bt:active{transform:scale(.97)}
.bt.am{background:var(--amarillo);color:var(--noche);border-color:var(--amarillo)}
.bt.az{background:var(--azul-2);border-color:var(--azul-2)}
.bt:disabled{opacity:.5;cursor:default}
.bt svg,.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (max-width:520px){.barra .tit{display:none}.bt .solo-pc{display:none}}

main{max-width:880px;margin:0 auto;padding:22px 16px 140px}
h1{margin:0 0 4px;font:900 clamp(26px,6vw,38px)/1.1 var(--f-disp);letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--amarillo)}
h2{margin:0 0 12px;font:800 17px var(--f-disp)}
.sub{margin:0 0 20px;color:var(--tinta-2)}
.mu{color:var(--tinta-3)}
.volver{display:inline-flex;align-items:center;gap:6px;color:var(--tinta-2);text-decoration:none;font-weight:700;margin-bottom:14px;padding:6px 0}

.panel{background:var(--vidrio);border:1px solid var(--borde);border-radius:20px;padding:18px;margin-bottom:16px}
.escanear{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,rgba(255,209,0,.18),rgba(255,209,0,.04));border-color:rgba(255,209,0,.35)}
.escanear .qr-ico{width:64px;height:64px;border-radius:18px;background:var(--amarillo);display:grid;place-items:center}
.escanear .qr-ico svg{width:38px;height:38px;stroke:var(--noche);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.escanear b{display:block;font:800 18px var(--f-disp);margin-bottom:2px}
.escanear p{margin:0 0 12px;color:var(--tinta-2);font-size:14.5px}
.escanear .fila{display:flex;gap:8px;flex-wrap:wrap}

.campo{width:100%;font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:13px;padding:12px 14px;outline:none}
.campo::placeholder{color:rgba(255,255,255,.5)}
.campo:focus{border-color:var(--amarillo);background:rgba(255,255,255,.13)}
select.campo{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
select.campo option{color:#16203a}
textarea.campo{min-height:110px;resize:vertical;line-height:1.45}
.buscar{position:relative;margin-bottom:14px}
.buscar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--tinta-2);fill:none;stroke-width:2.2;stroke-linecap:round}
.buscar .campo{padding-left:44px}

.pestanas{display:flex;gap:6px;margin:4px 0 14px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px;width:max-content;max-width:100%}
.pestanas button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--tinta-2);cursor:pointer}
.pestanas button[aria-selected="true"]{background:#fff;color:var(--noche)}

/* patente estilo Mercosur */
.pat{display:inline-flex;flex-direction:column;align-items:stretch;border:2px solid #1a1a1a;border-radius:6px;background:#fff;color:#111;overflow:hidden;line-height:1;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pat i{display:block;background:#1d4fa8;color:#fff;font:700 7px/1 var(--f-txt);letter-spacing:.12em;text-align:center;padding:2px 4px;font-style:normal}
.pat b{font:800 15px/1 var(--f-disp);letter-spacing:.06em;padding:4px 8px 5px;white-space:nowrap;text-align:center}
.pat.g i{font-size:10px;padding:3px 6px}.pat.g b{font-size:30px;padding:7px 14px 8px}

.flota{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.veh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--vidrio);border:1px solid var(--borde);text-decoration:none;transition:background .15s,transform .15s}
.veh:hover{background:rgba(255,255,255,.12)}
.veh:active{transform:scale(.98)}
.veh .m{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veh small{display:block;color:var(--tinta-3);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veh .est{font-size:13px;color:var(--amarillo);white-space:nowrap;letter-spacing:1px}
.vacio{grid-column:1/-1;text-align:center;color:var(--tinta-2);padding:28px 10px;border:2px dashed var(--borde);border-radius:18px}

/* ficha del vehículo */
.ficha{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ficha .dat{min-width:0;flex:1}
.ficha .dat b{display:block;font:800 19px var(--f-disp)}
.ficha .dat span{color:var(--tinta-2);font-size:14px}
.viaje{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:4px}
.viaje div small{display:block;color:var(--tinta-3);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.viaje div b{font-size:15.5px}
.viaje div .s2{display:block;color:var(--tinta-2);font-size:13px;margin-top:2px}
.etq{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:rgba(255,209,0,.16);color:var(--amarillo);vertical-align:middle}
.etq.ok{background:rgba(47,191,113,.16);color:#6fe3a4}
.etq.inf{background:rgba(79,141,245,.18);color:#9cc0ff}
.aviso{border-radius:14px;padding:12px 14px;background:rgba(255,209,0,.12);border:1px solid rgba(255,209,0,.3);color:#ffe680;font-size:14px}
.aviso.err{background:rgba(224,38,28,.14);border-color:rgba(224,38,28,.4);color:#ffb3ad}

/* formulario de recepción */
.paso{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.paso .n{width:28px;height:28px;border-radius:50%;background:var(--amarillo);color:var(--noche);font:900 14px var(--f-disp);display:grid;place-items:center;flex:none}
.paso h2{margin:0}
.paso .ok{margin-left:auto;color:#6fe3a4;font-weight:800;font-size:13px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dos label,.lb{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13.5px;color:var(--tinta-2)}
@media (max-width:560px){.dos{grid-template-columns:1fr}}

.fotos-tipo{border-top:1px solid var(--borde);padding:14px 0 4px}
.fotos-tipo:first-of-type{border-top:0;padding-top:2px}
.fotos-tipo .cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fotos-tipo .cab b{font:800 15.5px var(--f-disp)}
.fotos-tipo .cab small{display:block;color:var(--tinta-3);font-size:12.5px;font-weight:600}
.fotos-tipo .cab .cnt{margin-left:auto;font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;background:rgba(224,38,28,.18);color:#ffb3ad;white-space:nowrap}
.fotos-tipo .cab .cnt.ok{background:rgba(47,191,113,.18);color:#6fe3a4}
.miniaturas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mini{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;background:rgba(255,255,255,.08)}
.mini img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.mini .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center}
.mini.cargando{display:grid;place-items:center;color:var(--tinta-2);font-size:12px}
.agregar{aspect-ratio:1;border-radius:13px;border:2px dashed rgba(255,255,255,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--tinta-2);font-weight:700;font-size:12.5px;text-align:center;padding:6px;background:rgba(255,255,255,.03)}
.agregar:hover{border-color:var(--amarillo);color:#fff}
.agregar svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.agregar input{display:none}

.estrellas{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.estrellas button{border:0;background:none;padding:2px;cursor:pointer;line-height:0;border-radius:10px}
.estrellas svg{width:46px;height:46px;stroke:#ffd100;stroke-width:1.6;fill:transparent;transition:fill .15s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.estrellas button.on svg{fill:#ffd100}
.estrellas button:active svg{transform:scale(.85)}
.estrellas .cero{font:800 14px var(--f-disp);border:2px solid rgba(255,255,255,.3);border-radius:12px;padding:8px 12px;line-height:1;color:var(--tinta-2);margin-right:6px}
.estrellas .cero.on{background:var(--rojo);border-color:var(--rojo);color:#fff}
.calif-txt{margin-top:8px;font:800 16px var(--f-disp);min-height:1.3em;color:var(--amarillo)}
.calif-txt.nada{color:var(--tinta-3);font:600 14px var(--f-txt)}
@media (max-width:380px){.estrellas svg{width:38px;height:38px}}

.barra-guardar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(8,20,48,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--borde)}
.barra-guardar .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.barra-guardar .falta{font-size:13.5px;color:var(--tinta-2);flex:1;min-width:0}
.barra-guardar .bt{padding:12px 20px;font-size:15.5px}
body:has(.barra-guardar) #btn-escritorio{display:none!important}
.veh .pat{min-width:118px}

/* historial */
.rec{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--vidrio);border:1px solid var(--borde);margin-bottom:8px;text-decoration:none;cursor:pointer}
.rec:hover{background:rgba(255,255,255,.12)}
.rec img,.rec .sinfoto{width:72px;height:72px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.08);display:block}
.rec .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec .l1 .est{color:var(--amarillo);letter-spacing:1px;font-size:14px}
.rec small{display:block;color:var(--tinta-2);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .det{color:var(--tinta-3);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:6px}
.galeria img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;cursor:zoom-in;background:rgba(255,255,255,.08)}
.nota{white-space:pre-wrap;line-height:1.5;font-size:15.5px;margin:0}

/* modales: cámara para el QR y visor de fotos */
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,8,22,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.modal .cerrar{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px;line-height:1;cursor:pointer}
.camara{position:relative;width:min(420px,100%);aspect-ratio:3/4;border-radius:24px;overflow:hidden;background:#000}
.camara video{width:100%;height:100%;object-fit:cover;display:block}
.camara .mira{position:absolute;inset:18%;border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.35);border:3px solid var(--amarillo)}
.camara .linea{position:absolute;left:20%;right:20%;height:2px;background:var(--amarillo);top:50%;box-shadow:0 0 12px var(--amarillo);animation:barre 2s ease-in-out infinite alternate}
@keyframes barre{from{top:22%}to{top:78%}}
.modal p{color:var(--tinta-2);text-align:center;max-width:360px}
.visor img{max-width:100%;max-height:82vh;border-radius:14px;display:block}
.visor .pie{color:var(--tinta-2);margin-top:10px;font-weight:700}
.visor .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px;cursor:pointer}
.visor .nav.izq{left:10px}.visor .nav.der{right:10px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:#fff;color:var(--noche);font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.toast.err{background:#ffd9d6;color:#8a0f08}
.carga{display:flex;align-items:center;gap:10px;color:var(--tinta-2);padding:30px 0;justify-content:center}
.carga::before{content:"";width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--amarillo);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* etiquetas QR para imprimir y pegar en cada vehículo */
.etiquetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.etiqueta{background:#fff;color:#111;border-radius:16px;padding:14px 14px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;break-inside:avoid;page-break-inside:avoid}
.etiqueta .logo{background:#0b1b3d;border-radius:10px;padding:6px 10px;width:100%}
.etiqueta .logo img{height:20px;display:block;margin:0 auto}
.etiqueta .qr{width:150px;height:150px}
.etiqueta .qr svg{width:100%;height:100%;display:block}
.etiqueta small{font-size:11px;color:#444;line-height:1.3}
.etiqueta .pat{box-shadow:none}
@media print{
  @page{margin:10mm}
  body{background:#fff!important;color:#000}
  .barra,.no-imp,#btn-escritorio{display:none!important}
  main{padding:0;max-width:none}
  .etiquetas{grid-template-columns:repeat(3,1fr);gap:6mm}
  .etiqueta{border:1px dashed #999;border-radius:4mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>

<script>
/* ---------- conexión: mismo Firebase que el TMS (la flota, los choferes y los viajes se leen de ahí) ---------- */
const firebaseConfig={apiKey:"AIzaSyCLP890Q5hyuqSs82vyF0rk9VhEg0pBlCA",authDomain:"ecommerce-e7ab2.firebaseapp.com",projectId:"ecommerce-e7ab2",storageBucket:"ecommerce-e7ab2.firebasestorage.app",messagingSenderId:"237845351422",appId:"1:237845351422:web:6350a5c3e103b088cf4eaf"};
const FIRESTORE_DATABASE_ID="default";
const URL_APP=location.origin+location.pathname;
const URL_QR="https://fabriziovischi10-a11y.github.io/ecommerceportal/vehiculos.html";   // dirección fija que llevan las etiquetas impresas
let FS=null;
const tms=c=>FS.collection("hojaruta").doc("datos").collection(c);
const mia=c=>FS.collection("vehiculos").doc("datos").collection(c);
async function conectar(){
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  await firebase.auth().signInAnonymously();
  const app=firebase.app();
  const modular=app._delegate.container.getProvider("firestore").getImmediate({identifier:FIRESTORE_DATABASE_ID});
  FS=new firebase.firestore.Firestore(app,modular);
  try{FS.settings({experimentalAutoDetectLongPolling:true,ignoreUndefinedProperties:true,merge:true})}catch(e){}
}

/* ---------- utilidades ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const clavePat=p=>String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const pat=(p,g)=>'<span class="pat'+(g?" g":"")+'"><i>ARGENTINA</i><b>'+esc(String(p||"—").toUpperCase())+'</b></span>';
const hoyISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fFecha=f=>{if(!f)return"—";const [a,m,d]=String(f).slice(0,10).split("-");const dt=new Date(+a,m-1,+d);return dt.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"})};
const fFechaHora=iso=>iso?new Date(iso).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const est=n=>n==null?"":"★".repeat(n)+"☆".repeat(5-n);
const CALIF=["Muy mal estado","Malo","Regular","Bueno","Muy bueno","Excelente"];
const TIPOS=[["exterior","Exterior","Frente, laterales, trasera y caja"],["interior","Interior","Cabina, tablero y asientos"],["cubiertas","Cubiertas","Todas las ruedas, incluido el auxilio"]];
const tipoNom=t=>(TIPOS.find(x=>x[0]===t)||[t,t])[1];
function aviso(txt,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=txt;document.body.appendChild(t);setTimeout(()=>t.remove(),err?5000:2600)}
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- datos del TMS ---------- */
let CAM=[],CHO=[],SUC={},ZON={},ULT={};   // ULT: última recepción por camión (para mostrar estrellas en la flota)
const camDe=id=>CAM.find(c=>c.id===id);
const choDe=id=>CHO.find(c=>c.id===id);
const choNom=id=>{const c=choDe(id);return c?c.nombre:""};
const esAcop=c=>/acoplado/i.test(c.tipo||"");
async function cargarBase(){
  const lee=async c=>(await tms(c).get()).docs.map(d=>Object.assign({id:d.id},d.data()));
  const [cam,cho,suc,zon]=await Promise.all([lee("camiones"),lee("choferes"),lee("sucursales").catch(()=>[]),lee("zonas").catch(()=>[])]);
  CAM=cam.filter(c=>c.estado!=="Baja").sort((a,b)=>(esAcop(a)-esAcop(b))||String(a.patente).localeCompare(String(b.patente)));
  CHO=cho.sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
  suc.forEach(s=>SUC[s.id]=s.nombre||s.id);
  zon.forEach(z=>ZON[z.id]=[z.numero?"Zona "+z.numero:"",z.nombre||""].filter(Boolean).join(" ")||z.id);
  // órdenes de carga de los últimos 60 días, para mostrar en la flota a quién está asignada cada patente
  const desde=new Date(Date.now()-60*864e5).toISOString().slice(0,10);
  try{SAL=(await tms("salidas").where("fecha",">=",desde).get()).docs.map(d=>Object.assign({id:d.id},d.data())).filter(s=>s.estado!=="Anulada"&&s.fecha<=hoyISO())
    .sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.nro||0)-(a.nro||0))}catch(e){console.warn(e);SAL=[]}
}
let SAL=[];
// Chofer habitual: el que tiene esta patente como «Camión habitual» en Choferes del TMS (o el que figura en la ficha del camión).
const habitual=cam=>CHO.find(c=>c.camionId===cam.id&&c.estado!=="Inactivo")||null;
// A quién está asignada la patente: la última orden de carga del TMS; si no hay, el chofer habitual.
function asignado(cam){
  const s=SAL.find(x=>x.camionId===cam.id||x.acopladoId===cam.id);
  if(s)return{choferId:s.choferId||"",cobradorId:s.cobradorId||"",origen:"orden",sal:s};
  const h=habitual(cam);
  return h?{choferId:h.id,cobradorId:"",origen:"habitual"}:null;
}
async function cargarUltimas(){

// Achica la foto para que entre en un documento de Firestore (máx. ~1 MB): lado mayor 1400 px, JPEG.
function comprimir(file,lado,maxLen){
  return new Promise((ok,mal)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const k=Math.min(1,lado/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement("canvas");
      cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      let q=.78,d=cv.toDataURL("image/jpeg",q);
      while(d.length>maxLen&&q>.35){q-=.1;d=cv.toDataURL("image/jpeg",q)}
      ok(d);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);mal(new Error("formato no soportado"))};
    img.src=url;
  });
}
function faltantes(){
  const f=F,L=[];
  if(!f.choferId)L.push("el chofer");
  TIPOS.forEach(([k,n])=>{if(!f.fotos[k].filter(Boolean).length)L.push("foto "+n.toLowerCase())});
  if(f.estrellas==null)L.push("la calificación");
  if(!f.revisadoPor.trim())L.push("quién revisó");
  return L;
}

async function guardar(){
  const f=F;if(faltantes().length||f.guardando)return;
  f.guardando=true;validar();const b=$("f-ok");b.textContent="Guardando…";
  try{

    const miniatura=await comprimirDataURL(primera,240,60000);
    const cnt={};TIPOS.forEach(([k])=>cnt[k]=f.fotos[k].length);
    // primero las fotos (cada una en su documento, por el límite de 1 MB) y al final la recepción
    let n=0;const tot=Object.values(cnt).reduce((a,b)=>a+b,0);
    b.textContent="Subiendo fotos 0/"+tot+"…";
    await Promise.all(TIPOS.flatMap(([k])=>f.fotos[k].map((data,i)=>
      mia("fotos").doc(ref.id+"_"+k+"_"+i).set({recepcionId:ref.id,camionId:f.cam.id,tipo:k,orden:i,data,fecha}).then(()=>{b.textContent="Subiendo fotos "+(++n)+"/"+tot+"…"}))));
    ls.set("veh_revisa",f.revisadoPor.trim());
    await ref.set({camionId:f.cam.id,patente:f.cam.patente,modelo:f.cam.modelo||"",fecha,
      salidaId:f.sal?f.sal.id:null,salidaNro:f.sal?f.sal.nro||null:null,salidaFecha:f.sal?f.sal.fecha:null,
      choferId:f.choferId,choferNombre:choNom(f.choferId),cobradorId:f.cobradorId||null,cobradorNombre:choNom(f.cobradorId)||null,
      choferTMS:f.sal?f.sal.choferId||null:(habitual(f.cam)||{}).id||null,origenTMS:f.origen||null,
      choferSegunTMS:!!(f.origen&&(f.sal?f.sal.choferId:(habitual(f.cam)||{}).id)===f.choferId),
      km:f.km?Number(f.km):null,estrellas:f.estrellas,detalle:f.detalle.trim(),revisadoPor:f.revisadoPor.trim(),
      fotos:cnt,miniatura});
    F=null;aviso("Recepción guardada ✓");ir("r/"+ref.id);
  }catch(e){
    f.guardando=false;b.textContent="Guardar recepción";validar();aviso("No se pudo guardar: "+(e.message||e.code),true);
  }
}

       +(r.salidaNro?'<div><small>Orden de carga</small><b>N° '+esc(String(r.salidaNro).padStart(5,"0"))+'</b><span class="s2">'+fFecha(r.salidaFecha)+'</span></div>':"")
       +(r.km?'<div><small>Km del tablero</small><b>'+Number(r.km).toLocaleString("es-AR")+'</b></div>':"")
     +'</div></div>'
     +(r.detalle?'<div class="panel"><h2>Detalles</h2><p class="nota">'+esc(r.detalle)+'</p></div>':"")
     +'<div class="panel"><h2>Fotos</h2><div id="galeria"><div class="carga">Cargando fotos…</div></div></div>';
    const s=await mia("fotos").where("recepcionId","==",id).get();
    const fotos=s.docs.map(x=>x.data()).sort((a,b)=>TIPOS.findIndex(t=>t[0]===a.tipo)-TIPOS.findIndex(t=>t[0]===b.tipo)||a.orden-b.orden);
    const todas=fotos.map(x=>({src:x.data,pie:tipoNom(x.tipo)}));
    $("galeria").innerHTML=fotos.length?TIPOS.map(([k,n])=>{const L=fotos.filter(x=>x.tipo===k);return L.length?'<h2 style="font-size:14.5px;margin:10px 0 8px;color:var(--tinta-2)">'+n+' · '+L.length+'</h2><div class="galeria">'+L.map(x=>'<img src="'+x.data+'" alt="'+n+'" data-i="'+fotos.indexOf(x)+'">').join("")+'</div>':""}).join(""):'<p class="mu">Sin fotos.</p>';
    $("galeria").querySelectorAll("img").forEach(im=>im.onclick=()=>abrirVisor(todas,+im.dataset.i));
    v.insertAdjacentHTML("beforeend",'<div style="text-align:right"><button class="bt" id="r-del" style="color:#ffb3ad;border-color:rgba(224,38,28,.45)">Eliminar esta recepción</button></div>');
    $("r-del").onclick=async()=>{
      if(!confirm("¿Eliminar la recepción de "+r.patente+" del "+fFechaHora(r.fecha)+"? Se borran también sus fotos."))return;
      try{await Promise.all(s.docs.map(x=>x.ref.delete()));await d.ref.delete();aviso("Recepción eliminada");ir("v/"+clavePat(r.patente))}
      catch(e){aviso("No se pudo eliminar: "+(e.message||e.code),true)}
    };
  }catch(e){v.innerHTML='<div class="aviso err">No se pudo abrir la recepción: '+esc(e.message||e.code)+'</div>'}
}

/* ---------- visor de fotos ---------- */
let VIS={L:[],i:0};
function abrirVisor(L,i){VIS={L,i};$("m-foto").hidden=false;pintarVisor()}
function pintarVisor(){const x=VIS.L[VIS.i];if(!x)return;$("foto-img").src=x.src;$("foto-pie").textContent=x.pie+" · "+(VIS.i+1)+" de "+VIS.L.length;$("foto-ant").hidden=$("foto-sig").hidden=VIS.L.length<2}
$("foto-x").onclick=()=>{$("m-foto").hidden=true};
$("foto-ant").onclick=()=>{VIS.i=(VIS.i-1+VIS.L.length)%VIS.L.length;pintarVisor()};
$("foto-sig").onclick=()=>{VIS.i=(VIS.i+1)%VIS.L.length;pintarVisor()};
$("m-foto").addEventListener("click",e=>{if(e.target.id==="m-foto")$("m-foto").hidden=true});

/* ---------- escáner de QR (BarcodeDetector del navegador; si no existe, jsQR) ---------- */
let CAMST=null,BUCLE=0;
async function abrirCamara(){
  $("m-cam").hidden=false;$("cam-txt").textContent="Apuntá la cámara al QR pegado en el vehículo.";
  try{
    CAMST=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    const v=$("cam-v");v.srcObject=CAMST;await v.play();
    let det=null;
    if("BarcodeDetector" in window){try{det=new BarcodeDetector({formats:["qr_code"]})}catch(e){}}
    if(!det)await cargarJsQR();
    const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
    const id=++BUCLE;
    const paso=async()=>{
      if(id!==BUCLE||$("m-cam").hidden)return;
      let txt=null;
      try{
        if(det){const r=await det.detect(v);if(r.length)txt=r[0].rawValue}
        else if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const im=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(im.data,im.width,im.height,{inversionAttempts:"dontInvert"});if(r)txt=r.data}
      }catch(e){}
      if(txt)return leido(txt);
      setTimeout(paso,180);
    };
    paso();
  }catch(e){$("cam-txt").textContent="No se pudo abrir la cámara ("+(e.name==="NotAllowedError"?"no diste permiso":e.message||e.name)+"). También podés escanear el QR con la cámara del celular o elegir el vehículo de la lista."}
}
function cerrarCamara(){BUCLE++;$("m-cam").hidden=true;if(CAMST){CAMST.getTracks().forEach(t=>t.stop());CAMST=null}}
$("cam-x").onclick=cerrarCamara;
$("btn-qr").onclick=abrirCamara;
function leido(txt){
  let p=null;
  try{p=new URL(txt).searchParams.get("v")}catch(e){p=txt}
  const cam=p&&CAM.find(c=>clavePat(c.patente)===clavePat(p));
  if(!cam){$("cam-txt").textContent="Ese QR no es de un vehículo de la flota ("+String(txt).slice(0,60)+"). Probá con otro.";setTimeout(()=>{if(!$("m-cam").hidden){BUCLE++;abrirCamara()}},1800);return}
  if(navigator.vibrate)navigator.vibrate(80);
  cerrarCamara();ir("v/"+clavePat(cam.patente));
}
function cargarJsQR(){
  if(window.jsQR)return Promise.resolve();
  return new Promise((ok,mal)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";s.onload=ok;s.onerror=()=>mal(new Error("no se pudo cargar el lector de QR"));document.head.appendChild(s)});
}
