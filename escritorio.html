<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escritorio Portal</title>
<meta name="theme-color" content="#0e2756">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Escritorio: fondo azul noche de marca con brillos amarillo/rojo, barra superior con logo y reloj, grilla de íconos tipo app. */
:root{
  --amarillo:#FFD100; --azul:#1F4A9B; --noche:#0B1B3D; --rojo:#E0261C;
  --tinta:#ffffff; --tinta-2:rgba(255,255,255,.72);
  --f-disp:"Montserrat","Segoe UI",sans-serif; --f-txt:"Figtree","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--noche);color:var(--tinta);font-family:var(--f-txt)}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;position:relative;
  background:
    radial-gradient(900px 600px at 85% -10%,rgba(255,209,0,.30),transparent 60%),
    radial-gradient(700px 500px at -10% 110%,rgba(224,38,28,.28),transparent 60%),
    radial-gradient(800px 700px at 50% 120%,rgba(47,107,209,.45),transparent 65%),
    linear-gradient(160deg,#10275a 0%,#0b1b3d 55%,#081430 100%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(rgba(255,255,255,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.9) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 75%)}
a{color:inherit}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:4px;border-radius:22px}

/* barra superior */
.barra{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:calc(12px + env(safe-area-inset-top,0px)) 22px 12px;
  background:rgba(8,20,48,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.barra::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--amarillo) 0 55%,#ffb000 55% 75%,var(--rojo) 75% 88%,#2f6bd1 88%)}
.barra img{height:34px;width:auto;display:block}
.reloj{margin-left:auto;text-align:right;line-height:1.15}
.reloj b{display:block;font-family:var(--f-disp);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.reloj span{font-size:13px;color:var(--tinta-2);text-transform:capitalize}

main{max-width:1100px;margin:0 auto;padding:40px 22px 120px}
.saludo{margin:0 0 6px;font-family:var(--f-disp);font-weight:900;font-size:clamp(28px,5vw,44px);letter-spacing:-.01em}
.saludo em{font-style:normal;color:var(--amarillo)}
.sub{margin:0 0 34px;color:var(--tinta-2);font-size:16px}

.buscar{position:relative;display:block;max-width:420px;margin:0 0 34px}
.buscar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--tinta-2);fill:none;stroke-width:2.2;stroke-linecap:round}
.buscar input{width:100%;font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px 12px 44px;outline:none;transition:background .2s,border-color .2s}
.buscar input::placeholder{color:rgba(255,255,255,.55)}
.buscar input:focus{background:rgba(255,255,255,.16);border-color:var(--amarillo)}

/* grilla de apps */
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:30px 18px}
.app{display:flex;flex-direction:column;align-items:center;gap:12px;text-decoration:none;text-align:center;padding:8px 4px;border-radius:22px;
  animation:entra .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*60ms)}
.ico{--c1:#2457c5;--c2:#4f8df5;position:relative;width:96px;height:96px;border-radius:26px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--c2),var(--c1));
  box-shadow:0 14px 30px -12px var(--c1),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -6px 14px rgba(0,0,0,.12);
  transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.ico::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 45%);pointer-events:none}
.ico svg{width:52px;height:52px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.app:hover .ico{transform:translateY(-6px) scale(1.06);box-shadow:0 22px 40px -14px var(--c1),inset 0 1px 0 rgba(255,255,255,.35)}
.app:active .ico{transform:scale(.94)}
.nom{font-family:var(--f-disp);font-weight:800;font-size:15px;line-height:1.2}
.desc{font-size:12.5px;color:var(--tinta-2);line-height:1.3;max-width:20ch;margin-top:-6px}
.chip{position:absolute;top:-6px;right:-10px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#fff;color:var(--c1);border-radius:999px;padding:3px 8px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.vacio{grid-column:1/-1;color:var(--tinta-2);text-align:center;padding:30px}

.pie{position:fixed;left:0;right:0;bottom:0;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12.5px;color:rgba(255,255,255,.55);background:linear-gradient(0deg,rgba(8,20,48,.85),transparent)}

@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.96)}}
@media (max-width:520px){
  .barra{padding-inline:16px} .barra img{height:28px} .reloj b{font-size:18px}
  main{padding:28px 16px 110px}
  .apps{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 8px}
  .ico{width:72px;height:72px;border-radius:20px} .ico svg{width:40px;height:40px}
  .nom{font-size:13px} .desc{display:none}
  .chip{font-size:9px;padding:2px 6px;right:-8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main>
  <h1 class="saludo" id="saludo">Hola</h1>
  <p class="sub">Elegí una aplicación para abrirla.</p>
  <label class="buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Buscar aplicación" autocomplete="off" aria-label="Buscar aplicación"></label>
  <nav class="apps" id="apps" aria-label="Aplicaciones"></nav>
</main>
<div class="pie">Portal Distribuidora · Sistema logístico</div>

<script>
const APPS = [
  {n:"Portal Logística", d:"Recepción, preventa, sucursales y bajas", url:"https://fabriziovischi10-a11y.github.io/portal-logistica/", c1:"#c0392b", c2:"#ff6b5b",
   i:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>'},
  {n:"Hoja de Ruta", d:"TMS: órdenes de carga, rutas y novedades", url:"https://fabriziovischi10-a11y.github.io/ecommerceportal/hoja-de-ruta.html", c1:"#0b7fa3", c2:"#22b8cf",
   i:'<path d="M9 4l-5 2v14l5-2 6 2 5-2V4l-5 2z"/><path d="M9 4v14M15 6v14"/>'},
  {n:"TMS Claude", d:"Hoja de ruta (versión en Claude)", url:"https://claude.ai/artifact/5o4YopJimvVjVyTarF8qBv?sk=YftS-uDNu1rMLhTh5Dpb0g", c1:"#6f42d6", c2:"#a17cf5", chip:"Claude",
   i:'<path d="M5 19c3-1 4-4 4-7s2-6 6-6"/><circle cx="5" cy="19" r="2"/><circle cx="17" cy="6" r="2"/><path d="M14 15l3 3 4-5"/>'},
  {n:"Portal Entregas", d:"Planilla de entregas semanal", url:"https://fabriziovischi10-a11y.github.io/ecommerceportal/portal-entregas-firebase.html", c1:"#2b8a3e", c2:"#51cf66",
   i:'<path d="M21 8l-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>'},
  {n:"GestiEntrega", d:"Gestión de entregas", url:"https://gestientrega-d3trnwix.manus.space/", c1:"#d9480f", c2:"#f59f00",
   i:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v3h6V3M8.5 12l2.5 2.5 4.5-5"/>'},
  {n:"Monitoreo", d:"Control y seguimiento", url:"https://fabriziovischi10-a11y.github.io/ecommerceportal/monitoreo.html", c1:"#1f4a9b", c2:"#4f8df5",
   i:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M6 12l3-3 3 2 5-5"/>'},
  {n:"Asistencia", d:"Descansos, vacaciones y ausencias", url:"https://fabriziovischi10-a11y.github.io/portal-asistencia/", c1:"#c2255c", c2:"#f06595",
   i:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8.5 15l2.5 2.5 4.5-4.5"/>'}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function pintar(){
  const q=norm(document.getElementById("q").value.trim());
  const lista=APPS.filter(a=>!q||norm(a.n+" "+a.d).includes(q));
  document.getElementById("apps").innerHTML=lista.length?lista.map((a,k)=>
    `<a class="app" href="${esc(a.url)}" target="_blank" rel="noopener" style="--i:${k}" title="${esc(a.d)}">
      <span class="ico" style="--c1:${a.c1};--c2:${a.c2}"><svg viewBox="0 0 24 24">${a.i}</svg>${a.chip?`<span class="chip">${esc(a.chip)}</span>`:""}</span>
      <span class="nom">${esc(a.n)}</span><span class="desc">${esc(a.d)}</span></a>`).join("")
    :`<div class="vacio">No hay ninguna aplicación con ese nombre.</div>`;
}
document.getElementById("q").addEventListener("input",pintar);
document.getElementById("q").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const a=document.querySelector(".app"); if(a) a.click(); } });
function reloj(){
  const d=new Date(), h=d.getHours();
  document.getElementById("hora").textContent=d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("fecha").textContent=d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("saludo").innerHTML=(h<6?"Buenas noches":h<13?"Buen día":h<20?"Buenas tardes":"Buenas noches")+", <em>Portal</em>";
}
pintar(); reloj(); setInterval(reloj,15000);
</script>
